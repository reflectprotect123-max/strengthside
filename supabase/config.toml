# TheStrengthEngine — Supabase (shared project)
#
# This repo owns strength migrations only (see supabase/migrations/).
# Nutrition / MacroTrack tables and ecosystem RPCs live in THE-HYBRID-ENGINE1
# and are already applied on the shared hosted project.
#
# Link for local CLI work:
#   npx supabase link --project-ref orysjncrksmdfabpuftd
#
# Do NOT add nutrition migrations here — shared Postgres contract (CLAUDE.md).

project_id = "orysjncrksmdfabpuftd"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "com.hybrid.athlete://auth"
additional_redirect_urls = ["com.hybrid.athlete://auth", "capacitor://localhost"]

[functions]
enabled = true

[functions.brain-coach]
# This route verifies ES256 user tokens through auth.getUser in its handler.
verify_jwt = false

# Fitbit routes check the user JWT inside the handler. The callback is a Google redirect and has no Supabase session.
[functions.fitbit-connect]
verify_jwt = false

[functions.fitbit-callback]
verify_jwt = false

[functions.fitbit-sync]
verify_jwt = false

[functions.fitbit-status]
verify_jwt = false

[functions.fitbit-disconnect]
verify_jwt = false
