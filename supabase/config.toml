# TheStrengthEngine — Supabase (shared project)
#
# This repo owns strength migrations only (see supabase/migrations/).
# Nutrition / MacroTrack tables and ecosystem RPCs live in THE-HYBRID-ENGINE1
# and are already applied on the shared hosted project.
#
# Link for local CLI work:
#   npx supabase link --project-ref orysjncrksmdfabpuftd
#
# Do NOT add nutrition migrations here — shared Postgres contract (CLAUDE.md).

project_id = "orysjncrksmdfabpuftd"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "com.hybrid.athlete://auth"
additional_redirect_urls = ["com.hybrid.athlete://auth", "capacitor://localhost"]

# Official WHOOP OAuth. whoop-callback must be public — WHOOP redirects here with ?code=.
# Do not set [functions].enabled — older CLI treats [functions] as the per-function map.
[functions.whoop-callback]
verify_jwt = false

[functions.whoop-connect]
verify_jwt = true

[functions.whoop-sync]
verify_jwt = true

[functions.whoop-health]
verify_jwt = false

[functions.integrations-status]
verify_jwt = true

[functions.integrations-disconnect]
verify_jwt = true
