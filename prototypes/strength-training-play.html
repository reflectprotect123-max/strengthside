<!DOCTYPE html>
<!-- LOCKED tempo dropdown. See docs/training-tempo-lock.md. Do not change unless the user reopens the lock. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strength training play</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
  --oled-bg: #000000;
  --oled-surface: #121212;
  --oled-raised: #1c1c1e;
  --oled-text: #ffffff;
  --oled-muted: #8e8e93;
  --oled-line: rgba(255, 255, 255, 0.1);
  --sleep: #9db4c8;
  --recovery-high: #16ec06;
  --recovery-mid: #ffde00;
  --recovery-low: #ff0026;
  --recovery: var(--recovery-high);
  --strain: #1ba3ff;
  --strength: #d4a574;
  --recovery-room: #9fd356;
  --trn-blue: #1ba3ff;
  --trn-letter-bg: #3a3a3c;
  --font-body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Barlow Condensed", ui-sans-serif, system-ui, sans-serif;
  --nav-h: 72px;
  --fab-size: 56px;
  --tap: 44px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--oled-bg);
  color: var(--oled-text);
  font: 16px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}

.shell {
  min-height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  background: var(--oled-bg);
}

.app {
  min-height: calc(100dvh - var(--nav-h));
  padding-bottom: calc(var(--fab-size) + 40px);
}

.hidden { display: none !important; }

/* ── OLED home shell ── */
.shell-screen--oled {
  padding: 0 20px 8px;
  max-width: 100%;
  min-width: 0;
  overflow-x: hidden;
}

.home-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 0 4px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(180deg, #000 70%, transparent);
}

.home-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
}

.home-mark {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--oled-text);
}

.home-brand-text b {
  display: block;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
}

.home-brand-text small {
  display: block;
  margin-top: 1px;
  color: var(--oled-muted);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.home-lockers {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
}

.home-lockers span {
  color: var(--oled-muted);
}

.home-lockers span.on {
  color: #fff;
}

.home-lockers i {
  font-style: normal;
  color: var(--oled-muted);
  opacity: 0.5;
}

.locker-card {
  margin-bottom: 14px;
}

.locker-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.locker-switch .btn {
  min-height: 48px;
}

.home-top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.month-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: var(--tap);
  padding: 0 4px;
  color: var(--oled-muted);
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.month-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

.today-btn {
  border: 1px solid rgba(255, 255, 255, 0.42);
  border-radius: 999px;
  padding: 7px 14px;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  min-height: var(--tap);
  transition: background 0.18s var(--ease), border-color 0.18s var(--ease);
}

.today-btn:active {
  background: var(--oled-raised);
}

.bell-btn {
  position: relative;
  width: var(--tap);
  height: var(--tap);
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.bell-btn svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: var(--oled-text);
  stroke-width: 1.6;
}

.bell-badge {
  position: absolute;
  top: 6px;
  right: 2px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--oled-text);
  color: #000;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
  font-style: normal;
}

.ath-date {
  margin: 2px 0 14px;
  font-family: var(--font-display);
  font-size: clamp(22px, 5.5vw, 28px);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: rgba(255, 255, 255, 0.72);
}

.ath-athlete {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 6px;
}

.ath-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.14);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: var(--oled-muted);
}

.ath-avatar svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.ath-name {
  margin: 0;
  color: var(--oled-muted);
  font-size: 13px;
  font-weight: 500;
}

.ath-workout {
  margin: 2px 0 0;
  font-family: var(--font-display);
  font-size: clamp(20px, 5.5vw, 24px);
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.05;
}

/* ── WHOOP dials ── */
.ath-module-whoop {
  padding: 8px 0 4px;
  margin: 0 0 8px;
}

.ath-label {
  display: block;
  margin-bottom: 8px;
  color: rgba(255, 255, 255, 0.4);
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
}

.ath-whoop-dials,
.gauge-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: clamp(4px, 1.6vw, 8px);
  margin: 10px 0 12px;
  width: 100%;
}

.ath-whoop-dial {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.ath-whoop-dial-ring {
  position: relative;
  width: min(104px, 100%);
  aspect-ratio: 1;
  margin: 0 auto;
}

.ath-whoop-dial:nth-child(1) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 14px rgba(157, 180, 200, 0.18));
}

.ath-whoop-dial:nth-child(2) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 18px rgba(22, 242, 107, 0.28));
}

.ath-whoop-dial:nth-child(3) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 14px rgba(27, 163, 255, 0.16));
}

.ath-whoop-dial-ring svg {
  width: 100%;
  height: 100%;
  display: block;
}

.ath-whoop-dial-val {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  font-family: var(--font-display);
  font-size: clamp(22px, 7.2vw, 30px);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: #fff;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  pointer-events: none;
  text-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
}

.ath-whoop-dial-val .ath-whoop-n {
  display: block;
  line-height: 1;
}

.ath-whoop-dial-val small {
  display: block;
  font-size: clamp(10px, 3vw, 12px);
  font-weight: 650;
  opacity: 0.9;
  line-height: 1;
}

.ath-whoop-dial-lab {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: rgba(255, 255, 255, 0.5);
  text-transform: uppercase;
  text-align: center;
}

.today-call {
  margin: 4px 0 0;
  padding: 12px 0 0;
  border-top: 1px solid var(--oled-line);
}

.today-call .eyebrow {
  margin: 0 0 4px;
  color: var(--oled-muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.today-call .title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.05;
}

.today-call .meta {
  margin: 6px 0 0;
  color: var(--oled-muted);
  font-size: 13px;
  line-height: 1.45;
}

/* ── Calendar week ── */
.cal-strip {
  display: flex;
  gap: 6px;
  margin: 0 0 18px;
  padding: 2px 0;
  overflow-x: auto;
  scrollbar-width: none;
}

.cal-strip::-webkit-scrollbar { display: none; }

.cal-day {
  flex: 1 0 44px;
  min-width: 44px;
  min-height: var(--tap);
  padding: 10px 0 8px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: transparent;
  color: var(--oled-muted);
  text-align: center;
  transition: border-color 0.16s var(--ease), background 0.16s var(--ease);
}

.cal-day b {
  display: block;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 500;
  color: var(--oled-text);
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}

.cal-day.active {
  border-color: rgba(255, 255, 255, 0.22);
  background: var(--oled-surface);
}

.cal-day.active b {
  font-weight: 700;
}

.cal-dots {
  display: flex;
  justify-content: center;
  gap: 3px;
  min-height: 8px;
}

.cal-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--recovery-room);
}

.cal-dot.strength { background: var(--strength); }
.cal-dot.recovery { background: var(--recovery-room); }

/* ── Session list ── */
.home-brief {
  padding: 18px 0 8px;
  border-top: 1px solid var(--oled-line);
  margin-bottom: 8px;
}

.home-brief-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.home-brief .eyebrow {
  margin: 0;
  color: var(--oled-muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.home-pill {
  padding: 4px 8px;
  border: 1px solid var(--oled-line);
  border-radius: 999px;
  color: var(--oled-muted);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.published-list {
  display: grid;
  gap: 0;
}

.published-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--oled-line);
  min-height: var(--tap);
  width: 100%;
  text-align: left;
}

.published-item:last-child { border-bottom: 0; }

.pub-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.pub-dot.strength { background: var(--strength); }
.pub-dot.recovery { background: var(--recovery-room); }

.published-item strong {
  display: block;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.published-item small {
  display: block;
  margin-top: 2px;
  color: var(--oled-muted);
  font-size: 12px;
  text-transform: capitalize;
}

.published-item .chev {
  color: rgba(255, 255, 255, 0.35);
  font-size: 18px;
  line-height: 1;
}

.empty-day {
  color: var(--oled-muted);
  text-align: center;
  padding: 28px 8px;
  font-size: 14px;
  line-height: 1.5;
}

.home-cta {
  margin-top: 18px;
}

.btn {
  min-height: var(--tap);
  padding: 12px 16px;
  border-radius: 14px;
  border: 1px solid var(--oled-line);
  background: var(--oled-surface);
  font-weight: 650;
  transition: background 0.16s var(--ease), border-color 0.16s var(--ease);
}

.btn:active { background: var(--oled-raised); }

.btn.oled-cta,
.create-session-btn {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.42);
  background: #fff;
  color: #000;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
  box-shadow: none;
}

.btn.oled-cta:active,
.create-session-btn:active {
  background: #f2f2f2;
}

@media (hover: hover) {
  .today-btn:hover { background: rgba(255, 255, 255, 0.06); }
  .btn.oled-cta:hover,
  .create-session-btn:hover {
    background: #f2f2f2;
    border-color: #fff;
  }
}

/* ── FAB ── */
.fab-layer {
  position: fixed;
  right: max(20px, calc(50% - 215px + 20px));
  bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
}

.fab-layer.open .fab-menu { display: flex; }
.fab-layer.open .fab-scrim { display: block; }

.fab-scrim {
  display: none;
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(0, 0, 0, 0.45);
}

.fab-menu {
  display: none;
  flex-direction: column;
  background: var(--oled-raised);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  overflow: hidden;
  min-width: 210px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
}

.fab-menu button {
  text-align: left;
  padding: 14px 18px;
  font-size: 15px;
  border-bottom: 1px solid var(--oled-line);
  min-height: var(--tap);
}

.fab-menu button:last-child { border-bottom: 0; }
.fab-menu button:active { background: #2c2c2e; }

.fab {
  width: var(--fab-size);
  height: var(--fab-size);
  border-radius: 50%;
  background: #fff;
  color: #000;
  font-size: 30px;
  font-weight: 300;
  line-height: 1;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  transition: transform 0.2s var(--ease);
}

.fab-layer.open .fab { transform: rotate(45deg); }

/* ── Bottom nav ── */
.bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 430px;
  height: var(--nav-h);
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(14px);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 20;
}

.bottom-nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--oled-muted);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  position: relative;
  min-height: var(--tap);
}

.bottom-nav button svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  opacity: 0.85;
}

.bottom-nav button.active {
  color: var(--oled-text);
}

.bottom-nav button.active svg {
  opacity: 1;
}

.bottom-nav button[data-tab="progress"] svg {
  width: 24px;
  height: 24px;
  fill: none;
}

.bottom-nav button[data-tab="progress"].needs-checkin::before {
  content: "";
  position: absolute;
  top: 7px;
  left: 50%;
  width: 34px;
  height: 23px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: rgba(22, 236, 6, 0.26);
  box-shadow: 0 0 12px rgba(22, 236, 6, 0.88), 0 0 24px rgba(22, 236, 6, 0.42);
  z-index: -1;
}

.bottom-nav button[data-tab="progress"].needs-checkin svg {
  color: var(--recovery-high);
  filter: drop-shadow(0 0 5px rgba(22, 236, 6, 0.9));
}

.progress-page { padding-bottom: 118px; }
.progress-page h1 { margin: 4px 0 20px; }
.progress-checkin { border-color: rgba(22, 236, 6, 0.45); }
.progress-checkin.is-complete { border-color: var(--oled-line); }
.progress-checkin h2 { margin: 4px 0 6px; font-size: 20px; }
.progress-confirmation { margin: 14px 0 0; color: var(--recovery-high); font-size: 13px; font-weight: 700; }
.progress-section { margin-top: 14px; }
.progress-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.progress-section-head .btn { min-height: 34px; padding: 5px 10px; font-size: 11px; }
.progress-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.progress-metric { min-width: 0; padding: 12px 8px; border-radius: 10px; background: var(--oled-raised); text-align: center; }
.progress-metric span, .progress-metric small, .progress-row small { display: block; color: var(--oled-muted); font-size: 10px; }
.progress-metric b { display: block; margin-top: 3px; font-size: 16px; }
.progress-trends { margin-top: 16px; }
.progress-trend { margin-top: 12px; }
.progress-trend > span { color: var(--oled-muted); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
.progress-chart { width: 100%; height: auto; display: block; }
.progress-trend-range { display: flex; justify-content: space-between; color: var(--oled-muted); font-size: 10px; }
.progress-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--oled-line); }
.progress-row b { display: block; font-size: 14px; }
.progress-row > span { color: var(--oled-muted); font-size: 12px; white-space: nowrap; }
.progress-goals { margin: 10px 0 0; padding-left: 18px; }
.progress-goals li { margin: 8px 0; }

.nav-badge {
  position: absolute;
  top: 8px;
  right: calc(50% - 22px);
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--oled-text);
  color: #000;
  font-style: normal;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

/* ── Coach sheet ── */
.coach-sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  align-items: end;
  justify-items: center;
}

.coach-sheet-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
}

.coach-sheet-panel {
  position: relative;
  width: min(430px, 100%);
  max-height: 78dvh;
  background: var(--oled-surface);
  border-radius: 20px 20px 0 0;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-bottom: 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
}

.coach-sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.coach-sheet-head strong {
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 0.04em;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--oled-raised);
  font-size: 22px;
  line-height: 1;
}

.coach-log {
  flex: 1;
  overflow: auto;
  max-height: 42dvh;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.msg {
  padding: 10px 12px;
  border-radius: 14px;
  max-width: 92%;
  font-size: 14px;
  line-height: 1.45;
}

.msg.user {
  align-self: flex-end;
  background: rgba(255, 255, 255, 0.08);
}

.msg.assistant {
  align-self: flex-start;
  background: var(--oled-raised);
  border: 1px solid var(--oled-line);
}

.coach-compose {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: end;
}

.coach-compose textarea {
  background: #0a0a0a;

}

.shell-screen--training {

}

.trn-top {

}

.trn-logo {

.trn-icon-btn {

.trn-bell-badge {

.trn-block {

.trn-block:last-of-type { border-bottom: 0; }

.trn-block-head {

}

.trn-letter {

}

.trn-block--lift {

}

.trn-block--lift .trn-letter {

}

.trn-block-title,
.trn-lift-title {

}

.trn-lift-rx {

  font-size: 15px;
  font-weight: 600;

}

.trn-warmup-list {

}

.trn-warmup-list li {

.trn-num {

.trn-item-text { flex: 1; min-width: 0; }

.trn-note {

}

.trn-link {

.trn-section {

.trn-section-label {

.trn-section-badge {

}

.trn-section-badge svg {

  height: 16px;

}

.trn-recovery-list {
  margin: 0 0 10px;

.trn-recovery-goal {

}

.trn-block--recovery .trn-link {

}

.trn-add-exercise {
  display: flex;
  align-items: center;

  font-weight: 600;
}

.trn-add-icon {

  height: 28px;
  border-radius: 50%;

  place-items: center;
  font-size: 20px;
  font-weight: 400;
  line-height: 1;
}

.trn-ss {
  text-align: center;
  color: var(--trn-blue);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin: 2px 24px 10px;
  border: 1px solid var(--trn-blue);
  border-radius: 999px;
  padding: 4px;
}

.trn-session-name {
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 8px 0 12px;
}
  color: var(--oled-muted);
  text-align: center;
  padding: 40px 12px;
  font-size: 14px;
}

.fab-layer--training .fab {
  background: var(--trn-blue);
  color: #fff;
  font-weight: 400;
}

.bottom-nav button[data-tab="training"].active::before {
  content: "";
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 34px;
  height: 22px;
  border-radius: 6px;
  background: rgba(22, 236, 6, 0.22);
  z-index: -1;
}

.bottom-nav button[data-tab="training"].active svg {
  color: var(--recovery-high);
  fill: var(--recovery-high);
}

.nav-me-logo {
  width: 22px;
  height: 22px;
  border-radius: 50%;

.bottom-nav button[data-tab="me"].active .nav-me-logo {

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;

  }

/* One active set, in the existing logger shell. */
.log-active-set { border-top: 1px solid rgba(255,255,255,.12); margin-top: 20px; padding-top: 16px; }
.log-active-set h3 { font-size: 22px; margin: 0 0 8px; }
.log-set-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.log-set-heading > span { color: rgba(255,255,255,.72); font-size: 14px; }
.log-set-action { flex-shrink: 0; padding: 8px 16px; border-top: 1px solid rgba(255,255,255,.12); background: #000; }
.log-set-action .log-primary { margin: 0; }
.log-set-prescribed, .log-set-target { color: rgba(255,255,255,.72); font-size: 14px; margin: 8px 0 16px; }
.log-set-target strong { color: #fff; font-weight: 500; }
.log-active-fields { display: flex; gap: 12px; }
.log-active-fields label { flex: 1; min-width: 0; color: rgba(255,255,255,.72); font-size: 14px; }
.log-active-fields input { display: block; min-height: 76px; margin-top: 8px; font-size: 32px; font-variant-numeric: tabular-nums; }
.log-active-fields input[value="empty bar"] { font-size: 22px; letter-spacing: 0; }
.log-active-fields input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
.log-active-fields input::-webkit-inner-spin-button, .log-active-fields input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.log-active-fields input:focus-visible { outline: 2px solid #1ba3ff; outline-offset: 2px; }
.log-effort-inline { margin-top: 22px; }
.log-effort-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 16px; }
.log-effort-heading strong { font-size: 14px; color: #1ba3ff; }
.log-effort-slider { appearance: none; display: block; width: 100%; height: 48px; margin: 8px 0 0; background: transparent; cursor: pointer; }
.log-effort-slider::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: #8e8e93; }
.log-effort-slider::-moz-range-track { height: 4px; border-radius: 4px; background: #8e8e93; }
.log-effort-slider::-webkit-slider-thumb { appearance: none; width: 30px; height: 30px; border: 2px solid #fff; border-radius: 50%; background: #1ba3ff; margin-top: -13px; }
.log-effort-slider::-moz-range-thumb { width: 28px; height: 28px; border: 2px solid #fff; border-radius: 50%; background: #1ba3ff; }
.log-effort-slider:focus-visible { outline: 2px solid #1ba3ff; outline-offset: 3px; border-radius: 8px; }
.log-effort-slider:disabled { opacity: .4; cursor: default; }
.log-effort-labels { display: flex; justify-content: space-between; color: rgba(255,255,255,.72); font-size: 14px; }
.log-set-incomplete { width: 100%; min-height: 48px; border: 1px solid rgba(255,255,255,.28); border-radius: 8px; margin-top: 18px; }
.log-set-incomplete[aria-pressed="true"] { color: #fff; border-color: #1ba3ff; background: #1c1c1e; }
.log-set-error { color: #fff; font-size: 14px; margin: 12px 0 0; }
.log-set-error:empty { display: none; }
.log-active-set .log-primary { margin-top: 8px; }
.log-set-history-list { margin-top: 18px; }
.log-set-history { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; min-height: 48px; border-bottom: 1px solid rgba(255,255,255,.12); padding: 10px 0; font-size: 13px; }
.log-set-history .log-link { margin-left: auto; }
.log-set-tick { color: #16ec06; font-size: 20px; }
.log-set-skip { color: #1ba3ff; display: block; margin: 4px auto; min-height: 44px; }
.log-active-set button:focus-visible, .log-set-history:focus-visible { outline: 2px solid #1ba3ff; outline-offset: 3px; }
.log-active-fields .log-cell {width:100%;box-sizing:border-box;}
.log-active-set {margin-top:14px;padding-top:12px;}
.log-active-fields input {min-height:66px;}
.log-effort-inline {margin-top:16px;}
.log-body {overscroll-behavior:contain;}
.log-effort-labels {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11px;line-height:1.3;text-align:center;}
.log-effort-labels span:first-child {text-align:left;}
.log-effort-labels span:last-child {text-align:right;}
.log-demo-note {color:var(--oled-muted);font-size:11px;margin:8px 0;}
.log-load-decision {margin:0 0 12px;color:var(--trn-blue);}

@media (max-height:660px) { .log-active-set h3{font-size:19px;} .log-active-fields input{min-height:50px;} }

.lib-top {

<p class="play-note">Training builder. The warm-up file stays separate.</p>

<div class="phone" id="phone">
  <div class="viewport" id="view"></div>
</div>
<script>
(function () {
  const CATALOG = [
    ['back_squat', 'Back Squat'],
    ['bench_press', 'Bench Press'],
    ['lat_pull_downs', 'Lat Pull Downs'],
    ['reverse_hypers', 'Reverse Hypers'],
    ['front_squat', 'Front Squat'],
    ['romanian_deadlift', 'Romanian Deadlift'],
    ['goblet_box_squat', 'Goblet Box Squat'],
    ['farmer_carry', 'Farmer Carry']
  ];
  const PRESET = {
    back_squat: { metric: 'reps', sets: ['10', '8', '6'], tempo: ['2', '0', 'X', '1'], amrap: true },
    bench_press: { metric: 'reps_range', sets: ['6-8', '6-8', '6-8'], tempo: ['3', '3', 'X', '1'] },
    lat_pull_downs: { metric: 'reps', sets: ['10', '10', '10'], tempo: ['', '', '', ''] },
    reverse_hypers: { metric: 'reps', sets: ['10', '10', '10'], tempo: ['', '', '', ''] },
    front_squat: { metric: 'reps', sets: ['5', '3', '1'], tempo: ['', '', '', ''] },
    romanian_deadlift: { metric: 'reps', sets: ['8', '8', '8'], tempo: ['', '', '', ''] },
    goblet_box_squat: { metric: 'reps', sets: ['10', '10', '10'], tempo: ['', '', '', ''] },
    farmer_carry: { metric: 'meters', sets: ['20', '20', '20'], tempo: ['', '', '', ''] }
  };
  const METRICS = [
    ['reps', 'Reps'], ['reps_range', 'Rep Range'],
    ['weight_lb', 'Weight (lb)'], ['weight_kg', 'Weight (kg)'],
    ['weight_pct', 'Weight (%)'], ['lwp', 'Linear Weight Progression'],
    ['time_mmss', 'Time (mm:ss)'], ['seconds', 'Seconds'],
    ['miles', 'Miles'], ['yards', 'Yards'], ['meters', 'Meters'],
    ['feet', 'Feet'], ['watts', 'Watts'], ['calories', 'Calories'],
    ['inches', 'Inches'], ['velocity', 'Velocity (m/s)'], ['other', 'Other']
  ];
  const KEY = 'strength-training-play';

  function preset(id) { return PRESET[id] || { metric: 'reps', sets: ['8', '8', '8'], tempo: ['', '', '', ''] }; }
  function makeBlock(catalogId, groupId) {
    const known = CATALOG.find((row) => row[0] === catalogId);
    const title = known ? known[1] : catalogId;
    const row = preset(catalogId);
    const sets = row.sets.map((text) => ({ text, amrap: false }));
    if (row.amrap) sets.push({ text: '', amrap: true });
    return {
      id: catalogId + '-' + Math.random().toString(36).slice(2, 7),
      catalogId, title, groupId: groupId || null,
      metric: row.metric, metric2: 'none', sets,
      tempo: row.tempo.slice(), notes: '', notice: ''
    };
  }
  function fresh() {
    const group = 'ss-accessories';
    return {
      screen: 'edit',
      title: 'Lower Strength',
      instructions: '',
      query: '',
      selected: [],
      blocks: [
        makeBlock('back_squat'),
        makeBlock('bench_press'),
        makeBlock('lat_pull_downs', group),
        makeBlock('reverse_hypers', group)
      ],
      pad: null,
      date: new Date().toISOString().slice(0, 10),
      posted: '',
      creating: false,
      draftTitle: '',
      tempoMenu: null,
      tempoAdd: false,
      tempoDraft: null,
      tempoError: ''
    };
  }
  let state = load();
  function load() {
    try {
      const saved = JSON.parse(sessionStorage.getItem(KEY) || 'null');
      if (saved && (saved.screen === 'edit' || saved.screen === 'pick' || saved.screen === 'calendar')) {
        saved.blocks = saved.blocks || [];
        saved.pad = null;
        saved.creating = false;
        saved.tempoMenu = null;
        saved.tempoAdd = false;
        saved.tempoDraft = null;
        saved.tempoError = '';
        return saved;
      }
    } catch (e) {}
    return fresh();
  }
  function save() { sessionStorage.setItem(KEY, JSON.stringify(state)); }
  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function block(id) { return state.blocks.find((b) => b.id === id); }
  function isRep(metric) { return metric === 'reps' || metric === 'reps_range'; }
  function isEntry(metric) { return isRep(metric) || metric === 'meters' || metric === 'seconds' || metric === 'time_mmss'; }
  function metricName(metric) {
    if (!metric || metric === 'none') return '';
    const hit = METRICS.find((row) => row[0] === metric);
    return hit ? hit[1] : 'Reps';
  }
  function metricOptions(selected, allowNone) {
    const rows = (allowNone ? [['none', 'None']] : []).concat(METRICS);
    return rows.map(([key, label]) => '<option value="' + key + '"' + (selected === key ? ' selected' : '') + '>' + esc(label) + '</option>').join('');
  }
  function columnMetric(b, field) {
    return field === 'extra' ? (b.metric2 && b.metric2 !== 'none' ? b.metric2 : '') : b.metric;
  }
  function letters() {
    let code = 65;
    let i = 0;
    while (i < state.blocks.length) {
      const run = [state.blocks[i]];
      let j = i + 1;
      if (state.blocks[i].groupId) {
        while (j < state.blocks.length && state.blocks[j].groupId === state.blocks[i].groupId) run.push(state.blocks[j++]);
      }
      const letter = String.fromCharCode(code++);
      if (run.length === 1) run[0].letter = letter;
      else run.forEach((item, n) => { item.letter = letter + String(n + 1); });
      i = j;
    }
  }
  function rx(b) {
    const work = b.sets.filter((s) => !s.amrap).map((s) => s.text || '0');
    const same = work.length && work.every((text) => text === work[0]);
    let body = same ? work.length + ' x ' + work[0] : work.join(' / ');
    if (b.sets.some((s) => s.amrap)) body += ' / AMRAP';
    if (b.metric === 'meters') body += ' m';
    if (b.metric === 'seconds') body += ' sec';
    const tempo = (b.tempo || ['', '', '', '']).join('');
    return tempo.trim() ? body + ' · ' + tempo : body;
  }
  function nav() {
    return `<nav class="bottom-nav">
      <button type="button" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg><span>Home</span></button>
      <button type="button" data-tab="training"><svg viewBox="0 0 24 24"><path d="M7 3v2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2V3H7zm0 4h10v10H7V7z"/></svg><span>Training</span></button>
      <button type="button" data-tab="progress"><svg viewBox="0 0 40 40"><path d="M6 17 20 4l14 13M6 25 20 12l14 13M6 33 20 20l14 13" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square"/></svg><span>Progress</span></button>
      <button type="button" class="active" data-tab="library"><svg viewBox="0 0 24 24"><path d="M6 4h11a2 2 0 0 1 2 2v13H8a2 2 0 0 1-2-2V4zm2 14h9V6H8v12zM4 6h1v14H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/></svg><span>Library</span></button>
      <button type="button" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M6 19c1.2-3 3.2-4.5 6-4.5S16.8 16 18 19"/></svg><span>Me</span></button>
    </nav>`;
  }
  function setCell(b, s, i, field) {
    const metric = columnMetric(b, field);
    if (!metric) return '<div></div>';
    const n = i + 1;
    if (s.amrap && (metric === 'weight_kg' || metric === 'weight_lb')) return '<div class="lib-cell">Set 1 weight</div>';
    if (s.amrap && isRep(metric)) return '<div class="lib-cell" aria-label="Set ' + n + ' AMRAP">AMRAP</div>';
    if (s.amrap || !isEntry(metric)) return '<div class="lib-cell"></div>';
    const on = state.pad && state.pad.blockId === b.id && state.pad.setIndex === i && state.pad.field === field;
    const unit = metric === 'reps' || metric === 'reps_range' ? 'reps' : metricName(metric);
    return '<button type="button" class="lib-cell' + (on ? ' focus-cell' : '') + '" aria-label="Set ' + n + ' ' + esc(unit) + '" onclick="Play.openPad(\'' + b.id + '\',' + i + ',\'' + field + '\')">' + esc(field === 'extra' ? (s.extra || '0') : (s.text || '0')) + '</button>';
  }
  const TEMPO_KEY = 'strength-training-tempos';
  function savedTempos() {
    try {
      const list = JSON.parse(localStorage.getItem(TEMPO_KEY) || '[]');
      return Array.isArray(list) ? list.filter((item) => typeof item === 'string') : [];
    } catch (e) { return []; }
  }
  function rememberTempo(text) {
    const list = savedTempos();
    if (list.includes(text)) return;
    list.push(text);
    localStorage.setItem(TEMPO_KEY, JSON.stringify(list));
  }
  function tempoText(b) { return (b.tempo || ['', '', '', '']).join(''); }
  function tempoControl(b) {
    const current = tempoText(b).trim();
    const open = state.tempoMenu === b.id;
    const options = '<button type="button" class="tempo-opt' + (current ? '' : ' on') + '" onclick="Play.pickTempo(\'' + b.id + '\',\'\')">No tempo</button>' + savedTempos().map((text) => '<button type="button" class="tempo-opt' + (text === current ? ' on' : '') + '" onclick="Play.pickTempo(\'' + b.id + '\',\'' + text + '\')">' + esc(text) + '</button>').join('');
    let add = '';
    if (open && state.tempoAdd) {
      const draft = state.tempoDraft || ['', '', '', ''];
      const box = (index, name, hint, label) => '<label class="lib-grid-h">' + name + '<input class="lib-cell" maxlength="1" aria-label="' + label + ' for ' + esc(b.title) + '" value="' + esc(draft[index]) + '" oninput="Play.draftTempo(' + index + ', this.value)"><span>' + hint + '</span></label>';
      add = '<div class="tempo-add"><div class="lib-grid tempo-grid">' + box(0, 'Lower', 'way down', 'Lower') + box(1, 'Pause', 'bottom', 'Bottom pause') + box(2, 'Lift', 'X means fast', 'Lift') + box(3, 'Pause', 'top', 'Top pause') + '</div><p role="status">' + esc(state.tempoError || '') + '</p><button type="button" class="lib-primary" onclick="Play.saveTempo(\'' + b.id + '\')">Save</button></div>';
    }
    const menu = open ? '<div class="tempo-menu">' + options + '<button type="button" class="tempo-opt" onclick="Play.beginTempo(\'' + b.id + '\')">Add tempo</button>' + add + '</div>' : '';
    return '<div class="tempo-pick"><button type="button" class="tempo-btn" aria-label="Tempo for ' + esc(b.title) + '" onclick="Play.toggleTempo(\'' + b.id + '\')">' + esc(current || 'No tempo') + '</button>' + menu + '</div>';
  }
  function cardHtml(b) {
    const amrap = b.sets.at(-1)?.amrap;
    const rows = b.sets.map((s, i) => '<span>' + (i + 1) + '</span>' + setCell(b, s, i, 'text') + setCell(b, s, i, 'extra')).join('');
    const amrapBtn = isRep(b.metric) ? '<button type="button" class="lib-text-btn" onclick="Play.amrap(\'' + b.id + '\')">' + (amrap ? 'Remove AMRAP' : 'Add final AMRAP') + '</button>' : '';
    return '<article class="lib-block lib-ex" data-block="' + esc(b.catalogId) + '"><div class="lib-ex-top"><span class="lib-letter">' + esc(b.letter) + '</span><h3>' + esc(b.title) + '</h3><button type="button" class="lib-danger" aria-label="Delete ' + esc(b.title) + '" onclick="Play.removeBlock(\'' + b.id + '\')">Delete</button><button type="button" class="lib-done" onclick="Play.closePad()">Done</button></div><div class="meta">' + esc(rx(b)) + '</div><label class="lib-notes"><textarea placeholder="Add notes or instructions here" onchange="Play.notes(\'' + b.id + '\', this.value)">' + esc(b.notes) + '</textarea></label><div class="lib-field lib-metrics"><label>What do you want to track?</label><div class="lib-cols"><select aria-label="First metric for ' + esc(b.title) + '" onchange="Play.metric(\'' + b.id + '\', this.value)">' + metricOptions(b.metric, false) + '</select><select aria-label="Second metric for ' + esc(b.title) + '" onchange="Play.metric2(\'' + b.id + '\', this.value)">' + metricOptions(b.metric2 || 'none', true) + '</select></div></div><div class="lib-grid set-grid has-two"><span></span><div class="lib-grid-h">' + esc(metricName(b.metric)) + '</div><div class="lib-grid-h">' + esc(metricName(b.metric2)) + '</div>' + rows + '</div><p role="status">' + esc(b.notice || '') + '</p>' + tempoControl(b) + '<div class="lib-stepper"><button type="button" class="lib-step" aria-label="Remove a set from ' + esc(b.title) + '" onclick="Play.nudge(\'' + b.id + '\',-1)">−</button><span>Set</span><button type="button" class="lib-step" aria-label="Add a set to ' + esc(b.title) + '" onclick="Play.nudge(\'' + b.id + '\',1)">+</button></div>' + amrapBtn + '</article>';
  }
  function editorHtml() {
    letters();
    let body = '';
    state.blocks.forEach((b, i) => {
      const prev = state.blocks[i - 1];
      if (prev && prev.groupId && prev.groupId === b.groupId) body += '<div class="lib-ss">− Superset</div>';
      body += cardHtml(b);
    });
    const posted = state.posted ? '<p class="play-confirm">Posted for ' + esc(state.posted) + '</p>' : '';
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row"><span class="lib-back"></span><h1>Session Template</h1></div>
      <div class="lib-field"><label for="trainTitle">Title</label><input id="trainTitle" value="${esc(state.title)}" onchange="Play.field('title', this.value)"></div>
      <div class="lib-field"><label for="trainInstr">Session instructions</label><textarea id="trainInstr" placeholder="Coach notes for Start Session" onchange="Play.field('instructions', this.value)">${esc(state.instructions)}</textarea></div>
      ${posted}
      ${body}
      <div style="padding:16px"><button type="button" class="lib-primary" onclick="Play.calendar()">Post to calendar</button></div>
      <div class="lib-row-btns"><button type="button" onclick="Play.goPick()">+ Add Exercise</button></div>
      ${padHtml()}
      ${nav()}
    </div>`;
  }
  function pickRows() {
    const q = state.query.trim().toLowerCase();
    return CATALOG.filter((row) => row[1].toLowerCase().includes(q)).map(([id, title]) => {
      const on = state.selected.includes(id);
      const have = state.blocks.some((b) => b.catalogId === id);
      return `<button type="button" class="lib-pick-row" ${have ? 'disabled' : ''} onclick="Play.togglePick('${id}')"><b>${esc(title)}</b><span class="lib-unit">${esc(metricName(preset(id).metric))}</span><span class="lib-radio${on ? ' on' : ''}"></span></button>`;
    }).join('') || '<div class="lib-empty">No results. Create something new.</div>';
  }
  function pickHtml() {
    const rows = pickRows();
    const n = state.selected.length;
    const sheet = state.creating ? `<div class="lib-sheet"><div class="lib-sheet-card"><h2>New Exercise</h2><div class="lib-field"><label for="newExTitle">Title</label><input id="newExTitle" value="${esc(state.draftTitle)}" placeholder="Title" oninput="Play.draftTitle(this.value)"></div><div class="lib-field"><label>What do you want to track?</label><div class="lib-cols"><select id="newC1" aria-label="First metric for the new exercise">${metricOptions('reps', false)}</select><select id="newC2" aria-label="Second metric for the new exercise">${metricOptions('none', true)}</select></div></div><button type="button" class="lib-primary" onclick="Play.saveNewEx()">Create</button></div></div>` : '';
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row">
        <button type="button" class="lib-back" aria-label="Back" onclick="Play.goEdit()">←</button>
        <h1>Exercises</h1>
        <button type="button" class="lib-text-btn" ${n < 2 ? 'disabled' : ''} onclick="Play.addSuperset()">Superset</button>
        <button type="button" class="lib-text-btn" ${n < 1 ? 'disabled' : ''} onclick="Play.addSelected()">Add${n ? ' (' + n + ')' : ''}</button>
      </div>
      <div class="lib-search"><input value="${esc(state.query)}" placeholder="Search exercises and circuits" aria-label="Search exercises" oninput="Play.search(this.value)"></div>
      <div class="lib-tabs"><button type="button" class="on">Exercises</button></div>
      <button type="button" class="lib-create" onclick="Play.newEx()"><span class="lib-plus">+</span> Create New Exercise</button>
      <div id="libResults">${rows}</div>
      ${sheet}
      ${nav()}
    </div>`;
  }
  function calendarHtml() {
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row"><button type="button" class="lib-back" aria-label="Back" onclick="Play.goEdit()">←</button><h1>Post to calendar</h1></div>
      <div class="lib-field"><label for="sessionPostDate">Session date</label><input id="sessionPostDate" type="date" value="${esc(state.date)}" onchange="Play.field('date', this.value)"></div>
      <p class="lib-empty" style="text-align:left;padding:0 16px 12px">Lands on your Training tab only — no other athletes.</p>
      <div style="padding:0 16px"><button type="button" class="lib-primary" onclick="Play.confirmDate()">Post to calendar</button></div>
      <p class="lib-empty">${esc(state.title)}</p>
      ${nav()}
    </div>`;
  }
  function split(buffer) {
    const text = String(buffer || '');
    const dash = text.indexOf('-');
    return dash < 0 ? { left: text, dash: false, right: '' } : { left: text.slice(0, dash), dash: true, right: text.slice(dash + 1) };
  }
  function padHtml() {
    if (!state.pad) return '';
    const b = block(state.pad.blockId);
    if (!b) return '';
    const parts = split(state.pad.buffer);
    const mark = (text, on) => on ? '<span class="photo-caret">' + esc(text || '') + '</span>' : esc(text);
    const val = !parts.dash ? mark(parts.left || '0', true) : mark(parts.left, state.pad.side !== 'right') + '-' + mark(parts.right, state.pad.side === 'right');
    const key = (label, col, row, extra) => '<button type="button" class="photo-key' + (extra || '') + '" style="grid-column:' + col + ';grid-row:' + row + '" onclick="Play.key(\'' + label + '\')">' + (label === '⌫' ? '⌫' : label) + '</button>';
    const metric = columnMetric(b, state.pad.field) || b.metric;
    const unit = metric === 'seconds' || metric === 'time_mmss' ? 'SEC' : metric === 'meters' ? 'M' : metric === 'weight_kg' ? 'KG' : metric === 'weight_lb' ? 'LB' : metric === 'weight_pct' ? '%' : isRep(metric) ? 'REPS' : 'VALUE';
    return '<div class="photo-pad" role="dialog" aria-label="' + esc(metricName(metric)) + ' keypad"><div class="photo-pad-top"><div class="photo-pad-val" aria-live="polite">' + val + '</div><span class="photo-pad-unit">' + unit + '</span><button type="button" class="photo-pad-close" aria-label="Close keypad" onclick="Play.closePad()">⌄</button></div><div class="photo-pad-grid">' + key('1', 1, 1) + key('2', 2, 1) + key('3', 3, 1) + key('>', 4, 1) + key('4', 1, 2) + key('5', 2, 2) + key('6', 3, 2) + key('<', 4, 2) + key('7', 1, 3) + key('8', 2, 3) + key('9', 3, 3) + key('–', 1, 4) + key('0', 2, 4) + key('⌫', 3, 4, ' photo-key-bs') + '</div><p role="status">' + esc(state.pad.error || '') + '</p></div>';
  }
  function render() {
    letters();
    save();
    const phone = document.getElementById('phone');
    const view = document.getElementById('view');
    const y = view.scrollTop;
    phone.classList.toggle('has-pad', state.screen === 'edit' && !!state.pad);
    const html = state.screen === 'pick' ? pickHtml() : state.screen === 'calendar' ? calendarHtml() : editorHtml();
    view.innerHTML = '<div class="shell">' + html + '</div>';
    if (state.screen !== render.screen) view.scrollTop = 0;
    else view.scrollTop = y;
    render.screen = state.screen;
  }
  function digits(text) { return String(text || '').replace(/\D/g, ''); }
  function writeSet(b, index, field, text) {
    const set = b.sets[index];
    if (!set || set.amrap) return;
    if (field === 'extra') set.extra = text;
    else set.text = text;
  }
  function applyBuffer() {
    const b = block(state.pad.blockId);
    const set = b && b.sets[state.pad.setIndex];
    if (!set || set.amrap) return;
    const metric = columnMetric(b, state.pad.field) || b.metric;
    const parts = split(state.pad.buffer);
    if (metric === 'reps_range') {
      const left = digits(parts.left);
      const right = digits(parts.right);
      if (!parts.dash) { writeSet(b, state.pad.setIndex, state.pad.field, left || '0'); return; }
      if (!right) return;
      if (Number(right) < Number(left || '0')) { state.pad.error = 'Enter the lower number first.'; return; }
      writeSet(b, state.pad.setIndex, state.pad.field, (left || '0') + '-' + right);
      return;
    }
    if (parts.dash) { state.pad.error = 'Range needs Rep Range.'; return; }
    writeSet(b, state.pad.setIndex, state.pad.field, digits(parts.left) || '0');
  }
  const Play = {
    restart() { state = fresh(); render(); },
    field(key, value) { state[key] = value; save(); },
    draftTitle(value) { state.draftTitle = value; save(); },
    goEdit() { state.screen = 'edit'; state.pad = null; state.selected = []; state.query = ''; state.creating = false; render(); },
    goPick() { state.screen = 'pick'; state.pad = null; state.selected = []; state.query = ''; state.creating = false; render(); },
    calendar() { state.screen = 'calendar'; state.pad = null; render(); },
    confirmDate() {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(state.date || '')) return;
      state.posted = state.date;
      state.screen = 'edit';
      render();
    },
    search(value) {
      state.query = value;
      save();
      const box = document.getElementById('libResults');
      if (!box) return render();
      box.innerHTML = pickRows();
      const input = document.querySelector('.lib-search input');
      if (input) { input.focus(); input.setSelectionRange(value.length, value.length); }
    },
    togglePick(id) {
      if (state.blocks.some((b) => b.catalogId === id)) return;
      const at = state.selected.indexOf(id);
      if (at >= 0) state.selected.splice(at, 1);
      else state.selected.push(id);
      render();
    },
    addSelected() { Play.commit(false); },
    addSuperset() { if (state.selected.length >= 2) Play.commit(true); },
    commit(asSuperset) {
      const groupId = asSuperset ? 'ss-' + Math.random().toString(36).slice(2, 7) : null;
      state.selected.forEach((id) => {
        if (state.blocks.some((b) => b.catalogId === id)) return;
        state.blocks.push(makeBlock(id, groupId));
      });
      state.selected = [];
      state.query = '';
      state.screen = 'edit';
      render();
    },
    newEx() { state.creating = true; state.draftTitle = ''; render(); },
    saveNewEx() {
      const title = String(state.draftTitle || '').trim();
      if (!title) return;
      const c1 = document.getElementById('newC1')?.value || 'reps';
      const c2 = document.getElementById('newC2')?.value || 'none';
      const id = 'custom-' + Math.random().toString(36).slice(2, 7);
      CATALOG.push([id, title]);
      PRESET[id] = { metric: c1, sets: c1 === 'reps_range' ? ['8-12', '8-12', '8-12'] : c1 === 'meters' ? ['20', '20', '20'] : ['8', '8', '8'], tempo: ['', '', '', ''] };
      const made = makeBlock(id);
      made.metric2 = c2;
      state.blocks.push(made);
      state.creating = false;
      state.screen = 'edit';
      render();
    },
    removeBlock(id) {
      state.blocks = state.blocks.filter((b) => b.id !== id);
      if (state.pad && state.pad.blockId === id) state.pad = null;
      render();
    },
    notes(id, value) { const b = block(id); if (b) b.notes = value; save(); },
    toggleTempo(id) {
      state.tempoMenu = state.tempoMenu === id ? null : id;
      state.tempoAdd = false;
      state.tempoError = '';
      state.pad = null;
      render();
    },
    beginTempo(id) {
      const b = block(id);
      const tempo = (b && b.tempo) || ['', '', '', ''];
      state.tempoMenu = id;
      state.tempoAdd = true;
      state.tempoError = '';
      state.tempoDraft = tempo.map((part) => String(part || '').slice(0, 1));
      render();
    },
    draftTempo(index, value) {
      state.tempoDraft = state.tempoDraft || ['', '', '', ''];
      state.tempoDraft[index] = String(value || '').slice(0, 1).toUpperCase();
      save();
    },
    pickTempo(id, text) {
      const b = block(id);
      if (!b) return;
      if (text === '') b.tempo = ['', '', '', ''];
      else if (/^[0-9X]{4}$/.test(text)) b.tempo = text.split('');
      else return;
      state.tempoMenu = null;
      state.tempoAdd = false;
      render();
    },
    saveTempo(id) {
      const b = block(id);
      const draft = (state.tempoDraft || []).map((part) => String(part || '').toUpperCase());
      if (!b || draft.length !== 4 || draft.some((part) => !/^[0-9X]$/.test(part))) {
        state.tempoError = 'Use a number or X in each box.';
        render();
        return;
      }
      b.tempo = draft;
      rememberTempo(draft.join(''));
      state.tempoMenu = null;
      state.tempoAdd = false;
      state.tempoError = '';
      render();
    },
    nudge(id, dir) {
      const b = block(id);
      if (!b) return;
      const amrap = b.sets.filter((s) => s.amrap);
      const work = b.sets.filter((s) => !s.amrap);
      if (dir > 0 && work.length < 12) work.push({ text: work.at(-1)?.text || '8', amrap: false, extra: work.at(-1)?.extra });
      else if (dir < 0 && work.length > 1) work.pop();
      b.sets = work.concat(amrap);
      state.pad = null;
      render();
    },
    amrap(id) {
      const b = block(id);
      if (!b || !isRep(b.metric)) return;
      if (b.sets.at(-1)?.amrap) b.sets.pop();
      else b.sets.push({ text: '', amrap: true });
      state.pad = null;
      render();
    },
    metric(id, metric) {
      const b = block(id);
      if (!b) return;
      if (b.metric === 'reps_range' && metric !== 'reps_range') {
        b.sets.forEach((s) => { if (!s.amrap && String(s.text).includes('-')) s.text = String(s.text).split('-')[0] || '0'; });
        b.notice = 'Range became the lower number.';
      } else b.notice = '';
      b.metric = metric;
      if (!isRep(metric)) b.sets = b.sets.filter((s) => !s.amrap);
      if (state.pad && state.pad.blockId === id) state.pad = null;
      render();
    },
    metric2(id, metric) {
      const b = block(id);
      if (!b) return;
      b.metric2 = metric || 'none';
      if (b.metric2 !== 'none') b.sets.forEach((s) => { if (s.extra == null) s.extra = ''; });
      if (state.pad && state.pad.blockId === id && state.pad.field === 'extra') state.pad = null;
      render();
    },
    openPad(id, index, field) {
      const b = block(id);
      const set = b && b.sets[index];
      const which = field === 'extra' ? 'extra' : 'text';
      const metric = b && columnMetric(b, which);
      if (!b || !set || set.amrap || !isEntry(metric)) { state.pad = null; render(); return; }
      const source = which === 'extra' ? (set.extra || '') : (set.text || '');
      state.pad = { blockId: id, setIndex: index, field: which, buffer: source, side: 'left', fresh: true, error: '' };
      render();
    },
    closePad() { state.pad = null; render(); },
    key(key) {
      if (!state.pad) return;
      const b = block(state.pad.blockId);
      const metric = columnMetric(b, state.pad.field) || b.metric;
      const parts = split(state.pad.buffer);
      const side = state.pad.side === 'right' && parts.dash ? 'right' : 'left';
      state.pad.error = '';
      if (key === '>' || key === '–' || key === '-') {
        if (metric !== 'reps_range') { state.pad.error = 'Range needs Rep Range.'; render(); return; }
        parts.dash = true; state.pad.side = 'right'; state.pad.fresh = true;
      } else if (key === '<') { state.pad.side = 'left'; state.pad.fresh = true; }
      else if (key === '⌫') {
        if (side === 'right' && parts.right) parts.right = parts.right.slice(0, -1);
        else if (side === 'right') { parts.dash = false; state.pad.side = 'left'; }
        else parts.left = parts.left.slice(0, -1);
        state.pad.fresh = false;
      } else if (/^\d$/.test(key)) {
        if (state.pad.fresh && state.pad.side !== 'right') {
          parts.left = key;
          parts.right = '';
          parts.dash = false;
          state.pad.side = 'left';
        } else if (side === 'right') parts.right = (state.pad.fresh ? '' : parts.right) + key;
        else parts.left = parts.left + key;
        state.pad.fresh = false;
      } else return;
      state.pad.buffer = parts.dash ? parts.left + '-' + parts.right : parts.left;
      applyBuffer();
      render();
    }
  };
  window.Play = Play;
  document.addEventListener('keydown', (event) => {
    if (!state.pad) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (event.key === 'Backspace') { event.preventDefault(); Play.key('⌫'); }
    else if (/^\d$/.test(event.key)) Play.key(event.key);
    else if (event.key === '-') Play.key('–');
  });
  render();
})();

</script>
</body>
</html>
