<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strength builder play</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
  --oled-bg: #000000;
  --oled-surface: #121212;
  --oled-raised: #1c1c1e;
  --oled-text: #ffffff;
  --oled-muted: #8e8e93;
  --oled-line: rgba(255, 255, 255, 0.1);
  --sleep: #9db4c8;
  --recovery-high: #16ec06;
  --recovery-mid: #ffde00;
  --recovery-low: #ff0026;
  --recovery: var(--recovery-high);
  --strain: #1ba3ff;
  --strength: #d4a574;
  --recovery-room: #9fd356;
  --trn-blue: #1ba3ff;
  --trn-letter-bg: #3a3a3c;
  --font-body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Barlow Condensed", ui-sans-serif, system-ui, sans-serif;
  --nav-h: 72px;
  --fab-size: 56px;
  --tap: 44px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--oled-bg);
  color: var(--oled-text);
  font: 16px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}

.shell {
  min-height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  background: var(--oled-bg);
}

.app {
  min-height: calc(100dvh - var(--nav-h));
  padding-bottom: calc(var(--fab-size) + 40px);
}

.hidden { display: none !important; }

/* ── OLED home shell ── */
.shell-screen--oled {
  padding: 0 20px 8px;
  max-width: 100%;
  min-width: 0;
  overflow-x: hidden;
}

.home-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 0 4px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(180deg, #000 70%, transparent);
}

.home-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
}

.home-mark {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--oled-text);
}

.home-brand-text b {
  display: block;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
}

.home-brand-text small {
  display: block;
  margin-top: 1px;
  color: var(--oled-muted);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.home-lockers {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
}

.home-lockers span {
  color: var(--oled-muted);
}

.home-lockers span.on {
  color: #fff;
}

.home-lockers i {
  font-style: normal;
  color: var(--oled-muted);
  opacity: 0.5;
}

.locker-card {
  margin-bottom: 14px;
}

.locker-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.locker-switch .btn {
  min-height: 48px;
}

.home-top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.month-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: var(--tap);
  padding: 0 4px;
  color: var(--oled-muted);
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.month-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

.today-btn {
  border: 1px solid rgba(255, 255, 255, 0.42);
  border-radius: 999px;
  padding: 7px 14px;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  min-height: var(--tap);
  transition: background 0.18s var(--ease), border-color 0.18s var(--ease);
}

.today-btn:active {
  background: var(--oled-raised);
}

.bell-btn {
  position: relative;
  width: var(--tap);
  height: var(--tap);
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.bell-btn svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: var(--oled-text);
  stroke-width: 1.6;
}

.bell-badge {
  position: absolute;
  top: 6px;
  right: 2px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--oled-text);
  color: #000;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
  font-style: normal;
}

.ath-date {
  margin: 2px 0 14px;
  font-family: var(--font-display);
  font-size: clamp(22px, 5.5vw, 28px);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: rgba(255, 255, 255, 0.72);
}

.ath-athlete {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 6px;
}

.ath-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.14);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: var(--oled-muted);
}

.ath-avatar svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.ath-name {
  margin: 0;
  color: var(--oled-muted);
  font-size: 13px;
  font-weight: 500;
}

.ath-workout {
  margin: 2px 0 0;
  font-family: var(--font-display);
  font-size: clamp(20px, 5.5vw, 24px);
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.05;
}

/* ── WHOOP dials ── */
.ath-module-whoop {
  padding: 8px 0 4px;
  margin: 0 0 8px;
}

.ath-label {
  display: block;
  margin-bottom: 8px;
  color: rgba(255, 255, 255, 0.4);
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
}

.ath-whoop-dials,
.gauge-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: clamp(4px, 1.6vw, 8px);
  margin: 10px 0 12px;
  width: 100%;
}

.ath-whoop-dial {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.ath-whoop-dial-ring {
  position: relative;
  width: min(104px, 100%);
  aspect-ratio: 1;
  margin: 0 auto;
}

.ath-whoop-dial:nth-child(1) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 14px rgba(157, 180, 200, 0.18));
}

.ath-whoop-dial:nth-child(2) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 18px rgba(22, 242, 107, 0.28));
}

.ath-whoop-dial:nth-child(3) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 14px rgba(27, 163, 255, 0.16));
}

.ath-whoop-dial-ring svg {
  width: 100%;
  height: 100%;
  display: block;
}

.ath-whoop-dial-val {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  font-family: var(--font-display);
  font-size: clamp(22px, 7.2vw, 30px);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: #fff;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  pointer-events: none;
  text-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
}

.ath-whoop-dial-val .ath-whoop-n {
  display: block;
  line-height: 1;
}

.ath-whoop-dial-val small {
  display: block;
  font-size: clamp(10px, 3vw, 12px);
  font-weight: 650;
  opacity: 0.9;
  line-height: 1;
}

.ath-whoop-dial-lab {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: rgba(255, 255, 255, 0.5);
  text-transform: uppercase;
  text-align: center;
}

.today-call {
  margin: 4px 0 0;
  padding: 12px 0 0;
  border-top: 1px solid var(--oled-line);
}

.today-call .eyebrow {
  margin: 0 0 4px;
  color: var(--oled-muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.today-call .title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.05;
}

.today-call .meta {
  margin: 6px 0 0;
  color: var(--oled-muted);
  font-size: 13px;
  line-height: 1.45;
}

/* ── Calendar week ── */
.cal-strip {
  display: flex;
  gap: 6px;
  margin: 0 0 18px;
  padding: 2px 0;
  overflow-x: auto;
  scrollbar-width: none;
}

.cal-strip::-webkit-scrollbar { display: none; }

.cal-day {
  flex: 1 0 44px;
  min-width: 44px;
  min-height: var(--tap);
  padding: 10px 0 8px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: transparent;
  color: var(--oled-muted);
  text-align: center;
  transition: border-color 0.16s var(--ease), background 0.16s var(--ease);
}

.cal-day b {
  display: block;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 500;
  color: var(--oled-text);
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}

.cal-day.active {
  border-color: rgba(255, 255, 255, 0.22);
  background: var(--oled-surface);
}

.cal-day.active b {
  font-weight: 700;
}

.cal-dots {
  display: flex;
  justify-content: center;
  gap: 3px;
  min-height: 8px;
}

.cal-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--recovery-room);
}

.cal-dot.strength { background: var(--strength); }
.cal-dot.recovery { background: var(--recovery-room); }

/* ── Session list ── */
.home-brief {
  padding: 18px 0 8px;
  border-top: 1px solid var(--oled-line);
  margin-bottom: 8px;
}

.home-brief-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.home-brief .eyebrow {
  margin: 0;
  color: var(--oled-muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.home-pill {
  padding: 4px 8px;
  border: 1px solid var(--oled-line);
  border-radius: 999px;
  color: var(--oled-muted);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.published-list {
  display: grid;
  gap: 0;
}

.published-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--oled-line);
  min-height: var(--tap);
  width: 100%;
  text-align: left;
}

.published-item:last-child { border-bottom: 0; }

.pub-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.pub-dot.strength { background: var(--strength); }
.pub-dot.recovery { background: var(--recovery-room); }

.published-item strong {
  display: block;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.published-item small {
  display: block;
  margin-top: 2px;
  color: var(--oled-muted);
  font-size: 12px;
  text-transform: capitalize;
}

.published-item .chev {
  color: rgba(255, 255, 255, 0.35);
  font-size: 18px;
  line-height: 1;
}

.empty-day {
  color: var(--oled-muted);
  text-align: center;
  padding: 28px 8px;
  font-size: 14px;
  line-height: 1.5;
}

.home-cta {
  margin-top: 18px;
}

.btn {
  min-height: var(--tap);
  padding: 12px 16px;
  border-radius: 14px;
  border: 1px solid var(--oled-line);
  background: var(--oled-surface);
  font-weight: 650;
  transition: background 0.16s var(--ease), border-color 0.16s var(--ease);
}

.btn:active { background: var(--oled-raised); }

.btn.oled-cta,
.create-session-btn {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.42);
  background: #fff;
  color: #000;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
  box-shadow: none;
}

.btn.oled-cta:active,
.create-session-btn:active {
  background: #f2f2f2;
}

@media (hover: hover) {
  .today-btn:hover { background: rgba(255, 255, 255, 0.06); }
  .btn.oled-cta:hover,
  .create-session-btn:hover {
    background: #f2f2f2;
    border-color: #fff;
  }
}

/* ── FAB ── */
.fab-layer {
  position: fixed;
  right: max(20px, calc(50% - 215px + 20px));
  bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
}

.fab-layer.open .fab-menu { display: flex; }
.fab-layer.open .fab-scrim { display: block; }

.fab-scrim {
  display: none;
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(0, 0, 0, 0.45);
}

.fab-menu {
  display: none;
  flex-direction: column;
  background: var(--oled-raised);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  overflow: hidden;
  min-width: 210px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
}

.fab-menu button {
  text-align: left;
  padding: 14px 18px;
  font-size: 15px;
  border-bottom: 1px solid var(--oled-line);
  min-height: var(--tap);
}

.fab-menu button:last-child { border-bottom: 0; }
.fab-menu button:active { background: #2c2c2e; }

.fab {
  width: var(--fab-size);
  height: var(--fab-size);
  border-radius: 50%;
  background: #fff;
  color: #000;
  font-size: 30px;
  font-weight: 300;
  line-height: 1;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  transition: transform 0.2s var(--ease);
}

.fab-layer.open .fab { transform: rotate(45deg); }

/* ── Bottom nav ── */
.bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 430px;
  height: var(--nav-h);
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(14px);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 20;
}

.bottom-nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--oled-muted);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  position: relative;
  min-height: var(--tap);
}

.bottom-nav button svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  opacity: 0.85;
}

.bottom-nav button.active {
  color: var(--oled-text);
}

.bottom-nav button.active svg {
  opacity: 1;
}

.bottom-nav button[data-tab="progress"] svg {
  width: 24px;
  height: 24px;
  fill: none;
}

.bottom-nav button[data-tab="progress"].needs-checkin::before {
  content: "";
  position: absolute;
  top: 7px;
  left: 50%;
  width: 34px;
  height: 23px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: rgba(22, 236, 6, 0.26);
  box-shadow: 0 0 12px rgba(22, 236, 6, 0.88), 0 0 24px rgba(22, 236, 6, 0.42);
  z-index: -1;
}

.bottom-nav button[data-tab="progress"].needs-checkin svg {
  color: var(--recovery-high);
  filter: drop-shadow(0 0 5px rgba(22, 236, 6, 0.9));
}

.progress-page { padding-bottom: 118px; }
.progress-page h1 { margin: 4px 0 20px; }
.progress-checkin { border-color: rgba(22, 236, 6, 0.45); }
.progress-checkin.is-complete { border-color: var(--oled-line); }
.progress-checkin h2 { margin: 4px 0 6px; font-size: 20px; }
.progress-confirmation { margin: 14px 0 0; color: var(--recovery-high); font-size: 13px; font-weight: 700; }
.progress-section { margin-top: 14px; }
.progress-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.progress-section-head .btn { min-height: 34px; padding: 5px 10px; font-size: 11px; }
.progress-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.progress-metric { min-width: 0; padding: 12px 8px; border-radius: 10px; background: var(--oled-raised); text-align: center; }
.progress-metric span, .progress-metric small, .progress-row small { display: block; color: var(--oled-muted); font-size: 10px; }
.progress-metric b { display: block; margin-top: 3px; font-size: 16px; }
.progress-trends { margin-top: 16px; }
.progress-trend { margin-top: 12px; }
.progress-trend > span { color: var(--oled-muted); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
.progress-chart { width: 100%; height: auto; display: block; }
.progress-trend-range { display: flex; justify-content: space-between; color: var(--oled-muted); font-size: 10px; }
.progress-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--oled-line); }
.progress-row b { display: block; font-size: 14px; }
.progress-row > span { color: var(--oled-muted); font-size: 12px; white-space: nowrap; }
.progress-goals { margin: 10px 0 0; padding-left: 18px; }
.progress-goals li { margin: 8px 0; }

.nav-badge {
  position: absolute;
  top: 8px;
  right: calc(50% - 22px);
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--oled-text);
  color: #000;
  font-style: normal;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

/* ── Coach sheet ── */
.coach-sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  align-items: end;
  justify-items: center;
}

.coach-sheet-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
}

.coach-sheet-panel {
  position: relative;
  width: min(430px, 100%);
  max-height: 78dvh;
  background: var(--oled-surface);
  border-radius: 20px 20px 0 0;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-bottom: 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
}

.coach-sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.coach-sheet-head strong {
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 0.04em;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--oled-raised);
  font-size: 22px;
  line-height: 1;
}

.coach-log {
  flex: 1;
  overflow: auto;
  max-height: 42dvh;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.msg {
  padding: 10px 12px;
  border-radius: 14px;
  max-width: 92%;
  font-size: 14px;
  line-height: 1.45;
}

.msg.user {
  align-self: flex-end;
  background: rgba(255, 255, 255, 0.08);
}

.msg.assistant {
  align-self: flex-start;
  background: var(--oled-raised);
  border: 1px solid var(--oled-line);
}

.coach-compose {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: end;
}

.coach-compose textarea {
  background: #0a0a0a;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 14px;

/* One active set, in the existing logger shell. */
.log-active-set { border-top: 1px solid rgba(255,255,255,.12); margin-top: 20px; padding-top: 16px; }
.log-active-set h3 { font-size: 22px; margin: 0 0 8px; }
.log-set-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.log-set-heading > span { color: rgba(255,255,255,.72); font-size: 14px; }
.log-set-action { flex-shrink: 0; padding: 8px 16px; border-top: 1px solid rgba(255,255,255,.12); background: #000; }
.log-set-action .log-primary { margin: 0; }
.log-set-prescribed, .log-set-target { color: rgba(255,255,255,.72); font-size: 14px; margin: 8px 0 16px; }
.log-set-target strong { color: #fff; font-weight: 500; }
.log-active-fields { display: flex; gap: 12px; }
.log-active-fields label { flex: 1; min-width: 0; color: rgba(255,255,255,.72); font-size: 14px; }
.log-active-fields input { display: block; min-height: 76px; margin-top: 8px; font-size: 32px; font-variant-numeric: tabular-nums; }
.log-active-fields input[value="empty bar"] { font-size: 22px; letter-spacing: 0; }
.log-active-fields input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
.log-active-fields input::-webkit-inner-spin-button, .log-active-fields input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.log-active-fields input:focus-visible { outline: 2px solid #1ba3ff; outline-offset: 2px; }
.log-effort-inline { margin-top: 22px; }
.log-effort-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 16px; }
.log-effort-heading strong { font-size: 14px; color: #1ba3ff; }
.log-effort-slider { appearance: none; display: block; width: 100%; height: 48px; margin: 8px 0 0; background: transparent; cursor: pointer; }
.log-effort-slider::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: #8e8e93; }
.log-effort-slider::-moz-range-track { height: 4px; border-radius: 4px; background: #8e8e93; }
.log-effort-slider::-webkit-slider-thumb { appearance: none; width: 30px; height: 30px; border: 2px solid #fff; border-radius: 50%; background: #1ba3ff; margin-top: -13px; }
.log-effort-slider::-moz-range-thumb { width: 28px; height: 28px; border: 2px solid #fff; border-radius: 50%; background: #1ba3ff; }
.log-effort-slider:focus-visible { outline: 2px solid #1ba3ff; outline-offset: 3px; border-radius: 8px; }
.log-effort-slider:disabled { opacity: .4; cursor: default; }
.log-effort-labels { display: flex; justify-content: space-between; color: rgba(255,255,255,.72); font-size: 14px; }
.log-set-incomplete { width: 100%; min-height: 48px; border: 1px solid rgba(255,255,255,.28); border-radius: 8px; margin-top: 18px; }
.log-set-incomplete[aria-pressed="true"] { color: #fff; border-color: #1ba3ff; background: #1c1c1e; }
.log-set-error { color: #fff; font-size: 14px; margin: 12px 0 0; }
.log-set-error:empty { display: none; }
.log-active-set .log-primary { margin-top: 8px; }
.log-set-history-list { margin-top: 18px; }
.log-set-history { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; min-height: 48px; border-bottom: 1px solid rgba(255,255,255,.12); padding: 10px 0; font-size: 13px; }
.log-set-history .log-link { margin-left: auto; }
.log-set-tick { color: #16ec06; font-size: 20px; }
.log-set-skip { color: #1ba3ff; display: block; margin: 4px auto; min-height: 44px; }
.log-active-set button:focus-visible, .log-set-history:focus-visible { outline: 2px solid #1ba3ff; outline-offset: 3px; }
.log-active-fields .log-cell {width:100%;box-sizing:border-box;}
.log-active-set {margin-top:14px;padding-top:12px;}
.log-active-fields input {min-height:66px;}
.log-effort-inline {margin-top:16px;}
.log-body {overscroll-behavior:contain;}
.log-effort-labels {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11px;line-height:1.3;text-align:center;}
.log-effort-labels span:first-child {text-align:left;}
.log-effort-labels span:last-child {text-align:right;}
.log-demo-note {color:var(--oled-muted);font-size:11px;margin:8px 0;}
.log-load-decision {margin:0 0 12px;color:var(--trn-blue);}

@media (max-height:660px) { .log-active-set h3{font-size:19px;} .log-active-fields input{min-height:50px;} }

  function prepCatalog(which) { return which === 'cool' ? COOLDOWNS : WARMUPS; }
  function prepItems(which) { return which === 'cool' ? state.cooldowns : state.warmups; }
  function prepListHtml(which) {
    const cool = which === 'cool';
    const items = prepItems(which);
    const q = state.query.trim().toLowerCase();
    const rows = prepCatalog(which).filter((row) => row[1].toLowerCase().includes(q)).map((row) => {
      const on = state.selected.includes(row[0]);
      const have = items.some((b) => b.catalogId === row[0]);
      return `<button type="button" class="lib-pick-row" ${have ? 'disabled' : ''} onclick="Play.togglePick('${row[0]}')"><b>${esc(row[1])}</b><span class="lib-unit">${esc(metricName(row[2]))}</span><span class="lib-radio${on ? ' on' : ''}"></span></button>`;
    }).join('') || '<div class="lib-empty">No results.</div>';
    const n = state.selected.length;
    const label = items.length ? 'Next' : 'Skip';
    const action = items.length ? 'Play.startPrep(\'' + which + '\')' : (cool ? 'Play.calendar()' : 'Play.goPick()');
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row">
        <button type="button" class="lib-back" aria-label="Back" onclick="${cool ? 'Play.backCool()' : 'Play.goNotes()'}">←</button>
        <h1>${cool ? 'Cool-down' : 'Warm-up'}</h1>
        <button type="button" class="lib-text-btn" ${n < 1 ? 'disabled' : ''} onclick="Play.addSelected()">Add${n ? ' (' + n + ')' : ''}</button>
      </div>
      ${chosenPrepHtml(items)}
      ${n === 1 ? '<p class="lib-empty">Add keeps this on the list.</p>' : ''}
      <div class="lib-search"><input value="${esc(state.query)}" placeholder="${cool ? 'Search cool-downs' : 'Search warm-ups'}" aria-label="${cool ? 'Search cool-downs' : 'Search warm-ups'}" oninput="Play.search(this.value)"></div>
      <div id="libResults">${rows}</div>
      ${nextBar(label, action, n !== 0)}
      ${nav()}
    </div>`;
  }
  function chosenPrepHtml(items) {
    letters();

    return items.map((b) => '<article class="lib-block" data-added="' + esc(b.id) + '"><div class="lib-block-top"><span class="lib-letter">' + esc(b.letter) + '</span><div style="flex:1"><h3>' + esc(b.title) + '</h3><p class="sum">' + esc(rx(b)) + '</p></div><button type="button" class="lib-remove" aria-label="Remove ' + esc(b.title) + '" onclick="Play.removeBlock(\'' + b.id + '\')">Remove</button></div></article>').join('');
  }
  function prepCard(b) {

  }
  function prepEditorHtml(which) {
    letters();
    const cool = which === 'cool';
    const items = prepItems(which);
    const at = Math.max(0, items.findIndex((b) => b.id === state.activeId));
    const b = items[at];
    if (!b) return '';
    const last = at >= items.length - 1;
    const action = !last
      ? '<button type="button" class="btn oled-cta" onclick="Play.nextPrep()">Next</button>'
      : cool
        ? '<button type="button" class="btn oled-cta" onclick="Play.calendar()">Next</button>'
        : '<button type="button" class="btn oled-cta" onclick="Play.goPick()">Next</button>';
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row"><button type="button" class="lib-back" aria-label="Back" onclick="${cool ? 'Play.goCool()' : 'Play.goWarm()'}">←</button><h1>${at + 1} of ${items.length}</h1></div>
      ${prepCard(b)}
      <div class="play-dock"><div class="play-next">${action}</div>${padHtml()}</div>
    </div>`;
  }

  function pickHtml() {
    const q = state.query.trim().toLowerCase();
    const rows = CATALOG.filter(([, title]) => title.toLowerCase().includes(q)).map(([id, title]) => {
      const on = state.selected.includes(id);
      const have = state.blocks.some((b) => b.catalogId === id);
      const metric = (PRESET[id] || { metric: 'reps' }).metric;
      return `<button type="button" class="lib-pick-row" ${have ? 'disabled' : ''} onclick="Play.togglePick('${id}')"><b>${esc(title)}</b><span class="lib-unit">${esc(metricName(metric))}</span><span class="lib-radio${on ? ' on' : ''}"></span></button>`;
    }).join('') || '<div class="lib-empty">No results.</div>';
    const n = state.selected.length;
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row">
        <button type="button" class="lib-back" aria-label="Back" onclick="Play.backPick()">←</button>
        <h1>Exercises</h1>
        <button type="button" class="lib-text-btn" ${n < 2 ? 'disabled' : ''} onclick="Play.addSuperset()">Superset</button>
        <button type="button" class="lib-text-btn" ${n < 1 ? 'disabled' : ''} onclick="Play.addSelected()">Add${n ? ' (' + n + ')' : ''}</button>
      </div>
      ${chosenHtml()}
      ${n === 1 ? '<p class="lib-empty">Add keeps this on the list.</p>' : ''}
      ${n >= 2 ? '<p class="lib-empty">Superset groups these ' + n + '.</p>' : ''}
      <div class="lib-search"><input value="${esc(state.query)}" placeholder="Search exercises and circuits" aria-label="Search exercises" oninput="Play.search(this.value)"></div>
      <div class="lib-tabs"><button type="button" class="on">Exercises</button><button type="button" disabled>Circuits</button></div>
      <div id="libResults">${rows}</div>
      ${nextBar(state.blocks.length ? 'Next' : 'Add a lift', 'Play.startLifts()', n !== 0 || !state.blocks.length)}
      ${nav()}
    </div>`;
  }

  function chosenHtml() {
    letters();
    if (!state.blocks.length) return '';
    let body = '';
    state.blocks.forEach((b, i) => {
      const prev = state.blocks[i - 1];
      if (prev && b.groupId && prev.groupId === b.groupId) body += '<div class="lib-ss">− Superset</div>';
      body += '<article class="lib-block" data-added="' + esc(b.id) + '"><div class="lib-block-top"><span class="lib-letter">' + esc(b.letter) + '</span><div style="flex:1"><h3>' + esc(b.title) + '</h3></div><button type="button" class="lib-remove" aria-label="Remove ' + esc(b.title) + '" onclick="Play.removeBlock(\'' + b.id + '\')">Remove</button></div></article>';
    });
    return body;
  }

  function setCell(b, s, i, field) {
    const metric = columnMetric(b, field);
    if (!metric) return '';
    const on = state.pad && state.pad.blockId === b.id && state.pad.setIndex === i && (state.pad.field || 'text') === field;
    const unit = metricName(metric);
    if (s.amrap && field === 'text') return '<div class="lib-cell" aria-label="Set ' + (i + 1) + ' AMRAP">AMRAP</div>';
    if (s.amrap) return '<div class="lib-cell"></div>';
    const raw = field === 'extra' ? (s.extra || '') : (s.text || '0');
    return '<button type="button" class="lib-cell' + (on ? ' focus-cell' : '') + '" aria-label="Set ' + (i + 1) + ' ' + esc(unit) + '" onclick="Play.openPad(\'' + b.id + '\',' + i + ',\'' + field + '\')">' + esc(raw) + '</button>';
  }
  function setRows(b) {
    const two = !!columnMetric(b, 'extra');
    return b.sets.map((s, i) => '<span>' + (i + 1) + '</span>' + setCell(b, s, i, 'text') + (two ? setCell(b, s, i, 'extra') : '')).join('');
  }
  function openCard(b) {
    if (b.prep) return prepCard(b);
    const tempo = b.tempo || ['', '', '', ''];
    const cell = (index, label) => '<label class="lib-grid-h">' + label + '<input class="lib-cell" maxlength="1" aria-label="' + label + ' for ' + esc(b.title) + '" value="' + esc(tempo[index]) + '" oninput="Play.tempo(\'' + b.id + '\',' + index + ', this.value)"></label>';
    const two = !!columnMetric(b, 'extra');
    return '<article class="lib-block open-card lib-ex" data-block="' + esc(b.id) + '"><div class="lib-ex-top"><span class="lib-letter">' + esc(b.letter) + '</span><h3>' + esc(b.title) + '</h3><button type="button" class="lib-danger" aria-label="Delete ' + esc(b.title) + '" onclick="Play.removeBlock(\'' + b.id + '\')">Delete</button></div><div class="meta">' + esc(rx(b)) + '</div><label class="lib-notes"><textarea placeholder="Add notes or instructions here" oninput="Play.notes(\'' + b.id + '\', this.value)">' + esc(b.notes) + '</textarea></label><div class="lib-field lib-metrics"><label>What do you want to track?</label><div class="lib-cols"><select aria-label="First metric for ' + esc(b.title) + '" onchange="Play.metric(\'' + b.id + '\', this.value)">' + metricOptions(b.metric, false) + '</select><select aria-label="Second metric for ' + esc(b.title) + '" onchange="Play.metric2(\'' + b.id + '\', this.value)">' + metricOptions(b.metric2 || 'none', true) + '</select></div></div><div class="lib-grid set-grid' + (two ? ' has-two' : '') + '"><span></span><div class="lib-grid-h">' + esc(metricName(b.metric)) + '</div>' + (two ? '<div class="lib-grid-h">' + esc(metricName(b.metric2)) + '</div>' : '') + setRows(b) + '</div><p role="status">' + esc(b.notice || '') + '</p><div class="lib-grid tempo-grid" style="margin-top:14px">' + cell(0, 'Lower') + cell(1, 'Pause') + cell(2, 'Lift') + cell(3, 'Pause') + '</div><div class="lib-stepper"><button type="button" class="lib-step" aria-label="Remove a set" onclick="Play.nudge(\'' + b.id + '\',-1)">−</button><span>Set</span><button type="button" class="lib-step" aria-label="Add a set" onclick="Play.nudge(\'' + b.id + '\',1)">+</button></div><button type="button" class="lib-text-btn" onclick="Play.amrap(\'' + b.id + '\')">' + (b.sets.at(-1)?.amrap ? 'Remove AMRAP' : 'Add final AMRAP') + '</button></article>';
  }
  function editorHtml() {
    letters();
    const at = Math.max(0, state.blocks.findIndex((b) => b.id === state.activeId));
    const b = state.blocks[at];
    if (!b) return '';
    const mates = b.groupId ? state.blocks.filter((x) => x.groupId === b.groupId) : [];
    const mate = mates.length > 1 ? '<p class="play-mate">Superset ' + mates.map((x) => esc(x.letter)).join(' · ') + '</p>' : '';
    const last = at >= state.blocks.length - 1;
    const action = last
      ? '<button type="button" class="btn oled-cta" onclick="Play.goCool()">Next</button>'
      : '<button type="button" class="btn oled-cta" onclick="Play.nextLift()">Next</button>';
    const post = '';
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row"><button type="button" class="lib-back" aria-label="Back" onclick="Play.goPick()">←</button><h1>${at + 1} of ${state.blocks.length}</h1>${post}</div>
      ${mate}
      ${openCard(b)}
      <div class="play-dock"><div class="play-next">${action}</div>${padHtml()}</div>
    </div>`;
  }
  function padHtml() {
    if (!state.pad) return '';
    const b = block(state.pad.blockId);
    if (!b) return '';
    const parts = split(state.pad.buffer);
    const mark = (text, on) => on ? '<span class="photo-caret">' + esc(text || '') + '</span>' : esc(text);
    const val = !parts.dash ? mark(parts.left || '0', true) : mark(parts.left, state.pad.side !== 'right') + '-' + mark(parts.right, state.pad.side === 'right');
    const key = (label, col, row, extra) => '<button type="button" class="photo-key' + (extra || '') + '" style="grid-column:' + col + ';grid-row:' + row + '" onclick="Play.key(\'' + label + '\')">' + (label === '⌫' ? '⌫' : label) + '</button>';
    const metric = columnMetric(b, state.pad.field) || b.metric;
    const unit = metric === 'seconds' || metric === 'time_mmss' ? 'SEC' : metric === 'meters' ? 'M' : metric === 'weight_kg' ? 'KG' : metric === 'weight_lb' ? 'LB' : metric === 'weight_pct' ? '%' : (metric === 'reps' || metric === 'range') ? 'REPS' : 'VALUE';
    const padName = metricName(metric) + ' keypad';
    return '<div class="photo-pad" role="dialog" aria-label="' + padName + '"><div class="photo-pad-top"><div class="photo-pad-val" aria-live="polite">' + val + '</div><span class="photo-pad-unit">' + unit + '</span><button type="button" class="photo-pad-close" aria-label="Close keypad" onclick="Play.closePad()">⌄</button></div><div class="photo-pad-grid">' + key('1', 1, 1) + key('2', 2, 1) + key('3', 3, 1) + key('>', 4, 1) + key('4', 1, 2) + key('5', 2, 2) + key('6', 3, 2) + key('<', 4, 2) + key('7', 1, 3) + key('8', 2, 3) + key('9', 3, 3) + key('–', 1, 4) + key('0', 2, 4) + key('⌫', 3, 4, ' photo-key-bs') + '</div><p role="status">' + esc(state.pad.error || '') + '</p></div>';
  }
  function workoutSteps() {
    const steps = [];
    const push = (section, blocks) => blocks.forEach((b) => b.sets.forEach((s, i) => steps.push({ section, blockId: b.id, setIndex: i, amrap: !!s.amrap })));
    push('Warm-up', state.warmups);
    push('Lift', state.blocks);
    push('Cool-down', state.cooldowns);
    return steps;
  }
  function sessionLines(items) {
    letters();
    let body = '';
    items.forEach((b, i) => {
      const prev = items[i - 1];
      if (prev && b.groupId && prev.groupId === b.groupId) body += '<div class="lib-ss">− Superset</div>';
      const tempo = tempoText(b);
      body += '<article class="lib-block"><div class="lib-block-top"><span class="lib-letter">' + esc(b.letter) + '</span><div style="flex:1"><h3>' + esc(b.title) + '</h3><p class="sum">' + esc(rx(b) + (tempo ? ' · ' + tempo : '')) + '</p></div></div></article>';
    });
    return body;
  }
  function calendarHtml() {
    const ready = workoutSteps().length > 0;
    const section = (title, items) => items.length ? '<p class="play-step">' + title + '</p>' + sessionLines(items) : '';
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row"><button type="button" class="lib-back" aria-label="Back" onclick="Play.backCalendar()">←</button><h1>${esc(state.title || 'Workout')}</h1></div>
      ${section('Warm-up', state.warmups)}
      ${section('Lifts', state.blocks)}
      ${section('Cool-down', state.cooldowns)}
      <div style="padding:8px 16px 0"><button type="button" class="lib-primary" ${ready ? '' : 'disabled'} onclick="Play.startWorkout()">Start workout</button></div>
      <div class="lib-field"><label for="sessionPostDate">Session date</label><input id="sessionPostDate" type="date" value="${esc(state.date)}" onchange="Play.field('date', this.value)"></div>
      <div style="padding:0 16px"><button type="button" class="lib-text-btn" onclick="Play.confirmDate()">Post to calendar</button></div>
      <p class="lib-empty">${esc(state.posted || '')}</p>
      ${nav()}
    </div>`;
  }
  function workoutHtml() {
    const steps = workoutSteps();
    const step = steps[state.workout?.index || 0];
    if (!step) return calendarHtml();
    const b = block(step.blockId);
    const unit = b.metric === 'seconds' ? 'seconds' : b.metric === 'meters' ? 'meters' : 'reps';
    const plan = step.amrap ? 'AMRAP' : (b.sets[step.setIndex].text || '0');
    const actual = step.amrap ? 'AMRAP' : (b.sets[step.setIndex].actual || plan);
    const on = state.pad && state.pad.blockId === b.id && state.pad.setIndex === step.setIndex;
    const timedWarm = isTimedMetric(b.metric) && !step.amrap;
    const value = step.amrap
      ? '<div class="lib-cell">AMRAP</div><p class="lib-empty" style="text-align:left;padding:8px 0 0">As many reps as you can.</p>'
      : timedWarm
        ? timerBody(b.id, step.setIndex, 'text')
        : '<button type="button" class="lib-cell play-actual' + (on ? ' focus-cell' : '') + '" aria-label="Set ' + (step.setIndex + 1) + ' ' + unit + '" onclick="Play.openWorkoutPad()">' + esc(actual) + '</button>';
    const last = state.workout.index >= steps.length - 1;
    const action = last
      ? '<button type="button" class="btn oled-cta" onclick="Play.finishWorkout()">Done</button>'
      : '<button type="button" class="btn oled-cta" onclick="Play.nextWorkout()">Next</button>';
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row"><button type="button" class="lib-back" aria-label="Back" onclick="Play.backWorkout()">←</button><h1>${state.workout.index + 1} of ${steps.length}</h1></div>
      <p class="play-step">${esc(step.section)}</p>
      <article class="lib-block open-card lib-ex"><div class="lib-ex-top"><span class="lib-letter">${esc(b.letter)}</span><h3>${esc(b.title)}</h3></div><div class="meta">Set ${step.setIndex + 1} of ${b.sets.length}${step.amrap ? '' : ' · plan ' + esc(plan)}</div><div class="lib-grid-h">${esc(step.amrap ? 'Reps' : metricName(b.metric === 'range' ? 'reps' : b.metric))}</div>${value}</article>
      <div class="play-dock"><div class="play-next">${action}</div>${padHtml()}</div>
    </div>`;
  }
  function loggedLine(b) {
    const bits = b.sets.map((s) => s.amrap ? 'AMRAP' : (s.actual || s.text || '0'));
    const unit = b.metric === 'seconds' ? ' sec' : b.metric === 'meters' ? ' m' : '';
    return bits.join(' / ') + unit;
  }
  function finishHtml() {
    const section = (title, items) => items.length ? '<p class="play-step">' + title + '</p>' + items.map((b) => '<article class="lib-block"><div class="lib-block-top"><span class="lib-letter">' + esc(b.letter) + '</span><div style="flex:1"><h3>' + esc(b.title) + '</h3><p class="sum">' + esc(loggedLine(b)) + '</p></div></div></article>').join('') : '';
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row"><span class="lib-back"></span><h1>Done</h1></div>
      <p class="lib-empty" style="text-align:left">${esc(state.title)}</p>
      ${section('Warm-up', state.warmups)}
      ${section('Lifts', state.blocks)}
      ${section('Cool-down', state.cooldowns)}
      <div style="padding:8px 16px 0"><button type="button" class="lib-primary" onclick="Play.calendar()">Back to workout</button></div>
      ${nav()}
    </div>`;
  }

  function split(buffer) {
    const text = String(buffer || '');
    const dash = text.indexOf('-');
    return dash < 0 ? { left: text, dash: false, right: '' } : { left: text.slice(0, dash), dash: true, right: text.slice(dash + 1) };
  }
  function applyBuffer() {
    const b = block(state.pad.blockId);
    const set = b && b.sets[state.pad.setIndex];
    if (!set || set.amrap) return;
    const parts = split(state.pad.buffer);
    const field = state.pad.field === 'extra' ? 'extra' : 'text';
    const metric = columnMetric(b, field) || b.metric;
    if (state.screen === 'workout' || metric !== 'range') {
      const text = (parts.left || '0').replace(/\D/g, '') || '0';
      if (state.screen === 'workout') set.actual = text;
      else set[field] = text;
      return;
    }
    if (!parts.dash) set.text = parts.left || '0';
    else set.text = (parts.left || '0') + '-' + (parts.right || parts.left || '0');
  }

  function render(scrollToOpen) {
    letters();
    save();
    const phone = document.getElementById('phone');
    const view = document.getElementById('view');
    const y = view.scrollTop;
    const previous = render.screen;
    const editing = state.screen === 'edit' || state.screen === 'warmEdit' || state.screen === 'coolEdit' || state.screen === 'workout';
    phone.classList.toggle('has-pad', editing && !!state.pad);
    const html = state.screen === 'notes' ? notesHtml() : state.screen === 'warm' ? prepListHtml('warm') : state.screen === 'warmEdit' ? prepEditorHtml('warm') : state.screen === 'pick' ? pickHtml() : state.screen === 'cool' ? prepListHtml('cool') : state.screen === 'coolEdit' ? prepEditorHtml('cool') : state.screen === 'calendar' ? calendarHtml() : state.screen === 'workout' ? workoutHtml() : state.screen === 'finish' ? finishHtml() : editorHtml();
    view.innerHTML = '<div class="shell">' + html + timerHtml() + '</div>';
    if (scrollToOpen && editing) view.scrollTop = 0;
    else if (scrollToOpen && state.confirmAnchor) view.querySelector('[data-added="' + state.confirmAnchor + '"]')?.scrollIntoView({ block: 'nearest' });
    else if (state.screen !== previous) view.scrollTop = 0;
    else view.scrollTop = y;
    render.screen = state.screen;
  }

  function makePrep(catalog, catalogId) {
    const row = catalog.find((c) => c[0] === catalogId);
    return {
      id: catalogId + '-' + Math.random().toString(36).slice(2, 7),
      catalogId,
      title: row[1],
      groupId: null,
      metric: row[2],
      sets: row[3].map((text) => ({ text, amrap: false })),
      tempo: ['', '', '', ''],
      notes: '',
      notice: '',
      prep: true
    };
  }

  function makeBlock(catalogId, groupId) {
    const title = CATALOG.find((c) => c[0] === catalogId)[1];
    const preset = PRESET[catalogId] || { metric: 'reps', sets: ['8', '8', '8'], tempo: ['', '', '', ''] };
    return {
      id: catalogId + '-' + Math.random().toString(36).slice(2, 7),
      catalogId, title, groupId: groupId || null,
      metric: preset.metric,
      metric2: 'none',
      sets: preset.sets.map((text) => ({ text, amrap: false })),
      tempo: preset.tempo.slice(),
      notes: '',
      notice: ''
    };
  }

  const Play = {
    restart() { state = fresh(); render(); },
    field(key, value) { state[key] = value; save(); },
    goNotes() { state.screen = 'notes'; state.pad = null; state.selected = []; state.query = ''; render(); },
    goWarm() { state.screen = 'warm'; state.pad = null; state.selected = []; state.query = ''; render(); },
    goPick() { state.screen = 'pick'; state.pad = null; state.selected = []; state.query = ''; render(); },
    goCool() { state.screen = 'cool'; state.pad = null; state.selected = []; state.query = ''; render(); },
    backPick() { state.pad = null; state.screen = state.blocks.length ? 'edit' : 'warm'; render(true); },
    backCool() {
      state.pad = null;
      state.selected = [];
      state.query = '';
      if (state.blocks.length) {
        state.activeId = state.blocks[state.blocks.length - 1].id;
        state.screen = 'edit';
      } else state.screen = 'pick';
      render(true);
    },
    backCalendar() {
      state.pad = null;
      if (state.cooldowns.length) {
        state.activeId = state.activeId && state.cooldowns.some((b) => b.id === state.activeId) ? state.activeId : state.cooldowns[state.cooldowns.length - 1].id;
        state.screen = 'coolEdit';
      } else state.screen = 'cool';
      render(true);
    },
    search(value) {
      state.query = value;
      save();
      const box = document.getElementById('libResults');
      if (!box) return render();
      const hold = document.activeElement;
      const html = state.screen === 'warm' ? prepListHtml('warm') : state.screen === 'cool' ? prepListHtml('cool') : pickHtml();
      document.getElementById('view').innerHTML = '<div class="shell">' + html + '</div>';
      const input = document.querySelector('.lib-search input');
      if (input) { input.focus(); input.setSelectionRange(value.length, value.length); }
      else hold?.focus?.();
    },
    laneItems() {
      if (state.screen === 'warm' || state.screen === 'warmEdit') return state.warmups;
      if (state.screen === 'cool' || state.screen === 'coolEdit') return state.cooldowns;
      return state.blocks;
    },
    togglePick(id) {
      if (Play.laneItems().some((b) => b.catalogId === id)) return;
      const at = state.selected.indexOf(id);
      if (at >= 0) state.selected.splice(at, 1);
      else state.selected.push(id);
      render();
    },
    addSelected() {
      if (!state.selected.length) return;
      Play.commitSelected(false);
    },
    addSuperset() {
      if (state.selected.length < 2) return;
      Play.commitSelected(true);
    },
    commitSelected(asSuperset) {
      if (state.screen === 'warm' || state.screen === 'cool') {
        const which = state.screen === 'cool' ? 'cool' : 'warm';
        const items = prepItems(which);
        const added = [];
        state.selected.forEach((id) => {
          if (items.some((b) => b.catalogId === id)) return;
          const made = makePrep(prepCatalog(which), id);
          items.push(made);
          added.push(made);
        });
        state.selected = [];
        state.query = '';
        letters();
        state.confirm = '';
        state.confirmAnchor = added[0] ? added[0].id : '';
        render(true);
        return;
      }
      const group = asSuperset ? 'ss-' + Date.now() : null;
      const added = [];
      state.selected.forEach((id) => {
        if (state.blocks.some((b) => b.catalogId === id)) return;
        const made = makeBlock(id, group);
        state.blocks.push(made);
        added.push(made);
      });
      state.selected = [];
      state.superset = [];
      state.query = '';
      letters();
      state.confirm = '';
      state.confirmAnchor = added[0] ? added[0].id : '';
      state.screen = 'pick';
      render(true);
    },
    startPrep(which) {
      const items = prepItems(which);
      if (state.selected.length || !items.length) return;
      state.confirmAnchor = '';
      state.activeId = items[0].id;
      state.screen = which === 'cool' ? 'coolEdit' : 'warmEdit';
      state.pad = null;
      render(true);
    },
    nextPrep() {
      const warm = state.warmups.some((b) => b.id === state.activeId);
      const items = warm ? state.warmups : state.cooldowns;
      const at = items.findIndex((b) => b.id === state.activeId);
      const next = items[at + 1];
      if (!next) {
        if (warm) Play.goPick();
        return;
      }
      state.activeId = next.id;
      state.pad = null;
      render(true);
    },
    startLifts() {
      if (state.selected.length || !state.blocks.length) return;
      state.confirm = '';
      state.confirmAnchor = '';
      Play.openBlock(state.blocks[0].id);
    },
    nextLift() {
      const at = state.blocks.findIndex((b) => b.id === state.activeId);
      const next = state.blocks[at + 1];
      if (!next) return;
      Play.openBlock(next.id);
    },
    openEditor() { state.screen = 'edit'; render(true); },
    openBlock(id) {
      state.screen = 'edit';
      state.activeId = id;
      state.pad = null;
      render(true);
    },
    openPad(id, index, field) {
      const b = block(id);
      const set = b.sets[index];
      const which = field === 'extra' ? 'extra' : 'text';
      state.activeId = id;
      if (!set || (set.amrap && which === 'text')) { state.pad = null; render(); return; }
      if (isTimedMetric(columnMetric(b, which))) {
        state.pad = null;
        state.clock = null;
        state.timer = { blockId: id, setIndex: index, field: which };
        render();
        return;
      }
      const source = which === 'extra' ? (set.extra || '') : (state.screen === 'workout' ? (set.actual || set.text || '') : (set.text || ''));
      state.pad = { blockId: id, setIndex: index, field: which, buffer: state.screen === 'workout' ? String(source).split('-')[0] : source, side: 'left', fresh: true, error: '' };
      render();
    },
    closePad() { state.pad = null; render(); },
    key(key) {
      if (!state.pad) return;
      const b = block(state.pad.blockId);
      const parts = split(state.pad.buffer);
      const side = state.pad.side === 'right' && parts.dash ? 'right' : 'left';
      state.pad.error = '';
      const metric = columnMetric(b, state.pad.field) || b.metric;
      if (key === '>' || key === '–' || key === '-') {
        if (state.screen === 'workout' || metric !== 'range') { state.pad.error = state.screen === 'workout' || b.prep ? 'One number.' : 'Range needs Rep Range.'; render(); return; }
        parts.dash = true; state.pad.side = 'right'; state.pad.fresh = true;
      } else if (key === '<') { state.pad.side = 'left'; state.pad.fresh = true; }
      else if (key === '⌫') {
        if (side === 'right' && parts.right) parts.right = parts.right.slice(0, -1);
        else if (side === 'right') { parts.dash = false; state.pad.side = 'left'; }
        else parts.left = parts.left.slice(0, -1);
        state.pad.fresh = false;
      } else if (/^\d$/.test(key)) {
        if (side === 'right') parts.right = state.pad.fresh ? key : parts.right + key;
        else parts.left = state.pad.fresh ? key : parts.left + key;
        state.pad.fresh = false;
      } else return;
      state.pad.buffer = parts.dash ? parts.left + '-' + parts.right : parts.left;
      applyBuffer();
      render();
    },
    metric(id, metric) {
      const b = block(id);
      if (b.metric === 'range' && metric !== 'range') {
        b.sets.forEach((s) => { if (!s.amrap && String(s.text).includes('-')) s.text = String(s.text).split('-')[0] || '0'; });
        b.notice = 'Range became the lower number.';
      } else b.notice = '';
      b.metric = metric;
      if (state.pad && state.pad.blockId === id && state.pad.field !== 'extra') {
        const set = b.sets[state.pad.setIndex];
        state.pad.buffer = set && !set.amrap ? set.text : '';
        state.pad.side = 'left';
        if (metric !== 'range') state.pad.buffer = String(state.pad.buffer).split('-')[0];
      }
      render();
    },
    metric2(id, metric) {
      const b = block(id);
      b.metric2 = metric || 'none';
      if (b.metric2 !== 'none') b.sets.forEach((s) => { if (!s.amrap && s.extra == null) s.extra = ''; });
      if (state.pad && state.pad.blockId === id && state.pad.field === 'extra' && b.metric2 === 'none') state.pad = null;
      render();
    },
    tempo(id, index, value) {
      const b = block(id);
      b.tempo[index] = String(value || '').slice(0, 1);
      save();
    },
    notes(id, value) { block(id).notes = value; save(); },
    nudge(id, dir) {
      const b = block(id);
      const amrap = b.sets.filter((s) => s.amrap);
      const work = b.sets.filter((s) => !s.amrap);
      if (dir < 0 && work.length > 1) work.pop();
      if (dir > 0 && work.length < 12) work.push({ text: work.at(-1)?.text || '8', amrap: false });
      b.sets = work.concat(amrap.slice(0, 1));
      if (state.pad && state.pad.blockId === id && state.pad.setIndex >= b.sets.length) state.pad = null;
      render();
    },
    amrap(id) {
      const b = block(id);
      if (b.sets.at(-1)?.amrap) b.sets.pop();
      else b.sets.push({ text: '', amrap: true });
      if (state.pad && state.pad.blockId === id && b.sets[state.pad.setIndex]?.amrap) state.pad = null;
      render();
    },
    removeBlock(id) {
      const key = state.warmups.some((b) => b.id === id) ? 'warmups' : state.cooldowns.some((b) => b.id === id) ? 'cooldowns' : 'blocks';
      const at = state[key].findIndex((b) => b.id === id);
      const wasActive = state.activeId === id;
      state[key] = state[key].filter((b) => b.id !== id);
      if (state.pad && state.pad.blockId === id) state.pad = null;
      if (!state[key].length) {
        state.activeId = null;
        state.pad = null;
        if (key === 'warmups' && state.screen === 'warmEdit') state.screen = 'warm';
        if (key === 'cooldowns' && (state.screen === 'coolEdit' || state.screen === 'calendar')) state.screen = 'cool';
        if (key === 'blocks' && (state.screen === 'edit' || state.screen === 'calendar')) state.screen = 'pick';
        render();
        return;
      }
      if (wasActive) {
        state.activeId = (state[key][at] || state[key][at - 1] || state[key][0]).id;
        state.pad = null;
      }
      render();
    },
    reorder() {
      const at = state.blocks.findIndex((b) => b.id === state.activeId);
      if (at <= 0) return;
      const [item] = state.blocks.splice(at, 1);
      state.blocks.splice(at - 1, 0, item);
      render(true);
    },
    calendar() { state.screen = 'calendar'; state.pad = null; render(); },
    confirmDate() {
      state.posted = 'Posted ' + state.title + ' on ' + state.date + '.';
      state.screen = 'calendar';
      render();
    },
    startWorkout() {
      if (!workoutSteps().length) return;
      [state.warmups, state.blocks, state.cooldowns].forEach((list) => list.forEach((b) => b.sets.forEach((s) => {
        s.actual = s.amrap ? '' : (b.metric === 'range' ? String(s.text || '0').split('-')[0] : (s.text || '0'));
      })));
      state.workout = { index: 0 };
      state.screen = 'workout';
      state.pad = null;
      render(true);
    },
    openWorkoutPad() {
      const step = workoutSteps()[state.workout?.index || 0];
      if (!step || step.amrap) return;
      Play.openPad(step.blockId, step.setIndex);
    },
    nextWorkout() {
      const steps = workoutSteps();
      if (!state.workout || state.workout.index + 1 >= steps.length) return Play.finishWorkout();
      state.workout.index += 1;
      state.pad = null;
      render(true);
    },
    backWorkout() {
      state.pad = null;
      if (!state.workout || state.workout.index <= 0) { state.screen = 'calendar'; render(true); return; }
      state.workout.index -= 1;
      render(true);
    },
    finishWorkout() {
      state.screen = 'finish';
      state.pad = null;
      state.clock = null;
      state.timer = null;
      render(true);
    },
    closeTimer() { state.timer = null; state.clock = null; render(); },
    beginTimer(id, index, field) {
      const which = field === 'extra' ? 'extra' : 'text';
      const b = block(id);
      const set = b && b.sets[index];
      const total = set ? durationMs(which === 'extra' ? set.extra : set.text) : 0;
      if (!b || !isTimedMetric(columnMetric(b, which)) || !total) return;
      state.pad = null;
      state.clock = { blockId: id, setIndex: index, field: which, totalMs: total, endsAt: Date.now() + total };
      render();
    },
    nudgeTime(id, index, field, dir) {
      const which = field === 'extra' ? 'extra' : 'text';
      const b = block(id);
      const set = b && b.sets[index];
      const cur = set ? durationMs(which === 'extra' ? set.extra : set.text) || 60000 : 60000;
      writeDuration(id, index, which, Math.max(5000, cur + dir * 5000));
      state.clock = null;
      render();
    },
    quickTime(id, index, field, ms) {
      writeDuration(id, index, field === 'extra' ? 'extra' : 'text', ms);
      state.clock = null;
      render();
    }
  };
  window.Play = Play;
  setInterval(() => {
    if (!state.clock) return;
    const left = clockLeft();
    const node = document.querySelector('[data-clock="' + state.clock.blockId + '-' + state.clock.setIndex + '-' + state.clock.field + '"]');
    if (left <= 0) { state.clock = null; render(); return; }
    if (!node) return;
    const strong = node.querySelector('strong');
    const arc = node.querySelector('.tm-arc');
    if (strong) strong.textContent = formatClock(left);
    if (arc && state.clock.totalMs) {
      const c = 2 * Math.PI * 46;
      arc.setAttribute('stroke-dashoffset', String(c * (1 - left / state.clock.totalMs)));
    }
  }, 200);
  document.addEventListener('keydown', (event) => {
    if (!state.pad) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (event.key === 'Backspace') { event.preventDefault(); Play.key('⌫'); }
    else if (/^\d$/.test(event.key)) Play.key(event.key);
    else if (event.key === '-' ) Play.key('–');
  });
  render(state.screen === 'edit');
})();
</script>
</body>
</html>
