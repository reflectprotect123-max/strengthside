<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strength builder play</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
  --oled-bg: #000000;
  --oled-surface: #121212;
  --oled-raised: #1c1c1e;
  --oled-text: #ffffff;
  --oled-muted: #8e8e93;
  --oled-line: rgba(255, 255, 255, 0.1);
  --sleep: #9db4c8;
  --recovery-high: #16ec06;
  --recovery-mid: #ffde00;
  --recovery-low: #ff0026;
  --recovery: var(--recovery-high);
  --strain: #1ba3ff;
  --strength: #d4a574;
  --recovery-room: #9fd356;
  --trn-blue: #1ba3ff;
  --trn-letter-bg: #3a3a3c;
  --font-body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Barlow Condensed", ui-sans-serif, system-ui, sans-serif;
  --nav-h: 72px;
  --fab-size: 56px;
  --tap: 44px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--oled-bg);
  color: var(--oled-text);
  font: 16px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}

.shell {
  min-height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  background: var(--oled-bg);
}

.app {
  min-height: calc(100dvh - var(--nav-h));
  padding-bottom: calc(var(--fab-size) + 40px);
}

.hidden { display: none !important; }

/* ── OLED home shell ── */
.shell-screen--oled {
  padding: 0 20px 8px;
  max-width: 100%;
  min-width: 0;
  overflow-x: hidden;
}

.home-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 0 4px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(180deg, #000 70%, transparent);
}

.home-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
}

.home-mark {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--oled-text);
}

.home-brand-text b {
  display: block;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
}

.home-brand-text small {
  display: block;
  margin-top: 1px;
  color: var(--oled-muted);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.home-lockers {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
}

.home-lockers span {
  color: var(--oled-muted);
}

.home-lockers span.on {
  color: #fff;
}

.home-lockers i {
  font-style: normal;
  color: var(--oled-muted);
  opacity: 0.5;
}

.locker-card {
  margin-bottom: 14px;
}

.locker-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.locker-switch .btn {
  min-height: 48px;
}

.home-top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.month-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: var(--tap);
  padding: 0 4px;
  color: var(--oled-muted);
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.month-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

.today-btn {
  border: 1px solid rgba(255, 255, 255, 0.42);
  border-radius: 999px;
  padding: 7px 14px;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  min-height: var(--tap);
  transition: background 0.18s var(--ease), border-color 0.18s var(--ease);
}

.today-btn:active {
  background: var(--oled-raised);
}

.bell-btn {
  position: relative;
  width: var(--tap);
  height: var(--tap);
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.bell-btn svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: var(--oled-text);
  stroke-width: 1.6;
}

.bell-badge {
  position: absolute;
  top: 6px;
  right: 2px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--oled-text);
  color: #000;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
  font-style: normal;
}

.ath-date {
  margin: 2px 0 14px;
  font-family: var(--font-display);
  font-size: clamp(22px, 5.5vw, 28px);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: rgba(255, 255, 255, 0.72);
}

.ath-athlete {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 6px;
}

.ath-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.14);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: var(--oled-muted);
}

.ath-avatar svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.ath-name {
  margin: 0;
  color: var(--oled-muted);
  font-size: 13px;
  font-weight: 500;
}

.ath-workout {
  margin: 2px 0 0;
  font-family: var(--font-display);
  font-size: clamp(20px, 5.5vw, 24px);
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.05;
}

/* ── WHOOP dials ── */
.ath-module-whoop {
  padding: 8px 0 4px;
  margin: 0 0 8px;
}

.ath-label {
  display: block;
  margin-bottom: 8px;
  color: rgba(255, 255, 255, 0.4);
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
}

.ath-whoop-dials,
.gauge-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: clamp(4px, 1.6vw, 8px);
  margin: 10px 0 12px;
  width: 100%;
}

.ath-whoop-dial {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.ath-whoop-dial-ring {
  position: relative;
  width: min(104px, 100%);
  aspect-ratio: 1;
  margin: 0 auto;
}

.ath-whoop-dial:nth-child(1) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 14px rgba(157, 180, 200, 0.18));
}

.ath-whoop-dial:nth-child(2) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 18px rgba(22, 242, 107, 0.28));
}

.ath-whoop-dial:nth-child(3) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 14px rgba(27, 163, 255, 0.16));
}

.ath-whoop-dial-ring svg {
  width: 100%;
  height: 100%;
  display: block;
}

.ath-whoop-dial-val {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  font-family: var(--font-display);
  font-size: clamp(22px, 7.2vw, 30px);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: #fff;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  pointer-events: none;
  text-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
}

.ath-whoop-dial-val .ath-whoop-n {
  display: block;
  line-height: 1;
}

.ath-whoop-dial-val small {
  display: block;
  font-size: clamp(10px, 3vw, 12px);
  font-weight: 650;
  opacity: 0.9;
  line-height: 1;
}

.ath-whoop-dial-lab {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: rgba(255, 255, 255, 0.5);
  text-transform: uppercase;
  text-align: center;
}

.today-call {
  margin: 4px 0 0;
  padding: 12px 0 0;
  border-top: 1px solid var(--oled-line);
}

.today-call .eyebrow {
  margin: 0 0 4px;
  color: var(--oled-muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.today-call .title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.05;
}

.today-call .meta {
  margin: 6px 0 0;
  color: var(--oled-muted);
  font-size: 13px;
  line-height: 1.45;
}

/* ── Calendar week ── */
.cal-strip {
  display: flex;
  gap: 6px;
  margin: 0 0 18px;
  padding: 2px 0;
  overflow-x: auto;
  scrollbar-width: none;
}

.cal-strip::-webkit-scrollbar { display: none; }

.cal-day {
  flex: 1 0 44px;
  min-width: 44px;
  min-height: var(--tap);
  padding: 10px 0 8px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: transparent;
  color: var(--oled-muted);
  text-align: center;
  transition: border-color 0.16s var(--ease), background 0.16s var(--ease);
}

.cal-day b {
  display: block;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 500;
  color: var(--oled-text);
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}

.cal-day.active {
  border-color: rgba(255, 255, 255, 0.22);
  background: var(--oled-surface);
}

.cal-day.active b {
  font-weight: 700;
}

.cal-dots {
  display: flex;
  justify-content: center;
  gap: 3px;
  min-height: 8px;
}

.cal-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--recovery-room);
}

.cal-dot.strength { background: var(--strength); }
.cal-dot.recovery { background: var(--recovery-room); }

/* ── Session list ── */
.home-brief {
  padding: 18px 0 8px;
  border-top: 1px solid var(--oled-line);
  margin-bottom: 8px;
}

.home-brief-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.home-brief .eyebrow {
  margin: 0;
  color: var(--oled-muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.home-pill {
  padding: 4px 8px;
  border: 1px solid var(--oled-line);
  border-radius: 999px;
  color: var(--oled-muted);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.published-list {
  display: grid;
  gap: 0;
}

.published-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--oled-line);
  min-height: var(--tap);
  width: 100%;
  text-align: left;
}

.published-item:last-child { border-bottom: 0; }

.pub-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.pub-dot.strength { background: var(--strength); }
.pub-dot.recovery { background: var(--recovery-room); }

.published-item strong {
  display: block;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.published-item small {
  display: block;
  margin-top: 2px;
  color: var(--oled-muted);
  font-size: 12px;
  text-transform: capitalize;
}

.published-item .chev {
  color: rgba(255, 255, 255, 0.35);
  font-size: 18px;
  line-height: 1;
}

.empty-day {
  color: var(--oled-muted);
  text-align: center;
  padding: 28px 8px;
  font-size: 14px;
  line-height: 1.5;
}

.home-cta {
  margin-top: 18px;
}

.btn {
  min-height: var(--tap);
  padding: 12px 16px;
  border-radius: 14px;
  border: 1px solid var(--oled-line);
  background: var(--oled-surface);
  font-weight: 650;
  transition: background 0.16s var(--ease), border-color 0.16s var(--ease);
}

.btn:active { background: var(--oled-raised); }

.btn.oled-cta,
.create-session-btn {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.42);
  background: #fff;
  color: #000;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
  box-shadow: none;
}

.btn.oled-cta:active,
.create-session-btn:active {
  background: #f2f2f2;
}

@media (hover: hover) {
  .today-btn:hover { background: rgba(255, 255, 255, 0.06); }
  .btn.oled-cta:hover,
  .create-session-btn:hover {
    background: #f2f2f2;
    border-color: #fff;
  }
}

/* ── FAB ── */
.fab-layer {
  position: fixed;
  right: max(20px, calc(50% - 215px + 20px));
  bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
}

.fab-layer.open .fab-menu { display: flex; }
.fab-layer.open .fab-scrim { display: block; }

.fab-scrim {
  display: none;
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(0, 0, 0, 0.45);
}

.fab-menu {
  display: none;
  flex-direction: column;
  background: var(--oled-raised);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  overflow: hidden;
  min-width: 210px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
}

.fab-menu button {
  text-align: left;
  padding: 14px 18px;
  font-size: 15px;
  border-bottom: 1px solid var(--oled-line);
  min-height: var(--tap);
}

.fab-menu button:last-child { border-bottom: 0; }
.fab-menu button:active { background: #2c2c2e; }

.fab {
  width: var(--fab-size);
  height: var(--fab-size);
  border-radius: 50%;
  background: #fff;
  color: #000;
  font-size: 30px;
  font-weight: 300;
  line-height: 1;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  transition: transform 0.2s var(--ease);
}

.fab-layer.open .fab { transform: rotate(45deg); }

/* ── Bottom nav ── */
.bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 430px;
  height: var(--nav-h);
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(14px);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 20;
}

.bottom-nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--oled-muted);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  position: relative;
  min-height: var(--tap);
}

.bottom-nav button svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  opacity: 0.85;
}

.bottom-nav button.active {
  color: var(--oled-text);
}

.bottom-nav button.active svg {
  opacity: 1;
}

.bottom-nav button[data-tab="progress"] svg {
  width: 24px;
  height: 24px;
  fill: none;
}

.bottom-nav button[data-tab="progress"].needs-checkin::before {
  content: "";
  position: absolute;
  top: 7px;
  left: 50%;
  width: 34px;
  height: 23px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: rgba(22, 236, 6, 0.26);
  box-shadow: 0 0 12px rgba(22, 236, 6, 0.88), 0 0 24px rgba(22, 236, 6, 0.42);
  z-index: -1;
}

.bottom-nav button[data-tab="progress"].needs-checkin svg {
  color: var(--recovery-high);
  filter: drop-shadow(0 0 5px rgba(22, 236, 6, 0.9));
}

.progress-page { padding-bottom: 118px; }
.progress-page h1 { margin: 4px 0 20px; }
.progress-checkin { border-color: rgba(22, 236, 6, 0.45); }
.progress-checkin.is-complete { border-color: var(--oled-line); }
.progress-checkin h2 { margin: 4px 0 6px; font-size: 20px; }
.progress-confirmation { margin: 14px 0 0; color: var(--recovery-high); font-size: 13px; font-weight: 700; }
.progress-section { margin-top: 14px; }
.progress-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.progress-section-head .btn { min-height: 34px; padding: 5px 10px; font-size: 11px; }
.progress-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.progress-metric { min-width: 0; padding: 12px 8px; border-radius: 10px; background: var(--oled-raised); text-align: center; }
.progress-metric span, .progress-metric small, .progress-row small { display: block; color: var(--oled-muted); font-size: 10px; }
.progress-metric b { display: block; margin-top: 3px; font-size: 16px; }
.progress-trends { margin-top: 16px; }
.progress-trend { margin-top: 12px; }
.progress-trend > span { color: var(--oled-muted); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
.progress-chart { width: 100%; height: auto; display: block; }
.progress-trend-range { display: flex; justify-content: space-between; color: var(--oled-muted); font-size: 10px; }
.progress-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--oled-line); }
.progress-row b { display: block; font-size: 14px; }
.progress-row > span { color: var(--oled-muted); font-size: 12px; white-space: nowrap; }
.progress-goals { margin: 10px 0 0; padding-left: 18px; }
.progress-goals li { margin: 8px 0; }

.nav-badge {
  position: absolute;
  top: 8px;
  right: calc(50% - 22px);
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--oled-text);
  color: #000;
  font-style: normal;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

/* ── Coach sheet ── */
.coach-sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  align-items: end;
  justify-items: center;
}

.coach-sheet-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
}

.coach-sheet-panel {
  position: relative;
  width: min(430px, 100%);
  max-height: 78dvh;
  background: var(--oled-surface);
  border-radius: 20px 20px 0 0;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-bottom: 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
}

.coach-sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.coach-sheet-head strong {
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 0.04em;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--oled-raised);
  font-size: 22px;
  line-height: 1;
}

.coach-log {
  flex: 1;
  overflow: auto;
  max-height: 42dvh;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.msg {
  padding: 10px 12px;
  border-radius: 14px;
  max-width: 92%;
  font-size: 14px;
  line-height: 1.45;
}

.msg.user {
  align-self: flex-end;
  background: rgba(255, 255, 255, 0.08);
}

.msg.assistant {
  align-self: flex-start;
  background: var(--oled-raised);
  border: 1px solid var(--oled-line);
}

.coach-compose {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: end;
}

.coach-compose textarea {
  background: #0a0a0a;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 14px;

/* One active set, in the existing logger shell. */
.log-active-set { border-top: 1px solid rgba(255,255,255,.12); margin-top: 20px; padding-top: 16px; }
.log-active-set h3 { font-size: 22px; margin: 0 0 8px; }
.log-set-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.log-set-heading > span { color: rgba(255,255,255,.72); font-size: 14px; }
.log-set-action { flex-shrink: 0; padding: 8px 16px; border-top: 1px solid rgba(255,255,255,.12); background: #000; }
.log-set-action .log-primary { margin: 0; }
.log-set-prescribed, .log-set-target { color: rgba(255,255,255,.72); font-size: 14px; margin: 8px 0 16px; }
.log-set-target strong { color: #fff; font-weight: 500; }
.log-active-fields { display: flex; gap: 12px; }
.log-active-fields label { flex: 1; min-width: 0; color: rgba(255,255,255,.72); font-size: 14px; }
.log-active-fields input { display: block; min-height: 76px; margin-top: 8px; font-size: 32px; font-variant-numeric: tabular-nums; }
.log-active-fields input[value="empty bar"] { font-size: 22px; letter-spacing: 0; }
.log-active-fields input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
.log-active-fields input::-webkit-inner-spin-button, .log-active-fields input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.log-active-fields input:focus-visible { outline: 2px solid #1ba3ff; outline-offset: 2px; }
.log-effort-inline { margin-top: 22px; }
.log-effort-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 16px; }
.log-effort-heading strong { font-size: 14px; color: #1ba3ff; }
.log-effort-slider { appearance: none; display: block; width: 100%; height: 48px; margin: 8px 0 0; background: transparent; cursor: pointer; }
.log-effort-slider::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: #8e8e93; }
.log-effort-slider::-moz-range-track { height: 4px; border-radius: 4px; background: #8e8e93; }
.log-effort-slider::-webkit-slider-thumb { appearance: none; width: 30px; height: 30px; border: 2px solid #fff; border-radius: 50%; background: #1ba3ff; margin-top: -13px; }
.log-effort-slider::-moz-range-thumb { width: 28px; height: 28px; border: 2px solid #fff; border-radius: 50%; background: #1ba3ff; }
.log-effort-slider:focus-visible { outline: 2px solid #1ba3ff; outline-offset: 3px; border-radius: 8px; }
.log-effort-slider:disabled { opacity: .4; cursor: default; }
.log-effort-labels { display: flex; justify-content: space-between; color: rgba(255,255,255,.72); font-size: 14px; }
.log-set-incomplete { width: 100%; min-height: 48px; border: 1px solid rgba(255,255,255,.28); border-radius: 8px; margin-top: 18px; }
.log-set-incomplete[aria-pressed="true"] { color: #fff; border-color: #1ba3ff; background: #1c1c1e; }
.log-set-error { color: #fff; font-size: 14px; margin: 12px 0 0; }
.log-set-error:empty { display: none; }
.log-active-set .log-primary { margin-top: 8px; }
.log-set-history-list { margin-top: 18px; }
.log-set-history { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; min-height: 48px; border-bottom: 1px solid rgba(255,255,255,.12); padding: 10px 0; font-size: 13px; }
.log-set-history .log-link { margin-left: auto; }
.log-set-tick { color: #16ec06; font-size: 20px; }
.log-set-skip { color: #1ba3ff; display: block; margin: 4px auto; min-height: 44px; }
.log-active-set button:focus-visible, .log-set-history:focus-visible { outline: 2px solid #1ba3ff; outline-offset: 3px; }
.log-active-fields .log-cell {width:100%;box-sizing:border-box;}
.log-active-set {margin-top:14px;padding-top:12px;}
.log-active-fields input {min-height:66px;}
.log-effort-inline {margin-top:16px;}
.log-body {overscroll-behavior:contain;}
.log-effort-labels {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11px;line-height:1.3;text-align:center;}
.log-effort-labels span:first-child {text-align:left;}
.log-effort-labels span:last-child {text-align:right;}
.log-demo-note {color:var(--oled-muted);font-size:11px;margin:8px 0;}
.log-load-decision {margin:0 0 12px;color:var(--trn-blue);}

@media (max-height:660px) { .log-active-set h3{font-size:19px;} .log-active-fields input{min-height:50px;} }

.lib-pick-row {

  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 16px;
  border-bottom: 1px solid var(--oled-line);
  text-align: left;
}

.lib-radio {
  width: 22px;
  height: 22px;

  flex: none;
}

.lib-radio.on {
  background: var(--trn-blue);

}

.lib-tabs {
  display: flex;
  gap: 18px;
  padding: 0 16px 8px;

}

  padding: 10px 0;

}

.lib-tabs button.on {

.lib-sheet {

}

.lib-primary {

}

.lib-ex { padding: 8px 16px 18px; }

.lib-grid { display: grid; grid-template-columns: 36px 1fr 1fr; gap: 10px 12px; align-items: center; }

.lib-grid-h { color: #1ba3ff; font-weight: 650; }

    lat_pull_downs: { metric: 'reps', sets: ['10', '10', '10'], tempo: ['', '', '', ''] }

  function fresh() {
    return {

      warmup: '',
      cooldown: '',
      query: '',

      superset: [],
      blocks: [],
      activeId: null,
      pad: null,

    try {

    return fresh();
  }
  function save() { sessionStorage.setItem(KEY, JSON.stringify(state)); }
  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function block(id) { return state.blocks.find((b) => b.id === id); }
  function letters() {
    const used = {};
    let n = 0;
    state.blocks.forEach((b) => {
      if (b.groupId) {
        if (!used[b.groupId]) used[b.groupId] = String.fromCharCode(65 + n++);
        const mates = state.blocks.filter((x) => x.groupId === b.groupId);
        b.letter = used[b.groupId] + (mates.length > 1 ? String(mates.indexOf(b) + 1) : '');
      } else b.letter = String.fromCharCode(65 + n++);
    });
  }
  function rx(b) {
    const work = b.sets.filter((s) => !s.amrap).map((s) => s.text || '0');
    const same = work.length && work.every((t) => t === work[0]);
    const body = same ? work.length + ' x ' + work[0] : work.join(' / ');
    return b.sets.some((s) => s.amrap) ? body + ' / AMRAP' : body;
  }

    const t = (b.tempo || ['', '', '', '']).join('');

  }
  function nextBar(label, action, disabled) {
    const cls = label === 'Post to calendar' ? 'lib-primary' : 'btn oled-cta';
    return `<div class="lib-wizard-next"><button type="button" class="${cls}" ${disabled ? 'disabled' : ''} onclick="${action}">${esc(label)}</button></div>`;
  }

  function notesHtml() {
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row"><span class="lib-back"></span><h1>Notes</h1></div>
      <div class="lib-field"><label for="playTitle">Title</label><input id="playTitle" value="${esc(state.title)}" oninput="Play.field('title', this.value)"></div>
      <div class="lib-field"><label for="playInstr">Session instructions</label><textarea id="playInstr" placeholder="Coach notes for Start Session" oninput="Play.field('instructions', this.value)">${esc(state.instructions)}</textarea></div>
      <div class="lib-field"><label for="playWarm">Warm-up</label><textarea id="playWarm" placeholder="Optional" oninput="Play.field('warmup', this.value)">${esc(state.warmup)}</textarea></div>
      <div class="lib-field"><label for="playCool">Cool-down</label><textarea id="playCool" placeholder="Optional" oninput="Play.field('cooldown', this.value)">${esc(state.cooldown)}</textarea></div>
      ${nextBar('Next', 'Play.goPick()')}
      ${nav()}
    </div>`;
  }

  function pickHtml() {
    const q = state.query.trim().toLowerCase();
    const rows = CATALOG.filter(([, title]) => title.toLowerCase().includes(q)).map(([id, title]) => {
      const on = state.selected.includes(id);
      const have = state.blocks.some((b) => b.catalogId === id);
      return `<button type="button" class="lib-pick-row" ${have ? 'disabled' : ''} onclick="Play.togglePick('${id}')"><b>${esc(title)}</b><span class="lib-radio${on ? ' on' : ''}"></span></button>`;
    }).join('') || '<div class="lib-empty">No results.</div>';
    const n = state.selected.length;
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row">
        <button type="button" class="lib-back" aria-label="Back" onclick="Play.backPick()">←</button>
        <h1>Exercises</h1>

  function chosenHtml() {
    letters();
    if (!state.blocks.length) return '';
    let body = state.confirm ? '<p class="lib-empty play-confirm" role="status">' + esc(state.confirm) + '</p>' : '';

      const prev = state.blocks[i - 1];

  }

  function setRows(b) {
    const h1 = b.metric === 'range' ? 'Rep Range' : 'Reps';
    return b.sets.map((s, i) => {

      return '<span>' + (i + 1) + '</span>' + rep + weight;
    }).join('');
  }
  function editorHtml() {
    letters();
    let body = '';
    if (state.instructions || state.warmup || state.cooldown) {
      const bits = [state.instructions, state.warmup, state.cooldown].filter(Boolean);
      body += '<article class="lib-block"><div class="lib-block-top"><div style="flex:1"><h3>Instructions</h3><p class="sum">' + esc(bits.join(' · ')) + '</p></div></div></article>';
    }
    const at = state.blocks.findIndex((b) => b.id === state.activeId);
    state.blocks.forEach((b, i) => {
      const prev = state.blocks[i - 1];
      if (prev && b.groupId && prev.groupId === b.groupId) body += '<div class="lib-ss">− Superset</div>';
      if (b.id !== state.activeId) {
        body += '<article class="lib-block"><button type="button" class="tap-card" onclick="Play.openBlock(\'' + b.id + '\')"><div class="lib-block-top"><span class="lib-letter">' + esc(b.letter) + '</span><div style="flex:1"><h3>' + esc(b.title) + '</h3><div class="meta">' + esc(summary(b)) + '</div></div></div></button></article>';

      const tempo = b.tempo || ['', '', '', ''];
      const cell = (index, label) => '<label class="lib-grid-h">' + label + '<input class="lib-cell" maxlength="1" aria-label="' + label + ' for ' + esc(b.title) + '" value="' + esc(tempo[index]) + '" oninput="Play.tempo(\'' + b.id + '\',' + index + ', this.value)"></label>';
      body += '<article class="lib-block open-card lib-ex" data-block="' + esc(b.id) + '"><div class="lib-ex-top"><span class="lib-letter">' + esc(b.letter) + '</span><h3>' + esc(b.title) + '</h3><button type="button" class="lib-danger" aria-label="Delete ' + esc(b.title) + '" onclick="Play.removeBlock(\'' + b.id + '\')">Delete</button><button type="button" class="lib-done" onclick="Play.closePad()">Done</button></div><div class="meta">' + esc(rx(b)) + '</div><label class="lib-notes"><textarea placeholder="Add notes or instructions here" oninput="Play.notes(\'' + b.id + '\', this.value)">' + esc(b.notes) + '</textarea></label><div class="lib-field lib-metrics"><label>What do you want to track?</label><div class="lib-cols"><select aria-label="First metric for ' + esc(b.title) + '" onchange="Play.metric(\'' + b.id + '\', this.value)"><option value="reps"' + (b.metric === 'reps' ? ' selected' : '') + '>Reps</option><option value="range"' + (b.metric === 'range' ? ' selected' : '') + '>Rep Range</option></select><select aria-label="Second metric" disabled><option>Weight (kg)</option></select></div></div><div class="lib-grid"><span></span><div class="lib-grid-h">' + (b.metric === 'range' ? 'Rep Range' : 'Reps') + '</div><div class="lib-grid-h">Weight (kg)</div>' + setRows(b) + '</div><p role="status">' + esc(b.notice || '') + '</p><div class="lib-grid tempo-grid" style="margin-top:14px">' + cell(0, 'Lower') + cell(1, 'Pause') + cell(2, 'Lift') + cell(3, 'Pause') + '</div><div class="lib-stepper"><button type="button" class="lib-step" aria-label="Remove a set" onclick="Play.nudge(\'' + b.id + '\',-1)">−</button><span>Set</span><button type="button" class="lib-step" aria-label="Add a set" onclick="Play.nudge(\'' + b.id + '\',1)">+</button></div><button type="button" class="lib-text-btn" onclick="Play.amrap(\'' + b.id + '\')">' + (b.sets.at(-1)?.amrap ? 'Remove AMRAP' : 'Add final AMRAP') + '</button></article>';
    });
    const posted = state.posted ? '<p class="lib-empty">' + esc(state.posted) + '</p>' : '';
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row"><button type="button" class="lib-back" aria-label="Back" onclick="Play.goPick()">←</button><h1>Session Template</h1><button type="button" class="lib-text-btn" onclick="Play.reorder()">Reorder</button></div>
      <div class="lib-field"><label for="editTitle">Title</label><input id="editTitle" value="${esc(state.title)}" oninput="Play.field('title', this.value)"></div>
      ${body}
      <div class="lib-row-btns"><button type="button" onclick="Play.goPick()">+ Add Exercise</button><button type="button" disabled>+ Add Circuit</button></div>
      <div style="padding:0 16px 24px"><button type="button" class="lib-primary" onclick="Play.calendar()">Post to calendar</button></div>
      ${posted}
      ${at >= 0 && at < state.blocks.length - 1 ? '<div class="play-next"><button type="button" class="btn oled-cta" onclick="Play.nextLift()">Next</button></div>' : ''}
      ${padHtml()}
    </div>`;
  }
  function padHtml() {
    if (!state.pad) return '';
    const b = block(state.pad.blockId);
    if (!b) return '';
    const parts = split(state.pad.buffer);
    const mark = (text, on) => on ? '<span class="photo-caret">' + esc(text || '') + '</span>' : esc(text);
    const val = !parts.dash ? mark(parts.left || '0', true) : mark(parts.left, state.pad.side !== 'right') + '-' + mark(parts.right, state.pad.side === 'right');
    const key = (label, col, row, extra) => '<button type="button" class="photo-key' + (extra || '') + '" style="grid-column:' + col + ';grid-row:' + row + '" onclick="Play.key(\'' + label + '\')">' + (label === '⌫' ? '⌫' : label) + '</button>';
    return '<div class="photo-pad" role="dialog" aria-label="Reps keypad"><div class="photo-pad-top"><div class="photo-pad-val" aria-live="polite">' + val + '</div><span class="photo-pad-unit">REPS</span><button type="button" class="photo-pad-close" aria-label="Close keypad" onclick="Play.closePad()">⌄</button></div><div class="photo-pad-grid">' + key('1', 1, 1) + key('2', 2, 1) + key('3', 3, 1) + key('>', 4, 1) + key('4', 1, 2) + key('5', 2, 2) + key('6', 3, 2) + key('<', 4, 2) + key('7', 1, 3) + key('8', 2, 3) + key('9', 3, 3) + key('–', 1, 4) + key('0', 2, 4) + key('⌫', 3, 4, ' photo-key-bs') + '</div><p role="status">' + esc(state.pad.error || '') + '</p></div>';
  }
  function calendarHtml() {
    return `<div class="shell-screen shell-screen--library">
      <div class="lib-head-row"><button type="button" class="lib-back" aria-label="Back" onclick="Play.openEditor()">←</button><h1>Post to calendar</h1></div>
      <div class="lib-field"><label for="sessionPostDate">Session date</label><input id="sessionPostDate" type="date" value="${esc(state.date)}" onchange="Play.field('date', this.value)"></div>
      <p class="lib-empty" style="text-align:left;padding:0 16px 12px">Lands on your Training tab only.</p>
      <div style="padding:0 16px"><button type="button" class="lib-primary" onclick="Play.confirmDate()">Post to calendar</button></div>
      <p class="lib-empty">${esc(state.title)}</p>
    </div>`;
  }

  function split(buffer) {
    const text = String(buffer || '');
    const dash = text.indexOf('-');
    return dash < 0 ? { left: text, dash: false, right: '' } : { left: text.slice(0, dash), dash: true, right: text.slice(dash + 1) };
  }
  function applyBuffer() {
    const b = block(state.pad.blockId);
    const set = b && b.sets[state.pad.setIndex];
    if (!set || set.amrap) return;
    const parts = split(state.pad.buffer);
    if (b.metric !== 'range') {
      set.text = (parts.left || '0').replace(/\D/g, '') || '0';
      return;
    }
    if (!parts.dash) set.text = parts.left || '0';
    else set.text = (parts.left || '0') + '-' + (parts.right || parts.left || '0');
  }

  function render(scrollToOpen) {
    letters();
    save();
    const phone = document.getElementById('phone');
    const view = document.getElementById('view');
    const y = view.scrollTop;
    const previous = render.screen;
    phone.classList.toggle('has-pad', state.screen === 'edit' && !!state.pad);
    const html = state.screen === 'notes' ? notesHtml() : state.screen === 'pick' ? pickHtml() : state.screen === 'calendar' ? calendarHtml() : editorHtml();
    view.innerHTML = '<div class="shell">' + html + '</div>';
    if (scrollToOpen) (view.querySelector('.play-confirm') || view.querySelector('.open-card'))?.scrollIntoView({ block: 'start' });
    else if (state.screen !== previous) view.scrollTop = 0;
    else view.scrollTop = y;
    render.screen = state.screen;
  }

  function makeBlock(catalogId, groupId) {
    const title = CATALOG.find((c) => c[0] === catalogId)[1];
    const preset = PRESET[catalogId] || { metric: 'reps', sets: ['8', '8', '8'], tempo: ['', '', '', ''] };
    return {
      id: catalogId + '-' + Math.random().toString(36).slice(2, 7),
      catalogId, title, groupId: groupId || null,
      metric: preset.metric,
      sets: preset.sets.map((text) => ({ text, amrap: false })),
      tempo: preset.tempo.slice(),
      notes: '',
      notice: ''
    };
  }

  const Play = {
    restart() { state = fresh(); render(); },
    field(key, value) { state[key] = value; save(); },
    goPick() { state.screen = 'pick'; state.pad = null; render(); },
    backPick() { state.screen = state.blocks.length ? 'edit' : 'notes'; render(true); },
    search(value) {
      state.query = value;
      save();
      const box = document.getElementById('libResults');
      if (!box) return render();
      const hold = document.activeElement;
      const html = pickHtml();
      document.getElementById('view').innerHTML = '<div class="shell">' + html + '</div>';
      const input = document.querySelector('.lib-search input');
      if (input) { input.focus(); input.setSelectionRange(value.length, value.length); }
      else hold?.focus?.();
    },
    togglePick(id) {
      if (state.blocks.some((b) => b.catalogId === id)) return;
      const at = state.selected.indexOf(id);
      if (at >= 0) state.selected.splice(at, 1);
      else state.selected.push(id);
      render();
    },
    addSelected() {
      if (!state.selected.length) return;
      Play.commitSelected(false);
    },
    addSuperset() {
      if (state.selected.length < 2) return;
      Play.commitSelected(true);
    },
    commitSelected(asSuperset) {
      const group = asSuperset ? 'ss-' + Date.now() : null;
      const added = [];
      state.selected.forEach((id) => {
        if (state.blocks.some((b) => b.catalogId === id)) return;
        const made = makeBlock(id, group);
        state.blocks.push(made);
        added.push(made);
      });
      state.selected = [];
      state.superset = [];
      state.query = '';
      letters();
      const names = added.map((b) => b.letter + ' ' + b.title).join(', ');
      state.confirm = added.length ? (asSuperset ? 'Added superset: ' + names : 'Added: ' + names) : '';
      state.confirmAnchor = added[0] ? added[0].id : '';
      state.screen = 'pick';
      render(true);
    },
    startLifts() {
      if (state.selected.length || !state.blocks.length) return;
      state.confirm = '';
      state.confirmAnchor = '';
      Play.openBlock(state.blocks[0].id);
    },
    nextLift() {
      const at = state.blocks.findIndex((b) => b.id === state.activeId);
      const next = state.blocks[at + 1];
      if (!next) return;
      Play.openBlock(next.id);
    },
    openEditor() { state.screen = 'edit'; render(true); },
    openBlock(id) {
      state.screen = 'edit';
      state.activeId = id;
      const b = block(id);
      const index = Math.max(0, b.sets.findIndex((s) => !s.amrap));
      Play.openPad(id, index < 0 ? 0 : index, true);
    },
    openPad(id, index, scroll) {
      const b = block(id);
      const set = b.sets[index];
      state.activeId = id;
      if (!set || set.amrap) { state.pad = null; render(scroll); return; }
      state.pad = { blockId: id, setIndex: index, buffer: set.text || '', side: 'left', fresh: true, error: '' };
      render(scroll);
    },
    closePad() { state.pad = null; render(); },
    key(key) {
      if (!state.pad) return;
      const b = block(state.pad.blockId);
      const parts = split(state.pad.buffer);
      const side = state.pad.side === 'right' && parts.dash ? 'right' : 'left';
      state.pad.error = '';
      if (key === '>' || key === '–' || key === '-') {
        if (b.metric !== 'range') { state.pad.error = 'Range needs Rep Range.'; render(); return; }
        parts.dash = true; state.pad.side = 'right'; state.pad.fresh = true;
      } else if (key === '<') { state.pad.side = 'left'; state.pad.fresh = true; }
      else if (key === '⌫') {
        if (side === 'right' && parts.right) parts.right = parts.right.slice(0, -1);
        else if (side === 'right') { parts.dash = false; state.pad.side = 'left'; }
        else parts.left = parts.left.slice(0, -1);
        state.pad.fresh = false;
      } else if (/^\d$/.test(key)) {
        if (side === 'right') parts.right = state.pad.fresh ? key : parts.right + key;
        else parts.left = state.pad.fresh ? key : parts.left + key;
        state.pad.fresh = false;
      } else return;
      state.pad.buffer = parts.dash ? parts.left + '-' + parts.right : parts.left;
      applyBuffer();
      render();
    },
    metric(id, metric) {
      const b = block(id);
      if (b.metric === 'range' && metric === 'reps') {
        b.sets.forEach((s) => { if (!s.amrap && String(s.text).includes('-')) s.text = String(s.text).split('-')[0] || '0'; });
        b.notice = 'Range became the lower number.';
      } else b.notice = '';
      b.metric = metric;
      if (state.pad && state.pad.blockId === id) {
        const set = b.sets[state.pad.setIndex];
        state.pad.buffer = set && !set.amrap ? set.text : '';
        state.pad.side = 'left';
        if (metric !== 'range') state.pad.buffer = String(state.pad.buffer).split('-')[0];
      }
      render();
    },
    tempo(id, index, value) {
      const b = block(id);
      b.tempo[index] = String(value || '').slice(0, 1);
      save();
    },
    notes(id, value) { block(id).notes = value; save(); },
    nudge(id, dir) {
      const b = block(id);
      const amrap = b.sets.filter((s) => s.amrap);
      const work = b.sets.filter((s) => !s.amrap);
      if (dir < 0 && work.length > 1) work.pop();
      if (dir > 0 && work.length < 12) work.push({ text: work.at(-1)?.text || '8', amrap: false });
      b.sets = work.concat(amrap.slice(0, 1));
      if (state.pad && state.pad.blockId === id && state.pad.setIndex >= b.sets.length) state.pad = null;
      render();
    },
    amrap(id) {
      const b = block(id);
      if (b.sets.at(-1)?.amrap) b.sets.pop();
      else b.sets.push({ text: '', amrap: true });
      if (state.pad && state.pad.blockId === id && b.sets[state.pad.setIndex]?.amrap) state.pad = null;
      render();
    },
    removeBlock(id) {
      state.blocks = state.blocks.filter((b) => b.id !== id);
      if (state.pad && state.pad.blockId === id) state.pad = null;
      state.activeId = state.blocks[0]?.id || null;
      if (state.activeId) Play.openBlock(state.activeId);
      else render();
    },
    reorder() {
      const at = state.blocks.findIndex((b) => b.id === state.activeId);
      if (at <= 0) return;
      const [item] = state.blocks.splice(at, 1);
      state.blocks.splice(at - 1, 0, item);
      render(true);
    },
    calendar() { state.screen = 'calendar'; state.pad = null; render(); },
    confirmDate() {
      state.posted = 'Posted ' + state.title + ' on ' + state.date + '.';
      state.screen = 'edit';
      render(true);
    }
  };
  window.Play = Play;
  document.addEventListener('keydown', (event) => {
    if (!state.pad) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (event.key === 'Backspace') { event.preventDefault(); Play.key('⌫'); }
    else if (/^\d$/.test(event.key)) Play.key(event.key);
    else if (event.key === '-' ) Play.key('–');
  });
  render(state.screen === 'edit');
})();
</script>
</body>
</html>
