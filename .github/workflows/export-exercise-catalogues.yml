name: Downloadable exercise catalogue ZIP
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the usable catalogues and export the ZIP
        run: |
          python3 -m unittest discover -s scripts -p test_exercise_categories.py -v
          python3 scripts/export-exercise-catalogues.py
      - uses: actions/upload-artifact@v4
        with:
          name: exercise-catalogues-main-and-banded
          path: dist/catalogue-export/*.zip
      - name: Publish the phone-friendly download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view exercise-catalogues >/dev/null 2>&1; then
            gh release upload exercise-catalogues dist/catalogue-export/*.zip --clobber
            gh release edit exercise-catalogues --draft=false
          else
            gh release create exercise-catalogues dist/catalogue-export/*.zip --latest=false --title "Exercise catalogues — Main and Banded" --notes "Cleaned Main and Banded exercise catalogues with CSV, JSON, aliases and file hashes. Unclear/non-exercise entries and archived originals are excluded. No app installation required."
          fi
