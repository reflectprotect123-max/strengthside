name: Dogfood APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/nutrition-core/**'
      - '.github/workflows/dogfood-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/Android/Sdk"
          mkdir -p "$SDK/cmdline-tools" "$SDK/licenses"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDK/cmdline-tools/latest"
          # `yes | sdkmanager --licenses` exits 141 under pipefail when sdkmanager closes stdin.
          printf '%s\n' \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            84831b9409646a918e305e696a5a315c534a430 \
            d975f751698a77b662f1254ddbe140390d961f \
            601085b94cd77f0b157c6306946f4c23 \
            33b6a2b64607f11b759f320ef9dff4ae \
            8403addf88ab4874007e1c1b80d62b47 \
            1fde451af62354da92ce2630df5a2c65 \
            e9ac551e6ee698725b50a05caa2f6a59 \
            > "$SDK/licenses/android-sdk-license"
          cp "$SDK/licenses/android-sdk-license" "$SDK/licenses/android-sdk-preview-license"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Build debug dogfood APK
        run: bash apps/mobile/capacitor/scripts/build-dogfood-apk.sh

      - name: Publish dogfood-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="apps/mobile/capacitor/android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD="$(grep -o "LOCAL_BUILD='[^']*'" apps/mobile/prototype/hybrid-app/index.html | head -1 | cut -d"'" -f2)"
          SHA="$(git rev-parse --short HEAD)"
          NOTES="Debug Android shell for THE Hybrid athlete app.

          **Build stamp:** \`${BUILD}\`
          **Commit:** \`${SHA}\`

          Install on phone: open this release on GitHub → Assets → \`the-hybrid-athlete-dogfood-debug.apk\` → Install.
          Allow installs from your browser/files app if Android asks."

          if gh release view dogfood-latest >/dev/null 2>&1; then
            gh release edit dogfood-latest --title "Dogfood APK (latest)" --notes "$NOTES" --latest
            gh release upload dogfood-latest "$APK#the-hybrid-athlete-dogfood-debug.apk" --clobber
          else
            gh release create dogfood-latest "$APK#the-hybrid-athlete-dogfood-debug.apk" \
              --title "Dogfood APK (latest)" \
              --notes "$NOTES" \
              --latest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: the-hybrid-athlete-dogfood-debug
          path: apps/mobile/capacitor/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
