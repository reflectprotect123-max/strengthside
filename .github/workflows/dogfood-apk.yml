name: Strength Dogfood APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/strength-only-dogfood-20261008']
    paths:
      - 'apps/athlete/**'
      - 'apps/mobile/**'
      - 'packages/brain/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dogfood-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/Android/Sdk"
          mkdir -p "$SDK/cmdline-tools" "$SDK/licenses"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDK/cmdline-tools/latest"
          # `yes | sdkmanager --licenses` exits 141 under pipefail when sdkmanager closes stdin.
          printf '%s\n' \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            84831b9409646a918e305e696a5a315c534a430 \
            d975f751698a77b662f1254ddbe140390d961f \
            601085b94cd77f0b157c6306946f4c23 \
            33b6a2b64607f11b759f320ef9dff4ae \
            8403addf88ab4874007e1c1b80d62b47 \
            1fde451af62354da92ce2630df5a2c65 \
            e9ac551e6ee698725b50a05caa2f6a59 \
            > "$SDK/licenses/android-sdk-license"
          cp "$SDK/licenses/android-sdk-license" "$SDK/licenses/android-sdk-preview-license"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Validate strength app
        run: pnpm run verify

      - name: Build debug dogfood APK
        run: bash apps/mobile/capacitor/scripts/build-dogfood-apk.sh

      - name: Publish strength dogfood APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="apps/mobile/capacitor/android/app/build/outputs/apk/debug"
          APK="$OUT/The-Strength-1.2.0.apk"
          (cd "$OUT" && sha256sum The-Strength-1.2.0.apk > SHA256SUMS.txt)
          cat > /tmp/strength-release-notes.md <<'NOTES'
          Strength-only dogfood APK, version 1.2.0.

          TrainHeroic-inspired Training, Library builder, set-by-set logger,
          supersets, rest timers and WHOOP account connection.
          Conditioning is removed. Legacy conditioning sessions are filtered
          at device/cloud import. This APK loads its bundled strength app;
          it cannot download the old Hybrid S&C/Engine Capgo app.

          Download The-Strength-1.2.0.apk on Android and open it to install.
          Validation: repository verify, strength import tests and native asset
          boundary checks. Physical-phone installation has not been tested.
          NOTES
          TAG="strength-dogfood-v1.2.0-${GITHUB_SHA:0:7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/strength-release-notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "The Strength — dogfood APK 1.2.0" \
              --notes-file /tmp/strength-release-notes.md --latest
          fi
          gh release upload "$TAG" "$APK" "$OUT/SHA256SUMS.txt" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: strength-only-apk-1.2.0
          path: apps/mobile/capacitor/android/app/build/outputs/apk/debug/The-Strength-1.2.0.apk
          if-no-files-found: error
          retention-days: 30
