name: Strength APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/athlete/**'
      - 'apps/mobile/capacitor/android/**'
      - 'apps/mobile/capacitor/package*.json'
      - 'apps/mobile/capacitor/capacitor.config.json'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check bundled strength screens
        run: |
          node scripts/sync-training-core.mjs --check
          node scripts/generate-strength-release.mjs --check
          node apps/athlete/checks/athlete-app.smoke.mjs
          node scripts/stage-athlete.mjs apps/mobile/capacitor/www
      - name: Install and sync native updater
        working-directory: apps/mobile/capacitor
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
      - name: Build full Android APK
        working-directory: apps/mobile/capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: strength-apk-unsigned
          path: |
            apps/mobile/capacitor/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/mobile/capacitor/package-lock.json
