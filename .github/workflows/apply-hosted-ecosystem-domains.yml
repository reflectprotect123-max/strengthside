# Apply HYBRID S&C ecosystem domain migration on shared hosted Supabase.
# Needs ONE GitHub Actions secret:
#   SUPABASE_ACCESS_TOKEN  (https://supabase.com/dashboard/account/tokens)
#   — or — SUPABASE_DB_PASSWORD (Database settings)
#
# How to run:
#   Actions → "Apply hosted ecosystem domains" → Run workflow → confirm = APPLY
name: Apply hosted ecosystem domains

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to run DDL against shared hosted Postgres'
        required: true
        default: ''

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install psql (DB password path)
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Guard
        run: |
          if [[ "${{ inputs.confirm }}" != "APPLY" ]]; then
            echo "::error::Refusing — set confirm=APPLY to run hosted DDL"
            exit 1
          fi
      - name: Apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION }}
          SUPABASE_PROJECT_REF: orysjncrksmdfabpuftd
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" && -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::Add repo secret SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD under Settings → Secrets → Actions"
            exit 1
          fi
          node scripts/apply-hosted-ecosystem-hybrid-sc-domains.mjs
