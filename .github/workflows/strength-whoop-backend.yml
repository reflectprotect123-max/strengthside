name: Strength WHOOP backend
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/strength-whoop-*/**'
      - 'scripts/deploy-strength-whoop.sh'
      - '.github/workflows/strength-whoop-backend.yml'
permissions:
  contents: read
concurrency:
  group: strength-whoop-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.78.1
      - name: Deploy namespaced strength WHOOP account endpoints
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRENGTH_WHOOP_TARGETS: strength-whoop-status strength-whoop-disconnect
        run: bash scripts/deploy-strength-whoop.sh
