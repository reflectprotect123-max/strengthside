name: Strength brain backend
on:
  push:
    branches: [codex/strength-brain-today]
    paths: ['supabase/migrations/20261010120000_strength_brain_memory.sql', '.github/workflows/strength-brain-backend.yml', 'checks/sql/strength-brain-memory-test.sql']
  workflow_dispatch:
    inputs:
      deploy_whoop_accounts:
        description: Deploy only the namespaced strength WHOOP account endpoints
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ !inputs.deploy_whoop_accounts }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: brain-test-local
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify brain schema and athlete isolation in disposable Postgres
        env:
          PGPASSWORD: brain-test-local
        run: psql -h localhost -U postgres -d postgres -f checks/sql/strength-brain-memory-test.sql
      - name: Apply additive brain memory migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-strength-brain.mjs

  whoop_accounts:
    if: ${{ inputs.deploy_whoop_accounts }}
    uses: ./.github/workflows/strength-whoop-backend.yml
    secrets: inherit
