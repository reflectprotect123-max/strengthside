# Deploy athlete HTML app + integration functions to Netlify.
# Requires repo secret: NETLIFY_AUTH_TOKEN.
# Site defaults to slug "thehybridsystem" (confirmed from successful deploy logs).
# Optional: NETLIFY_SITE_ID — UUID or slug. If set to a URL by mistake, ignored.
name: Deploy athlete Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/preview-site/**'
      - 'apps/mobile/prototype/hybrid-app/**'
      - 'apps/mobile/sync-hybrid-html.sh'
      - 'netlify.toml'
      - '.github/workflows/deploy-athlete-netlify.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync preview-site from prototype
        run: bash apps/mobile/sync-hybrid-html.sh

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${NETLIFY_AUTH_TOKEN:-}" ]]; then
            echo "::warning::NETLIFY_AUTH_TOKEN not set — skipping Netlify deploy"
            exit 0
          fi
          # Prefer secret when it is a real site id/slug. A common footgun is
          # pasting APP_BASE_URL into NETLIFY_SITE_ID — reject that and use the
          # known athlete site slug from prior successful deploys.
          SITE="${NETLIFY_SITE_ID:-thehybridsystem}"
          if [[ "$SITE" == http* || "$SITE" == *netlify.app* || "$SITE" == */* ]]; then
            echo "::warning::NETLIFY_SITE_ID looks like a URL/path ('${SITE:0:32}…'); using slug thehybridsystem"
            SITE=thehybridsystem
          fi
          if [[ -z "$SITE" ]]; then
            SITE=thehybridsystem
          fi
          echo "Deploying to Netlify site: $SITE"
          # Deploy FROM preview-site so netlify-cli does not scan the pnpm
          # monorepo packages and abort with "multiple projects detected".
          cd apps/mobile/preview-site
          # Match hybrid1: @netlify/blobs ^10.x for function Blobs API.
          # Install into a side folder so we do not upload node_modules as
          # static site files; esbuild external_node_modules resolves from here.
          npm install --omit=dev --no-fund --no-audit --prefix .
          # GitHub secrets are not function runtime env. config.mjs falls back
          # to the production athlete origin when APP_BASE_URL is unset on the site.
          npx --yes netlify-cli deploy --prod \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --site="$SITE" \
            --dir=. \
            --functions=netlify/functions \
            --no-build \
            --message "deploy athlete app (${GITHUB_SHA::7})"
