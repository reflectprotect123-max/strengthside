# Deploy athlete HTML app + integration proxy functions to Netlify.
# Requires repo secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID (thehybridsystem site).
name: Deploy athlete Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/preview-site/**'
      - 'apps/mobile/prototype/hybrid-app/**'
      - 'apps/mobile/sync-hybrid-html.sh'
      - 'netlify.toml'
      - '.github/workflows/deploy-athlete-netlify.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync preview-site from prototype
        run: bash apps/mobile/sync-hybrid-html.sh

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${NETLIFY_AUTH_TOKEN:-}" || -z "${NETLIFY_SITE_ID:-}" ]]; then
            echo "::warning::NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID not set — skipping Netlify deploy"
            exit 0
          fi
          # Deploy FROM preview-site so netlify-cli does not scan the pnpm
          # monorepo packages and abort with "multiple projects detected".
          cd apps/mobile/preview-site
          # WHOOP/Concept2 handlers import @netlify/blobs (runtime API). Install
          # so esbuild/external_node_modules can resolve it during packaging.
          npm install --omit=dev --no-fund --no-audit
          # Ensure production functions get APP_BASE_URL even if the UI var was
          # saved under the wrong context/scope (Builds-only, preview-only, etc.).
          npx --yes netlify-cli env:set APP_BASE_URL "https://thehybridsystem.netlify.app" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --site="$NETLIFY_SITE_ID" \
            --context production \
            --scope functions runtime \
            --force
          npx --yes netlify-cli deploy --prod \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --site="$NETLIFY_SITE_ID" \
            --dir=. \
            --functions=netlify/functions \
            --no-build \
            --message "deploy athlete app (${GITHUB_SHA::7})"
