# Deploy athlete HTML app + integration functions to Netlify.
# Requires repo secret: NETLIFY_AUTH_TOKEN.
# Site defaults to slug "thehybridsystem" (confirmed from successful deploy logs).
# Optional: NETLIFY_SITE_ID — UUID or slug. If set to a URL by mistake, ignored.
#
# WHOOP contract: strength client uses Supabase; legacy Netlify proxies remain for other consumers.
# Ownership smoke runs BEFORE deploy; live smoke runs AFTER.
name: Deploy athlete Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/athlete/**'
      - 'scripts/sync-athlete-app.sh'
      - 'scripts/bundle-brain.mjs'
      - 'scripts/bundle-adaptive.mjs'
      - 'packages/brain/**'
      - 'packages/adaptive/**'
      - 'apps/mobile/capacitor/android/app/src/main/**'
      - 'scripts/deploy-athlete.mjs'
      - 'scripts/stage-athlete.mjs'
      - 'scripts/generate-strength-release.mjs'
      - 'scripts/sync-training-core.mjs'
      - 'apps/shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Build athlete bundles
        run: bash scripts/sync-athlete-app.sh

      - name: WHOOP routing gate
        run: node apps/athlete/checks/whoop-ownership.smoke.mjs

      - name: WHOOP deep-link gate (Android OAuth return)
        run: node apps/athlete/checks/whoop-deeplink.smoke.mjs

      - name: Hybrid proxy smoke
        run: node apps/athlete/checks/hybrid-proxy.smoke.mjs

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NETLIFY_AUTH_TOKEN:-}" ]]; then
            echo "::warning::NETLIFY_AUTH_TOKEN not set — skipping Netlify deploy"
            exit 0
          fi
          node scripts/deploy-athlete.mjs

      - name: Live WHOOP production smoke (post-deploy)
        if: ${{ success() }}
        env:
          WHOOP_LIVE_RETRIES: '5'
          WHOOP_LIVE_RETRY_MS: '5000'
        run: node apps/athlete/checks/whoop-live.smoke.mjs
