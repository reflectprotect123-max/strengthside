# Deploy The Brain athlete app to Netlify (thehybridsystem).
name: Deploy athlete Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/brain-app/**'
      - 'packages/brain/**'
      - 'scripts/bundle-brain.mjs'
      - 'apps/mobile/capacitor/android/app/src/main/**'
      - '.github/workflows/deploy-athlete-netlify.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:brain
      - run: node apps/brain-app/checks/whoop-ownership.smoke.mjs
      - run: node apps/brain-app/checks/whoop-deeplink.smoke.mjs
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${NETLIFY_AUTH_TOKEN:-}" ]]; then
            echo "::warning::NETLIFY_AUTH_TOKEN not set — skipping Netlify deploy"
            exit 0
          fi
          SITE="${NETLIFY_SITE_ID:-thehybridsystem}"
          if [[ "$SITE" == http* || "$SITE" == *netlify.app* || "$SITE" == */* ]]; then
            SITE=thehybridsystem
          fi
          cd apps/brain-app
          npx --yes netlify-cli@26.2.0 deploy --prod \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --site="$SITE" \
            --dir=. \
            --functions=netlify/functions \
            --no-build \
            --message "deploy The Brain (${GITHUB_SHA::7})"
