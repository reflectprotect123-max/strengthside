# Deploy athlete HTML app + integration functions to Netlify.
# Requires repo secret: NETLIFY_AUTH_TOKEN.
# Site defaults to slug "thehybridsystem" (confirmed from successful deploy logs).
# Optional: NETLIFY_SITE_ID — UUID or slug. If set to a URL by mistake, ignored.
#
# WHOOP contract: athlete site is PROXY-ONLY → thehybridengine1.
# Ownership smoke runs BEFORE deploy; live smoke runs AFTER.
name: Deploy athlete Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/athlete/**'
      - 'scripts/sync-athlete-app.sh'
      - 'scripts/bundle-brain.mjs'
      - 'scripts/bundle-adaptive.mjs'
      - 'packages/brain/**'
      - 'packages/adaptive/**'
      - 'apps/mobile/capacitor/android/app/src/main/**'
      - '.github/workflows/deploy-athlete-netlify.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Build athlete bundles
        run: bash scripts/sync-athlete-app.sh

      - name: WHOOP ownership gate (block real-handler cutover)
        run: node apps/athlete/checks/whoop-ownership.smoke.mjs

      - name: WHOOP deep-link gate (Android OAuth return)
        run: node apps/athlete/checks/whoop-deeplink.smoke.mjs

      - name: Hybrid proxy smoke
        run: node apps/athlete/checks/hybrid-proxy.smoke.mjs

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${NETLIFY_AUTH_TOKEN:-}" ]]; then
            echo "::warning::NETLIFY_AUTH_TOKEN not set — skipping Netlify deploy"
            exit 0
          fi
          SITE="${NETLIFY_SITE_ID:-thehybridsystem}"
          if [[ "$SITE" == http* || "$SITE" == *netlify.app* || "$SITE" == */* ]]; then
            echo "::warning::NETLIFY_SITE_ID looks like a URL/path ('${SITE:0:32}…'); using slug thehybridsystem"
            SITE=thehybridsystem
          fi
          if [[ -z "$SITE" ]]; then
            SITE=thehybridsystem
          fi
          echo "Deploying to Netlify site: $SITE"
          cd apps/athlete
          npx --yes netlify-cli@26.2.0 deploy --prod \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --site="$SITE" \
            --dir=. \
            --functions=netlify/functions \
            --no-build \
            --message "deploy athlete app (${GITHUB_SHA::7})"

      - name: Live WHOOP production smoke (post-deploy)
        if: ${{ success() }}
        env:
          WHOOP_LIVE_RETRIES: '5'
          WHOOP_LIVE_RETRY_MS: '5000'
        run: node apps/athlete/checks/whoop-live.smoke.mjs
