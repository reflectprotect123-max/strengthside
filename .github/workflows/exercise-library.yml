name: Exercise movement library
on:
  pull_request:
    paths:
      - 'docs/data/trainheroic-library/**'
      - 'scripts/categorise-exercise-library.py'
      - 'scripts/test_exercise_categories.py'
      - '.github/workflows/exercise-library.yml'
  push:
    branches: [main]
    paths:
      - 'docs/data/trainheroic-library/**'
      - 'scripts/categorise-exercise-library.py'
      - 'scripts/test_exercise_categories.py'
      - '.github/workflows/exercise-library.yml'
permissions:
  contents: read
jobs:
  movement-categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check category decisions, identities, aliases and reproducible exports
        run: |
          python3 -m unittest discover -s scripts -p test_exercise_categories.py -v
          python3 scripts/categorise-exercise-library.py --check
