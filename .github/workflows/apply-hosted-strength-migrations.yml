# Apply strength migrations to shared hosted Supabase (orysjncrksmdfabpuftd).
# Needs one repo secret: SUPABASE_ACCESS_TOKEN (preferred) or SUPABASE_DB_PASSWORD.
# Manual only — never auto-apply on every push to main.
name: Apply hosted strength migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to run DDL against shared hosted Postgres'
        required: true
        default: ''

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Guard
        run: |
          if [[ "${{ inputs.confirm }}" != "APPLY" ]]; then
            echo "::error::Refusing — set confirm=APPLY to run hosted DDL"
            exit 1
          fi
      - name: Apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: orysjncrksmdfabpuftd
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" && -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::Add repo secret SUPABASE_ACCESS_TOKEN (Account → Access Tokens) or SUPABASE_DB_PASSWORD"
            exit 1
          fi
          node scripts/apply-hosted-strength-migrations.mjs
