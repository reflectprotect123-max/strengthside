# Build THE Hybrid Coach Windows installer (.exe) and publish for shell OTA.
# Coach UI still updates via Netlify on load; this ships shell (.exe) updates.
name: Build coach desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-coach-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Coach desktop smoke (config + live URL)
        run: pnpm run check:coach-desktop

      - name: Build and publish Windows NSIS installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run dist:publish

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: THE-Hybrid-Coach-Windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/latest.yml
          if-no-files-found: error
