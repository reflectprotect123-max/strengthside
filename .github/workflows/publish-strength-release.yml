name: Publish signed Strength APK
on:
  workflow_dispatch:
    inputs:
      artifact_ref:
        description: Branch containing verified signed release files under release-assets
        required: true
      version:
        description: App version (for example 1.3.0)
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.artifact_ref }}
      - name: Verify and publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd release-assets
          sha256sum -c "Hybrid-Strength-${RELEASE_VERSION}-SHA256SUMS.txt"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "Hybrid-Strength-${RELEASE_VERSION}.apk" > certificate.txt
          grep -Fq '14771b0886786647eeed859536af67af8d7da8b73f1ea42655b77dc379baf29f' certificate.txt
          gh release create "strength-brain-v${RELEASE_VERSION}" \
            "Hybrid-Strength-${RELEASE_VERSION}.apk" \
            "Hybrid-Strength-${RELEASE_VERSION}-Web.zip" \
            "Hybrid-Strength-${RELEASE_VERSION}-SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --title "Hybrid Strength ${RELEASE_VERSION}" \
            --notes-file release-notes.md
