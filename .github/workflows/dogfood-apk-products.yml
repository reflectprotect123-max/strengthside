# Debug APKs for Hybrid Strength / Hybrid Engine.
# Separate GitHub releases so mixed dogfood-latest is not clobbered.
# Pattern copied from nutrition's dogfood-apk.yml + this repo's mixed Dogfood APK.
name: Dogfood APK products

on:
  workflow_dispatch:
    inputs:
      product:
        description: strength, engine, or both
        required: true
        default: both
        type: choice
        options:
          - both
          - strength
          - engine
  push:
    branches: [main]
    paths:
      - 'apps/hybrid-strength/**'
      - 'apps/hybrid-engine/**'
      - 'apps/mobile/prototype/hybrid-app/**'
      - 'apps/mobile/capacitor/**'
      - 'scripts/extract-hybrid-apps.sh'
      - 'scripts/setup-product-shells.sh'
      - 'scripts/build-product-apk.sh'
      - '.github/workflows/dogfood-apk-products.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [strength, engine]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.product == 'both' || inputs.product == matrix.product }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/Android/Sdk"
          mkdir -p "$SDK/cmdline-tools" "$SDK/licenses"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDK/cmdline-tools/latest"
          printf '%s\n' \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            84831b9409646a918e305e696a5a315c534a430 \
            d975f751698a77b662f1254ddbe140390d961f \
            601085b94cd77f0b157c6306946f4c23 \
            33b6a2b64607f11b759f320ef9dff4ae \
            8403addf88ab4874007e1c1b80d62b47 \
            1fde451af62354da92ce2630df5a2c65 \
            e9ac551e6ee698725b50a05caa2f6a59 \
            > "$SDK/licenses/android-sdk-license"
          cp "$SDK/licenses/android-sdk-license" "$SDK/licenses/android-sdk-preview-license"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Refresh product tree
        run: bash scripts/extract-hybrid-apps.sh

      - name: Build debug APK
        env:
          PRODUCT: ${{ matrix.product }}
        run: bash scripts/build-product-apk.sh

      - name: Publish product dogfood release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ matrix.product }}
        run: |
          set -euo pipefail
          APP_ID="$(python3 -c "import json; print(json.load(open('scripts/hybrid-products.json'))['$PRODUCT']['appId'])")"
          DIR="$(python3 -c "import json; print(json.load(open('scripts/hybrid-products.json'))['$PRODUCT']['dir'])")"
          APK_SRC="$(find "$DIR/capacitor/android/app/build/outputs/apk/debug" -name '*.apk' | head -1)"
          APK_NAME="hybrid-${PRODUCT}-dogfood-debug.apk"
          APK_OUT="$(dirname "$APK_SRC")/$APK_NAME"
          cp -f "$APK_SRC" "$APK_OUT"
          SHA="$(git rev-parse --short HEAD)"
          TAG="dogfood-${PRODUCT}-latest"
          TITLE="Hybrid ${PRODUCT} dogfood APK (latest)"
          NOTES="Debug Android shell for **${APP_ID}**.

          **Commit:** \`${SHA}\`

          Does not replace mixed \`dogfood-latest\` (\`com.hybrid.athlete\`).

          Install on phone: GitHub → Assets → \`${APK_NAME}\` → Install.
          Capgo OTA (channels **dogfood** then **live**) can replace the WebView after this APK is installed once."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets -q '.assets[].name' | while read -r name; do
              if [[ -n "$name" && "$name" != "$APK_NAME" ]]; then
                gh release delete-asset "$TAG" "$name" --yes || true
              fi
            done
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" "$APK_OUT" --clobber
          else
            gh release create "$TAG" "$APK_OUT" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-${{ matrix.product }}-dogfood-debug
          path: apps/hybrid-${{ matrix.product }}/capacitor/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
