# Redeploy official WHOOP Edge functions (connect / callback / sync / disconnect).
# Needs repo secret SUPABASE_ACCESS_TOKEN (https://supabase.com/dashboard/account/tokens).
name: Deploy WHOOP Edge

on:
  push:
    paths:
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/whoop-*/**'
      - 'supabase/functions/integrations-*/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-whoop-edge.yml'
      - 'scripts/deploy-whoop-edge.sh'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Gate
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skip Edge deploy"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.gate.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: orysjncrksmdfabpuftd
        run: bash scripts/deploy-whoop-edge.sh
