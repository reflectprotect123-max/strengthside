name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - name: Install postgres + pgvector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-contrib
          PGVER=$(ls /usr/lib/postgresql | sort -V | tail -1)
          sudo apt-get install -y "postgresql-$PGVER-pgvector"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run check:engine-adapter
      - run: pnpm run check:cond-thin-twin
      - run: pnpm run check:cond-interval-autoreg
      - run: pnpm run check:cond-session-logger
      - run: pnpm run check:cond-autopilot-prescription
      - run: pnpm run check:coach-ai
      - run: pnpm run check:strength-ai
      - run: pnpm run check:strength-rep-llm
      - run: pnpm run check:library-conditioning
      - run: pnpm run check:starter-templates
      - run: pnpm run check:engine-adapt
      - run: pnpm run check:label-scan
      - run: pnpm run check:native-bridge
      - run: pnpm run check:capgo-live-update
      - run: pnpm run check:native-ble
      - run: pnpm run check:blank-slate-wm
      - run: pnpm run check:calendar-ux
      - run: pnpm run check:track-dawn-polish
      - run: pnpm run check:athlete-builder-migrate
      - run: pnpm run check:athlete-builder-logger
      - run: pnpm run check:athlete-engine-builder
      - run: pnpm run check:athlete-superset-lock
      - run: pnpm run check:session-preview
      - run: pnpm run check:session-chrome
      - run: pnpm run check:session-flow
      - run: pnpm run check:rest-overlay
      - run: pnpm run check:hybrid-html-sync
      - run: pnpm run check:builder-suggest
      - run: pnpm run check:nutrition-ui
      - run: pnpm run check:strength-resolve
      - run: pnpm run check:e1rm-value
      - run: pnpm run check:strength-adapter-resolve
      - run: pnpm run check:strength-session-start-load
      - run: pnpm run check:strength-load-context
      - run: pnpm run check:account-sync-checkin
      - run: pnpm run check:log-columns
      - run: pnpm run check:exercise-load-expr
      - run: pnpm run check:exercise-load-profiles
      - run: pnpm run check:exercise-search
      - run: pnpm run check:autopilot-policy
      - run: pnpm run check:strength-volume
      - run: pnpm run check:strength-progression
      - run: pnpm run check:strength-sync
      - run: pnpm run check:nutrition-sync
      - run: pnpm run check:food-catalog
      - run: pnpm run check:whoop-ownership
      - run: pnpm run check:whoop-deeplink
      - run: pnpm run check:hybrid-proxy
      - run: pnpm run check:whoop-live
      - run: pnpm run check:coach-loop
      - run: pnpm run check:coach-session-builder
      - run: pnpm run check:coach-nutrition
      - run: pnpm run check:coach-program-grid
      - run: pnpm run check:coach-bridge
      - run: pnpm run check:coach-calendars
      - run: pnpm run check:coach-v1-e2e
      - run: pnpm run check:coach-cloud
      - run: pnpm run check:coach-portal-athlete
      - run: pnpm run check:coach-block-types
      - run: pnpm run check:coach-audit-fixes
      - run: pnpm run check:big-mac-bridge
      - run: pnpm run check:coach-desktop
      - name: Migrations apply (no environment gaps permitted here)
        run: |
          node checks/migrations-apply.mjs | tee /tmp/migrations.log
          if grep -q "KNOWN ENVIRONMENT GAP" /tmp/migrations.log; then
            echo "::error::A KNOWN ENVIRONMENT GAP appeared in CI. The extension IS installed here, so the install broke."
            exit 1
          fi

  evidence-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e evidence-platform pytest jsonschema pyyaml
      - run: python -m pytest evidence-platform/tests/ -q
      - run: python evidence-platform/validators/validate_platform.py
