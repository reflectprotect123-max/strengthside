# OpenRouter on The Brain owner site (thehybridengine1) via REST API + coach deploy.
# Key from handoff vault (rematerialize) — NOT embedded in this yaml.
name: Set OpenRouter on Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-openrouter-netlify.yml'
      - 'scripts/set-openrouter-netlify.mjs'
      - 'scripts/rematerialize-openrouter-from-vault.sh'
      - 'handoff.md'

permissions:
  contents: read

jobs:
  set-openrouter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Netlify token
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Missing repo secret NETLIFY_AUTH_TOKEN"
            exit 1
          fi

      - name: Set OPENROUTER on Brain owner site + deploy brain-coach
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/rematerialize-openrouter-from-vault.sh
          node scripts/set-openrouter-netlify.mjs --deploy-coach

      - name: Sync athlete proxy + redeploy thehybridsystem
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/sync-athlete-app.sh
          cd apps/athlete
          npx --yes netlify-cli api listSites --auth="$NETLIFY_AUTH_TOKEN" > /tmp/sites.json
          TO_SITE="$(node -e '
            const rows = JSON.parse(require("fs").readFileSync("/tmp/sites.json","utf8"));
            const id = rows.find(r => r.name === "thehybridsystem")?.id
              || rows.find(r => /thehybridsystem/i.test(r.ssl_url || r.url || ""))?.id
              || "";
            if (!id) { console.error("no thehybridsystem"); process.exit(3); }
            process.stdout.write(id);
          ')"
          npx --yes netlify-cli link --id "$TO_SITE" --name thehybridsystem --auth="$NETLIFY_AUTH_TOKEN"
          npm install --omit=dev --no-fund --no-audit --prefix .
          npx --yes netlify-cli deploy --prod \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --site="$TO_SITE" \
            --dir=. \
            --functions=netlify/functions \
            --no-build \
            --message "brain-coach proxy to Brain owner (${GITHUB_SHA::7})"
