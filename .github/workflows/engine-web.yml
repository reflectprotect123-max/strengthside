name: Check Hybrid Engine web
on:
  push:
    paths: ['apps/engine-web/**', '.github/workflows/engine-web.yml']
  pull_request:
    paths: ['apps/engine-web/**', '.github/workflows/engine-web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - run: node scripts/check.mjs
