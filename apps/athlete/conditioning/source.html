</script><script>/* CONFIRMED: Morpheus exposes daily/weekly/monthly recovery, HRV, RHR,
 * sleep, steps and weekly cardio totals. STRENGTHSIDE-DESIGNED: this UI,
 * aggregation, import and comparisons. No proprietary progression formula. */
(function(){
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const symbol='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 17 20 4l14 13M6 25 20 12l14 13M6 33 20 20l14 13" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square"/></svg>';
const day=d=>{const s=String(d??'').slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const x=new Date(s+'T12:00:00Z');return Number.isFinite(+x)&&x.toISOString().slice(0,10)===s?s:null;};
const shift=(d,n)=>new Date(Date.parse(d+'T12:00:00Z')+n*86400000).toISOString().slice(0,10);
const defs=[['recovery','Recovery','%',0,100],['hrv','HRV','ms',0,1000],['rhr','Resting HR','bpm',1,300],['sleep','Sleep','h',0,24],['steps','Steps','',0,200000]];
const importedNumber=v=>{if(v!=null&&String(v).trim()!==''&&!Number.isFinite(Number(v)))throw Error('Invalid numeric value in import. Nothing was imported.');return number(v);};
const number=v=>v==null||String(v).trim()===''?null:Number.isFinite(Number(v))?Number(v):null;
let notice='',detail=null;
S.progressUi=S.progressUi||{period:'Weekly',date:today()};
function records(){const rows=new Map();for(const [d,c] of Object.entries(S.checkin||{})){if(!day(d))continue;rows.set(d,{date:d,recovery:number(c.whoopRecovery),hrv:number(c.hrv),rhr:number(c.restingHr),sleep:number(c.sleepHours),steps:number(c.steps),source:c.whoopSyncedAt?'WHOOP account':'Manual WHOOP entry'});}for(const r of S.whoopHistory||[])rows.set(r.date,{...rows.get(r.date),...r});return [...rows.values()].sort((a,b)=>a.date.localeCompare(b.date));}
function bounds(period,date){let start=date,end=date;if(['30 days','90 days','365 days'].includes(period))start=shift(date,1-parseInt(period));else if(period==='All')start=records()[0]?.date||date;else if(period==='Weekly'){const weekday=new Date(date+'T12:00:00Z').getUTCDay();start=shift(date,-((weekday+6)%7));end=shift(start,6);}else if(period==='Monthly'){start=date.slice(0,7)+'-01';end=shift(new Date(Date.UTC(Number(date.slice(0,4)),Number(date.slice(5,7)),1,12)).toISOString().slice(0,10),-1);}return {start,end};}
function average(rows,k){const a=rows.map(r=>r[k]).filter(Number.isFinite);return {value:a.length?a.reduce((s,n)=>s+n,0)/a.length:null,count:a.length};}
const fmt=(n,k)=>n==null?'—':k==='steps'?Math.round(n).toLocaleString():Number(n).toFixed(k==='hrv'||k==='sleep'?1:0);
function chart(rows,k,color){const a=rows.filter(r=>Number.isFinite(r[k]));if(!a.length)return '<p class="pg-muted">No measurements in this period.</p>';const min=Math.min(...a.map(r=>r[k])),max=Math.max(...a.map(r=>r[k])),span=max-min||1;const lo=Date.parse(rows[0].date),hi=Date.parse(rows.at(-1).date),x=r=>12+((Date.parse(r.date)-lo)/(hi-lo||1))*296,y=r=>94-(r[k]-min)/span*70;return '<svg class="pg-chart" viewBox="0 0 320 110" role="img" aria-label="'+e(k)+' trend; '+a.length+' measurements"><path d="M12 94H308" stroke="var(--oled-line)"/><polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+a.map(r=>x(r)+','+y(r)).join(' ')+'"/>'+a.map(r=>'<circle cx="'+x(r)+'" cy="'+y(r)+'" r="3" fill="'+color+'"><title>'+e(r.date)+': '+fmt(r[k],k)+'</title></circle>').join('')+'</svg><div class="pg-between pg-muted"><span>'+e(rows[0].date)+'</span><span>'+e(rows.at(-1).date)+'</span></div><p class="pg-muted">Missing days have no measurement; lines connect recorded values.</p>';}
function cards(date,period){const b=bounds(period,date),old=bounds(period,shift(b.start,-1)),all=records(),rows=all.filter(r=>r.date>=b.start&&r.date<=b.end),previous=all.filter(r=>r.date>=old.start&&r.date<=old.end);return '<div class="pg-cards">'+defs.map(([k,label,unit])=>{const a=average(rows,k),p=average(previous,k),delta=period!=='All'&&a.value!=null&&p.value!=null?a.value-p.value:null;return '<section class="pg-card"><h2>'+label+'</h2><div class="pg-value">'+fmt(a.value,k)+' <small>'+unit+'</small></div><p class="pg-muted">'+a.count+' recorded '+(a.count===1?'day':'days')+(delta==null?' · No previous-period comparison':' · '+(delta>0?'+':'')+fmt(delta,k)+' '+unit+' vs previous '+period.toLowerCase())+'</p>'+chart(rows,k,k==='recovery'?'var(--recovery-high)':'var(--trn-blue)')+'</section>';}).join('')+'</div>';}
function controls(){const u=S.progressUi,b=bounds(u.period,u.date);return '<label>History range<select aria-label="History range" onchange="Progress.period(this.value)">'+['Daily','Weekly','Monthly','30 days','90 days','365 days','All'].map(p=>'<option '+(p===u.period?'selected':'')+'>'+p+'</option>').join('')+'</select></label>'+ '<div class="pg-tabs">'+['Daily','Weekly','Monthly'].map(p=>'<button aria-pressed="'+(p===u.period)+'" onclick="Progress.period(\''+p+'\')">'+p+'</button>').join('')+'</div><div class="pg-between pg-date"><button aria-label="Previous period" onclick="Progress.move(-1)">‹</button><label>Period containing <input aria-label="Trend date" type="date" max="'+today()+'" value="'+e(u.date)+'" onchange="Progress.date(this.value)"></label><button aria-label="Next period" onclick="Progress.move(1)">›</button></div><p class="pg-muted">'+b.start+(b.end!==b.start?' → '+b.end:'')+'</p>';}
function weekly(date=S.progressUi.date){const b=bounds('Weekly',date),work=(S.liveWorkoutHistory||[]).filter(r=>r.date>=b.start&&r.date<=b.end),target=(S.weeklyTargetHistory||[]).find(t=>t.weekStart===b.start);return '<section class="pg-card"><h2>Weekly cardio minutes</h2><p class="pg-muted">Monday–Sunday · '+b.start+' → '+b.end+'</p>'+['Blue','Green','Red'].map(z=>{const minutes=work.reduce((s,w)=>s+(w.type==='Strength'?0:Number(w.zoneSeconds?.[z])||0),0)/60;const range=target?.zones?.[z];return '<div class="pg-zone" style="--pg-zone:'+({Blue:'var(--trn-blue)',Green:'var(--recovery-high)',Red:'var(--recovery-low)'}[z])+'"><div class="pg-between"><b>'+z+'</b><span>'+minutes.toFixed(1)+' min</span></div><div class="pg-track"><i style="width:'+(range?Math.min(100,minutes/range[1]*100):0)+'%"></i></div><small>'+(range?'Target '+range[0]+'–'+range[1]+' min':'Target range not available')+'</small></div>';}).join('')+'<details><summary>Daily breakdown</summary>'+Array.from({length:7},(_,i)=>{const d=shift(b.start,i),w=work.filter(r=>r.date===d);return '<p class="pg-muted">'+d+' · '+['Blue','Green','Red'].map(z=>z+' '+(w.reduce((s,r)=>s+(r.type==='Strength'?0:Number(r.zoneSeconds?.[z])||0),0)/60).toFixed(1)).join(' / ')+' min</p>';}).join('')+'</details></section>';}
function history(){return '<section class="pg-card"><h2>Workout history</h2>'+((S.liveWorkoutHistory||[]).length?(S.liveWorkoutHistory||[]).slice().reverse().map(w=>'<button class="pg-history" onclick="Progress.workout(\''+e(w.id)+'\')"><span><b>'+e(w.date)+' · '+e(w.type)+'</b><small>'+Math.round(w.elapsed/60)+' min · Effort '+e(w.rpe)+'/10</small></span><span>›</span></button>').join(''):'<p class="pg-muted">Your saved workouts will appear here.</p>')+'</section>';}
function workout(){const w=(S.liveWorkoutHistory||[]).find(w=>w.id===detail);if(!w){detail=null;return progress();}return '<div class="pg-page"><button class="method-secondary" onclick="Progress.workout(null)">‹ Progress</button><h1>'+e(w.type)+' workout</h1><p>'+e(w.date)+' · '+Math.round(w.elapsed/60)+' minutes</p><section class="pg-card"><h2>Heart rate</h2>'+sampleChart(w)+'<p class="pg-muted">'+(w.samples?.length||0)+' recorded samples · '+e(w.activeZones?.model_version||w.model_version||'Recorded model')+'</p></section><section class="pg-card"><h2>Zone minutes</h2>'+['Blue','Green','Red'].map(z=>'<p>'+z+' · '+((Number(w.zoneSeconds?.[z])||0)/60).toFixed(1)+' min</p>').join('')+'<p>Effort '+e(w.rpe)+'/10 · Performance '+e(w.performance)+'/10</p><p>'+e(w.notes||'No notes')+'</p></section><section class="pg-card"><h2>Intervals</h2>'+((w.intervalHistory||[]).map(i=>'<p>'+e(i.methodId)+' · '+(i.completed?'Completed':'Stopped early')+'</p>').join('')||'<p class="pg-muted">No interval completion records.</p>')+'</section></div>';}
function sampleChart(w){const a=w.samples||[];if(!a.length)return '<p class="pg-muted">No HR samples recorded.</p>';const min=Math.min(...a.map(s=>s.bpm)),max=Math.max(...a.map(s=>s.bpm));return '<svg class="pg-chart" viewBox="0 0 320 110" role="img" aria-label="Workout heart-rate chart"><polyline fill="none" stroke="var(--trn-blue)" stroke-width="2" points="'+a.map((s,i)=>(12+i/(a.length-1||1)*296)+','+(94-(s.bpm-min)/(max-min||1)*70)).join(' ')+'"/></svg><p class="pg-muted">'+min+'–'+max+' bpm · samples in recorded order</p>';}

function progress(){return '<div class="pg-page"><p class="lib-kicker">The Engine</p><h1>Progress</h1><p class="pg-muted">Your recovery, physiology and training over time.</p>'+controls()+cards(S.progressUi.date,S.progressUi.period)+weekly()+targetHistory()+history()+'<p class="pg-muted">WHOOP HRV is shown in raw RMSSD milliseconds. Higher HRV or lower resting HR alone does not establish improved fitness. Measurements from other protocols need separate baselines.</p></div>';}
function home(){const d=S.selectedDate||today(),reading=window.EngineHome?EngineHome.selection(records(),d,today()):{row:records().find(r=>r.date===d)||{},date:d},row=reading.row,z=LiveWorkout.calculatedZones();return '<div class="pg-page"><p class="lib-kicker">The Engine</p><h1>Today</h1><label class="pg-date">View day <input aria-label="Home date" type="date" max="'+today()+'" value="'+e(d)+'" onchange="Progress.homeDate(this.value)"></label>'+(reading.stale?'<p class="pg-muted">Latest WHOOP reading: '+e(reading.date)+'. Today’s reading is not available yet.</p>':'')+(window.EngineApp?'<button class="method-secondary" onclick="'+(S.settings.whoop?.connected?'EngineApp.refreshWhoop()':"setTab('me')")+'">'+(S.settings.whoop?.connected?'Refresh WHOOP':'Connect WHOOP')+'</button>':'')+'<div class="pg-cards">'+defs.map(([k,label,unit])=>'<section class="pg-card"><h2>'+label+'</h2><div class="pg-value">'+fmt(row[k],k)+' <small>'+unit+'</small></div><p class="pg-muted">'+e(row[k]!=null?row.source||'Manual WHOOP entry':'Not recorded')+'</p></section>').join('')+'</div><section class="pg-card"><h2>Today’s cardio zones</h2><p>'+(!z?'Enter your maximum heart rate in Settings.':['Blue '+z.blue+'–'+(z.green-1),'Green '+z.green+'–'+(z.red-1),'Red '+z.red+'–'+z.max].join(' · ')+' bpm')+'</p><p class="pg-muted">'+(z?(z.estimated?'Estimated Karvonen · ':'')+(z.recovery==null?'Baseline · no current recovery':'Adjusted using today’s recovery · StrengthSide model'):'')+'</p></section><button class="method-load" onclick="setTab(\'training\')">Start training</button><button class="method-secondary" onclick="setTab(\'progress\')">View trends and history</button>'+weekly(d)+'</div>';}

function csv(text){const out=[],row=[];let value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++;}else quoted=!quoted;}else if(!quoted&&(c===','||c==='\n'||c==='\r')){row.push(value);value='';if(c!==','){if(c==='\r'&&text[i+1]==='\n')i++;if(row.some(v=>v.trim()))out.push(row.splice(0));else row.length=0;}}else value+=c;}if(quoted)throw Error('Unclosed quote in CSV.');row.push(value);if(row.some(v=>v.trim()))out.push(row);if(out.length<2)throw Error('CSV needs column headers and at least one row.');const head=out.shift().map(s=>s.replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[^a-z0-9]/g,''));return out.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])));}
function cycleDay(c){if(!c?.start)return null;const offset=/^([+-])(\d{2}):(\d{2})$/.exec(c.timezone_offset||'');if(offset&&Number.isFinite(Date.parse(c.start))){const minutes=(Number(offset[2])*60+Number(offset[3]))*(offset[1]==='-'?-1:1);return day(new Date(Date.parse(c.start)+minutes*60000).toISOString());}return day(c.start);}
function normalize(input){const raw=Array.isArray(input)?input:input.recoveries?.records||input.recoveries||input.records; if(!Array.isArray(raw))throw Error('Choose a WHOOP CSV or JSON array of dated measurements.');const cycles=input.cycles?.records||input.cycles||[],byCycle=new Map(Array.isArray(cycles)?cycles.map(c=>[c.id,c]):[]);const result=[];let skipped=0;const get=(r,keys)=>keys.map(k=>r[k]).find(v=>v!=null&&v!=='');for(const r of raw){if(r.score_state&&r.score_state!=='SCORED'){skipped++;continue;}const s=r.score||r,d=day(get(r,['date','cycle_start','cyclestarttime','cyclestart','start'])||cycleDay(byCycle.get(r.cycle_id)));if(!d||d>today()){skipped++;continue;}const n={date:d,source:'WHOOP import',recovery:importedNumber(get(s,['recovery','recovery_score','recoveryscore'])),hrv:importedNumber(get(s,['hrv','hrv_rmssd_milli','heartratevariabilityms','hrvms'])),rhr:importedNumber(get(s,['rhr','resting_heart_rate','restingheartratebpm','restingheartrate'])),sleep:importedNumber(get(s,['sleep','sleep_hours','sleephours'])),steps:importedNumber(get(s,['steps','stepcount']))};const sleepMinutes=importedNumber(get(s,['asleepdurationmin','sleepdurationmin']));if(n.sleep==null&&sleepMinutes!=null)n.sleep=sleepMinutes/60;let count=0;for(const [k,, ,min,max] of defs){if(n[k]!=null){if(!Number.isFinite(n[k])||n[k]<min||n[k]>max||(k==='hrv'&&n[k]===0))throw Error('Invalid '+k+' on '+d+'. Nothing was imported.');count++;}}if(!count){skipped++;continue;}result.push(n);}if(!result.length)throw Error('No valid dated HRV/RHR/recovery rows found. API recovery JSON needs matching cycles to identify physiological dates.');return {rows:result,skipped};}
window.Progress={records,bounds,average,normalize,csv,
period(p){S.progressUi.period=p;save();render();},date(d){if(day(d)&&d<=today()){S.progressUi.date=d;save();render();}},homeDate(d){if(day(d)&&d<=today()){S.selectedDate=d;S.progressUi.date=d;save();render();}},move(n){const u=S.progressUi,b=bounds(u.period,u.date);this.date(n<0?shift(b.start,-1):shift(b.end,1));},workout(id){detail=id;render();},
async importFile(f){if(!f)return;try{if(f.size>10*1024*1024)throw Error('Choose a file smaller than 10 MB.');const text=await f.text(),parsed=normalize(f.name.toLowerCase().endsWith('.csv')?csv(text):JSON.parse(text)),map=new Map((S.whoopHistory||[]).map(r=>[r.date,r]));for(const r of parsed.rows){const old=map.get(r.date)||{};map.set(r.date,{...old,...Object.fromEntries(Object.entries(r).filter(([k,v])=>v!=null))});}S.whoopHistory=[...map.values()].sort((a,b)=>a.date.localeCompare(b.date));for(const r of parsed.rows){const c=S.checkin[r.date]||(S.checkin[r.date]={});for(const [k,key] of [['recovery','whoopRecovery'],['hrv','hrv'],['rhr','restingHr'],['sleep','sleepHours'],['steps','steps']])if(r[k]!=null)c[key]=r[k];}S.whoopImport={at:new Date().toISOString(),source:'WHOOP export',model_version:'whoop-history-v1',count:parsed.rows.length};notice=parsed.rows.length+' rows imported; '+parsed.skipped+' skipped. Existing workouts preserved.';save();}catch(err){notice=err.message;}render();},
manual(event){event.preventDefault();const f=new FormData(event.target),d=day(f.get('date'));if(!d||d>today())return;const row={date:d,source:'Manual WHOOP entry'};for(const [k,,,min,max] of defs){const n=number(f.get(k));if(n!=null&&(n<min||n>max||(k==='hrv'&&n===0))){alert('Check '+k);return;}row[k]=n;}const c=S.checkin[d]||(S.checkin[d]={});Object.assign(c,{whoopRecovery:row.recovery,hrv:row.hrv,restingHr:row.rhr,sleepHours:row.sleep,steps:row.steps});S.whoopHistory=(S.whoopHistory||[]).filter(r=>r.date!==d);S.selectedDate=d;notice='Measurement saved.';save();render();},
