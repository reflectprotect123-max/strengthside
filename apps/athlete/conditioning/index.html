function syncFab() {
  const layer = document.getElementById('fabLayer');
  if (!layer) return;
  const show = !S.loggerOpen;
  layer.classList.toggle('hidden', !show);
  layer.classList.toggle('open', !!S.fabOpen);
  layer.classList.toggle('fab-layer--training', S.tab === 'training');
}

function fabAction(kind) {
  S.fabOpen = false;
  save();
  syncFab();
  if (kind === 'goal') {
    const title = window.prompt('Goal title');
    if (title && title.trim()) {
      S.goals.push({ id: String(Date.now()), title: title.trim(), created: today() });
      save();
      render();
    }
    return;
  }
  if (kind === 'session') {
    S.tab = 'library';
    if (window.LibraryView) LibraryView.createEngine();
    else render();
    return;
  }
  if (kind === 'coach') {
    openCoachSheet();
  }
}

function openCoachSheet() {
  const sheet = document.getElementById('coachSheet');
  if (!sheet) return;
  sheet.classList.remove('hidden');
  sheet.setAttribute('aria-hidden', 'false');
  renderCoachSheetLog();
}

function closeCoachSheet() {
  const sheet = document.getElementById('coachSheet');
  if (!sheet) return;
  sheet.classList.add('hidden');
  sheet.setAttribute('aria-hidden', 'true');
}

function renderCoachSheetLog() {
  const log = document.getElementById('coachSheetLog');
  if (!log) return;
  log.innerHTML = (S.coachHistory || [])
    .map((m) => `<div class="msg ${m.role}">${esc(m.content)}</div>`)
    .join('');
  log.scrollTop = log.scrollHeight;
}

function render() {
  const root = document.getElementById('app');
  const map = {
    home: homeHtml,
    training: trainingTabHtml,
    library: libraryHtml,
    me: meHtml,
    settings: meHtml,
  };
  if (S.tab === 'chat') S.tab = 'home';
  root.innerHTML = (map[S.tab] || homeHtml)();

  document.querySelectorAll('[data-tab]').forEach((b) => {
    b.classList.toggle('active', b.dataset.tab === S.tab);
  });

  const shell = document.getElementById('shell');
  if (shell) shell.classList.toggle('shell--training', S.tab === 'training');

  syncFab();
  renderCoachSheetLog();
  if (window.Logger && S.loggerOpen) Logger.paint();

  if (window.Whoop) {
    if (S.tab === 'me' && !(S.settings.whoop && S.settings.whoop.email)) {
      Whoop.renderPanels();
    }
    if (S.tab === 'home' || S.tab === 'training') Whoop.autoSyncIfPossible();
  }
}

async function askCoach() {
  const input = document.getElementById('coachSheetInput');
  const status = document.getElementById('coachSheetStatus');
  const message = (input && input.value || '').trim();
  if (!message) return;
  if (!window.Whoop || !(await Whoop.token())) {
    if (status) status.textContent = 'Sign in under Me before using the coach.';
    return;
  }
  if (status) status.textContent = 'Thinking…';
  S.coachHistory = S.coachHistory || [];
  S.coachHistory.push({ role: 'user', content: message });
  input.value = '';
  render();
  renderCoachSheetLog();
  try {
    const coachUrl = (window.Whoop && typeof Whoop.fnUrl === 'function')
      ? Whoop.fnUrl('brain-coach')
      : String((window.ENGINE_CONFIG && ENGINE_CONFIG.supabaseUrl) || 'https://orysjncrksmdfabpuftd.supabase.co').replace(/\/$/, '') + '/functions/v1/brain-coach';
    const res = await fetch(coachUrl, {
      method: 'POST',
      headers: {
        authorization: 'Bearer ' + (await Whoop.token()),
        apikey: (window.ENGINE_CONFIG && ENGINE_CONFIG.supabaseAnon) || '',
        'content-type': 'application/json',
      },
      body: JSON.stringify({
        message,
        packet: HybridBrain.coachContextFromPacket(packet()),
        history: S.coachHistory.filter((m) => m.content !== '(empty reply)').slice(-8),
      }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || 'Coach request failed');
    const reply = String(body.reply || '').trim();
    if (!reply) throw new Error('Coach returned no text. Try again.');
    S.coachHistory.push({ role: 'assistant', content: reply });
    if (status) status.textContent = '';
    S.chatUnread = Math.max(0, (S.chatUnread || 0) - 1);
  } catch (err) {
    if (status) status.textContent = err.message || 'Coach failed';
  }
  save();
  render();
  renderCoachSheetLog();
}

(function(){

const defs=[['recovery','Recovery','%',0,100],['hrv','HRV','ms',0,1000],['rhr','Resting HR','bpm',1,300],['sleep','Sleep','h',0,24],['steps','Steps','',0,200000]];
const importedNumber=v=>{if(v!=null&&String(v).trim()!==''&&!Number.isFinite(Number(v)))throw Error('Invalid numeric value in import. Nothing was imported.');return number(v);};
const number=v=>v==null||String(v).trim()===''?null:Number.isFinite(Number(v))?Number(v):null;
let notice='',detail=null;
S.progressUi=S.progressUi||{period:'Weekly',date:today()};
function records(){const rows=new Map();for(const [d,c] of Object.entries(S.checkin||{})){if(!day(d))continue;rows.set(d,{date:d,recovery:number(c.whoopRecovery),hrv:number(c.hrv),rhr:number(c.restingHr),sleep:number(c.sleepHours),steps:number(c.steps),source:c.whoopSyncedAt?'WHOOP account':'Manual WHOOP entry'});}for(const r of S.whoopHistory||[])rows.set(r.date,{...rows.get(r.date),...r});return [...rows.values()].sort((a,b)=>a.date.localeCompare(b.date));}
function bounds(period,date){let start=date,end=date;if(['30 days','90 days','365 days'].includes(period))start=shift(date,1-parseInt(period));else if(period==='All')start=records()[0]?.date||date;else if(period==='Weekly'){const weekday=new Date(date+'T12:00:00Z').getUTCDay();start=shift(date,-((weekday+6)%7));end=shift(start,6);}else if(period==='Monthly'){start=date.slice(0,7)+'-01';end=shift(new Date(Date.UTC(Number(date.slice(0,4)),Number(date.slice(5,7)),1,12)).toISOString().slice(0,10),-1);}return {start,end};}

function chart(rows,k,color){const a=rows.filter(r=>Number.isFinite(r[k]));if(!a.length)return '<p class="pg-muted">No measurements in this period.</p>';const min=Math.min(...a.map(r=>r[k])),max=Math.max(...a.map(r=>r[k])),span=max-min||1;const lo=Date.parse(rows[0].date),hi=Date.parse(rows.at(-1).date),x=r=>12+((Date.parse(r.date)-lo)/(hi-lo||1))*296,y=r=>94-(r[k]-min)/span*70;return '<svg class="pg-chart" viewBox="0 0 320 110" role="img" aria-label="'+e(k)+' trend; '+a.length+' measurements"><path d="M12 94H308" stroke="var(--oled-line)"/><polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+a.map(r=>x(r)+','+y(r)).join(' ')+'"/>'+a.map(r=>'<circle cx="'+x(r)+'" cy="'+y(r)+'" r="3" fill="'+color+'"><title>'+e(r.date)+': '+fmt(r[k],k)+'</title></circle>').join('')+'</svg><div class="pg-between pg-muted"><span>'+e(rows[0].date)+'</span><span>'+e(rows.at(-1).date)+'</span></div><p class="pg-muted">Missing days have no measurement; lines connect recorded values.</p>';}
