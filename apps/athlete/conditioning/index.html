<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="hybrid-product" content="engine">
  <title>The Hybrid Engine</title>
  <style>

:root {
  --oled-bg: #000000;
  --oled-surface: #121212;
  --oled-raised: #1c1c1e;
  --oled-text: #ffffff;
  --oled-muted: #8e8e93;
  --oled-line: rgba(255, 255, 255, 0.1);
  --sleep: #9db4c8;
  --recovery-high: #16ec06;
  --recovery-mid: #ffde00;
  --recovery-low: #ff0026;
  --recovery: var(--recovery-high);
  --strain: #1ba3ff;
  --strength: #d4a574;
  --engine: #5ec4b7;
  --recovery-room: #9fd356;
  --trn-blue: #1ba3ff;
  --trn-letter-bg: #3a3a3c;
  --font-body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Barlow Condensed", ui-sans-serif, system-ui, sans-serif;
  --nav-h: 72px;
  --fab-size: 56px;
  --tap: 44px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--oled-bg);
  color: var(--oled-text);
  font: 16px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}

.shell {
  min-height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  background: var(--oled-bg);
}

.app {
  min-height: calc(100dvh - var(--nav-h));
  padding-bottom: calc(var(--fab-size) + 40px);
}

.hidden { display: none !important; }

/* ── OLED home shell ── */
.shell-screen--oled {
  padding: 0 20px 8px;
  max-width: 100%;
  min-width: 0;
  overflow-x: hidden;
}

.home-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 0 4px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(180deg, #000 70%, transparent);
}

.home-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
}

.home-mark {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--oled-text);
}

.home-brand-text b {
  display: block;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
}

.home-brand-text small {
  display: block;
  margin-top: 1px;
  color: var(--oled-muted);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.home-lockers {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
}

.home-lockers span {
  color: var(--oled-muted);
}

.home-lockers span.on {
  color: #fff;
}

.home-lockers i {
  font-style: normal;
  color: var(--oled-muted);
  opacity: 0.5;
}

.locker-card { margin-bottom: 14px; }

.locker-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.locker-switch .btn {
  min-height: 48px;
}

.home-top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.month-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: var(--tap);
  padding: 0 4px;
  color: var(--oled-muted);
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.month-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

.today-btn {
  border: 1px solid rgba(255, 255, 255, 0.42);
  border-radius: 999px;
  padding: 7px 14px;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  min-height: var(--tap);
  transition: background 0.18s var(--ease), border-color 0.18s var(--ease);
}

.today-btn:active {
  background: var(--oled-raised);
}

.bell-btn {
  position: relative;
  width: var(--tap);
  height: var(--tap);
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.bell-btn svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: var(--oled-text);
  stroke-width: 1.6;
}

.bell-badge {
  position: absolute;
  top: 6px;
  right: 2px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--oled-text);
  color: #000;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
  font-style: normal;
}

.ath-date {
  margin: 2px 0 14px;
  font-family: var(--font-display);
  font-size: clamp(22px, 5.5vw, 28px);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: rgba(255, 255, 255, 0.72);
}

.ath-athlete {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 6px;
}

.ath-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.14);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: var(--oled-muted);
}

.ath-avatar svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.ath-name {
  margin: 0;
  color: var(--oled-muted);
  font-size: 13px;
  font-weight: 500;
}

.ath-workout {
  margin: 2px 0 0;
  font-family: var(--font-display);
  font-size: clamp(20px, 5.5vw, 24px);
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.05;
}

/* ── WHOOP dials ── */
.ath-module-whoop {
  padding: 8px 0 4px;
  margin: 0 0 8px;
}

.ath-label {
  display: block;
  margin-bottom: 8px;
  color: rgba(255, 255, 255, 0.4);
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
}

.ath-zones {
  margin: 0 0 12px;
  padding: 10px 12px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.03);
}

.ath-zone-est {
  margin: 0 0 8px;
  color: rgba(255, 255, 255, 0.45);
  font-size: 12px;
  line-height: 1.35;
}

.ath-zones ul {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: rgba(255, 255, 255, 0.82);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.ath-whoop-dials,
.gauge-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: clamp(4px, 1.6vw, 8px);
  margin: 10px 0 12px;
  width: 100%;
}

.ath-whoop-dial {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.ath-whoop-dial-ring {
  position: relative;
  width: min(104px, 100%);
  aspect-ratio: 1;
  margin: 0 auto;
}

.ath-whoop-dial:nth-child(1) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 14px rgba(157, 180, 200, 0.18));
}

.ath-whoop-dial:nth-child(2) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 18px rgba(22, 242, 107, 0.28));
}

.ath-whoop-dial:nth-child(3) .ath-whoop-dial-ring {
  filter: drop-shadow(0 0 14px rgba(27, 163, 255, 0.16));
}

.ath-whoop-dial-ring svg {
  width: 100%;
  height: 100%;
  display: block;
}

.ath-whoop-dial-val {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  font-family: var(--font-display);
  font-size: clamp(22px, 7.2vw, 30px);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: #fff;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  pointer-events: none;
  text-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
}

.ath-whoop-dial-val .ath-whoop-n {
  display: block;
  line-height: 1;
}

.ath-whoop-dial-val small {
  display: block;
  font-size: clamp(10px, 3vw, 12px);
  font-weight: 650;
  opacity: 0.9;
  line-height: 1;
}

.ath-whoop-dial-lab {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: rgba(255, 255, 255, 0.5);
  text-transform: uppercase;
  text-align: center;
}

.today-call {
  margin: 4px 0 0;
  padding: 12px 0 0;
  border-top: 1px solid var(--oled-line);
}

.today-call .eyebrow {
  margin: 0 0 4px;
  color: var(--oled-muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.today-call .title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.05;
}

.today-call .meta {
  margin: 6px 0 0;
  color: var(--oled-muted);
  font-size: 13px;
  line-height: 1.45;
}

/* ── Calendar week ── */
.cal-strip {
  display: flex;
  gap: 6px;
  margin: 0 0 18px;
  padding: 2px 0;
  overflow-x: auto;
  scrollbar-width: none;
}

.cal-strip::-webkit-scrollbar { display: none; }

.cal-day {
  flex: 1 0 44px;
  min-width: 44px;
  min-height: var(--tap);
  padding: 10px 0 8px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: transparent;
  color: var(--oled-muted);
  text-align: center;
  transition: border-color 0.16s var(--ease), background 0.16s var(--ease);
}

.cal-day b {
  display: block;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 500;
  color: var(--oled-text);
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}

.cal-day.active {
  border-color: rgba(255, 255, 255, 0.22);
  background: var(--oled-surface);
}

.cal-day.active b {
  font-weight: 700;
}

.cal-dots {
  display: flex;
  justify-content: center;
  gap: 3px;
  min-height: 8px;
}

.cal-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--recovery-room);
}

.cal-dot.strength { background: var(--strength); }
.cal-dot.engine { background: var(--engine); }
.cal-dot.recovery { background: var(--recovery-room); }

/* ── Session list ── */
.home-brief {
  padding: 18px 0 8px;
  border-top: 1px solid var(--oled-line);
  margin-bottom: 8px;
}

.home-brief-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.home-brief .eyebrow {
  margin: 0;
  color: var(--oled-muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.home-pill {
  padding: 4px 8px;
  border: 1px solid var(--oled-line);
  border-radius: 999px;
  color: var(--oled-muted);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.published-list {
  display: grid;
  gap: 0;
}

.published-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--oled-line);
  min-height: var(--tap);
  width: 100%;
  text-align: left;
}

.published-item:last-child { border-bottom: 0; }

.pub-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.pub-dot.strength { background: var(--strength); }
.pub-dot.engine { background: var(--engine); }
.pub-dot.recovery { background: var(--recovery-room); }

.published-item strong {
  display: block;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.published-item small {
  display: block;
  margin-top: 2px;
  color: var(--oled-muted);
  font-size: 12px;
  text-transform: capitalize;
}

.published-item .chev {
  color: rgba(255, 255, 255, 0.35);
  font-size: 18px;
  line-height: 1;
}

.empty-day {
  color: var(--oled-muted);
  text-align: center;
  padding: 28px 8px;
  font-size: 14px;
  line-height: 1.5;
}

.home-cta {
  margin-top: 18px;
}

.btn {
  min-height: var(--tap);
  padding: 12px 16px;
  border-radius: 14px;
  border: 1px solid var(--oled-line);
  background: var(--oled-surface);
  font-weight: 650;
  transition: background 0.16s var(--ease), border-color 0.16s var(--ease);
}

.btn:active { background: var(--oled-raised); }

.btn.oled-cta,
.create-session-btn {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.42);
  background: #fff;
  color: #000;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
  box-shadow: none;
}

.btn.oled-cta:active,
.create-session-btn:active {
  background: #f2f2f2;
}

@media (hover: hover) {
  .today-btn:hover { background: rgba(255, 255, 255, 0.06); }
  .btn.oled-cta:hover,
  .create-session-btn:hover {
    background: #f2f2f2;
    border-color: #fff;
  }
}

/* ── FAB ── */
.fab-layer {
  position: fixed;
  right: max(20px, calc(50% - 215px + 20px));
  bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
}

.fab-layer.open .fab-menu { display: flex; }
.fab-layer.open .fab-scrim { display: block; }

.fab-scrim {
  display: none;
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(0, 0, 0, 0.45);
}

.fab-menu {
  display: none;
  flex-direction: column;
  background: var(--oled-raised);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  overflow: hidden;
  min-width: 210px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
}

.fab-menu button {
  text-align: left;
  padding: 14px 18px;
  font-size: 15px;
  border-bottom: 1px solid var(--oled-line);
  min-height: var(--tap);
}

.fab-menu button:last-child { border-bottom: 0; }
.fab-menu button:active { background: #2c2c2e; }

.fab {
  width: var(--fab-size);
  height: var(--fab-size);
  border-radius: 50%;
  background: #fff;
  color: #000;
  font-size: 30px;
  font-weight: 300;
  line-height: 1;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  transition: transform 0.2s var(--ease);
}

.fab-layer.open .fab { transform: rotate(45deg); }

/* ── Bottom nav ── */
.bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 430px;
  height: var(--nav-h);
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(14px);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 20;
}

.bottom-nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--oled-muted);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  position: relative;
  min-height: var(--tap);
}

.bottom-nav button svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  opacity: 0.85;
}

.bottom-nav button.active {
  color: var(--oled-text);
}

.bottom-nav button.active svg {
  opacity: 1;
}

.nav-badge {
  position: absolute;
  top: 8px;
  right: calc(50% - 22px);
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--oled-text);
  color: #000;
  font-style: normal;
  font-size: 10px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

/* ── Coach sheet ── */
.coach-sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  align-items: end;
  justify-items: center;
}

.coach-sheet-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
}

.coach-sheet-panel {
  position: relative;
  width: min(430px, 100%);
  max-height: 78dvh;
  background: var(--oled-surface);
  border-radius: 20px 20px 0 0;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-bottom: 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
}

.coach-sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.coach-sheet-head strong {
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 0.04em;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--oled-raised);
  font-size: 22px;
  line-height: 1;
}

.coach-log {
  flex: 1;
  overflow: auto;
  max-height: 42dvh;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.msg {
  padding: 10px 12px;
  border-radius: 14px;
  max-width: 92%;
  font-size: 14px;
  line-height: 1.45;
}

.msg.user {
  align-self: flex-end;
  background: rgba(255, 255, 255, 0.08);
}

.msg.assistant {
  align-self: flex-start;
  background: var(--oled-raised);
  border: 1px solid var(--oled-line);
}

.coach-compose {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: end;
}

.coach-compose textarea {
  background: #0a0a0a;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 14px;
  padding: 10px 12px;
  resize: none;
  width: 100%;
}

.btn.primary {
  border: 1px solid rgba(255, 255, 255, 0.42);
  background: #fff;
  color: #000;
  font-weight: 700;
}

.stub {
  color: var(--oled-muted);
  font-size: 13px;
  margin: 8px 0 0;
}

/* ── Other tabs ── */
.page {
  padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 24px;
}

.page h1 {
  font-family: var(--font-display);
  font-size: clamp(26px, 6.5vw, 32px);
  margin: 8px 0 16px;
  letter-spacing: -0.02em;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--oled-muted);
  font-weight: 650;
}

.card {
  background: var(--oled-surface);
  border: 1px solid var(--oled-line);
  border-radius: 16px;
  padding: 16px;
  margin: 12px 0;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 8px 0;
}

.field input,
.field textarea {
  background: #0a0a0a;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 12px;
  padding: 10px 12px;
  width: 100%;
  min-height: var(--tap);
}

.field label {
  color: var(--oled-muted);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.page-lead {
  margin: 0 0 16px;
  max-width: 34ch;
}

.signin-card {
  margin-top: 4px;
}

.signin-msg {
  margin-top: 12px;
  color: #f87171;
}

.account-compact .account-email {
  margin: 0;

/* STRENGTHSIDE-DESIGNED: reference layout, using the existing Engine palette. */
.method-builder { max-width: 440px; margin: 0 auto; color: var(--oled-text); padding-bottom: 100px; font-family: Arial, sans-serif; }
.method-top { height: 64px; display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; border-bottom: 1px solid var(--oled-line); padding: 0 16px; }
.method-top h1 { text-align: center; font: 600 14px Arial, sans-serif; margin: 0; letter-spacing: 0; text-transform: none; }
.method-top button { background: none; border: 0; color: var(--oled-text); font-size: 24px; padding: 6px 0; }
.method-content { padding: 18px 16px; }
.method-zones { background: var(--oled-surface); border-radius: 5px; padding: 20px 16px; margin-bottom: 18px; color: var(--oled-muted); font-size: 15px; }
.method-builder summary, .method-sheet summary { cursor: pointer; list-style: none; font-weight: 600; display: flex; justify-content: space-between; gap: 16px; }
.method-builder summary::-webkit-details-marker, .method-sheet summary::-webkit-details-marker { display:none; }
.method-builder summary::after, .method-sheet summary::after { content: '⌄'; font-weight: 400; }
.method-zones p { font-size: 13px; line-height: 1.6; margin: 14px 0 0; }
.method-choose { display: flex; justify-content: space-between; align-items: center; margin: 0 0 20px; }
.method-choose h2 { font: 600 19px Arial, sans-serif; margin: 0; }
.method-choose button { padding: 8px 10px; background: none; border: 1px solid var(--oled-text); border-radius: 8px; color: var(--oled-text); font: 600 13px Arial, sans-serif; }
.method-tabs { display: grid; grid-template-columns: repeat(3,1fr); border-radius: 6px; background: var(--oled-surface); padding: 3px; }
.method-tabs button { border: 0; background: none; color: var(--oled-muted); border-radius: 4px; padding: 8px 0; font: 14px Arial, sans-serif; }
.method-tabs button[aria-selected="true"] { background: var(--zone); color: #000; font-weight: 600; }
.method-intro { color: var(--oled-muted); font-size: 14px; line-height: 1.3; margin: 18px 2px 22px; }
.method-card { display: block; width: 100%; text-align: left; border: 0; background: var(--oled-surface); color: var(--oled-text); border-radius: 12px; padding: 18px 16px; margin: 0 0 14px; font-family: Arial, sans-serif; }
.method-card-title { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; font-size: 17px; margin-bottom: 6px; }
.method-card-title > span { color: var(--oled-muted); font-weight: 400; }
.method-card-target { display: block; color: var(--zone); font-size: 13px; line-height: 1.55; }
.method-card-goal { display: block; color: var(--oled-muted); font-size: 14px; line-height: 1.3; margin-top: 12px; }
.method-overlay { position: fixed; inset: 0; background: #0009; z-index: 60; display: flex; justify-content: center; align-items: flex-end; }
.method-sheet { width: 100%; max-width: 440px; max-height: calc(100dvh - 72px); overflow-y: auto; overscroll-behavior: contain; border: 1px solid var(--oled-line); border-bottom: 0; background: #000; border-radius: 16px 16px 0 0; padding: 0 16px 28px; font-family: Arial, sans-serif; color: var(--oled-text); position: relative; }
.method-handle { width: 34px; height: 4px; margin: 12px auto 20px; background: var(--oled-muted); border-radius: 4px; }
.method-close { position: sticky; top: 6px; float: right; background: #000; color: #fff; border: 0; font-size: 25px; width: 32px; height: 32px; z-index: 2; }
.method-sheet > h2 { font-size: 19px; font-weight: 600; margin: 0 40px 16px 0; line-height: 32px; }
.method-graph { margin: 8px 0 18px; }
.method-graph svg { width: 100%; height: 90px; display: block; }
.method-graph figcaption { text-align: right; color: var(--oled-muted); font-size: 12px; margin-top: 8px; }
.method-instructions { border: 1px solid var(--oled-line); border-radius: 8px; padding: 16px 12px; margin: 0 0 18px; }
.method-instructions h3 { font-size: 16px; line-height: 1.3; margin: 0 0 12px; }
.method-instructions p, .method-exercises p, .method-extras p { font-size: 14px; line-height: 1.5; color: var(--oled-muted); margin: 0 0 12px; }
.method-target-line { font-size: 13px; line-height: 1.6; color: var(--oled-muted); }
.method-exercises { padding: 16px 12px; background: var(--oled-surface); border-radius: 8px; margin-bottom: 28px; font-size: 16px; }
.method-exercises p { margin: 14px 0 0; }
.method-update { font-size: 17px; margin: 0 0 16px; }
.method-settings { border-radius: 10px; padding: 14px 12px; background: #080808; }
.method-field { margin: 0 0 22px; }
.method-field label, .method-total label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.method-field select, .method-total > div { width: 100%; background: var(--oled-surface); color: var(--oled-text); border: 1px solid var(--oled-line); border-radius: 8px; padding: 15px 12px; font: 14px Arial,sans-serif; color-scheme: dark; }
.method-total { margin: 4px 0 14px; }
.method-load { width: 100%; color: #000; background: var(--oled-text); border: 0; border-radius: 6px; padding: 13px 12px; font: 600 14px Arial,sans-serif; margin-top: 8px; }
.method-secondary { width: 100%; color: var(--oled-text); background: none; border: 1px solid var(--oled-line); padding: 13px; border-radius: 6px; margin-top: 12px; }
.method-extras { font-size: 13px; color: var(--oled-muted); margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--oled-line); }
.method-sheet .lib-field { margin: 16px 0; }
.method-sheet .lib-field label { font-family: Arial,sans-serif; font-size: 13px; }
body:has(.method-overlay) { overflow: hidden; }
body:has(.method-builder) #fabLayer { display:none; }
.method-alert-sheet > h2 { text-align:center; color:var(--oled-text); }
.method-alert-row { display:flex; justify-content:space-between; align-items:center; width:100%; background:none; border:0; padding:19px 0; color:var(--oled-text); font:14px Arial,sans-serif; text-align:left; }
.method-alert-row span { color:var(--engine); }
.method-alert-row:disabled { opacity:.45; }
.method-alert-row:disabled span { color:var(--oled-muted); font-size:11px; }
.method-builder button:focus-visible, .method-sheet button:focus-visible, .method-sheet select:focus-visible { outline: 2px solid var(--engine); outline-offset: 3px; }
@media(min-width:600px) { .method-overlay { align-items: center; } .method-sheet { max-height: 88dvh; border-bottom: 1px solid var(--oled-line); border-radius:16px; } }

    const title = piece.title || (Eng && Eng.machineTitle(machine)) || machine;
    t.blocks.push({
      id: nid('blk'),
      kind: 'engine',
      title,
      machine,
      structure: piece.structure || 'intervals',
      effort: piece.effort || 'medium',
      workSec: Math.max(1, Number(piece.workSec) || 15),
      restSec: Math.max(0, Number(piece.restSec) || 45),
      rounds: Math.max(1, Number(piece.rounds) || 8),
      typedWatts: piece.typedWatts == null || piece.typedWatts === '' ? null : Number(piece.typedWatts),
      typedSplitSec: piece.typedSplitSec == null || piece.typedSplitSec === '' ? null : Number(piece.typedSplitSec),
      typedRpm: piece.typedRpm == null || piece.typedRpm === '' ? null : Number(piece.typedRpm),
    });
    return st;
  }

  function addCircuit(state, tid, { title, instructions, catalogId } = {}) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    let instr = instructions || '';
    let name = title || 'Circuit';
    if (catalogId) {
      const hit = st.catalog.circuits.find((c) => c.id === catalogId);
      if (hit) {
        name = hit.title;
        instr = hit.instructions || instr;
      }
    }
    t.blocks.push({
      id: nid('blk'),
      kind: 'circuit',
      title: name,
      instructions: instr,
      track: 'for_completion',
    });
    return st;
  }

  function addExercise(state, tid) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    return st;
  }

  function removeBlock(state, tid, bid) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    t.blocks = t.blocks.filter((b) => b.id !== bid);
    return st;
  }

  function moveBlock(state, tid, bid, dir) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    const i = t.blocks.findIndex((b) => b.id === bid);
    const j = i + (dir < 0 ? -1 : 1);
    if (i < 0 || j < 0 || j >= t.blocks.length) return st;
    const tmp = t.blocks[i];
    t.blocks[i] = t.blocks[j];
    t.blocks[j] = tmp;
    return st;
  }

  function patchBlock(state, tid, bid, patch) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    const b = t.blocks.find((x) => x.id === bid);
    if (!b) return st;
    Object.assign(b, patch);
    if (Array.isArray(b.columns)) b.columns = b.columns.filter((k) => k && k !== 'none');
    return st;
  }

  function linkSuperset(state, tid, aId, bId) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    const a = t.blocks.find((x) => x.id === aId);
    const b = t.blocks.find((x) => x.id === bId);
    if (!a || !b || a.kind !== 'lift' || b.kind !== 'lift') return st;
    const gid = a.groupId || b.groupId || nid('ss');
    a.groupId = gid;
    b.groupId = gid;
    return st;
  }

  function unlinkSuperset(state, tid, bid) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    const b = t.blocks.find((x) => x.id === bid);
    if (b) b.groupId = null;
    return st;
  }

  function lettered(tpl) {
    const blocks = (tpl.blocks || []).map((b) => ({ ...b }));
    let code = 65;
    let i = 0;
    while (i < blocks.length) {
      const b = blocks[i];
      if (b.kind !== 'lift') {
        b.letter = String.fromCharCode(code++);
        i += 1;
        continue;
      }
      const run = [b];
      let j = i + 1;
      if (b.groupId) {
        while (j < blocks.length && blocks[j].kind === 'lift' && blocks[j].groupId === b.groupId) {
          run.push(blocks[j]);
          j += 1;
        }
      }
      const L = String.fromCharCode(code++);
      if (run.length === 1) run[0].letter = L;
      else run.forEach((x, n) => { x.letter = L + String(n + 1); });
      i = j;
    }
    return blocks;
  }

  function itemsFromInstructions(text) {
    const lines = String(text || '')
      .split(/\n+/)
      .map((s) => s.replace(/^\s*\d+[.)]\s*/, '').trim())
      .filter(Boolean);
    return lines.map((text, i) => ({ n: i + 1, text }));
  }

  function rxFor(block) {
    const sets = Math.max(1, Number(block.setCount) || 3);
    const cols = block.columns || ['reps'];
    const repBit = cols[0] === 'reps_range' ? '8-12' : cols[0] === 'reps' ? '8' : '';
    if (cols.includes('meters')) return repBit ? `${sets} x ${repBit} m` : `${sets} x m`;
    if (cols[0] === 'reps' || cols[0] === 'reps_range') return `${sets} x ${repBit}`;
    if (cols[0] === 'seconds' || cols[0] === 'time_mmss') return `${sets} x time`;
    return `${sets} sets`;
  }

  function sectionFor(block) {
    if (block.kind === 'engine') return 'The Engine';
    if (block.kind === 'circuit') {
      if (/recover|cool/i.test(block.title || '')) return 'Recovery';
      return 'Conditioning';
    }
    return 'Strength/Power';
  }

  function compile(tpl) {
    const blocks = [];
    let lastSection = '';
    for (const b of lettered(tpl)) {
      if (b.kind === 'lift') continue;
      const section = sectionFor(b);
      if (section !== lastSection) {
        blocks.push({ kind: 'section', label: section.toUpperCase() });
        lastSection = section;
      }
      if (b.kind === 'engine') {
        const Eng = root.HybridEngine;
        blocks.push({
          kind: 'engine',
          letter: b.letter,
          title: b.title,
          machine: b.machine,
          structure: b.structure,
          effort: b.effort,
          workSec: b.workSec,
          restSec: b.restSec,
          rounds: b.rounds,
          typedWatts: b.typedWatts,
          typedSplitSec: b.typedSplitSec,
          typedRpm: b.typedRpm, workTarget: b.workTarget, recoveryTarget: b.recoveryTarget, workIntent: b.workIntent, manualNoProgression: b.manualNoProgression,
          prescription: Eng ? Eng.rxText(b) : `${b.rounds} rounds`,
          section,
        });
      } else if (b.kind === 'circuit') {
        const recovery = /recover|cool/i.test(b.title || '');
        blocks.push({
          kind: recovery ? 'recovery' : 'warmup',
          letter: b.letter,
          title: b.title,
          items: itemsFromInstructions(b.instructions),
          bullets: recovery ? itemsFromInstructions(b.instructions).map((x) => x.text) : [],
          footer: 'For Completion',
          section,
        });
      }
    }
    return {
      id: tpl.id,
      title: tpl.title || 'Engine session',
      instructions: tpl.instructions || '',
      blocks,
      dots: {},
    };
  }

  function assignDate(state, tid, date) {
    const st = clone(ensure(state));
    if (!st.templates.some((t) => t.id === tid)) return st;
    st.assignments[date] = tid;
    return st;
  }

  function unassignDate(state, date) {
    const st = clone(ensure(state));
    delete st.assignments[date];
    return st;
  }

  function planForDate(state, date, fallback) {
    const st = ensure(state);
    const tid = st.assignments[date];
    const tpl = tid && st.templates.find((t) => t.id === tid);
    if (!tpl) return fallback || null;
    const plan = compile(tpl);
    plan.dots = Object.fromEntries(Object.keys(st.assignments).map((d) => [d, true]));
    return plan;
  }

  function createCatalogExercise(state, { title, columns } = {}) {
    const st = clone(ensure(state));
    const cols = (columns || ['reps']).filter((k) => k && k !== 'none');
    st.catalog.exercises.unshift({
      id: nid('ex'),
      title: String(title || 'Exercise').trim() || 'Exercise',
      columns: cols.length ? cols : ['reps'],
    });
    return st;
  }

  function createCatalogCircuit(state, { title, instructions } = {}) {
    const st = clone(ensure(state));
    st.catalog.circuits.unshift({
      id: nid('ci'),
      title: String(title || 'Circuit').trim() || 'Circuit',
      track: 'for_completion',
      instructions: instructions || '',
    });
    return st;
  }

  function searchCatalog(state, tab, q) {
    const st = ensure(state);
    const needle = String(q || '').trim().toLowerCase();
    const list = tab === 'circuits' ? st.catalog.circuits : st.catalog.exercises;
    if (!needle) return list.slice();
    return list.filter((x) => x.title.toLowerCase().includes(needle));
  }

  function deleteTemplate(state, tid) {
    const st = clone(ensure(state));
    st.templates = st.templates.filter((t) => t.id !== tid);
    for (const [d, id] of Object.entries(st.assignments)) {
      if (id === tid) delete st.assignments[d];
    }
    return st;
  }

  function trackLabel(key) {
    const hit = TRACK.find((t) => t.key === key);
    return hit ? hit.label : key;
  }

  const HybridLibrary = {
    TRACK,
    emptyState,
    ensure,
    template,
    createTemplate,
    patchTemplate,
    deleteTemplate,
    addCircuit,
    addEnginePiece,
    addExercise,
    removeBlock,
    moveBlock,
    patchBlock,
    linkSuperset,
    unlinkSuperset,
    lettered,
    compile,
    assignDate,
    unassignDate,
    planForDate,
    createCatalogExercise,
    createCatalogCircuit,
    searchCatalog,
    trackLabel,
  };

  root.HybridLibrary = HybridLibrary;
})(typeof window !== 'undefined' ? window : globalThis);

  <script>(function (root) {

  function pickerHtml() {
    const u = ui();

      ? `<button type="button" class="lib-create" onclick="LibraryView.newCirc()"><span class="lib-plus">+</span> Create New Circuit</button>`
      : `<button type="button" class="lib-create" onclick="LibraryView.newEx()"><span class="lib-plus">+</span> Create New Exercise</button>`;
    const n = selected.size;
    return `
      <div class="shell-screen shell-screen--library">

        </div>
        <div class="lib-search"><input value="${esc(u.q || '')}" placeholder="Search exercises and circuits" oninput="LibraryView.search(this.value)"></div>

    stopClock();
    if (typeof root.syncFab === 'function') root.syncFab();
    if (typeof root.render === 'function') root.render();
  }

  function timerState() {
    if (!root.S.timer) root.S.timer = HybridTimer.create();
    return root.S.timer;
  }

  function persistTimer(next) {
    if (typeof window !== 'undefined' && window.matchMedia) {
      next.reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
    root.S.timer = next;
    if (typeof root.save === 'function') root.save();
    paint();
  }

  let audioCtx = null;
  function beep(kind) {
    if (lastBeep === kind) return;
    lastBeep = kind;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = audioCtx || new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g);
      g.connect(audioCtx.destination);
      o.frequency.value = kind === 'go' || kind === 'done' ? 880 : 660;
      g.gain.value = 0.06;
      o.start();
      o.stop(audioCtx.currentTime + 0.08);
    } catch (_) { /* no audio */ }
  }

  function startClock() {
    stopClock();
    clockTimer = setInterval(() => {
      const clock = document.getElementById('logClock');
      if (clock) clock.textContent = elapsed();
      const t = timerState();
      const now = Date.now();
      if(root.Standalone) root.Standalone.audioTick();
      const s = session();
      if (s && s.phase === 'block' && root.HybridEngine) {
        const page = HybridSession.currentPage(s);
        const log = page && s.logs[page.id];
        if (page && page.logMode === 'engine' && log && log.engine) {
          const next = HybridEngine.tick(log, now);
          if (next !== log) {
            persistEngine(next);
            return;
          }
          const clock = document.getElementById('engClock');
          if (clock) {
            const ends = log.engine.phase === 'work' ? log.engine.workEndsAt : log.engine.restEndsAt;
            if (ends) clock.textContent = remainLabel(ends, now);
          }
        }
      }
      const next = HybridTimer.tick(t, now);
      if (next !== t) {
        if (next.view === 'idle' && t.view !== 'idle') beep('done');
        lastBeep = '';
        persistTimer(next);
        return;
      }
      const snap = HybridTimer.snapshot(t, now);
      if (snap.countInLabel && snap.countInLabel !== lastBeep) {
        beep(snap.countInLabel === 'GO!' ? 'go' : snap.countInLabel);
      } else if (snap.roundLabel && snap.roundLabel !== lastBeep) {
        beep(snap.roundLabel);
      }
      patchLiveTimer(snap);
    }, 100);
  }

  function patchLiveTimer(snap) {
    if (snap.view !== 'countIn' && snap.view !== 'running') return;
    if (snap.display === 'docked') {
      const dock = document.getElementById('logTimerDock');
      if (!dock) return;
      const wrap = document.createElement('div');
      wrap.innerHTML = timerDockHtml();
      const node = wrap.firstElementChild;
      if (node) dock.replaceWith(node);
      return;
    }
    const full = document.getElementById('logTimerFull');
    if (!full) return;
    const wrap = document.createElement('div');
    wrap.innerHTML = runHtml(snap);
    const node = wrap.firstElementChild;
    if (node) full.replaceWith(node);
  }

  function stopClock() {
    if (clockTimer) clearInterval(clockTimer);
    clockTimer = 0;
  }

  function dotsHtml(s) {
    return s.pages.map((p, i) => {
      const ids = HybridSession.logIdsForPage(p);
      const done = p.logMode === 'complete' || p.logMode === 'engine'
        ? !!(s.logs[p.id] && s.logs[p.id].completed)
        : p.logMode === 'doneHub' ? false
        : ids.some((id) => s.logs[id] && s.logs[id].sets && s.logs[id].sets.some((r) => r.logged));
      const cur = s.phase === 'block' && i === s.blockIndex;
      return `<span class="log-dot${cur ? ' current' : done ? ' done' : ''}"></span>`;
    }).join('');
  }

  function headerHtml(s) {
    const page = s.phase === 'block' ? HybridSession.currentPage(s) : null;
    if (page && page.logMode === 'engine') {
      return `
      <div class="log-top">
        <button type="button" class="log-back-x" onclick="Logger.chevron()" aria-label="Close">⌄</button>
        <div class="log-dots">${dotsHtml(s)}</div>
        <div class="log-clock" id="logClock">${elapsed()}</div>
      </div>
      <div class="log-totals log-totals--engine">
        <div class="eng-eyebrow">The Engine</div>
      </div>`;
    }
    const t = HybridSession.totals(s);
    return `
      <div class="log-top">
        <button type="button" class="log-back-x" onclick="Logger.chevron()" aria-label="Close">⌄</button>
        <div class="log-dots">${dotsHtml(s)}</div>
        <div class="log-clock" id="logClock">${elapsed()}</div>
      </div>
      <div class="log-totals">
        <div><b>${t.reps}</b><span>REPS</span></div>
        <div><b>${t.kg}</b><span>KG</span></div>
      </div>`;
  }

  function ringSvg(progress, inner) {
    const c = 2 * Math.PI * 46;
    const off = c * (1 - Math.max(0, Math.min(1, progress || 0)));
    return `<svg class="tm-ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/>
      <circle cx="50" cy="50" r="46" fill="none" stroke="#16ec06" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        transform="rotate(-90 50 50)"/>
    </svg>${inner}`;
  }

  function timerDockHtml() {
    const snap = HybridTimer.snapshot(timerState(), Date.now());
    if (snap.view === 'countIn' && snap.display === 'docked') {
      return `<div class="tm-dock-copy" id="logTimerDock">${esc(snap.countInLabel)}</div>`;
    }
    if (snap.view === 'running' && snap.display === 'docked') {
      return `<button type="button" class="tm-dock-run" id="logTimerDock" onclick="Logger.timerTapDock()">${ringSvg(snap.progress, `<span>${esc(snap.clock)}</span>`)}</button>`;
    }
    if (snap.chrome === 'select') {
      return `<button type="button" class="tm-select" onclick="Logger.timerOpen()" aria-label="Select Timer">${icoSwitch()} Select Timer</button>`;
    }
    return `<button type="button" class="log-play" onclick="Logger.timerPlay()" aria-label="Start last timer">▶</button>`;
  }

  function barHtml(s) {
    const atStart = s.blockIndex === 0;
    const atEnd = s.blockIndex === s.pages.length - 1;
    const snap = HybridTimer.snapshot(timerState(), Date.now());
    const hideSides = snap.stopSheet;
    return `
      <div class="log-bar">
        <button type="button" class="log-bar-btn" onclick="Logger.prev()" ${atStart || hideSides ? 'disabled' : ''}>← Back</button>
        ${timerDockHtml()}
        <button type="button" class="log-bar-btn" onclick="Logger.next()" ${atEnd || hideSides ? 'disabled style="opacity:.35"' : ''}>Next →</button>
      </div>`;
  }

  function switchBtn() {
    return `<button type="button" class="tm-switch" onclick="Logger.timerSwitch()">${icoSwitch()} Switch</button>`;
  }

  function modeTitle(mode) {
    if (mode === 'tabata') return 'Tabata Timer';
    if (mode === 'emom') return 'EMOM Timer';
    return (HybridTimer.PICKER.find((p) => p.id === mode) || {}).label || mode;
  }

  function pickerIcon(id) {
    const g = '#16ec06';
    const w = '#fff';
    if (id === 'rest') {
      return `<svg viewBox="0 0 72 72" class="tm-ico">${circ()}<text x="36" y="44" text-anchor="middle" fill="${g}" font-size="22" font-weight="700" font-family="Barlow Condensed,sans-serif">Zzz</text></svg>`;
    }
    if (id === 'stopwatch') {
      return `<svg viewBox="0 0 72 72" class="tm-ico">${circ()}<circle cx="36" cy="38" r="16" fill="none" stroke="${w}" stroke-width="2.5"/><path d="M36 38 L36 26" stroke="${g}" stroke-width="2.5" stroke-linecap="round"/><rect x="32" y="12" width="8" height="6" rx="1" fill="${w}"/></svg>`;
    }
    if (id === 'amrap') {
      return `<svg viewBox="0 0 72 72" class="tm-ico"><path d="M14 50 A24 24 0 1 1 58 50" fill="none" stroke="${w}" stroke-width="2.5"/><path d="M36 50 L52 28" stroke="${g}" stroke-width="2.5" stroke-linecap="round"/></svg>`;
    }
    if (id === 'forTime') {
      return `<svg viewBox="0 0 72 72" class="tm-ico">${circ()}<path d="M36 20 A16 16 0 1 1 20 36" fill="none" stroke="${g}" stroke-width="8"/><circle cx="36" cy="36" r="3" fill="${w}"/></svg>`;
    }
    if (id === 'tabata') {
      return `<svg viewBox="0 0 72 72" class="tm-ico"><text x="36" y="46" text-anchor="middle" fill="${g}" font-size="28" font-weight="700" font-family="Barlow Condensed,sans-serif">:20</text></svg>`;
    }
    if (id === 'custom') {
      return `<svg viewBox="0 0 72 72" class="tm-ico">${circ()}<path d="M36 20 A16 16 0 0 1 52 36 L36 36 Z" fill="${g}"/></svg>`;
    }
    return `<svg viewBox="0 0 72 72" class="tm-ico"><text x="36" y="46" text-anchor="middle" fill="${g}" font-size="22" font-weight="700" font-family="Barlow Condensed,sans-serif">1:00</text></svg>`;
  }

  function circ() {
    return `<circle cx="36" cy="36" r="26" fill="none" stroke="#fff" stroke-width="2.5"/>`;
  }

  function icoSwitch() {
    return `<svg viewBox="0 0 20 20" width="16" height="16"><circle cx="10" cy="11" r="6" fill="none" stroke="#1ba3ff" stroke-width="1.6"/><path d="M10 7 v4" stroke="#1ba3ff" stroke-width="1.6"/></svg>`;
  }

  function fieldBox(key, value, label) {
    return `<label class="tm-field"><span>${esc(label)}</span><input inputmode="numeric" value="${esc(value)}" onchange="Logger.timerField('${esc(key)}', this.value)"></label>`;
  }

  function pairBoxes(aKey, aVal, bKey, bVal, label) {
    return `<div class="tm-pair">
      <input inputmode="numeric" value="${esc(aVal)}" onchange="Logger.timerField('${esc(aKey)}', this.value)">
      <i>:</i>
      <input inputmode="numeric" value="${esc(bVal)}" onchange="Logger.timerField('${esc(bKey)}', this.value)">
      <span>${esc(label)}</span>
    </div>`;
  }

  function setupHtml(snap) {
    const mode = snap.mode;
    const c = snap.config || {};
    const title = modeTitle(mode);
    let body = '';
    if (mode === 'rest') {
      const m = Math.floor((c.restMs || 0) / 60000);
      const s = Math.floor(((c.restMs || 0) % 60000) / 1000);
      body = `
        <p class="tm-kicker">Quick Start</p>
        <div class="tm-quick">${[30000, 45000, 60000, 90000, 120000].map((ms) => {
          const clock = HybridTimer.formatClock(ms, false);
          return `<button type="button" onclick="Logger.timerQuick(${ms})">${clock}</button>`;
        }).join('')}</div>
        <hr class="tm-rule">
        <p class="tm-kicker">Customize</p>
        <div class="tm-custom">
          <button type="button" onclick="Logger.timerNudge(-1)">−</button>
          <div class="tm-ms"><b>${m}</b><span>m</span></div>
          <div class="tm-ms"><b>${String(s).padStart(2, '0')}</b><span>s</span></div>
          <button type="button" onclick="Logger.timerNudge(1)">+</button>
        </div>
        <button type="button" class="tm-start" onclick="Logger.timerStart()"><span>▶</span>Start</button>`;
    } else if (mode === 'stopwatch' || mode === 'forTime') {
      body = `
        <button type="button" class="tm-giant" onclick="Logger.timerStart()">▶</button>
        <div class="tm-countin-row">${fieldBox('countInSec', Math.round((c.countInMs || 0) / 1000), 'Count In')}</div>
        <div class="tm-run-btns">
          <button type="button" class="tm-reset" onclick="Logger.timerReset()">Reset</button>
          <button type="button" class="tm-pause" onclick="Logger.timerPause()">Pause</button>
        </div>`;
    } else if (mode === 'amrap') {
      body = `
        ${pairBoxes('totalMin', Math.floor((c.totalMs || 0) / 60000), 'totalSec', String(Math.floor(((c.totalMs || 0) % 60000) / 1000)).padStart(2, '0'), 'Total Time')}
        <div class="tm-countin-row">${fieldBox('countInSec', Math.round((c.countInMs || 0) / 1000), 'Count In')}</div>
        <button type="button" class="tm-start" onclick="Logger.timerStart()"><span>▶</span>Start</button>`;
    } else if (mode === 'tabata' || mode === 'custom') {
      const work = c.workMs || 0;
      const rest = c.restMs || 0;
      const blurb = mode === 'tabata'
        ? `${c.rounds} rounds of ${Math.round(work / 1000)} seconds work, ${Math.round(rest / 1000)} seconds rest`
        : `${c.rounds} rounds of: ${HybridTimer.formatClock(work, false)} work / ${HybridTimer.formatClock(rest, false)} rest`;
      body = `
        <p class="tm-blurb">${esc(blurb)}</p>
        ${fieldBox('rounds', c.rounds, 'Rounds')}
        ${mode === 'tabata'
          ? `${fieldBox('workSec', Math.round(work / 1000), 'Work')}${fieldBox('restSec', Math.round(rest / 1000), 'Rest')}`
          : `${pairBoxes('workMin', Math.floor(work / 60000), 'workSec', String(Math.floor((work % 60000) / 1000)).padStart(2, '0'), 'Work')}
             ${pairBoxes('restMin', Math.floor(rest / 60000), 'restSec', String(Math.floor((rest % 60000) / 1000)).padStart(2, '0'), 'Rest')}`}
        <div class="tm-countin-row">${fieldBox('countInSec', Math.round((c.countInMs || 0) / 1000), 'Count In')}</div>
        <button type="button" class="tm-start" onclick="Logger.timerStart()"><span>▶</span>Start</button>`;
    } else if (mode === 'emom') {
      body = `
        ${pairBoxes('everyMin', Math.floor((c.everyMs || 0) / 60000), 'everySec', String(Math.floor(((c.everyMs || 0) % 60000) / 1000)).padStart(2, '0'), 'Every')}
        ${fieldBox('rounds', c.rounds, 'Rounds')}
        <div class="tm-countin-row">${fieldBox('countInSec', Math.round((c.countInMs || 0) / 1000), 'Count In')}</div>
        <button type="button" class="tm-start" onclick="Logger.timerStart()"><span>▶</span>Start</button>`;
    }
    return `
      <div class="tm-full" id="logTimerFull">
        <div class="tm-head">
          <h2>${esc(title)}</h2>
          ${switchBtn()}
        </div>
        <div class="tm-setup">${body}</div>
      </div>`;
  }

  function pickerHtml() {
    const tiles = HybridTimer.PICKER.map((m) => `<button type="button" class="tm-tile" onclick="Logger.timerChoose('${m.id}')">${pickerIcon(m.id)}<span>${esc(m.label)}</span></button>`).join('');
    return `<div class="tm-full tm-picker" id="logTimerFull">
      <button type="button" class="tm-x" onclick="Logger.timerClosePicker()" aria-label="Close">×</button>
      <div class="tm-grid">${tiles}</div>
    </div>`;
  }

  function runHtml(snap) {
    const title = modeTitle(snap.mode);
    if (snap.view === 'countIn') {
      return `<div class="tm-full" id="logTimerFull">
        <div class="tm-head"><h2>${esc(title)}</h2>${switchBtn()}</div>
        <div class="tm-countin">${esc(snap.countInLabel)}</div>
      </div>`;
    }
    const inner = `<div class="tm-face">
      ${snap.roundFraction ? `<small>${esc(snap.roundFraction)}</small>` : ''}
      <strong>${esc(snap.clock || '')}</strong>
      ${snap.roundLabel ? `<em>${esc(snap.roundLabel)}</em>` : ''}
    </div>`;
    return `<div class="tm-full" id="logTimerFull">
      <div class="tm-head"><h2>${esc(title)}</h2>${switchBtn()}</div>
      <div class="tm-run">${ringSvg(snap.progress == null ? 1 : snap.progress, inner)}</div>
      ${snap.mode !== 'rest' ? `<div class="tm-run-btns"><button type="button" class="tm-reset" onclick="Logger.timerReset()">Reset</button>${snap.mode === 'stopwatch' || snap.mode === 'forTime' ? `<button type="button" class="tm-pause" onclick="Logger.timerPause()">Pause</button>` : ''}</div>` : ''}
    </div>`;
  }

  function timerOverlayHtml() {
    const t = timerState();
    const snap = HybridTimer.snapshot(t, Date.now());
    let extra = '';
    if (snap.view === 'picker') extra = pickerHtml();
    else if (snap.view === 'setup') extra = setupHtml(snap);
    else if ((snap.view === 'running' || snap.view === 'countIn') && snap.display === 'fullscreen') extra = runHtml(snap);
    if (snap.stopSheet) {
      extra += `<div class="tm-stop" onclick="if(event.target===this)Logger.timerCancelStop()">
        <div class="tm-stop-card">
          <button type="button" class="tm-stop-go" onclick="Logger.timerStop()">Stop Timer</button>
          <button type="button" onclick="Logger.timerCancelStop()">Cancel</button>
        </div>
      </div>`;
    }
    return extra;
  }

  function quoteHtml() {
    return `<div class="log-quote"><p>${esc(QUOTE)}</p></div>`;
  }

  function coachHtml() {
    const s = session();
    const copy = (s && s.instructions && String(s.instructions).trim()) ? s.instructions : COACH;
    return `
      <div class="log-coach">
        <h1>Coach Instructions</h1>
        <p>${esc(copy).replace(/\n/g, '<br>')}</p>
        <button type="button" class="log-primary" onclick="Logger.gotCoach()">Got It</button>
      </div>`;
  }

  function remainLabel(endsAt, now) {
    const sec = Math.max(0, Math.ceil(((endsAt || now) - now) / 1000));
    const m = Math.floor(sec / 60);
    const r = sec % 60;
    return `${m}:${String(r).padStart(2, '0')}`;
  }

  function persistEngine(nextLog) {
    const s = JSON.parse(JSON.stringify(session()));
    const page = HybridSession.currentPage(s);
    s.logs[page.id] = nextLog;
    if (nextLog.engine && nextLog.engine.phase === 'done' && root.HybridEngine) {
      const closed = HybridEngine.closePiece(nextLog, root.HybridAdaptive);
      s.engineAnchors = s.engineAnchors || {};
      if (page.machine) s.engineAnchors[page.machine] = closed;
      root.S.engineAnchors = { ...(root.S.engineAnchors || {}), ...(s.engineAnchors || {}) };
    }
    persist(s);
  }

  function engineHtml(s, page, log) {
    const e = log.engine;
    if (!e || !root.HybridEngine) return `<p class="log-kicker">Engine bundle missing</p>`;
    const now = Date.now();
    const target = HybridEngine.formatTarget(e.target, e.modality) || (e.skipped ? 'No invented pace' : 'Type the first number');
    const shown = Math.min(e.rounds, e.phase === 'ready' || e.phase === 'rest' ? e.roundIndex + 1 : e.roundIndex + 1);
    const kicker = `${page.letter}. The Engine · ${(e.structure || 'intervals').toUpperCase()}`;
    let stage = '';
    if (e.phase === 'ready') {
      stage = `
        <p class="eng-target" id="engTarget">${esc(target)}</p>
        ${e.skipped ? '' : `<label class="eng-first">First number
          <input inputmode="decimal" value="${esc(e.modality === 'split' ? (e.target.splitSec || '') : e.modality === 'rpm' ? (e.target.rpm || '') : (e.target.watts || ''))}" onchange="Logger.engineTyped(this.value)">
        </label>`}
        <button type="button" class="log-primary eng-go" onclick="Logger.engineStart()">Start work</button>`;
    } else if (e.phase === 'work') {
      stage = `
        <p class="eng-phase">Work ${shown}/${e.rounds}</p>
        <p class="eng-clock" id="engClock">${esc(remainLabel(e.workEndsAt, now))}</p>
        <p class="eng-target">${esc(target)}</p>
        <button type="button" class="eng-early" onclick="Logger.engineEnd()">End interval early</button>`;
    } else if (e.phase === 'rest') {
      const nextTarget = HybridEngine.formatTarget(e.target, e.modality) || target;
      const restClock = e.restEndsAt != null ? `<p class="eng-clock" id="engClock">${esc(remainLabel(e.restEndsAt, now))}</p>` : '';
      const effortBlock = e.needsEffort ? `
        <p class="log-emh-label">How was that interval?</p>
        <div class="log-intensity">
          <button type="button" onclick="Logger.engineEffort('easy')">Easy</button>
          <button type="button" onclick="Logger.engineEffort('medium')">Medium</button>
          <button type="button" onclick="Logger.engineEffort('hard')">Hard</button>
        </div>` : '';
      const skipBtn = e.needsEffort ? '' : `<button type="button" class="log-primary" onclick="Logger.engineSkipRest()">Skip · start work</button>`;
      const upNextBlock = e.needsEffort ? '' : `<p class="eng-target">Up next · ${esc(nextTarget)}</p>`;
      stage = `
        <p class="eng-phase">${page.recoveryTarget ? "Active recovery" : "Rest"}</p>
        ${restClock}
        <p class="eng-up">Last interval · ${esc(target)}</p>
        ${effortBlock}
        ${upNextBlock}
        ${skipBtn}`;
    } else {
      stage = `
        <p class="eng-phase">Piece done</p>
        <p class="eng-target">${esc(target)}</p>
        <button type="button" class="log-complete is-done" onclick="Logger.next()">Next</button>`;
    }
    return `
      <p class="log-kicker">${esc(kicker)}</p>
      <h2 class="log-title">${esc(page.title)}</h2>
      <p class="log-rx">${esc(page.prescription || '')}</p>
      <p class="template-lead">${esc(e.phase === "rest" ? (page.recoveryTarget || "Recover") : (page.workTarget || ""))}</p><div class="eng-stage">${stage}</div>`;
  }

  function completeHtml(s, page, log) {
    const items = (page.items || []).map((it) => `
      <li><strong>${it.n}.</strong> ${esc(it.text)}
        ${it.note ? `<p class="log-note"><em>*${esc(it.note)}</em></p>` : ''}
      </li>`).join('');
    const bullets = (page.bullets || []).map((b) => `<li>${esc(b)}</li>`).join('');
    return `
      <p class="log-kicker">${esc(page.letter)}. ${esc(page.section)}</p>
      <h2 class="log-title">${esc(page.title)}</h2>
      ${items ? `<ol class="log-list">${items}</ol>` : ''}
      ${bullets ? `<ul class="log-bullets">${bullets}</ul>` : ''}
      ${page.note ? `<p class="log-note"><em>*${esc(page.note)}</em></p>` : ''}
      ${page.goal ? `<p>${esc(page.goal)}</p>` : ''}
      <button type="button" class="log-complete${log.completed ? ' is-done' : ''}" onclick="Logger.complete()">
        ${log.completed ? 'Completed' : 'Mark As Completed'}
      </button>
      <input class="log-ex-note" placeholder="Add circuit note" value="${esc(log.note || '')}" onchange="Logger.note('${esc(page.id)}',this.value)">`;
  }

  function sideHtml(s, page) {
    const wm = (s.workingMax && s.workingMax[page.id]) || '';
    return `
      <div class="log-meta-row">
        <div class="log-thumb">▶</div>
        <div class="log-side">
          <div class="log-side-row"><span>WORKING MAX</span><button type="button" class="log-add" onclick="Logger.sheet('wm')">${wm ? esc(wm) + ' >' : 'Add >'}</button></div>
          <div class="log-side-row"><span>LAST</span><span>${wm ? esc(wm) : 'None'}</span></div>
        </div>
      </div>`;
  }

  function colField(key) {
    if (key === 'reps' || key === 'reps_range') return 'reps';
    if (key === 'weight_kg' || key === 'weight_lb' || key === 'weight_pct' || key === 'lwp') return 'kg';
    return key;
  }

  function columnsFor(page) {
    if (page.columns && page.columns.length) return page.columns;
    if (page.logMode === 'kg') return ['reps', 'weight_kg'];
    return ['reps'];
  }

  function cellVal(row, field) {
    if (field === 'reps') return row.reps == null ? 'MAX' : row.reps;
    if (field === 'kg') return row.kg == null || row.kg === '' ? '' : row.kg;
    const v = row.cells && row.cells[field];
    return v == null ? '' : v;
  }

  function tableHtml(s, page, log) {
    const cols = columnsFor(page);
    const mid = esc(page.id);
    const heads = cols.map((k) => `<th>${esc((root.HybridLibrary && HybridLibrary.trackLabel(k)) || k)}</th>`).join('');
    const rows = (log.sets || []).map((row, i) => {
      const tds = cols.map((k) => {
        const field = colField(k);
        const focus = pad && pad.memberId === page.id && pad.setIndex === i && pad.field === field;
        const val = cellVal(row, field);
        const ph = field === 'reps' && row.reps == null;
        return `<td><button type="button" class="log-cell${focus ? ' focus' : ''}${ph ? ' ph' : ''}" onclick="Logger.focusPad('${mid}',${i},'${esc(field)}')">${esc(val)}</button></td>`;
      }).join('');
      return `<tr>
        <td>${i + 1}</td>
        ${tds}
        <td><button type="button" class="log-check${row.logged ? ' on' : ''}" onclick="Logger.check('${mid}',${i})">${row.logged ? '✓' : ''}</button></td>
      </tr>`;
    }).join('');
    return `
      <p class="log-rx">${esc(page.prescription)}</p>
      ${page.notes && page.notes.length ? `<ul class="log-notes">${page.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
      <table class="log-table">
        <thead><tr><th>Sets</th>${heads}<th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="log-set-ctrl">
        <button type="button" onclick="Logger.nudgeSets('${mid}',-1)">−</button>
        <span>Set</span>
        <button type="button" onclick="Logger.nudgeSets('${mid}',1)">+</button>
      </div>
      <input class="log-ex-note" placeholder="Add exercise note" value="${esc(log.note || '')}" onchange="Logger.note('${mid}',this.value)">`;
  }

        <div class="log-intensity">
          ${[1, 2, 3, 4, 5].map((i) => `<button type="button" class="${f.intensity === i ? 'on' : ''}" onclick="Logger.feelIntensity(${i})">${i}</button>`).join('')}

      </div>`;
  }

  function summaryHtml(s) {
    const st = HybridSession.summaryStats(s);
    return `
      <div class="log-sum">
        <p class="log-kicker">${esc(s.date)}</p>
        <h2 class="log-title">Heavy Lower</h2>

  function padHtml() {
    if (!pad) return '';
    const unit = (session().unit || 'kg') === 'lb' ? 'lb' : 'kg';
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', '⌫'];
    const keyBtns = keys.map((k) => `<button type="button" onclick="Logger.padKey('${k}')">${k}</button>`).join('');
    return `
      <div class="log-pad">
        <div class="log-pad-head">
          <div>
            <span class="log-pad-val">${esc(pad.buffer || '0')}</span>
            ${pad.field === 'kg' ? `<span class="log-unit">
              <button type="button" class="${unit === 'kg' ? 'on' : ''}" onclick="Logger.unit('kg')">Kg</button>
              <button type="button" class="${unit === 'lb' ? 'on' : ''}" onclick="Logger.unit('lb')">Lb</button>
            </span>` : `<span style="margin-left:8px;opacity:.6">${esc((root.HybridLibrary && HybridLibrary.trackLabel(pad.field)) || pad.field).toUpperCase()}</span>`}
          </div>
          <button type="button" onclick="Logger.closePad()">⌄</button>
        </div>
        <div class="log-keys">
          ${keyBtns}
          <div class="log-pad-side" style="grid-column:4;grid-row:1 / span 4">
            <button type="button" class="blue" onclick="Logger.padLog()">Log</button>
            <button type="button" class="blue" onclick="Logger.padAutofill()">Autofill</button>
            <button type="button" class="log-miss${pad.miss ? ' on' : ''}" onclick="Logger.padMiss()">Miss</button>
          </div>
        </div>
      </div>`;

  function sheetHtml(s) {
    if (!sheet) return '';
    if (sheet === 'goal') {
      return `
        <div class="log-sheet" onclick="if(event.target===this)Logger.sheet(null)">
          <div class="log-sheet-card">
            <h2>Set a new goal</h2>
            <p>Track a target for this lift. Hybrid keeps this on the phone for now.</p>
            <button type="button" class="log-primary" onclick="Logger.sheet(null)">Got it</button>
          </div>
        </div>`;
    }
    const page = HybridSession.currentPage(s);
    const cur = (s.workingMax && s.workingMax[page.id]) || '';
    return `
      <div class="log-sheet" onclick="if(event.target===this)Logger.sheet(null)">
        <div class="log-sheet-card">
          <h2>Working max</h2>
          <input id="wmInput" type="number" inputmode="decimal" value="${esc(cur)}" placeholder="kg">
          <button type="button" class="log-primary" onclick="Logger.saveWm()">Save</button>
        </div>
      </div>`;
  }

  function blockHtml(s) {
    const page = HybridSession.currentPage(s);
    const log = s.logs[page.id] || { completed: false, sets: [], note: '' };
    let body = '';
    if (page.logMode === 'complete') body = completeHtml(s, page, log);
    else if (page.logMode === 'engine') body = engineHtml(s, page, log);
    else if (page.logMode === 'doneHub') body = hubHtml();
    else if (page.logMode === 'superset') {
      const members = (page.members || []).map((m) => `
        <section class="log-ss-member">
          <h2 class="log-title">${esc(m.letter)}. ${esc(m.title)}</h2>
          ${m.logMode === 'kg' ? sideHtml(s, m) : ''}
          ${tableHtml(s, m, s.logs[m.id] || { sets: [], note: '' })}
        </section>`).join('');
      body = `
        <p class="log-kicker">${esc(page.letter)}. ${esc(page.section)}</p>
        <div class="log-ss">${members}</div>`;
    } else {
      body = `
        <p class="log-kicker">${esc(page.letter)}. ${esc(page.section)}</p>
        <h2 class="log-title">${esc(page.title)}</h2>
        ${page.logMode === 'kg' ? sideHtml(s, page) : ''}
        ${tableHtml(s, page, log)}`;
    }
    return `${headerHtml(s)}<div class="log-body">${body}</div>${barHtml(s)}${padHtml()}${sheetHtml(s)}${timerOverlayHtml()}`;
  }

  function paint() {
    if(root.Standalone) root.Standalone.audioTick();
    const el = document.getElementById('logger');
    if (!el) return;
    const s = session();
    if (!s || !root.S.loggerOpen) {
      el.classList.add('hidden');
      return;
    }
    el.classList.remove('hidden');
    document.getElementById('shell').classList.add('logger-open');
    let inner = '';
    if (s.phase === 'quote') inner = quoteHtml();
    else if (s.phase === 'coach') inner = coachHtml();
    else if (s.phase === 'feel') inner = feelHtml(s);
    else if (s.phase === 'summary') inner = summaryHtml(s);
    else inner = blockHtml(s);
    el.innerHTML = `<div class="log-screen">${toast ? `<div class="log-toast">${esc(toast)}</div>` : ''}${inner}</div>`;
    startClock();
    if (s.phase === 'quote') {
      el.querySelector('.log-quote')?.addEventListener('click', () => Logger.gotQuote());
      if (!Logger._quoteTimer) {
        Logger._quoteTimer = setTimeout(() => {
          Logger._quoteTimer = 0;
          const cur = session();
          if (cur && cur.phase === 'quote') persist(HybridSession.ackQuote(cur));
        }, 1600);
      }
    }
  }

  const Logger = {
    open,
    close,
    paint,
    gotQuote() {
      if (Logger._quoteTimer) { clearTimeout(Logger._quoteTimer); Logger._quoteTimer = 0; }
      persist(HybridSession.ackQuote(session()));
    },
    gotCoach() { persist(HybridSession.ackCoach(session())); },
    next() { pad = null; persist(HybridSession.nextPage(session())); },
    prev() { pad = null; persist(HybridSession.prevPage(session())); },
    complete() { persist(HybridSession.completeCurrent(session())); },
    engineStart() {
      const s = session();
      const page = HybridSession.currentPage(s);
      persistEngine(HybridEngine.startWork(s.logs[page.id], Date.now()));
    },
    engineEnd() {
      const s = session();
      const page = HybridSession.currentPage(s);
      persistEngine(HybridEngine.endWork(s.logs[page.id], Date.now(), true));
    },
    engineEffort(effort) {
      const s = session();
      const page = HybridSession.currentPage(s);
      const log = s.logs[page.id];
      if (!log.engine || !log.engine.needsEffort) return;
      persistEngine(HybridEngine.recordEffort(log, effort, root.HybridAdaptive, Date.now()));
    },
    engineSkipRest() {
      const s = session();
      const page = HybridSession.currentPage(s);
      persistEngine(HybridEngine.skipRestAndStart(s.logs[page.id], Date.now()));
    },
    engineTyped(raw) {
      const n = Number(raw);
      const s = JSON.parse(JSON.stringify(session()));
      const page = HybridSession.currentPage(s);
      const e = s.logs[page.id].engine;
      if (!Number.isFinite(n) || n <= 0) return;
      if (e.modality === 'split') e.target.splitSec = n;
      else if (e.modality === 'rpm') e.target.rpm = n;
      else e.target.watts = n;
      e.skipped = false;
      persist(s);
    },
    note(memberId, v) {
      const s = JSON.parse(JSON.stringify(session()));
      const page = HybridSession.currentPage(s);
      const id = page.logMode === 'superset' ? memberId : page.id;
      s.logs[id].note = v;
      persist(s);
    },
    focusPad(memberId, setIndex, field) {
      const s = session();
      const page = HybridSession.currentPage(s);
      const lift = page.logMode === 'superset' ? HybridSession.memberOf(page, memberId) : page;
      const row = s.logs[lift.id].sets[setIndex];
      const seed = field === 'kg' ? row.kg : field === 'reps' ? row.reps : (row.cells && row.cells[field]);
      pad = { memberId: lift.id, setIndex, field, buffer: seed == null ? '' : String(seed), miss: !!row.miss };
      paint();
    },
    closePad() { pad = null; paint(); },
    padKey(k) {
      if (!pad) return;
      if (k === '⌫') pad.buffer = String(pad.buffer || '').slice(0, -1);
      else pad.buffer = `${pad.buffer || ''}${k}`.replace(/^0+(\d)/, '$1');
      paint();
    },
    padMiss() { if (pad) { pad.miss = !pad.miss; paint(); } },
    padLog() {
      if (!pad) return;
      const n = Number(pad.buffer);
      const patch = { miss: pad.miss };
      if (pad.field === 'kg') patch.kg = n;
      else if (pad.field === 'reps') patch.reps = n;
      else patch.cells = { [pad.field]: n };
      let s = HybridSession.logSet(session(), pad.setIndex, patch, pad.memberId);
      if (pad.field === 'kg' && n > 0) {
        const page = HybridSession.currentPage(s);
        const lift = page.logMode === 'superset' ? HybridSession.memberOf(page, pad.memberId) : page;
        const prev = Math.max(0, ...s.logs[lift.id].sets.filter((r, i) => i !== pad.setIndex && r.logged).map((r) => r.kg || 0));
        if (n >= prev && lift.targetReps) {
          toast = `New ${lift.targetReps} Rep Max!`;
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => { toast = ''; paint(); }, 2200);
        }
      }
      pad = null;
      persist(s);
    },
    padAutofill() {
      if (!pad) return;
      const idx = pad.setIndex;
      const n = Number(pad.buffer);
      const patch = { miss: pad.miss };
      if (pad.field === 'kg') patch.kg = n;
      else if (pad.field === 'reps') patch.reps = n;
      else patch.cells = { [pad.field]: n };
      let s = HybridSession.logSet(session(), idx, patch, pad.memberId);
      s = HybridSession.autofillFrom(s, idx, pad.memberId);
      pad = null;
      persist(s);
    },
    check(memberId, i) {
      const s = session();
      const page = HybridSession.currentPage(s);
      const lift = page.logMode === 'superset' ? HybridSession.memberOf(page, memberId) : page;
      const row = s.logs[lift.id].sets[i];
      if (!row.logged) persist(HybridSession.logSet(s, i, {}, lift.id));
      else persist(HybridSession.toggleLogged(s, i, lift.id));
    },
    unit(u) {
      const s = JSON.parse(JSON.stringify(session()));
      s.unit = u;
      persist(s);
    },
    nudgeSets(memberId, dir) {
      const s = JSON.parse(JSON.stringify(session()));
      const page = HybridSession.currentPage(s);
      const lift = page.logMode === 'superset' ? HybridSession.memberOf(page, memberId) : page;
      const log = s.logs[lift.id];
      if (dir > 0) {
        log.sets.push({
          reps: lift.logMode === 'max' ? null : lift.targetReps,
          kg: null,
          cells: {},
          logged: false,
          miss: false,
        });
      } else if (log.sets.length > 1) log.sets.pop();
      persist(s);
    },
    sheet(kind) { sheet = kind; paint(); },
    saveWm() {
      const input = document.getElementById('wmInput');
      const page = HybridSession.currentPage(session());
      persist(HybridSession.setWorkingMax(session(), page.id, input && input.value));
      sheet = null;
      paint();
    },
    doneTraining() { pad = null; persist(HybridSession.openSummary(session())); },
    addExercise() {
      close();
      if (typeof root.openLibraryForDay === 'function') root.openLibraryForDay();
    },
    feelIntensity(n) { persist(HybridSession.setFeel(session(), { intensity: n })); },
    feelMins(d) {
      const cur = (session().feel && session().feel.durationMin) || 1;
      persist(HybridSession.setFeel(session(), { durationMin: Math.max(1, cur + d) }));
    },
    feelNote(v) { persist(HybridSession.setFeel(session(), { note: v })); },
    finish() { persist(HybridSession.finishToSummary(session())); },
    chevron() {
      const t = timerState();
      const snap = HybridTimer.snapshot(t, Date.now());
      if ((snap.view === 'running' || snap.view === 'countIn') && snap.display === 'fullscreen') persistTimer(HybridTimer.collapse(t));
      else if (snap.view === 'picker') persistTimer(HybridTimer.closePicker(t));
      else if (snap.view === 'setup') persistTimer(HybridTimer.stop(t));
      else close();
    },
    timerOpen() { persistTimer(HybridTimer.openPicker(timerState())); },
    timerPlay() { persistTimer(HybridTimer.play(timerState(), Date.now())); },
    timerChoose(id) { persistTimer(HybridTimer.choose(timerState(), id)); },
    timerClosePicker() { persistTimer(HybridTimer.closePicker(timerState())); },
    timerSwitch() { persistTimer(HybridTimer.openPicker(HybridTimer.stop(timerState()))); },
    timerQuick(ms) { persistTimer(HybridTimer.quickStart(timerState(), ms)); },
    timerNudge(dir) { persistTimer(HybridTimer.nudgeRest(timerState(), dir)); },
    timerStart() { persistTimer(HybridTimer.start(timerState(), Date.now())); },
    timerReset() { persistTimer(HybridTimer.reset(timerState(), Date.now())); },
    timerPause() { persistTimer(HybridTimer.togglePause(timerState(), Date.now())); },
    timerTapDock() { persistTimer(HybridTimer.openStopSheet(timerState())); },
    timerStop() { persistTimer(HybridTimer.stop(timerState())); },
    timerCancelStop() { persistTimer(HybridTimer.cancelStopSheet(timerState())); },
    timerField(key, raw) {
      const n = Number(raw);
      if (!Number.isFinite(n)) return;
      const t = timerState();
      const c = { ...(t.config || {}) };
      if (key === 'countInSec') c.countInMs = Math.max(0, n) * 1000;
      if (key === 'rounds') c.rounds = Math.max(1, n);
      if (key === 'workMin') c.workMs = Math.max(0, n) * 60000 + ((c.workMs || 0) % 60000);
      if (key === 'restMin') c.restMs = Math.max(0, n) * 60000 + ((c.restMs || 0) % 60000);
      if (key === 'workSec') {
        c.workMs = t.mode === 'tabata' ? Math.max(1, n) * 1000
          : Math.floor((c.workMs || 0) / 60000) * 60000 + Math.max(0, n) * 1000;
      }
      if (key === 'restSec') {
        c.restMs = t.mode === 'tabata' ? Math.max(0, n) * 1000
          : Math.floor((c.restMs || 0) / 60000) * 60000 + Math.max(0, n) * 1000;
      }

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.build !== BRAIN_BUILD) return defaultState();
    return {

}

  if (!window.HybridSc || !window.Whoop || typeof Whoop.client !== 'function') return;
  try {
    const sb = Whoop.client();
    const { data: sessionData } = await sb.auth.getSession();
    const uid = sessionData && sessionData.session && sessionData.session.user && sessionData.session.user.id;
    if (!uid) return;
    const domains = (HybridSc.SNAPSHOT_DOMAINS && HybridSc.SNAPSHOT_DOMAINS.strength) || ['strength_side', 'strength'];
    let snapshot = null;
    for (const domain of domains) {
      const { data, error } = await sb
        .from('athlete_domain_snapshots')
        .select('snapshot')
        .eq('user_id', uid)
        .eq('domain', domain)
        .maybeSingle();
      if (!error && data) { snapshot = data.snapshot; break; }

    if (!snapshot) return;

      return `<li><span class="trn-num">${item.n}</span><span class="trn-item-text">${esc(item.text)}${note}</span></li>`;

  return `
    <article class="trn-block trn-block--warmup" onclick="startTrainingSession('${esc(block.letter)}')">

}

function trainingBlocksHtml(iso) {
  const plan = trainingPlanForDate(iso);
  if (!plan || !plan.blocks || !plan.blocks.length) {
    return `<p class="trn-empty">Nothing scheduled for this day yet.</p>
    <button type="button" class="trn-add-exercise" onclick="openLibraryForDay()">
      <span class="trn-add-icon" aria-hidden="true">+</span>
      <span>Add Exercise</span>
    </button>`;
  }
  const head = plan.title
    ? `<div class="trn-session-name">${esc(plan.title)}</div>`
    : '';
  const body = plan.blocks
    .map((block, i) => {
      if (block.kind === 'warmup') return trnWarmupHtml(block);
      if (block.kind === 'section') return trnSectionHtml(block);
      if (block.kind === 'lift') {
        const next = plan.blocks[i + 1];
        const a = String(block.letter || '').match(/^([A-Za-z]+)(\d+)$/);
        const b = next && String(next.letter || '').match(/^([A-Za-z]+)(\d+)$/);
        const superset = !!(a && b && a[1] === b[1] && Number(b[2]) === Number(a[2]) + 1);
        return trnLiftHtml(block, { superset });
      }
      if (block.kind === 'engine') return trnEngineHtml(block);
      if (block.kind === 'recovery') return trnRecoveryHtml(block);
      return '';
    })
    .join('');
  return `
    ${head}
    ${body}
    <button type="button" class="trn-add-exercise" onclick="openLibraryForDay()">
      <span class="trn-add-icon" aria-hidden="true">+</span>
      <span>Add Exercise</span>
    </button>`;
}

function otaBannerHtml() {
  const s = otaInfo && otaInfo.status;
  if (s !== 'ready' && s !== 'available') return '';
  const ver = esc(otaInfo.next || otaInfo.latest || '');
  if (s === 'ready') {
    return `

          <div class="ota-title">Version ${ver} is ready</div>

  return `

      <div class="ota-copy">
        <div class="ota-kicker">App update</div>
        <div class="ota-title">Version ${ver} is downloading</div>
        <div class="ota-meta">Restart now appears when the file is on the phone.</div>
      </div>
    </div>`;
}

async function refreshOtaStatus(force) {
  if (!window.NativeBridge || typeof NativeBridge.probeLiveUpdate !== 'function') return;
  try {
    otaInfo = (await NativeBridge.probeLiveUpdate(force ? { refresh: true } : {})) || otaInfo;
  } catch (_) {
    return;
  }
  if (S.tab === 'me') render();
}

async function applyOtaUpdate() {
  if (!window.NativeBridge || typeof NativeBridge.applyLiveUpdate !== 'function') return;
  const r = await NativeBridge.applyLiveUpdate();
  if (r === 'error' || r === 'unavailable') {
    window.alert('Could not restart into the update. Close the app fully and open it again.');
  }
}

async function lookForAppUpdate() {
  await refreshOtaStatus(true);
  if (otaInfo.status === 'ready' || otaInfo.status === 'available') {
    if (S.tab === 'me') render();
    return;
  }
  if (otaInfo.status === 'browser') {
    window.alert('App updates run on the phone install — not in the browser.');
    return;
  }
  window.alert(`You're on ${otaInfo.current || APP_BUILD}. No new version is ready.`);
}

async function switchHybridLocker(next) {

    /* offline — still walk the hallway */

  location.assign(HybridSc.origins(location.href)[next === 'strength' ? 'strength' : 'engine']);
}

  if (ev) ev.stopPropagation();

  S.fabOpen = false;
