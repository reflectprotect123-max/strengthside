<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Coach — parked</title>
<style>
  :root{--bg:#0c0f12;--fg:#e8e4dc;--muted:#8a857c;--copper:#d4a574;--panel:#161b20}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,sans-serif;padding:24px}
  .card{max-width:420px;padding:28px 24px;border:1px solid rgba(212,165,116,.25);border-radius:14px;background:var(--panel)}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);margin:0 0 10px}
  h1{font-size:22px;margin:0 0 12px;font-weight:650}
  p{margin:0;color:var(--muted);line-height:1.45;font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">THE Hybrid · Coach</p>
    <h1>Coach is parked</h1>
    <p>Strength &amp; conditioning coach publish/pull is frozen while Autopilot V3 rebuilds Open → Next → Close on the athlete app. No S&amp;C sessions move between coach and athlete until this park lifts.</p>
  </div>
</body>
</html>
