lay:block;margin-top:1px;font-size:26px;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.restcorner button{float:right;border:0;background:transparent;color:var(--muted);font-size:11px}.task{font-size:26px;font-weight:860;letter-spacing:-.045em}.setrow{display:grid;grid-template-columns:38px 1fr 1fr .7fr auto;gap:7px;align-items:end;padding:9px 0;border-bottom:1px solid var(--line)}.setrow:last-child{border:0}.setnum{padding-bottom:9px;color:var(--gold2);font-size:12px;font-weight:850}.mini{display:block;margin-bottom:4px;color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase}.setrow.done{opacity:.76}.setrow.done .setnum:after{color:var(--ok);content:" ✓"}

/* Minimal interface — slick mode */

body.minimal-ui h1{font-size:27px}
body.minimal-ui .lead{display:none}
body.minimal-ui .helper{display:none}
body.minimal-ui .notice{display:none}
body.minimal-ui .dropbox{display:none}
body.minimal-ui .card{padding:13px;border-radius:16px;box-shadow:none;background:#101010}
body.minimal-ui .stack{gap:10px;margin-top:14px}

body.minimal-ui .meta{font-size:12px;line-height:1.35}

/* ========== Athlete UI polish — Track Dawn (tokens in single :root above) ========== */
html{background:var(--bg-deep);scrollbar-color:#4a5560 var(--bg-deep);scrollbar-width:thin;scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top))}
body{
  min-height:100svh;
  color:var(--text);
  font-family:var(--font-body);
  font-weight:450;
  letter-spacing:-.011em;
  background:
    radial-gradient(ellipse 90% 55% at 50% -8%, rgba(212,165,116,.11), transparent 55%),
    radial-gradient(ellipse 70% 40% at 100% 10%, rgba(94,196,180,.06), transparent 45%),
    radial-gradient(ellipse 50% 30% at 0% 80%, rgba(212,165,116,.04), transparent 40%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:rgba(212,165,116,.28);color:var(--text)}
button,a,input,textarea,select,[onclick],.day,.nav button,.ath-module{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.day:focus-visible,.nav button:focus-visible,.ath-module:focus-visible,.btn:focus-visible,.expandhead:focus-visible,.weekhead:focus-visible,.searchpick:focus-visible,.block-collapsed:focus-visible,.close:focus-visible{
  outline:none; box-shadow:var(--focus);
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

.app,.shell{
  position:relative; isolation:isolate;
  max-width:760px; margin:0 auto; min-height:100svh;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.top,.header{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  min-height:64px;
  padding:12px 16px calc(12px);
  padding-top:calc(12px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
  background:rgba(10,12,14,.82);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  backdrop-filter:blur(18px) saturate(140%);
}
.brand{display:flex; gap:12px; align-items:center}
.mark{
  display:grid; place-items:center;
  width:42px; height:42px;
  border:1px solid rgba(212,165,116,.55);
  border-radius:13px;
  color:var(--copper2);
  font-family:var(--font-display);
  font-weight:700; font-size:13px; letter-spacing:.14em;
  background:linear-gradient(145deg, rgba(212,165,116,.16), rgba(94,196,180,.05));
  box-shadow:inset 0 1px rgba(255,255,255,.06);
}
.brand b, .brand > div > b{
  display:block; font-family:var(--font-display);
  font-size:18px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
}
.brand small{
  display:block; margin-top:2px;
  color:var(--dim); font-size:10px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase;
}
main, #appScreen, .screen{
  padding:22px 16px 28px;
}
.eyebrow,.kicker{
  margin:0 0 8px;
  color:var(--copper2);
  font-family:var(--font-display);
  font-size:12px; font-weight:600;
  letter-spacing:.18em; text-transform:uppercase;
}
h1,h2,h3{font-family:var(--font-display); font-weight:700; letter-spacing:.01em}
h1{font-size:clamp(28px,7vw,34px); line-height:1.02; letter-spacing:.005em}
h2{font-size:clamp(22px,5.5vw,26px); line-height:1.1}
.lead,.meta{color:var(--muted); font-size:14px; line-height:1.5; font-weight:400}
.lead{margin-top:8px; max-width:36ch}
.stack{display:grid; gap:14px; margin-top:18px}

/* Surfaces — card chrome */
.card,.streamhero,.weekbox,.toolcard,.anchorcard,.programcard,.systemhero{
  padding:16px 16px 15px;
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  background:
    linear-gradient(165deg, rgba(24,29,34,.96), rgba(14,18,22,.98));
  box-shadow:inset 0 1px rgba(255,255,255,.035);
}
.card.soft,.simplecard{box-shadow:none; background:var(--panel3)}
.systemhero,.streamhero{
  border-color:rgba(212,165,116,.28);
  background:
    linear-gradient(145deg, rgba(212,165,116,.1), transparent 42%),
    linear-gradient(165deg, rgba(24,29,34,.98), rgba(12,16,20,.99));
}
.title{font-weight:600; letter-spacing:-.015em; line-height:1.25}
.pill,.programchip{
  display:inline-flex; align-items:center;
  padding:5px 9px; border-radius:999px;
  border:1px solid rgba(212,165,116,.28);
  background:var(--copper-dim);
  color:var(--copper2);
  font-size:10px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase;
}
.pill.ok{border-color:rgba(125,186,154,.35); color:var(--ok); background:rgba(125,186,154,.1)}
.pill.warn{border-color:rgba(212,163,91,.35); color:var(--warn); background:rgba(212,163,91,.1)}
.pill.bad{border-color:rgba(208,137,125,.35); color:var(--bad); background:rgba(208,137,125,.1)}

.btn, button.btn, .btns .btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px; min-width:44px;
  padding:11px 14px;
  border:1px solid var(--line2);
  border-radius:13px;
  background:linear-gradient(180deg, #1c2228, #151a1f);
  color:var(--text);
  font-family:var(--font-body);
  font-weight:600; font-size:14px;
  letter-spacing:-.01em;
  box-shadow:inset 0 1px rgba(255,255,255,.04);
  transition:border-color .16s var(--ease), background .16s var(--ease), transform .12s var(--ease), box-shadow .16s var(--ease);
}
.btn.primary, button.btn.primary, .btn.block.primary{
  border-color:rgba(212,165,116,.65);
  background:linear-gradient(180deg, #e0b888, #c89458);
  color:#14110d;
  box-shadow:inset 0 1px rgba(255,255,255,.28), 0 8px 22px rgba(120,80,30,.22);
}
.btn.ghost{background:transparent; box-shadow:none}
.btn.danger,.btn.bad{border-color:rgba(208,137,125,.4); color:#f0b4aa; background:rgba(208,137,125,.06)}
.btn.small{min-height:36px; padding:8px 11px; font-size:12px; border-radius:11px}
.btn.block{width:100%}
.btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
@media(hover:hover){
  .btn:hover{border-color:rgba(212,165,116,.35); background:linear-gradient(180deg,#232a31,#191e24)}
  .btn.primary:hover{border-color:#e8c49a; background:linear-gradient(180deg,#e8c49a,#d4a574); transform:translateY(-1px)}
  .btn:active,.btn.primary:active{transform:translateY(0)}
}

input,textarea,select{
  width:100%; min-height:44px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0b0e11;
  color:var(--text);
  font-family:var(--font-body);
}
input:focus,textarea:focus,select:focus{border-color:rgba(212,165,116,.55); box-shadow:var(--focus)}
.field label{
  color:var(--muted); font-size:10px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase;
}

/* Home athlete modules — signature effort panes */
.ath-session{padding:2px 0 6px}
.ath-date,.ath-session > .ath-date{
  margin:0 0 14px;
  font-family:var(--font-display);
  font-size:clamp(26px,7vw,32px);
  font-weight:700;
  letter-spacing:.02em;
  line-height:1;
  color:var(--text);
}
.ath-athlete{display:flex; gap:12px; align-items:center; margin-bottom:18px}
.ath-avatar,.ath-flash-wrap{
  width:48px; height:48px; border-radius:50%;
  display:grid; place-items:center; flex-shrink:0;
  border:1px solid rgba(94,196,180,.35);
  background:radial-gradient(circle at 30% 25%, rgba(94,196,180,.22), rgba(18,22,26,.9));
  color:var(--zone);
}
.ath-name{margin:0; color:var(--zone); font-size:14px; font-weight:600; letter-spacing:.02em}
.ath-workout{margin:3px 0 0; color:var(--text); font-family:var(--font-display); font-size:22px; font-weight:600; letter-spacing:.02em; line-height:1.05}
.ath-module{
  display:flex; align-items:center; gap:12px;
  width:100%;
  min-height:72px;
  padding:14px 14px;
  margin:0 0 12px;
  border-radius:18px;
  border:1px solid rgba(212,165,116,.22);
  background:
    linear-gradient(120deg, rgba(212,165,116,.1), transparent 46%),
    linear-gradient(165deg, rgba(24,29,34,.95), rgba(12,16,20,.98));
  color:inherit; font:inherit; text-align:left;
  box-shadow:inset 0 1px rgba(255,255,255,.04);
  transition:border-color .16s var(--ease), transform .12s var(--ease), background .16s var(--ease);
}
.ath-module:last-child{margin-bottom:0}
.ath-module.static{cursor:default}
@media(hover:hover){
  .ath-module:not(.static):hover{
    border-color:rgba(94,196,180,.4);
    transform:translateY(-1px);
    background:
      linear-gradient(120deg, rgba(94,196,180,.1), transparent 50%),
      linear-gradient(165deg, rgba(26,32,38,.98), rgba(12,16,20,.99));
  }
}
.ath-label{
  width:86px; flex-shrink:0;
  color:var(--copper2);
  font-family:var(--font-display);
  font-size:13px; font-weight:700;
  letter-spacing:.14em; line-height:1.15;
}
.ath-module[aria-label*="Conditioning" i] .ath-label,
.ath-module:nth-of-type(2) .ath-label{color:var(--zone)}
.ath-legend{flex:1; display:flex; flex-direction:column; gap:6px}
.ath-row{display:flex; align-items:center; gap:8px}
.ath-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.ath-ll{color:var(--muted); font-size:12px; font-weight:500; min-width:64px}
.ath-lv{color:var(--text); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}
.ath-chev{color:var(--dim); font-size:18px; margin-left:4px}
.ath-cond{flex:1; display:flex; flex-direction:column; gap:8px}
.ath-hint{margin:0; color:var(--dim); font-size:11px; font-weight:500}
.ath-zbar{height:12px; border-radius:999px; overflow:hidden; display:flex; background:rgba(0,0,0,.35)}
.ath-zn{color:var(--muted); font-size:12px; font-weight:500; min-width:32px}
.ath-zr{color:var(--dim); font-size:11px; font-weight:500; margin-left:auto}
.ath-zt,.mph-ztime{color:var(--text); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}

/* Nav */
.nav,#bottomNav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  border-top:1px solid var(--line);
  background:rgba(7,9,11,.9);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  backdrop-filter:blur(18px) saturate(140%);
}
.navin,.nav .navin,#bottomNav .navin{
  display:grid; grid-template-columns:repeat(4,1fr);
  max-width:760px; margin:0 auto;
  padding:6px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav button,#bottomNav button{
  display:grid; place-items:center; gap:4px;
  min-height:52px;
  border:0; background:transparent;
  color:var(--dim);
  font-family:var(--font-body);
  font-size:10px; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase;
  border-radius:14px;
  transition:color .16s var(--ease), background .16s var(--ease);
}
.nav button.active,#bottomNav button.active{
  color:var(--copper2);
  background:rgba(212,165,116,.08);
}
.nav svg,#bottomNav svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7}

/* Calendar week */
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:14px}
.day{
  min-height:56px; padding:8px 2px;
  border:1px solid var(--line); border-radius:14px;
  background:var(--panel3); color:var(--muted); text-align:center;
  font-size:11px; font-weight:500;
  transition:border-color .16s var(--ease), background .16s var(--ease);
}
.day b{display:block; margin-top:4px; color:var(--text); font-family:var(--font-display); font-size:16px; font-weight:700}
.day.active{border-color:rgba(212,165,116,.55); background:rgba(212,165,116,.12); color:var(--copper2)}
.day.has:after{display:block; width:5px; height:5px; margin:5px auto 0; border-radius:50%; background:var(--zone); content:""}

/* Library hero */
.streamhero,.systemhero{
  padding:18px 16px;
}
.streamhero h2,.systemhero h2{
  margin:6px 0 0;
  font-family:var(--font-display);
  font-size:clamp(26px,6.5vw,32px);
  letter-spacing:.02em;
}
.quickgrid,.quickgrid{display:grid; grid-template-columns:1fr; gap:8px; margin-top:14px}
@media(min-width:420px){.quickgrid{grid-template-columns:1fr 1fr}}

/* Conditioning runtime — The Engine slate */
.mph-back{
  min-height:44px; margin-bottom:10px; padding:8px 0;
  border:0; background:transparent; color:var(--copper2);
  font-weight:600; font-size:14px;
}
.mph-hero{
  padding:16px 14px 14px;
  border:1px solid rgba(212,165,116,.28);
  border-radius:18px;
  background:
    radial-gradient(ellipse at 18% 0%, rgba(61,255,158,.08), transparent 42%),
    radial-gradient(ellipse at 88% 8%, rgba(51,196,255,.07), transparent 40%),
    linear-gradient(180deg, #14110d, #0c0c0c);
}
.mph-eye{
  margin:0 0 6px;
  color:var(--copper2);
  font-size:12px; font-weight:800;
  letter-spacing:.14em; text-transform:uppercase;
}
.mph-hero h2{
  margin:0;
  font-family:var(--font-display);
  font-size:clamp(28px,7vw,34px);
  letter-spacing:.02em; line-height:1;
}
.mph-copy{
  margin:8px 0 0;
  color:var(--muted);
  font-size:13px; line-height:1.45;
}
.mph-gauge-wrap{margin-top:8px}
.mph-hr-readout{
  display:flex; align-items:baseline; justify-content:center;
  gap:10px; margin-top:-6px;
}
.mph-hr-readout b{
  font-family:var(--font-display);
  font-size:42px; font-weight:700; letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.mph-hr-readout b small{
  margin-left:4px; color:var(--dim);
  font-size:14px; font-weight:600; letter-spacing:.08em;
}
.mph-hr-readout span{font-size:13px; font-weight:700}
.mph-hr-status,.mph-guide{
  margin:8px 0 0;
  color:var(--dim);
  font-size:12px; line-height:1.4;
}
.mph-zone{
  margin-top:8px; padding:11px 12px;
  border:1px solid var(--line); border-radius:14px;
  background:rgba(8,10,12,.55);
  transition:border-color .18s ease, background .18s ease;
}
.mph-zone.on{
  border-color:rgba(212,165,116,.55);
  background:rgba(212,165,116,.1);
}
.mph-bpm{
  display:block; margin-top:4px;
  color:var(--dim); font-size:12px; font-weight:600;
  font-variant-numeric:tabular-nums;
}
.mph-compact{margin-top:12px}
.mph-compact-meta{
  display:flex; align-items:center; gap:8px;
  margin-top:8px; color:var(--text); font-size:13px; font-weight:650;
}
.mph-compact-meta .ath-dot{width:8px; height:8px}
.mph-compact-meta span.muted{color:var(--muted); font-weight:500}
.mph-build{
  margin-top:14px; padding:15px 14px 18px;
  border:1px solid var(--line); border-radius:18px;
  background:linear-gradient(180deg, var(--panel), #101010);
}
.mph-build .title{
  font-family:var(--font-display);
  font-size:22px; letter-spacing:.02em;
}
.mph-lab{
  display:block; margin:14px 0 8px;
  color:var(--dim);
  font-size:12px; font-weight:800;
  letter-spacing:.12em; text-transform:uppercase;
}
.mph-chips{display:flex; flex-wrap:wrap; gap:8px}
.mph-chip{
  min-height:44px; min-width:44px; padding:10px 14px;
  border:1px solid var(--line2); border-radius:999px;
  background:#0d0d0d; color:var(--muted);
  font-size:13px; font-weight:650; white-space:nowrap;
  transition:border-color .18s ease, background .18s ease, color .18s ease;
}
.mph-chip.on{
  border-color:rgba(212,165,116,.65);
  background:rgba(212,165,116,.14);
  color:var(--copper2);
}
.mph-chip:focus-visible,.mph-step:focus-visible,.mph-back:focus-visible,
.ath-sticky .btn:focus-visible{
  outline:2px solid var(--copper2);
  outline-offset:2px;
}
.ath-sticky{
  position:sticky; bottom:0; z-index:25;
  display:grid; gap:8px;
  margin:16px -4px 0; padding:12px 4px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:rgba(7,9,11,.94);
  backdrop-filter:blur(12px);
}
.ath-sticky.dual{grid-template-columns:1fr 1fr}
.ath-sticky .btn{min-height:48px}

.mph-mins{
  display:flex; align-items:center; justify-content:center;
  gap:16px; margin-top:4px;
}
.mph-mins b{
  min-width:64px; text-align:center;
  font-family:var(--font-display);
  font-size:36px; font-weight:700;
  font-variant-numeric:tabular-nums;
}
.mph-step{
  width:44px; height:44px; padding:0;
  border:1px solid var(--line2); border-radius:50%;
  background:#0d0d0d; color:var(--text);
  font-size:22px; line-height:1;
}
.mph-adv{
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  margin-top:4px;
  animation:mphAdvIn .28s cubic-bezier(.22,1,.36,1) both;
}
.mph-adv .field{margin-top:0}
.mph-adv input{
  text-align:center; font-variant-numeric:tabular-nums;
  min-height:44px;
}
@keyframes mphAdvIn{
  from{opacity:0; transform:translateY(6px)}
  to{opacity:1; transform:none}
}
.mph-derived{
  margin:14px 0 0; padding:10px 12px;
  border:1px solid rgba(212,165,116,.28);
  border-radius:12px;
  background:rgba(212,165,116,.08);
  color:#e8d4b7;
  font-size:12px; line-height:1.45;
}
.mph-derived b{color:var(--copper2)}
.mph-shell{padding-bottom:12px}

@media (prefers-reduced-motion: reduce){
  .mph-chip,.mph-zone{transition:none}
  .mph-adv{animation:none}
  .shell-screen{animation:none}
}
.bigtime,.mph-gauge b{
  font-family:var(--font-display);
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}

.stat{padding:12px; border:1px solid var(--line); border-radius:14px; background:rgba(8,10,12,.5)}
.stat small{display:block; color:var(--muted); font-size:9px; letter-spacing:.12em; text-transform:uppercase}
.stat b{display:block; margin-top:4px; font-family:var(--font-display); font-size:26px; letter-spacing:.01em}

.savestatus,.savestatus{
  padding:7px 10px; border:1px solid var(--line); border-radius:999px;
  background:rgba(14,18,22,.9); color:var(--muted);
  font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
}
.savestatus.ok{border-color:rgba(125,186,154,.4); color:var(--ok)}

details.card > summary{
  cursor:pointer; list-style:none;

}
details.card > summary::-webkit-details-marker{display:none}

function athTodayZoneSeconds(){let out=emptyZoneSeconds(),day=today();
  for(const x of (S.sessions||[])){
    if(x.date!==day)continue;
    if(!(x.status==='completed'||x.status==='active'||x.id===S.active))continue;
    for(const t of (x.tasks||[])){
      if(t.kind!=='conditioning')continue;
      out=mergeZoneSeconds(out,taskZoneSeconds(t));
    }
  }
  // live in-progress on bleHr (not yet flushed)
  if(simpleCondLog) out=mergeZoneSeconds(out,bleHr.zoneSeconds);
  return out;
}
function athZoneSecondsTotal(zs){zs=zs||{};return Object.values(zs).reduce((a,v)=>a+num(v),0)}
function tickCondZoneSeconds(bpm){
  if(!simpleCondLog)return;
  let t=current(); if(!t||t.kind!=='conditioning')return;
  // Count time while the block clock is running OR as soon as strap stream has started
  let clockOn=!!(t.blockTimer&&t.blockTimer.on);
  let streaming=!!bleHr.startedAt;
  if(!clockOn&&!streaming)return;
  let now=Date.now();
  if(bleHr.lastZoneAt){
    let dt=Math.min(5,Math.max(0,(now-bleHr.lastZoneAt)/1000));
    if(dt>0){
      let zones=athZonesForReadiness(athHomeMetrics().recovery);
      let z=mphZoneForHr(bpm,zones);
      let key=z&&z.key?z.key:'recovery';
      bleHr.zoneSeconds=bleHr.zoneSeconds||emptyZoneSeconds();
      bleHr.zoneSeconds[key]=num(bleHr.zoneSeconds[key])+dt;
      t.result=t.result||{};
      t.result.zoneSeconds=mergeZoneSeconds(t.result.zoneSeconds, {});
      // keep task copy in sync with live totals for this block
      t.result.zoneSeconds=Object.assign(emptyZoneSeconds(), bleHr.zoneSeconds);
      let el=$('mphZoneTime_'+key); if(el) el.textContent=formatZoneClock(bleHr.zoneSeconds[key]);
      let homeEl=$('athZoneTime_'+key); if(homeEl) homeEl.textContent=formatZoneClock(athTodayZoneSeconds()[key]);
    }
  }
  bleHr.lastZoneAt=now;
}

function setSupersetValue(k,v){
  let t=current(),item=t?supersetCurrent(t):null;
  if(!item)return;
  item.row[k]=v;
  save('superset-edit');
}
function logSupersetSet(){
  let t=current(),item=t?supersetCurrent(t):null;
  if(!item){if(t)t.complete=true;save('superset-complete');return train()}
  let error=validateStrengthRow(item.row);
  if(error)return alert(error);
  let restSec=restSeconds((t.exercises||[])[item.exIndex]?.restSec||supersetRest(t));
  item.row.done=true;
  let next=supersetCurrent(t);
  t.complete=!next;
  save('superset-log');
  // Rest between rounds only (after last lift in the round), not between paired lifts.
  if(next&&next.exIndex===0)maybeStartRestAfterLog(restSec,true);
  train();
}

function conditioningTask(t){if(t.conditioningType==='intervals')return intervalTask(t);let r=t.result||{},metricFields=resultFields(t.modality,t);return`<div class=card style="margin-top:14px"><div class=row><div><div class=title>${condSummary(t)}</div><div class=meta>Log the result when the block is done.</div></div><div class=btns style="margin-top:0"><button class="btn small" onclick=toggleBlockClock()>${t.blockTimer?.on?'Pause':'Start timer'}</button></div></div>${conditionDropdown(t,true)}${conditioningNotesBox(t)}<div class=stats><div class="stat wide"><small>Block duration</small><b id=blockClock>${fmt(blockElapsed(t))}</b></div></div>${resultInputs(r,metricFields)}<button class="btn primary block" style="margin-top:12px" onclick=completeConditioning()>Complete block</button>${t.optional?'<button class="btn block" style="margin-top:8px" onclick=skipOptionalTask()>Skip optional block</button>':''}</div>`}function resultFields(mod,t={}){let common=['duration','distance','calories','avgHr','maxHr','notes'];if(['Bike','Rower','Ski erg'].includes(mod))common.splice(5,0,'avgWatts');if(['Run','Walk'].includes(mod))common.splice(5,0,'pace');if(mod==='Circuit'||['intervals','amrap','timecap'].includes(t.conditioningType))common.splice(1,0,'roundsCompleted');return common}function validateMetricValue(key,value){if(String(value??'').trim()===''||key==='pace'||key==='notes')return'';let n=Number(value);if(!Number.isFinite(n))return'Enter a valid number.';if(['duration','distance','calories','avgWatts','roundsCompleted'].includes(key)&&n<0)return`${key} cannot be negative.`;if(['avgHr','maxHr'].includes(key)&&(n<30||n>250))return'Heart rate must be between 30 and 250 bpm.';return''}

function intervalBase(){return{running:false,phase:'ready',round:1,remaining:0,elapsed:0,completedRounds:0,finished:false,phaseEndsAt:null,runStartedAt:null}}
function intervalElapsed(iv,at=Date.now()){return num(iv.elapsed)+(iv.running&&iv.runStartedAt?Math.max(0,Math.floor((at-iv.runStartedAt)/1000)):0)}

function intervalTask(t){let r=t.result||{},iv=normaliseInterval(t),elapsed=intervalElapsed(iv),remaining=intervalRemaining(iv);if(iv.finished)return`<div class="card timerbox" style="margin-top:14px"><div class=phase>Intervals complete</div><div class=meta>${iv.completedRounds} completed round${iv.completedRounds===1?'':'s'} · actual elapsed ${fmt(iv.elapsed)}</div></div><div class=card style="margin-top:12px">${conditioningNotesBox(t)}${resultInputs(r,resultFields(t.modality,t))}<button class="btn primary block" style="margin-top:12px" onclick=completeConditioning()>Save results and complete block</button>${t.optional?'<button class="btn block" style="margin-top:8px" onclick=skipOptionalTask()>Skip optional block</button>':''}</div>`;return`<div class="card timerbox" style="margin-top:14px"><div class=phase>${esc(t.modality)} intervals</div><div class=meta>${t.rounds} rounds · ${t.workSec}s work / ${t.restSec}s rest</div><div class=bigtime id=intervalClock>${fmt(remaining)}</div><div class=meta id=intervalMeta>${iv.phase==='ready'?'Ready':`Round ${Math.min(iv.round,t.rounds)} · ${iv.phase} · elapsed ${fmt(elapsed)}`}</div><div class=btns style="justify-content:center"><button class="btn primary" onclick=toggleIntervals()>${iv.running?'Pause':'Start'}</button><button class=btn onclick=skipInterval()>Skip phase</button><button class="btn danger" onclick=endIntervals()>End</button></div></div><div class=card style="margin-top:12px">${conditioningNotesBox(t)}${resultInputs(r,resultFields(t.modality,t))}${t.optional?'<button class="btn block" style="margin-top:8px" onclick=skipOptionalTask()>Skip optional block</button>':''}</div>`}
function toggleIntervals(){let t=current(),iv=normaliseInterval(t),now=Date.now();if(iv.finished)return;if(iv.running){iv.elapsed=intervalElapsed(iv,now);iv.remaining=intervalRemaining(iv,now);iv.running=false;iv.runStartedAt=null;iv.phaseEndsAt=null}else{if(iv.phase==='ready'){iv.phase='work';iv.remaining=num(t.workSec)}iv.running=true;iv.runStartedAt=now;iv.phaseEndsAt=now+Math.max(1,num(iv.remaining))*1000}if(iv.running)ensureCondClockRunning();save();refreshCondLogOrTrain()}
function advanceInterval(completedWork=true,boundaryAt=Date.now()){let t=current(),iv=normaliseInterval(t);if(iv.phase==='work'){if(completedWork)iv.completedRounds=Math.max(iv.completedRounds,iv.round);if(iv.round>=t.rounds)return endIntervals(boundaryAt);iv.phase='rest';iv.remaining=num(t.restSec)}else{iv.round++;iv.phase='work';iv.remaining=num(t.workSec)}if(iv.running){iv.phaseEndsAt=boundaryAt+Math.max(1,num(iv.remaining))*1000}save()}

function syncIntervalClock(t){let iv=normaliseInterval(t),now=Date.now(),guard=0;if(iv.running&&iv.phaseEndsAt){while(!iv.finished&&now>=iv.phaseEndsAt&&guard++<100){let boundary=iv.phaseEndsAt;advanceInterval(true,boundary);iv=t.interval}if(guard>=100)return endIntervals(now)}return iv}
function tickIntervals(){let t=S.active?current():null;if(!t||!taskNeedsIntervalClock(t)||!t.interval?.running)return;let iv=syncIntervalClock(t),elapsed=intervalElapsed(iv),remaining=intervalRemaining(iv),c=$('intervalClock'),m=$('intervalMeta'),p=$('intervalPhase');if(c)c.textContent=fmt(remaining);let roundLabel=iv.finished?`Complete · elapsed ${fmt(iv.elapsed)}`:(iv.phase==='ready'?'Ready':`Round ${Math.min(iv.round,t.rounds||1)} · ${iv.phase}`);if(p)p.textContent=iv.finished?'Done':roundLabel;if(m)m.textContent=iv.finished?`Complete · elapsed ${fmt(iv.elapsed)}`:`${t.rounds||1}×${t.workSec||0}s / ${t.restSec||0}s · elapsed ${fmt(elapsed)}`;save();if(iv.finished)refreshCondLogOrTrain()}

function blockElapsed(t){return num(t.blockTimer?.elapsed)+(t.blockTimer?.on?Math.floor((Date.now()-t.blockTimer.last)/1000):0)}function toggleBlockClock(){let t=current();t.blockTimer=t.blockTimer||{elapsed:0,on:false,last:null};if(t.blockTimer.on){t.blockTimer.elapsed=blockElapsed(t);t.blockTimer.on=false;t.blockTimer.last=null}else{t.blockTimer.on=true;t.blockTimer.last=Date.now()}save();if(simpleCondLog)renderSimpleCondLog();else train()}
function ensureSessionTimer(x){if(!x)return x;x.timer=x.timer||{elapsed:0,on:false,last:null};if(x.timer.elapsed===undefined)x.timer.elapsed=0;if(x.timer.on===undefined)x.timer.on=false;if(x.timer.last===undefined)x.timer.last=null;return x}

function restMenu(){sheet(`<h2>Rest timer</h2><p class=lead>Starts automatically after you Log a set when more sets remain. Change duration here anytime — timer stays in the corner.</p><div class=btns>${[30,60,90,120,180,240,300].map(n=>`<button class=btn onclick="runRest(${n})">${fmt(n)}</button>`).join('')}</div><div class=field><label>Custom seconds</label><input id=restCustom type=number value=90></div><button class="btn primary block" style="margin-top:11px" onclick="runRest(num($('restCustom').value))">Start rest</button>`)}function runRest(n){n=Math.max(1,Math.round(n));closeSheet();stopRest();restEnd=Date.now()+n*1000;drawRest();restTick=setInterval(drawRest,250)}function drawRest(){let n=Math.max(0,Math.ceil((restEnd-Date.now())/1000));$('restRoot').innerHTML=`<div class=restcorner><small>Rest</small><b>${fmt(n)}</b><button onclick=stopRest()>Dismiss</button></div>`;if(!n){stopRest();beep()}}function stopRest(){if(restTick)clearInterval(restTick);restTick=null;restEnd=0;$('restRoot').innerHTML=''}function beep(){if(S.settings.intervalVibrate&&navigator.vibrate)navigator.vibrate([100,80,100]);if(S.settings.intervalSound)try{let a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch{}}

function exerciseProfile(exerciseId='',name='',category=''){let ex=libraryExercise(exerciseId,name,category);ensureExerciseTrackingFlags(S);let entries=exerciseEntries(ex.id,ex.name),best=bestEntry(entries),last=lastEntry(entries),lastTop=last?entries.filter(e=>e.sessionId===last.sessionId).sort((a,b)=>num(b.row.weight)-num(a.row.weight))[0]:null,manual=num(ex.manual1rm),max=manual||best?.e1rm||0,allowed=percentCalcAllowed(ex);let pct=allowed?`<div class=card><div class=row><div><div class=title>1RM % calculator</div><div class=meta>Only enabled for powerlifting/Olympic lifts and manually checked custom lifts.</div></div><span class=pill>PRIVATE</span></div><div class=field><label>Training max / 1RM kg</label><input id="manual1rm_${esc(ex.id)}" type=number value="${esc(manual||Math.round(max)||'')}" placeholder="Enter 1RM or use best estimate"></div><button class="btn small primary" style="margin-top:8px" onclick="saveExerciseManualMax('${esc(ex.id)}')">Save 1RM</button>${percentTableHtml(max)}<details class=dropbox><summary>How to use this</summary><div class=dropbody>Use percentages as a guide for main barbell lifts only. This does not change your workout and does not tell you to max out.</div></details></div>`:`<div class=notice>This exercise does not have the % calculator enabled. It is kept as a normal history log. Custom exercises only get the calculator if you manually tick the option when creating/editing them.</div>`;sheet(`<h2>${esc(ex.name||name||'Exercise')}</h2><p class=lead>${esc(ex.category||category||'Custom')} · ${entries.length} logged set${entries.length===1?'':'s'}</p><div class=stack><div class=card><div class=stats><div class=stat><small>Last done</small><b>${last?dateLabel(last.date):'—'}</b></div><div class=stat><small>Best e1RM</small><b>${best?`~${Math.round(best.e1rm)}kg`:'—'}</b></div><div class="stat wide"><small>Best set</small><b style="font-size:14px">${esc(bestSetText(best))}</b></div></div><div class=meta style="margin-top:10px">${l function strengthVolume(rows){return(rows||[]).filter(x=>x.done&&x.targetKind!=='seconds').reduce((a,x)=>a+num(x.weight)*num(x.reps),0)}function taskStrengthRows(t){if(t.kind==='strength')return t.rows||[];if(t.kind==='superset')return(t.exercises||[]).flatMap(ex=>ex.rows||[]);return[]}function strengthLoad(rows){return strengthVolume(rows)/50}function hrTrimp(min,avg){if(window.EngineAdapter&&EngineAdapter.hrTrimp)return EngineAdapter.hrTrimp(min,avg,S.profile,athWhoopSampleForEngine());let rest=num(S.profile.restingHr)||60,max=num(S.profile.maxHr)||190;if(!min||!avg||avg<=rest)return 0;let hrr=Math.max(0,Math.min(1,(avg-rest)/Math.max(1,max-rest))),coef=S.profile.sex==='female'?1.67:1.92;return min*hrr*(.64*Math.exp(coef*hrr))}function condLoad(t){let r=t.result||{},min=num(r.duration)/60||blockElapsed(t)/60;if(window.EngineAdapter&&EngineAdapter.condLoad)return EngineAdapter.condLoad({minutes:min,avgHr:num(r.avgHr),profile:S.profile,whoop:athWhoopSampleForEngine()});if(num(r.avgHr)>0){return{load:hrTrimp(min,num(r.avgHr)),method:'HR-based load',confidence:'high',scored:true}}return{load:0,method:'Conditioning completed — no load score unless average heart rate is logged.',confidence:'unknown',scored:false}}function athLoadHeadlineHtml(){if(!window.LoadHeadline)return'';let r=LoadHeadline.computeLoadHeadline(S.sessions||[],{days:7});let html=LoadHeadline.loadHeadlineHtml(r);if(window.RecoveryEngine){let p=RecoveryEngine.recoveryPosture(recoveryInputForPosture());if(p.gate==='hold'||p.gate==='caution')html+=`<p class=ath-hint style="margin-top:4px">Load shown — autopilot stays conservative today.</p>`}return html}

function finishSession(){let x=ses(S.active);if(!x)return go('home');if(!x.tasks.every(t=>t.complete))return alert('Complete the current task first.');releaseTrainingWake();if(x.timer.on){x.timer.elapsed=workElapsed(x);x.timer.on=false;x.timer.last=null}let sets=x.tasks.flatMap(taskStrengthRows).filter(r=>r.done),tonnage=strengthVolume(sets),sLoad=strengthLoad(sets),conditioning=x.tasks.filter(t=>t.kind==='conditioning').map(t=>({...condLoad(t),heading:t.heading,modality:t.modality,result:t.result||{}})),cLoad=conditioning.reduce((a,c)=>a+c.load,0);x.status='completed';x.completedAt=Date.now();let duration=workElapsed(x),condSecs=(x.tasks||[]).filter(t=>t.kind==='conditioning').reduce((a,t)=>a+num(t.result?.duration),0);if(condSecs>duration)duration=condSecs;x.summary={duration,sets:sets.length,tonnage,strengthLoad:sLoad,conditioningLoad:cLoad,totalLoad:sLoad+cLoad,conditioning};x.summary.e1rm=sessionE1rmList(x);recomputeSessionStress(x);touchRecord(x,'sessions');S.active=null;S.meta=S.meta||{};S.meta.lastCompletedWorkoutId=x.id;S.meta.lastCompletedWorkoutAt=isoNow();stopRest();let hasStrength=(x.tasks||[]).some(t=>t.kind==='strength'||t.kind==='superset');if(hasStrength&&!x.sessionPainRecorded){save('completed-workout');promptSessionPain(x.id);return}finalizeSilentStrength(x);save('completed-workout');showSummary(x.id)}function recalcSessionSummary(x){let sets=(x.tasks||[]).flatMap(taskStrengthRows).filter(r=>r.done),tonnage=strengthVolume(sets),sLoad=strengthLoad(sets),conditioning=(x.tasks||[]).filter(t=>t.kind==='conditioning').map(t=>({...condLoad(t),heading:t.heading,modality:t.modality,result:t.result||{}})),cLoad=conditioning.reduce((a,c)=>a+c.load,0),duration=num(x.summary?.duration)||num(x.timer?.elapsed)||0;x.summary={duration,sets:sets.length,tonnage,strengthLoad:sLoad,conditioningLoad:cLoad,totalLoad:sLoad+cLoad,conditioning};x.summary.e1rm=sessionE1rmList(x);recomputeSessionStress(x);touchRecord(x,'sessions');return x.summary}
function completedRowsHtml(sessionId,task,ex=null){let rows=ex?ex.rows:task.rows;return`<div class=editgrid>${(rows||[]).map((r,idx)=>`<div class=editrow><div class=setnum>${r.extra?'EX':r.n}<span class=target>${esc(targetLabel(r))}</span></div><div><span class=mini>Weight</span><input type=number value="${esc(r.weight||'')}" onchange="editCompletedRow('${sessionId}','${task.id}','${ex?ex.id:''}','${r.id}','weight',this.value)"></div><div><span class=mini>${rowInputLabel(r)}</span><input type=number value="${esc(r.reps||'')}" onchange="editCompletedRow('${sessionId}','${task.id}','${ex?ex.id:''}','${r.id}','reps',this.value)"></div><div><span class=mini>RIR</span><input type=number min=0 max=10 value="${esc(r.rir||'')}" onchange="editCompletedRow('${sessionId}','${task.id}','${ex?ex.id:''}','${r.id}','rir',this.value)"></div><button class="btn small ${r.extra?'danger':''}" onclick="${r.extra?`deleteCompletedRow('${sessionId}','${task.id}','${ex?ex.id:''}','${r.id}')`:`toggleCompletedDone('${sessionId}','${task.id}','${ex?ex.id:''}','${r.id}')`}">${r.extra?'×':(r.done?'Logged':'Log')}</button>${rowE1rmHint(r)}</div>`).join('')}</div><button class="btn small" style="margin-top:8px" onclick="addCompletedRow('${sessionId}','${task.id}','${ex?ex.id:''}')">Add extra set</button>`}

<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).then(reg => {
      function activateWaiting(worker){
        if (!worker) return;
        worker.postMessage({ type: 'SKIP_WAITING' });
      }
      if (reg.waiting) activateWaiting(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed') activateWaiting(nw);
        });
      });
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update().catch(() => {});
      });
    }).catch(() => {});
  });
}
