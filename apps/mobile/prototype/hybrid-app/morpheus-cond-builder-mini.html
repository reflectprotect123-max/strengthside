<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Morpheus conditioning builder · mini</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a0a;--surf:#121212;--ink:#f5f0e8;--muted:rgba(245,240,232,.55);
  --line:rgba(245,240,232,.12);--brass:#c9a227;--copper:#b87333;
  --z-rec:#4fc3f7;--z-aer:#66bb6a;--z-ana:#ef5350;--z-neu:#ab47bc;--z-pow:#ffca28;
  --touch:44px;--ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;background:radial-gradient(120% 80% at 50% -10%,#1a1410 0%,var(--bg) 55%);
  color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;display:flex;justify-content:center;padding:24px 12px 40px}
.phone{width:min(390px,100%);background:var(--surf);border:1px solid var(--line);border-radius:28px;
  overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55);display:flex;flex-direction:column;max-height:860px}
.top{padding:18px 18px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--brass)}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;letter-spacing:.04em;
  text-transform:uppercase;margin-top:6px;line-height:1}
.sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
.scroll{flex:1;overflow:auto;padding:14px 16px 100px;-webkit-overflow-scrolling:touch}
.mph-zone-compact{display:flex;gap:5px;margin:0 0 14px;padding:8px;background:rgba(0,0,0,.35);
  border:1px solid var(--line);border-radius:12px}
.mph-zc{flex:1;min-height:36px;border-radius:8px;border:1px solid transparent;background:rgba(255,255,255,.04);
  color:var(--muted);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s,border-color .2s,color .2s}
.mph-zc:active{transform:scale(.96)}
.mph-zc.on{color:#fff;border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor,0 0 14px color-mix(in srgb,currentColor 35%,transparent)}
.mph-zc.z-recovery{color:var(--z-rec)}.mph-zc.z-aerobic{color:var(--z-aer)}.mph-zc.z-anaerobic{color:var(--z-ana)}
.mph-zc.z-neural{color:var(--z-neu)}.mph-zc.z-power{color:var(--z-pow)}
.mph-zc.z-recovery.on{background:color-mix(in srgb,var(--z-rec) 22%,transparent)}
.mph-zc.z-aerobic.on{background:color-mix(in srgb,var(--z-aer) 22%,transparent)}
.mph-zc.z-anaerobic.on{background:color-mix(in srgb,var(--z-ana) 22%,transparent)}
.mph-zc.z-neural.on{background:color-mix(in srgb,var(--z-neu) 22%,transparent)}
.mph-zc.z-power.on{background:color-mix(in srgb,var(--z-pow) 22%,transparent)}
.mph-sec{margin:0 0 18px}
.mph-lab{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(245,240,232,.72);margin:0 0 8px}
.mph-chips{display:flex;flex-wrap:wrap;gap:8px}
.mph-chip{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);
  min-height:var(--touch);padding:10px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
  transition:border-color .15s,background .15s,color .15s,transform .12s var(--ease)}
.mph-chip:active{transform:scale(.97)}
.mph-chip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mph-chip.on{border-color:var(--brass);background:rgba(201,162,39,.18);color:#ffe9a8}
.mph-row{display:flex;gap:10px;align-items:flex-end}
.mph-field{flex:1}
.mph-field input{width:100%;min-height:var(--touch);padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font-size:16px;font-weight:600}
.mph-field input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.mph-adv{margin-top:4px;padding-top:14px;border-top:1px solid var(--line);
  animation:mphIn .28s var(--ease) both}
@keyframes mphIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mph-chip:active,.mph-zc:active{transform:none}.mph-adv{animation:none}}
.sticky{position:sticky;bottom:0;margin:0 -16px -14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));
  background:linear-gradient(180deg,transparent,rgba(18,18,18,.92) 28%,rgba(18,18,18,.98));
  border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.btn{appearance:none;width:100%;min-height:52px;border:0;border-radius:14px;cursor:pointer;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--brass),var(--copper));color:#1a1208;
  box-shadow:0 8px 24px rgba(201,162,39,.28);transition:transform .15s var(--ease),filter .15s}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn:focus-visible{outline:2px solid #ffe9a8;outline-offset:3px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120%);
  background:#1c1812;border:1px solid var(--brass);color:var(--ink);padding:12px 16px;border-radius:12px;
  font-size:13px;max-width:min(340px,92vw);transition:transform .35s var(--ease);z-index:20;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="phone" role="main">
  <div class="top">
    <div class="brand">THE Hybrid System · Morpheus</div>
    <h1>Conditioning</h1>
    <p class="sub">Build today’s session · zones follow readiness</p>
  </div>
  <div class="scroll">
    <div class="mph-zone-compact" role="group" aria-label="Target zone">
      <button type="button" class="mph-zc z-recovery" data-z="recovery">Rec</button>
      <button type="button" class="mph-zc z-aerobic on" data-z="aerobic">Aer</button>
      <button type="button" class="mph-zc z-anaerobic" data-z="anaerobic">Ana</button>
      <button type="button" class="mph-zc z-neural" data-z="neural">Neu</button>
      <button type="button" class="mph-zc z-power" data-z="power">Pow</button>
    </div>
    <div class="mph-sec">
      <span class="mph-lab">Format</span>
      <div class="mph-chips" id="formats"></div>
    </div>
    <div class="mph-sec">
      <span class="mph-lab">Modality</span>
      <div class="mph-chips" id="mods"></div>
    </div>
    <div class="mph-sec">
      <span class="mph-lab">Effort</span>
      <div class="mph-chips" id="efforts"></div>
    </div>
    <div class="mph-sec">
      <span class="mph-lab">Minutes</span>
      <div class="mph-row"><div class="mph-field"><input id="mins" type="number" min="5" max="180" step="5" value="20"/></div></div>
    </div>
    <div class="mph-adv" id="adv" hidden>
      <div class="mph-sec">
        <span class="mph-lab">Rounds · work · rest</span>
        <div class="mph-row">
          <div class="mph-field"><span class="mph-lab">Rounds</span><input id="rounds" type="number" min="1" max="40" value="6"/></div>
          <div class="mph-field"><span class="mph-lab">Work s</span><input id="work" type="number" min="10" max="600" step="5" value="40"/></div>
          <div class="mph-field"><span class="mph-lab">Rest s</span><input id="rest" type="number" min="0" max="600" step="5" value="20"/></div>
        </div>
      </div>
    </div>
    <div class="sticky">
      <button type="button" class="btn" id="start">Start session</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const state={format:'steady',modality:'bike',effort:'medium',zone:'aerobic'};
const FORMATS=[{k:'steady',l:'Steady'},{k:'intervals',l:'Intervals'},{k:'tempo',l:'Tempo'},{k:'free',l:'Free'},{k:'custom',l:'Custom'}];
const MODS=[{k:'bike',l:'Bike'},{k:'row',l:'Row'},{k:'run',l:'Run'},{k:'ski',l:'Ski'},{k:'swim',l:'Swim'},{k:'other',l:'Other'}];
const EFFORTS=[{k:'easy',l:'Easy',z:'recovery'},{k:'medium',l:'Medium',z:'aerobic'},{k:'hard',l:'Hard',z:'anaerobic'}];
function chip(el,items,key,onPick){
  el.innerHTML=items.map(i=>{
    const on=state[key]===i.k;
    return `<button type="button" class="mph-chip${on?' on':''}" aria-pressed="${on?'true':'false'}" data-v="${i.k}">${i.l}</button>`;
  }).join('');
  el.querySelectorAll('.mph-chip').forEach(b=>b.addEventListener('click',()=>{state[key]=b.dataset.v;onPick&&onPick(b.dataset.v);paint();}));
}
function paintZones(){
  document.querySelectorAll('.mph-zc').forEach(b=>{
    const on=b.dataset.z===state.zone;
    b.classList.toggle('on',on);
    b.setAttribute('aria-pressed',on?'true':'false');
  });
}
function paint(){
  chip(document.getElementById('formats'),FORMATS,'format',()=>{
    const show=['intervals','tempo','custom'].includes(state.format);
    document.getElementById('adv').hidden=!show;
  });
  chip(document.getElementById('mods'),MODS,'modality');
  chip(document.getElementById('efforts'),EFFORTS,'effort',v=>{
    const e=EFFORTS.find(x=>x.k===v); if(e) state.zone=e.z;
  });
  document.getElementById('adv').hidden=!['intervals','tempo','custom'].includes(state.format);
  paintZones();
}
document.querySelectorAll('.mph-zc').forEach(b=>b.addEventListener('click',()=>{state.zone=b.dataset.z;paintZones();}));
document.getElementById('start').addEventListener('click',()=>{
  const mins=+document.getElementById('mins').value||20;
  const show=!document.getElementById('adv').hidden;
  const extra=show?` · ${document.getElementById('rounds').value}×${document.getElementById('work').value}/${document.getElementById('rest').value}s`:'';
  const t=document.getElementById('toast');
  t.textContent=`${state.format} · ${state.modality} · ${state.effort} · ${mins} min · ${state.zone}${extra}`;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600);
});
paint();
</script>
</body>
</html>
