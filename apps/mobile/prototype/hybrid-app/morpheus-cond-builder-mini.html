<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#090909" />
<title>Morpheus · Conditioning builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#090909; --panel:#121212; --line:#2a2927; --line2:#3a3732;
  --text:#f1ede5; --muted:#aaa399; --dim:#8a847a;
  --copper:#d4a574; --copper2:#e8c49a; --copper-dim:rgba(212,165,116,.14);
  --font-display:"Barlow Condensed",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:var(--font-body)}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 20% -10%, rgba(61,255,158,.07), transparent 45%),
    radial-gradient(ellipse at 90% 0%, rgba(51,196,255,.06), transparent 40%),
    var(--bg);
}
.phone{
  max-width:390px; margin:0 auto; padding:18px 16px 40px;
}
.eye{
  margin:0 0 6px; color:var(--copper2);
  font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
}
h1{
  margin:0; font-family:var(--font-display); font-weight:700;
  font-size:34px; letter-spacing:.02em; line-height:1;
}
.copy{margin:8px 0 0; color:var(--muted); font-size:13px; line-height:1.45}
.hero{
  padding:16px 14px; border:1px solid rgba(212,165,116,.28); border-radius:18px;
  background:
    radial-gradient(ellipse at 18% 0%, rgba(61,255,158,.08), transparent 42%),
    linear-gradient(180deg,#14110d,#0c0c0c);
}
.zones{display:grid; gap:8px; margin-top:10px}
.zone{
  padding:11px 12px; border:1px solid var(--line); border-radius:14px;
  background:rgba(8,10,12,.55);
}
.zone.on{border-color:rgba(212,165,116,.55); background:rgba(212,165,116,.1)}
.zone-row{display:flex; align-items:center; gap:8px}
.zone-row b{flex:1; font-size:14px}
.zone-row span{color:var(--text); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}
.dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
.bpm{display:block; margin-top:4px; color:var(--dim); font-size:12px}
.build{
  margin-top:14px; padding:15px 14px; border:1px solid var(--line); border-radius:18px;
  background:linear-gradient(180deg,var(--panel),#101010);
}
.lab{
  display:block; margin:14px 0 8px; color:var(--dim);
  font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
}
.lab:first-of-type{margin-top:10px}
.title{font-family:var(--font-display); font-size:22px; letter-spacing:.02em}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  min-height:40px; padding:8px 12px; border:1px solid var(--line2); border-radius:999px;
  background:#0d0d0d; color:var(--muted); font:inherit; font-size:13px; font-weight:600; cursor:pointer;
}
.chip.on{border-color:rgba(212,165,116,.65); background:var(--copper-dim); color:var(--copper2)}
.mins{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:4px}
.mins b{
  min-width:64px; text-align:center; font-family:var(--font-display);
  font-size:36px; font-weight:700; font-variant-numeric:tabular-nums;
}
.step{
  width:44px; height:44px; border:1px solid var(--line2); border-radius:50%;
  background:#0d0d0d; color:var(--text); font-size:22px; cursor:pointer;
}
.derived{
  margin:14px 0 0; padding:10px 12px; border:1px solid rgba(212,165,116,.28);
  border-radius:12px; background:rgba(212,165,116,.08); color:#e8d4b7;
  font-size:12px; line-height:1.45;
}
.derived b{color:var(--copper2)}
.start{
  display:block; width:100%; margin-top:14px; min-height:48px;
  border:1px solid var(--copper); border-radius:12px;
  background:var(--copper); color:#14110d;
  font:inherit; font-weight:700; cursor:pointer;
}
.start:active{opacity:.9}
.toast{
  display:none; margin-top:12px; padding:10px 12px; border-radius:12px;
  border:1px solid rgba(156,180,139,.4); background:rgba(156,180,139,.12);
  color:#c5d6bb; font-size:13px;
}
.toast.show{display:block}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<script>
const FORMATS=[
  {key:'steady',name:'Steady-state'},
  {key:'intervals',name:'Intervals'},
  {key:'tempo',name:'Tempo'},
  {key:'free',name:'Free run'},
  {key:'custom',name:'Custom'},
];
const EFFORTS=[
  {key:'easy',name:'Easy',zone:'recovery',rpe:'3–4',cue:'full sentences'},
  {key:'medium',name:'Medium',zone:'aerobic',rpe:'5–7',cue:'short sentences'},
  {key:'hard',name:'Hard',zone:'anaerobic',rpe:'8–9.5',cue:'a few words at a time'},
];
const MODS=['Run','Walk','Bike','Rower','Ski erg','Circuit','Other'];
const ZONES=[
  {key:'recovery',name:'Recovery',color:'#33c4ff',lo:95,hi:117},
  {key:'aerobic',name:'Aerobic',color:'#3dff9e',lo:118,hi:140},
  {key:'anaerobic',name:'Anaerobic',color:'#ffc24d',lo:141,hi:163},
  {key:'peak',name:'Peak',color:'#ff5b57',lo:164,hi:190},
];

let state={fmt:'steady',effort:'easy',modality:'Run',minutes:30};

function effort(){return EFFORTS.find(e=>e.key===state.effort)||EFFORTS[0]}
function fmt(){return FORMATS.find(f=>f.key===state.fmt)||FORMATS[0]}
function zone(){return ZONES.find(z=>z.key===effort().zone)||ZONES[0]}

function chip(list,key,onClick){
  return list.map(item=>{
    const k=item.key||item, name=item.name||item, on=(state[key]===k)?' on':'';
    const mark=on?'✓ ':'';
    return `<button type="button" class="chip${on}" onclick="${onClick}('${k}')">${mark}${name}</button>`;
  }).join('');
}

function render(toast){
  const e=effort(), z=zone(), f=fmt();
  document.getElementById('app').innerHTML=`
    <section class="hero">
      <p class="eye">Morpheus · build</p>
      <h1>Conditioning</h1>
      <p class="copy">Pick format, modality and effort. Today’s <b style="color:${z.color}">${z.name}</b> band is ${z.lo}–${z.hi} bpm for ${e.name}.</p>
    </section>
    <div class="zones">
      ${ZONES.map(row=>`
        <div class="zone${row.key===z.key?' on':''}">
          <div class="zone-row">
            <span class="dot" style="background:${row.color}"></span>
            <b>${row.name}</b>
            <span>${row.lo}–${row.hi}</span>
          </div>
          <span class="bpm">bpm band for today</span>
        </div>`).join('')}
    </div>
    <section class="build">
      <p class="eye">Builder</p>
      <div class="title">What kind of conditioning?</div>
      <span class="lab">Format</span>
      <div class="chips">${chip(FORMATS,'fmt','setFmt')}</div>
      <span class="lab">Modality</span>
      <div class="chips">${chip(MODS.map(m=>({key:m,name:m})),'modality','setMod')}</div>
      <span class="lab">Effort</span>
      <div class="chips">${chip(EFFORTS,'effort','setEffort')}</div>
      <span class="lab">Minutes</span>
      <div class="mins">
        <button type="button" class="step" aria-label="fewer minutes" onclick="nudge(-5)">−</button>
        <b>${state.minutes||'—'}</b>
        <button type="button" class="step" aria-label="more minutes" onclick="nudge(5)">+</button>
      </div>
      <p class="derived">
        <b>${e.name}</b> · RPE ${e.rpe} · ${e.cue} · HR zone
        <b style="color:${z.color}">${z.name} ${z.lo}–${z.hi}</b><br>
        ${f.name} · ${state.modality} · ${state.minutes||'—'} min
      </p>
      <button type="button" class="start" onclick="start()">Start session</button>
      <div class="toast${toast?' show':''}" id="toast">${toast||''}</div>
    </section>`;
}

function setFmt(k){state.fmt=k;render()}
function setMod(k){state.modality=k;render()}
function setEffort(k){state.effort=k;render()}
function nudge(d){state.minutes=Math.max(0,Math.min(120,(state.minutes||0)+d));render()}
function start(){
  const e=effort(), z=zone(), f=fmt();
  render(`${f.name} · ${state.modality} · ${e.name} · ${state.minutes} min → ${z.name} ${z.lo}–${z.hi}`);
}

render();
</script>
</body>
</html>
