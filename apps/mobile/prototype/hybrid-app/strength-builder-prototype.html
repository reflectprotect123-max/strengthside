<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090b" />
  <title>Strength builder prototype — logger 1:1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0c0e;
      --panel: #12161a;
      --panel2: #181d22;
      --panel3: #0e1216;
      --line: rgba(255, 255, 255, 0.08);
      --line2: rgba(255, 255, 255, 0.12);
      --text: #eef2f4;
      --muted: #9aa3ab;
      --dim: #6f7881;
      --copper: #d4a574;
      --copper2: #e8c49a;
      --gold: var(--copper);
      --gold2: var(--copper2);
      --tap-min: 44px;
      --font-body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Barlow Condensed", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
    }
    button, input, select {
      font: inherit;
      color: inherit;
    }
    .shell {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100svh;
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(9, 9, 9, 0.92);
      backdrop-filter: blur(14px);
    }
    .top .back {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      padding: 8px 0;
      min-height: var(--tap-min);
    }
    .top .save {
      border: 1px solid var(--copper);
      background: var(--copper);
      color: #14110d;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      min-height: var(--tap-min);
    }
    .top-meta { flex: 1; min-width: 0; }
    .top-meta .eyebrow {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    .top-meta input {
      width: 100%;
      margin-top: 4px;
      border: 0;
      background: transparent;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      padding: 0;
      color: var(--text);
    }
    .top-meta input:focus { outline: none; }
    main { padding: 16px; }
    .proto-note {
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px dashed var(--line2);
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .lift-stack { display: grid; gap: 10px; }
    .lift-card {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      overflow: hidden;
    }
    .lift-card.linked { border-color: rgba(196, 154, 92, 0.4); }
    .logger-screen {
      display: flex;
      flex-direction: column;
      padding: 18px 16px 16px;
      min-height: 0;
    }
    .logger-screen > .eyebrow {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 700;
    }
    .exercise-name {
      width: 100%;
      border: 0;
      background: transparent;
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.02em;
      padding: 0;
      color: var(--text);
    }
    .exercise-name:focus { outline: none; }
    .exercise-name::placeholder { color: var(--dim); }
    .progressline {
      margin-top: 6px;
      font-size: 12px;
      color: var(--dim);
    }
    .setchip {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 6px;
      margin-top: 14px;
      padding: 6px 12px;
      border: 1px solid rgba(212, 165, 116, 0.35);
      border-radius: 999px;
      background: rgba(212, 165, 116, 0.1);
      color: var(--gold2);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .setchip b { font-size: 15px; font-variant-numeric: tabular-nums; }
    .hero {
      margin-top: 18px;
      padding: 20px 16px 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      text-align: center;
    }
    .hero-label {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .hero-metrics {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 8px;
    }
    .metric-col { min-width: 0; }
    .metric-val {
      font-family: var(--font-display);
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--dim);
    }
    .metric-sep {
      font-size: 28px;
      color: var(--dim);
      font-weight: 300;
      padding-bottom: 28px;
    }
    .metric-select {
      width: 100%;
      margin-top: 8px;
      padding: 8px 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel3);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
    }
    .metric-select:focus {
      outline: none;
      border-color: var(--copper);
    }
    .rest-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .rest-row label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: left;
    }
    .rest-row input {
      width: 88px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel3);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .hero-target {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .hero-target b { color: var(--gold2); font-weight: 600; }
    .slider-card {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel3);
      opacity: 0.72;
      pointer-events: none;
    }
    .sliderhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .sliderhead b { font-size: 15px; font-weight: 600; }
    .slidervalue { color: var(--gold2); font-size: 13px; font-weight: 700; }
    .slider-card input[type="range"] {
      width: 100%;
      height: 6px;
      appearance: none;
      background: linear-gradient(90deg, var(--copper) 0%, var(--gold2) 55%, #d0897d 100%);
      border-radius: 999px;
    }
    .sliderlabels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 10px;
      color: var(--dim);
    }
    .sliderlabels span { max-width: 56px; text-align: center; line-height: 1.2; }
    .next-wrap { margin-top: 16px; opacity: 0.72; pointer-events: none; }
    .btn {
      display: block;
      width: 100%;
      min-height: 52px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 12px;
    }
    .btn.primary {
      background: linear-gradient(180deg, #e8c49a, #c9955f);
      border-color: #c9955f;
      color: #1a1208;
    }
    .btn.ghost {
      margin-top: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      min-height: 44px;
    }
    .ss-lock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin: 0;
      padding: 8px 10px;
      min-height: 36px;
      border: 1px dashed var(--line2);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .ss-lock.on {
      border-style: solid;
      border-color: rgba(196, 154, 92, 0.55);
      background: rgba(196, 154, 92, 0.12);
      color: var(--gold2);
    }
    .sticky-foot {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(9, 9, 9, 0.94);
      backdrop-filter: blur(12px);
    }
    .sticky-foot .shell { max-width: 420px; margin: 0 auto; padding: 0; }
    .add-lift {
      width: 100%;
      min-height: var(--tap-min);
      border: 1px dashed var(--line2);
      border-radius: 14px;
      background: transparent;
      color: var(--copper2);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <button type="button" class="back">← Library</button>
      <div class="top-meta">
        <div class="eyebrow">Hybrid Strength · builder</div>
        <input type="text" value="Full Body A" aria-label="Template name" />
      </div>
      <button type="button" class="save">Save</button>
    </header>

    <main>
      <p class="proto-note">
        Prototype — each exercise is a full logger card. Edit name, metric dropdowns, and rest.
        Hero values stay <strong>—</strong> until session start. No rest timer. Slider / Next are static.
      </p>

      <div class="lift-stack" id="liftStack"></div>
    </main>
  </div>

  <div class="sticky-foot">
    <div class="shell">
      <button type="button" class="add-lift" id="addLift">+ Add lift</button>
    </div>
  </div>

  <script>
    const LOAD_METRICS = [
      { key: 'weight_kg', label: 'Weight (kg)' },
      { key: 'weight_pct_wm', label: 'Weight % (of WM)' },
      { key: 'weight_lwp', label: 'Weight (LWP)' },
    ];
    const EFFORT_METRICS = [
      { key: 'reps', label: 'Reps' },
      { key: 'reps_range', label: 'Reps (min–max)' },
      { key: 'time_sec', label: 'Time (seconds)' },
      { key: 'distance_m', label: 'Distance (metres)' },
    ];

    const lifts = [
      { id: 1, name: 'Bench Press', load: 'weight_pct_wm', effort: 'reps', rest: 150, linked: false },
      { id: 2, name: 'Barbell Row', load: 'weight_pct_wm', effort: 'reps', rest: 75, linked: true },
      { id: 3, name: 'Back Squat', load: 'weight_pct_wm', effort: 'reps', rest: 180, linked: false },
    ];

    function fmtRest(sec) {
      sec = Math.max(0, Number(sec) || 0);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function options(list, selected) {
      return list
        .map((m) => `<option value="${m.key}"${m.key === selected ? ' selected' : ''}>${m.label}</option>`)
        .join('');
    }

    function renderCard(lift, index, total) {
      const linkedClass = lift.linked ? ' linked' : '';
      return `
        <article class="lift-card${linkedClass}" data-id="${lift.id}">
          <div class="logger-screen dial-strength">
            <div class="eyebrow">Hybrid Strength · builder</div>
            <input class="exercise-name" type="text" value="${lift.name.replace(/"/g, '&quot;')}" placeholder="Exercise name" data-field="name" aria-label="Exercise name" />
            <div class="progressline" data-rest-line>One set at a time · Rest ${fmtRest(lift.rest)} after Next</div>
            <div class="setchip">Set <b>1</b> / 3</div>
            <div class="hero">
              <div class="hero-label">Load & effort · session start fills numbers</div>
              <div class="hero-metrics">
                <div class="metric-col">
                  <div class="metric-val">—</div>
                  <select class="metric-select" data-field="load" aria-label="Load metric">${options(LOAD_METRICS, lift.load)}</select>
                </div>
                <div class="metric-sep">×</div>
                <div class="metric-col">
                  <div class="metric-val">—</div>
                  <select class="metric-select" data-field="effort" aria-label="Effort metric">${options(EFFORT_METRICS, lift.effort)}</select>
                </div>
              </div>
              <div class="rest-row">
                <label for="rest-${lift.id}">Rest (seconds)</label>
                <input id="rest-${lift.id}" type="number" min="0" step="5" value="${lift.rest}" data-field="rest" aria-label="Rest seconds" />
              </div>
              <div class="hero-target">Target: <b>RIR 2</b> · next set adjusts from slider</div>
            </div>
            <div class="slider-card">
              <div class="sliderhead"><b>How hard was that set?</b><span class="slidervalue">Medium · RIR ~2</span></div>
              <input type="range" disabled min="0" max="5" step="1" value="2" aria-hidden="true" />
              <div class="sliderlabels">
                <span>Very easy</span><span>Easy</span><span>Medium</span><span>Hard</span><span>Max</span><span>Didn't finish</span>
              </div>
            </div>
            <div class="next-wrap">
              <button type="button" class="btn primary" disabled>Next set</button>
              <button type="button" class="btn ghost" disabled>+ Extra set</button>
            </div>
          </div>
        </article>
        ${
          index < total - 1
            ? `<button type="button" class="ss-lock${lift.linked ? ' on' : ''}" data-link="${lift.id}" aria-pressed="${lift.linked}">
                <span aria-hidden="true">⛓</span> ${lift.linked ? 'Superset linked' : 'Link as superset'}
              </button>`
            : ''
        }`;
    }

    function render() {
      const stack = document.getElementById('liftStack');
      stack.innerHTML = lifts.map((l, i) => renderCard(l, i, lifts.length)).join('');

      stack.querySelectorAll('[data-field="name"]').forEach((el) => {
        el.addEventListener('input', () => {
          const lift = lifts.find((x) => x.id === Number(el.closest('.lift-card').dataset.id));
          if (lift) lift.name = el.value;
        });
      });

      stack.querySelectorAll('[data-field="rest"]').forEach((el) => {
        el.addEventListener('input', () => {
          const card = el.closest('.lift-card');
          const lift = lifts.find((x) => x.id === Number(card.dataset.id));
          if (!lift) return;
          lift.rest = Number(el.value) || 0;
          card.querySelector('[data-rest-line]').textContent =
            'One set at a time · Rest ' + fmtRest(lift.rest) + ' after Next';
        });
      });

      stack.querySelectorAll('[data-field="load"], [data-field="effort"]').forEach((el) => {
        el.addEventListener('change', () => {
          const lift = lifts.find((x) => x.id === Number(el.closest('.lift-card').dataset.id));
          if (lift) lift[el.dataset.field] = el.value;
        });
      });

      stack.querySelectorAll('[data-link]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = Number(btn.dataset.link);
          const lift = lifts.find((x) => x.id === id);
          if (!lift) return;
          lift.linked = !lift.linked;
          render();
        });
      });
    }

    document.getElementById('addLift').addEventListener('click', () => {
      lifts.push({
        id: Date.now(),
        name: '',
        load: 'weight_pct_wm',
        effort: 'reps',
        rest: 120,
        linked: false,
      });
      render();
      const inputs = document.querySelectorAll('.exercise-name');
      inputs[inputs.length - 1].focus();
    });

    render();
  </script>
</body>
</html>
