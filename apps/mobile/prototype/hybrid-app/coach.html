<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>THE Hybrid — Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --color-copper:#d4a574;--color-copper-bright:#e8c49a;
  --color-bg-deep:#07090b;--color-bg-panel:#12161a;--line:rgba(255,255,255,.08);
  --bg:var(--color-bg-deep);--panel:var(--color-bg-panel);--panel2:#181d22;
  --text:#eef2f4;--muted:#9aa3ab;--dim:#6f7881;
  --copper:var(--color-copper);--copper2:var(--color-copper-bright);
  --ok:#7dba9a;--warn:#d4a35b;
  --coach-nav-bg:var(--color-bg-deep);--coach-header-bg:#0a0c0e;
  --coach-main-bg:#f4f6f8;--coach-main-text:#1a2228;--coach-main-muted:#5c6874;
  --coach-card-bg:#ffffff;--coach-card-border:#e2e8ef;
  --coach-nav-active:rgba(212,165,116,.14);--coach-link:#3d7ea6;
  --font-body:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-display:"Barlow Condensed",ui-sans-serif,system-ui,sans-serif;
  --tap:44px;--focus:0 0 0 3px rgba(232,196,154,.45);
}
*{box-sizing:border-box}
html,body{margin:0;font-family:var(--font-body);min-height:100%}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--focus)}
h1,h2,h3,p{margin:0}
a{color:var(--coach-link)}
.hidden{display:none !important}

/* gate — dark */
#gate{max-width:440px;margin:0 auto;padding:48px 20px;background:var(--bg);color:var(--text);min-height:100vh}
.mark{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--copper);border-radius:11px;color:var(--copper2);font-weight:800;letter-spacing:.12em;font-size:12px;flex-shrink:0}
.acct{display:grid;gap:8px;margin-top:18px}
.acct button{text-align:left;color:var(--text)}
#gate .btn{min-height:var(--tap);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-weight:650;color:var(--text)}
#gate .btn.primary{border-color:var(--copper);background:var(--copper);color:#14110d}
#gate .field{margin-top:12px}
#gate label{display:block;margin:0 0 6px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
#gate input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:#0d1114;color:var(--text)}
#gate .muted{color:var(--muted);font-size:13px;line-height:1.45}

/* shell — R0 */
#coachApp.coach-shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;background:var(--coach-main-bg)}
.coach-side{display:flex;flex-direction:column;padding:16px 10px;background:var(--coach-nav-bg);border-right:1px solid var(--line);color:var(--text);min-height:100vh}
.coach-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px}
.coach-brand b{font-size:14px;letter-spacing:.02em}
.coach-brand .sub{color:var(--dim);font-size:11px;margin-top:2px}
.coach-side nav{display:grid;gap:2px;flex:1;margin-top:8px}
.coach-side nav button,.coach-side .nav-soon{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--dim);text-align:left;font-size:13px;font-weight:500}
.coach-side nav button.on{background:var(--coach-nav-active);color:var(--copper2)}
.coach-side nav button:hover:not(.on):not(:disabled){background:rgba(255,255,255,.04);color:var(--text)}
.coach-side nav button:disabled,.coach-side .nav-soon{opacity:.42;cursor:not-allowed}
.nav-ico{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.coach-side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:6px}
.coach-side-foot button{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 10px;border:0;border-radius:8px;background:transparent;color:var(--dim);font-size:12px;text-align:left}
.coach-side-foot button:hover{color:var(--text);background:rgba(255,255,255,.04)}

.coach-workspace{display:flex;flex-direction:column;min-width:0;min-height:100vh}
.coach-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;min-height:56px;background:var(--coach-header-bg);border-bottom:1px solid var(--line);color:var(--text)}
.coach-header-title{font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coach-header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.coach-header-actions .btn-assist{min-height:36px;padding:8px 14px;border:0;border-radius:8px;background:var(--copper);color:#14110d;font-size:12px;font-weight:700;opacity:.45;cursor:not-allowed}
.icon-btn{position:relative;display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--dim);cursor:not-allowed;opacity:.45}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75}
.icon-btn .badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--copper);color:#14110d;font-size:9px;font-weight:800;line-height:16px;text-align:center}
.coach-avatar{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--copper2)}

.coach-body{display:grid;flex:1;grid-template-columns:1fr}
.coach-body.has-rail{grid-template-columns:1fr 280px}
.coach-main{padding:24px 28px 48px;color:var(--coach-main-text);min-width:0}
.coach-rail{padding:24px 16px;border-left:1px solid var(--coach-card-border);background:var(--coach-main-bg);min-width:0}

/* light main components */
.eyebrow{color:var(--copper);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.muted{color:var(--coach-main-muted);font-size:13px;line-height:1.45}
.coach-main h1,.coach-main h2{color:var(--coach-main-text)}
.coach-main h1{font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:.01em}
.btn{min-height:var(--tap);padding:10px 14px;border:1px solid var(--coach-card-border);border-radius:10px;background:var(--coach-card-bg);font-weight:650;color:var(--coach-main-text)}
.btn.primary{border-color:var(--copper);background:var(--copper);color:#14110d}
.btn.ghost{background:transparent;border-color:transparent;color:var(--coach-link)}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:7px 10px;font-size:12px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--coach-card-border);border-radius:10px;background:#fff;color:var(--coach-main-text)}
textarea{min-height:88px;resize:vertical}
label{display:block;margin:0 0 6px;color:var(--coach-main-muted);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.field{margin-top:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.card{padding:16px;border:1px solid var(--coach-card-border);border-radius:12px;background:var(--coach-card-bg);box-shadow:0 1px 2px rgba(16,24,32,.04)}
.pill{padding:4px 8px;border:1px solid var(--coach-card-border);border-radius:999px;color:var(--coach-main-muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:#f8fafc}
.slice-stub{display:grid;place-items:center;min-height:280px;text-align:center;gap:8px}
.slice-stub b{font-family:var(--font-display);font-size:22px}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.metric{text-align:center;padding:10px 4px}
.metric b{display:block;font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--coach-main-text)}
.metric span{color:var(--coach-main-muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.ring{width:42px;height:42px;margin:0 auto 4px}
.dateh{margin:22px 0 10px;font-family:var(--font-display);font-size:20px;letter-spacing:.02em;color:var(--coach-main-text)}
.presc{text-decoration:line-through;color:var(--coach-main-muted)}
.actual{color:#9a7348;font-weight:600}
.grid7{display:grid;grid-template-columns:88px repeat(7,1fr);gap:6px;align-items:stretch}
.cell{min-height:72px;padding:8px;border:1px solid var(--coach-card-border);border-radius:10px;background:#fff;text-align:left;font-size:12px;color:var(--coach-main-text)}
.cell.empty{color:var(--coach-main-muted)}
.wk{display:grid;place-items:center;color:var(--coach-main-muted);font-size:12px}
.cal{display:grid;gap:8px}
.item{padding:12px;border:1px solid var(--coach-card-border);border-radius:12px;background:var(--coach-card-bg);text-align:left;width:100%;color:var(--coach-main-text)}

@media(max-width:980px){
  #coachApp.coach-shell{grid-template-columns:1fr}
  .coach-side{flex-direction:row;flex-wrap:wrap;min-height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .coach-side nav{display:flex;flex-wrap:wrap;margin:0}
  .coach-body.has-rail{grid-template-columns:1fr}
  .coach-rail{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="gate"></div>
<div id="coachApp" class="coach-shell hidden"></div>
<script src="./coach-loop.js"></script>
<script>
const L = window.CoachLoop;
let S = L.loadState();
const ui = { view:'home', lib:'programs', athleteId:null, teamId:null, programId:null, templateId:null, sessionId:null, expandAll:false, expanded:{}, err:'' };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dash = (v) => (v == null || v === '') ? '–' : String(v);
function persist(){ L.saveState(null, S); }
function account(){ return L.currentAccount(S); }
function athleteBy(id){ return (S.athletes||[]).find(a => a.id === id); }
function tpl(id){ return (S.templates||[]).find(t => t.id === id); }
function ses(id){ return (S.sessions||[]).find(s => s.id === id); }
function prog(id){ return (S.programs||[]).find(p => p.id === id); }
function team(id){ return (S.teams||[]).find(t => t.id === id); }

function go(view, extra){ Object.assign(ui, extra||{}, { view }); render(); }
function signOut(){ L.logout(S); persist(); ui.view='home'; render(); }
function resetDemo(){ S = L.resetState(); ui.view='home'; render(); }

function tryLogin(email, pass){
  const r = L.login(S, email, pass);
  if (!r.ok){ ui.err = r.error; render(); return; }
  if (r.account.role !== 'coach'){
    L.logout(S);
    ui.err = 'Coach workspace only. Athletes use the Hybrid athlete app.';
    persist(); render(); return;
  }
  ui.err = ''; persist(); render();
}

function navActive(key){
  if (key === 'home') return ui.view === 'home';
  if (key === 'athletes') return ui.view === 'athletes' || ui.view === 'athlete';
  if (key === 'teams') return ui.view === 'teams' || ui.view === 'team';
  if (key === 'library') return ['library','program','session'].includes(ui.view);
  return false;
}

function headerTitle(){
  const coachName = S.coach?.name || 'Dan';
  if (ui.view === 'home') return `Welcome back, Coach ${coachName}`;
  const titles = { athletes:'My Athletes', athlete:'My Athletes', teams:'My Teams', team:'My Teams', library:'Library', program:'Library', session:'Library', assign:'Assign' };
  return titles[ui.view] || 'Coach Home';
}

function icon(name){
  const paths = {
    home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    users:'<path d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1"/><circle cx="9" cy="7" r="3"/><path d="M22 19v-1a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    teams:'<path d="M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M18 11a2.5 2.5 0 1 0 0-5"/><path d="M6 11a2.5 2.5 0 1 0 0-5"/><path d="M12 13c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4Z"/>',
    library:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
    chart:'<path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-6"/>',
    gym:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 18h.01"/>',
    support:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 4.8 1 2 2 0 0 0-1 1.8V14"/><path d="M12 17h.01"/>',
    msg:'<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>',
    bell:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  };
  return `<svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||''}</svg>`;
}

function sliceStub(label, slice){
  return `<div class="card slice-stub"><div><b>${esc(label)}</b><p class="muted">${esc(slice)} — layout stub for chrome review (R0)</p></div></div>`;
}

function ringSvg(done, total){
  const p = total ? done/total : 0;
  const c = 2*Math.PI*16;
  const dashn = `${p*c} ${c}`;
  return `<svg class="ring" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="16" fill="none" stroke="#e2e8ef" stroke-width="4"/><circle cx="21" cy="21" r="16" fill="none" stroke="#7dba9a" stroke-width="4" stroke-dasharray="${dashn}" stroke-linecap="round" transform="rotate(-90 21 21)"/></svg>`;
}

function metricRow(m){
  return `<div class="metrics">
    <div class="metric">${ringSvg(m.blocksDone,m.blocksTotal)}<b>${m.blocksDone}/${m.blocksTotal}</b><span>Blocks</span></div>
    <div class="metric"><b>${dash(m.readiness)}</b><span>Readiness</span></div>
    <div class="metric"><b>${dash(m.minutes)}</b><span>Minutes</span></div>
    <div class="metric"><b>${m.intensity==null?'–':m.intensity+'%'}</b><span>Intensity</span></div>
    <div class="metric"><b>${m.volumeKg?m.volumeKg+' kg':'–'}</b><span>Volume</span></div>
  </div>`;
}

function blockDetail(session){
  return (session.blocks||[]).map(b => {
    const letter = b.letter ? `<span class="pill">${esc(b.letter)}</span>` : '';
    const ex = (b.exercises||[]).map(e => {
      const actual = L.actualLine(e);
      const swap = e.swappedFrom ? `<div class="muted">Swapped from ${esc(e.swappedFrom.name)}</div>` : '';
      return `<div style="margin-top:10px"><div class="row"><b>${esc(e.name)}</b><span class="pill">${esc(e.metric||'Weight')}</span></div>
        <div class="presc">${esc(L.prescriptionLine(e))}</div>
        ${actual?`<div class="actual">${esc(actual)}</div>`:''}
        ${e.athleteNote?`<div class="muted">${esc(e.athleteNote)}</div>`:''}${swap}</div>`;
    }).join('');
    const notes = b.notes ? `<div class="muted" style="margin-top:8px">${esc(b.notes)}</div>` : '';
    return `<div class="card" style="margin-top:10px"><div class="row"><div><span class="eyebrow">${esc(b.category||b.type)}</span><div>${letter} ${esc(b.heading||'')}</div></div><span class="pill">${b.scoring==='weight'?'For Weight':'For Completion'}</span></div>${notes}${ex}</div>`;
  }).join('');
}

function saveComment(sessionId){
  const el = document.getElementById('note-'+sessionId);
  const s = ses(sessionId); if (!s || !el) return;
  L.setSessionComment(s, el.value, L.IDS.coach);
  persist(); render();
}

function toggleCard(id){ ui.expanded[id] = !ui.expanded[id]; render(); }

function feedHtml(){
  const athletes = S.athletes||[];
  const list = ui.filterAthlete && ui.filterAthlete!=='all'
    ? (S.sessions||[]).filter(s => s.athleteId===ui.filterAthlete)
    : S.sessions;
  const groups = L.groupFeed(list, athletes);
  const cards = groups.map(g => `<div class="dateh">${esc(g.label)}</div>` + g.cards.map(c => {
    const s = c.session;
    const open = ui.expandAll || ui.expanded[s.id];
    const title = s.sessionTitle || s.name;
    return `<div class="card">
      <div class="row"><div><div class="eyebrow">${esc(c.athlete?.name||'Athlete')}</div><h2 style="font-size:20px;margin-top:4px">${esc(s.name)}</h2><div class="muted">${esc(title)}</div></div><span class="pill">${esc(s.status)}</span></div>
      ${metricRow(c.metrics)}
      <div class="row" style="margin-top:12px"><button class="btn ghost small" onclick="toggleCard('${s.id}')">${open?'See less':'See more'}</button></div>
      ${open?blockDetail(s):''}
      <div class="field"><label>Session note</label><textarea id="note-${s.id}">${esc(s.comment?.text||'')}</textarea>
      <button class="btn primary block" style="margin-top:8px" onclick="saveComment('${s.id}')">Save session note</button></div>
    </div>`;
  }).join('')).join('') || `<div class="card muted">No logged sessions found — try a different filter.</div>`;
  const opts = athletes.map(a => `<option value="${a.id}" ${ui.filterAthlete===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
  return `<div class="topbar"><div><div class="eyebrow">Latest feed</div></div>
    <select onchange="ui.filterAthlete=this.value;render()" aria-label="Filter athletes"><option value="all">All Athletes</option>${opts}</select></div>
    <label class="row" style="justify-content:flex-start;gap:8px;margin-bottom:8px"><input type="checkbox" ${ui.expandAll?'checked':''} onchange="ui.expandAll=this.checked;render()" style="width:auto"> Expand all cards</label>
    <div class="stack">${cards}</div>`;
}

function needsHtml(){
  const n = L.needsProgramming(S);
  if (!n.athletes.length && !n.teams.length) {
    return `<div class="card"><div class="eyebrow">Needs programming</div><h2 style="font-size:20px;margin-top:6px">All clear</h2><p class="muted" style="margin-top:8px">There are currently no teams or athletes in need of programming.</p></div>`;
  }
  return `<div class="card"><div class="eyebrow">Needs programming</div><h2 style="font-size:20px;margin-top:6px">${n.athletes.length} athlete${n.athletes.length===1?'':'s'}</h2><p class="muted" style="margin-top:8px">${n.athletes.map(a=>esc(a.name)).join(', ')}</p></div>`;
}

function monthKey(){ return L.today().slice(0,7); }

function athleteListHtml(){ return sliceStub('My Athletes', 'Slice S5'); }
function athleteCalHtml(){ return sliceStub('Athlete calendar', 'Slice S7'); }
function teamListHtml(){ return sliceStub('My Teams', 'Slice S4'); }
function teamCalHtml(){ return sliceStub('Team calendar', 'Slice S6'); }
function libraryHtml(){ return sliceStub('Library', 'Slice S2 / S9'); }
function programHtml(){ return sliceStub('Program grid', 'Slice S3'); }
function sessionHtml(){ return sliceStub('Session builder', 'Slice S3'); }
function assignHtml(){ return sliceStub('Assign program', 'Slice S6'); }

function coachChrome(body){
  const nav = [
    ['home','Coach Home','home',false],
    ['athletes','Athletes','users',false],
    ['teams','Teams','teams',false],
    ['library','Library','library',false],
    ['analytics','Analytics','chart',true],
    ['gym','Gym Tools','gym',true],
  ];
  const navHtml = nav.map(([k,l,ic,off]) => {
    if (off) return `<span class="nav-soon" title="Coming soon">${icon(ic)}${esc(l)}</span>`;
    return `<button type="button" class="${navActive(k)?'on':''}" onclick="go('${k}')">${icon(ic)}${esc(l)}</button>`;
  }).join('');
  const initials = String(S.coach?.name||'D').slice(0,1).toUpperCase();
  const hasRail = ui.view === 'home';
  return `<aside class="coach-side" aria-label="Coach navigation">
    <div class="coach-brand"><div class="mark">TH</div><div><b>THE Hybrid</b><div class="sub">hybrid S&C · coach workspace</div></div></div>
    <nav>${navHtml}</nav>
    <div class="coach-side-foot">
      <span class="nav-soon" title="Coming soon">${icon('support')}Support</span>
      <button type="button" onclick="resetDemo()">Reset demo data</button>
      <button type="button" onclick="signOut()">Sign out</button>
    </div>
  </aside>
  <div class="coach-workspace">
    <header class="coach-header">
      <div class="coach-header-title">${esc(headerTitle())}</div>
      <div class="coach-header-actions">
        <button type="button" class="btn-assist" disabled title="Coming soon">Manage Assistants</button>
        <span class="icon-btn" title="Coming soon">${icon('msg')}<span class="badge">·</span></span>
        <span class="icon-btn" title="Coming soon">${icon('bell')}</span>
        <div class="coach-avatar" title="Coach profile">${initials}</div>
      </div>
    </header>
    <div class="coach-body ${hasRail?'has-rail':''}">
      <main class="coach-main">${body}</main>
      ${hasRail?`<aside class="coach-rail" aria-label="Programming status">${needsHtml()}</aside>`:''}
    </div>
  </div>`;
}

function gateHtml(){
  return `<div class="row" style="justify-content:flex-start;gap:12px"><div class="mark">TH</div><div><b>THE Hybrid System</b><div class="muted">Coach workspace · local demo</div></div></div>
    <h1 style="margin-top:28px;font-family:var(--font-display);font-size:40px">Sign in</h1>
    <p class="muted" style="margin-top:8px">Coach demo. Password: <b>demo</b></p>
    ${ui.err?`<div class="card" style="margin-top:12px;border-color:#d0897d">${esc(ui.err)}</div>`:''}
    <div class="field"><label>Email</label><input id="em" value="dan@thehybrid.local"></div>
    <div class="field"><label>Password</label><input id="pw" type="password" value="demo"></div>
    <button class="btn primary block" style="margin-top:16px" onclick="tryLogin($('em').value,$('pw').value)">Sign in</button>
    <div class="acct">
      <button class="btn" onclick="tryLogin('dan@thehybrid.local','demo')">Coach · Dan</button>
    </div>
    <p class="muted" style="margin-top:24px">Athletes keep using the Hybrid athlete app. This page is coach-only.</p>`;
}

function render(){
  const acc = account();
  $('gate').classList.add('hidden');
  $('coachApp').classList.add('hidden');
  if (!acc || acc.role !== 'coach'){
    if (acc) { L.logout(S); persist(); }
    $('gate').classList.remove('hidden'); $('gate').innerHTML = gateHtml(); return;
  }
  $('coachApp').classList.remove('hidden');
  let body = '';
  if (ui.view==='athletes') body = athleteListHtml();
  else if (ui.view==='athlete') body = athleteCalHtml();
  else if (ui.view==='teams') body = teamListHtml();
  else if (ui.view==='team') body = teamCalHtml();
  else if (ui.view==='library') body = libraryHtml();
  else if (ui.view==='program') body = programHtml();
  else if (ui.view==='session') body = sessionHtml();
  else if (ui.view==='assign') body = assignHtml();
  else body = feedHtml();
  $('coachApp').innerHTML = coachChrome(body);
}

window.go=go; window.signOut=signOut; window.resetDemo=resetDemo; window.tryLogin=tryLogin;
window.saveComment=saveComment; window.toggleCard=toggleCard;
render();
</script>
</body>
</html>
