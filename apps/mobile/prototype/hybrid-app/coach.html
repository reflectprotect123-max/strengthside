<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>THE Hybrid — Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --color-copper:#d4a574;--color-copper-bright:#e8c49a;
  --color-bg-deep:#07090b;--color-bg-panel:#12161a;--line:rgba(255,255,255,.08);
  --bg:var(--color-bg-deep);--panel:var(--color-bg-panel);--panel2:#181d22;
  --text:#eef2f4;--muted:#9aa3ab;--dim:#6f7881;
  --copper:var(--color-copper);--copper2:var(--color-copper-bright);
  --ok:#7dba9a;--warn:#d4a35b;
  --coach-nav-bg:var(--color-bg-deep);--coach-header-bg:#0a0c0e;
  --coach-main-bg:#07090b;--coach-main-text:var(--text);--coach-main-muted:var(--muted);
  --coach-card-bg:var(--panel);--coach-card-border:var(--line);
  --coach-nav-active:rgba(212,165,116,.14);--coach-link:var(--copper2);
  --font-body:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-display:"Barlow Condensed",ui-sans-serif,system-ui,sans-serif;
  --tap:44px;--focus:0 0 0 3px rgba(232,196,154,.45);
}
*{box-sizing:border-box}
html,body{margin:0;font-family:var(--font-body);min-height:100%}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--focus)}
h1,h2,h3,p{margin:0}
a{color:var(--coach-link)}
.hidden{display:none !important}

/* gate — dark */
#gate{max-width:440px;margin:0 auto;padding:48px 20px;background:var(--bg);color:var(--text);min-height:100vh}
.mark{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--copper);border-radius:11px;color:var(--copper2);font-weight:800;letter-spacing:.12em;font-size:12px;flex-shrink:0}
.acct{display:grid;gap:8px;margin-top:18px}
.acct button{text-align:left;color:var(--text)}
#gate .btn{min-height:var(--tap);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-weight:650;color:var(--text)}
#gate .btn.primary{border-color:var(--copper);background:var(--copper);color:#14110d}
#gate .field{margin-top:12px}
#gate label{display:block;margin:0 0 6px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
#gate input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:#0d1114;color:var(--text)}
#gate .muted{color:var(--muted);font-size:13px;line-height:1.45}

/* shell — R0 */
#coachApp.coach-shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;background:var(--coach-main-bg)}
.coach-side{display:flex;flex-direction:column;padding:16px 10px;background:var(--coach-nav-bg);border-right:1px solid var(--line);color:var(--text);min-height:100vh}
.coach-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px}
.coach-brand b{font-size:14px;letter-spacing:.02em}
.coach-brand .sub{color:var(--dim);font-size:11px;margin-top:2px}
.coach-side nav{display:grid;gap:2px;flex:1;margin-top:8px}
.coach-side nav button,.coach-side .nav-soon{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--dim);text-align:left;font-size:13px;font-weight:500}
.coach-side nav button.on{background:var(--coach-nav-active);color:var(--copper2)}
.coach-side nav button:hover:not(.on):not(:disabled){background:rgba(255,255,255,.04);color:var(--text)}
.coach-side nav button:disabled,.coach-side .nav-soon{opacity:.42;cursor:not-allowed}
.nav-ico{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.coach-side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:6px}
.coach-side-foot button{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 10px;border:0;border-radius:8px;background:transparent;color:var(--dim);font-size:12px;text-align:left}
.coach-side-foot button:hover{color:var(--text);background:rgba(255,255,255,.04)}

.coach-workspace{display:flex;flex-direction:column;min-width:0;min-height:100vh}
.coach-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;min-height:56px;background:var(--coach-header-bg);border-bottom:1px solid var(--line);color:var(--text)}
.coach-header-title{font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coach-header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.coach-header-actions .btn-assist{min-height:36px;padding:8px 14px;border:0;border-radius:8px;background:var(--copper);color:#14110d;font-size:12px;font-weight:700;opacity:.45;cursor:not-allowed}
.icon-btn{position:relative;display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--dim);cursor:not-allowed;opacity:.45}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75}
.icon-btn .badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--copper);color:#14110d;font-size:9px;font-weight:800;line-height:16px;text-align:center}
.coach-avatar{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--copper2)}

.coach-body{display:grid;flex:1;grid-template-columns:1fr}
.coach-body.has-rail{grid-template-columns:1fr 280px}
.coach-main{padding:24px 28px 48px;color:var(--coach-main-text);min-width:0}
.coach-rail{padding:24px 16px;border-left:1px solid var(--line);background:var(--coach-main-bg);min-width:0}

/* main — Track Dawn dark (matches athlete app) */
.eyebrow{color:var(--copper);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.muted{color:var(--coach-main-muted);font-size:13px;line-height:1.45}
.coach-main h1,.coach-main h2{color:var(--coach-main-text)}
.coach-main h1{font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:.01em}
.btn{min-height:var(--tap);padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-weight:650;color:var(--text)}
.btn.primary{border-color:var(--copper);background:var(--copper);color:#14110d}
.btn.ghost{background:transparent;border-color:transparent;color:var(--copper2)}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:7px 10px;font-size:12px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#0d1114;color:var(--text)}
textarea{min-height:88px;resize:vertical}
label{display:block;margin:0 0 6px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.field{margin-top:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.card{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.pill{padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.03)}
.slice-stub{display:grid;place-items:center;min-height:280px;text-align:center;gap:8px}
.slice-stub b{font-family:var(--font-display);font-size:22px}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.metric{text-align:center;padding:10px 4px}
.metric b{display:block;font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--coach-main-text)}
.metric span{color:var(--coach-main-muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.ring{width:42px;height:42px;margin:0 auto 4px}
.dateh{margin:22px 0 10px;font-family:var(--font-display);font-size:20px;letter-spacing:.02em;color:var(--coach-main-text)}
.presc{text-decoration:line-through;color:var(--dim)}
.actual{color:var(--copper2);font-weight:600}
.grid7{display:grid;grid-template-columns:88px repeat(7,1fr);gap:6px;align-items:stretch}
.cell{min-height:72px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#0e1216;text-align:left;font-size:12px;color:var(--text)}
.cell.empty{color:var(--dim)}
.wk{display:grid;place-items:center;color:var(--muted);font-size:12px}
.cal{display:grid;gap:8px}
.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:left;width:100%;color:var(--text)}

/* session builder — R3 */
.lib-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px}
.lib-tabs button{padding:8px 12px;border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-9px}
.lib-tabs button.on{color:var(--copper2);border-bottom-color:var(--copper)}
.builder-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.builder-title{font-family:var(--font-display);font-size:28px;font-weight:600;background:transparent;border:0;border-bottom:1px solid transparent;padding:4px 0;width:min(100%,520px);color:var(--text)}
.builder-title:focus{border-bottom-color:var(--copper);outline:none}
.builder-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.instructions-box{position:relative}
.instructions-box textarea{min-height:120px}
.char-count{position:absolute;top:8px;right:10px;font-size:11px;color:var(--dim)}
.block-card{margin-top:16px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden}
.block-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.letter-badge{display:grid;place-items:center;width:32px;height:32px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--copper2);flex-shrink:0}
.block-head select{max-width:180px;min-height:36px;padding:6px 8px;font-size:12px}
.block-head .grow{flex:1;min-width:120px}
.block-body{padding:14px}
.exercise-card{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.exercise-pick{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0d1114;color:var(--text);font-weight:650}
.exercise-pick:hover{border-color:rgba(212,165,116,.35)}
.rx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.rx-grid .field{margin-top:0}
.set-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.set-table th,.set-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.set-table td{color:var(--text);font-size:13px;text-transform:none;font-weight:500;letter-spacing:0}
.set-table input{padding:6px 8px;font-size:13px}
.add-block-bar{margin-top:20px}
.kebab-btn{min-height:32px;min-width:32px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted)}
.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50;padding:20px}
.picker-panel{width:min(520px,100%);max-height:min(80vh,640px);overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px}
.picker-list{display:grid;gap:6px;margin-top:12px;max-height:360px;overflow:auto}
.picker-item{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0d1114;color:var(--text)}
.picker-item:hover{border-color:rgba(212,165,116,.35)}
.template-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}
.template-row:hover{border-color:rgba(212,165,116,.25)}
.engine-box{margin-top:4px}
.engine-plan{margin:0 0 12px;padding:10px 12px;border:1px solid rgba(212,165,116,.22);border-radius:10px;background:rgba(212,165,116,.06);color:var(--copper2);font-weight:650;font-size:14px}
.engine-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.efforts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.eff{display:grid;gap:2px;min-height:56px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:#0d1114;color:var(--muted);text-align:left}
.eff.on{border-color:rgba(212,165,116,.55);background:rgba(212,165,116,.12);color:var(--copper2)}
.eff b{font-size:14px}
.eff small{font-size:11px;color:var(--dim);font-weight:500}
.eff.on small{color:var(--copper)}
.mins-row{display:flex;align-items:center;gap:8px}
.mins-row input{flex:1}
.mins-row button{min-width:40px;min-height:40px}
.engine-hint{margin:8px 0 0;color:var(--dim);font-size:12px;line-height:1.4}

/* program grid — R4 */
.prog-list{display:grid;gap:10px}
.prog-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.prog-row-main{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:0;border:0;background:transparent;color:var(--text);cursor:pointer;min-height:44px}
.prog-row-main:hover b{color:var(--copper2)}
.prog-row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prog-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.prog-title{font-family:var(--font-display);font-size:28px;font-weight:600;background:transparent;border:0;border-bottom:1px solid transparent;padding:4px 0;width:min(100%,420px);color:var(--text)}
.prog-title:focus{border-bottom-color:var(--copper);outline:none}
.prog-icons{display:flex;gap:6px;align-items:center}
.prog-icon{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--muted)}
.prog-icon:hover{color:var(--copper2);border-color:rgba(212,165,116,.35)}
.prog-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.prog-week{margin-top:22px}
.prog-week-label{font-family:var(--font-display);font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.prog-days{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.prog-day-h{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:0 4px 6px}
.prog-cell{position:relative;min-height:120px;padding:0;border:1px solid var(--line);border-radius:10px;background:#0e1216;text-align:left;color:var(--text);overflow:visible}
.prog-cell.empty{cursor:pointer}
.prog-cell.empty:hover{border-color:rgba(212,165,116,.3)}
.prog-card{padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.prog-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.prog-card-mark{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;border:1px solid var(--copper);color:var(--copper2);font-size:9px;font-weight:800;letter-spacing:.06em;flex-shrink:0}
.prog-card-title{font-size:12px;font-weight:650;line-height:1.3;flex:1;min-width:0}
.prog-card-body{display:flex;gap:8px;align-items:flex-start;margin-top:auto}
.prog-card-body .letter-badge{width:24px;height:24px;font-size:11px}
.prog-card-ex{font-size:12px;line-height:1.35}
.prog-card-ex .muted{font-size:11px;margin-top:2px}
.kebab-menu{position:absolute;top:36px;right:6px;z-index:20;min-width:180px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:0 12px 32px rgba(0,0,0,.45);display:grid;gap:2px}
.kebab-menu button{width:100%;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--text);font-size:13px;min-height:40px}
.kebab-menu button:hover{background:rgba(212,165,116,.12);color:var(--copper2)}
.kebab-menu button.danger{color:#d0897d}
.prog-footer{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* calendars + roster — R5/R6 */
.roster-table{width:100%;border-collapse:collapse;font-size:13px}
.roster-table th,.roster-table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.roster-table th{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.linkish{background:transparent;border:0;padding:0;color:var(--copper2);font-weight:650;cursor:pointer;text-align:left}
.cal-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:16px 0;flex-wrap:wrap}
.cal-month{margin-top:8px}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{min-height:88px;border:1px solid var(--line);border-radius:10px;background:#0e1216;padding:6px;position:relative}
.cal-day.expanded{min-height:120px;border-color:rgba(212,165,116,.35)}
.cal-day-num{width:100%;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;text-align:left;padding:2px 4px;cursor:pointer}
.cal-day-body{display:grid;gap:6px;margin-top:4px}
.cal-chip{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);position:relative;font-size:11px}
.cal-chip.unpublished{border-style:dashed;opacity:.92}
.cal-chip.published{border-color:rgba(125,186,154,.45)}
.cal-chip-top{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
.cal-chip-title{font-weight:650;line-height:1.25}
.cal-chip-meta{margin-top:4px;color:var(--dim);font-size:10px}
.cal-empty-actions{margin-top:6px}

@media(max-width:980px){
  #coachApp.coach-shell{grid-template-columns:1fr}
  .coach-side{flex-direction:row;flex-wrap:wrap;min-height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .coach-side nav{display:flex;flex-wrap:wrap;margin:0}
  .coach-body.has-rail{grid-template-columns:1fr}
  .coach-rail{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="gate"></div>
<div id="coachApp" class="coach-shell hidden"></div>
<script src="./coach-loop.js"></script>
<script src="./coach-nutrition.js"></script>
<script src="./coach-bridge.js"></script>
<script src="./coach-views.js"></script>
<script>
const L = window.CoachLoop;
const N = window.CoachNutrition;
let S = L.loadState();
const ui = {
  view:'home', lib:'sessions', athleteId:null, teamId:null, programId:null, templateId:null, sessionId:null,
  expandAll:false, expanded:{}, err:'', exPicker:null, exSearch:'',
  cellMenu:null, cellPick:null, progSearch:'',
  calMonth:null, calDay:null, chipMenu:null, libPick:null,
  assignTeamId:null, assignStart:null, nutAthleteId:null,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dash = (v) => (v == null || v === '') ? '–' : String(v);
function persist(){
  L.saveState(null, S);
  if (window.CoachBridge) CoachBridge.push(S);
}
function account(){ return L.currentAccount(S); }
function athleteBy(id){ return (S.athletes||[]).find(a => a.id === id); }
function tpl(id){ return (S.templates||[]).find(t => t.id === id); }
function ses(id){ return (S.sessions||[]).find(s => s.id === id); }
function prog(id){ return (S.programs||[]).find(p => p.id === id); }
function team(id){ return (S.teams||[]).find(t => t.id === id); }

function go(view, extra){
  Object.assign(ui, extra||{}, { view });
  if (view !== 'session') ui.exPicker = null;
  if (view !== 'program') { ui.cellMenu = null; ui.cellPick = null; }
  if (view === 'assign' && !ui.assignTeamId && S.teams && S.teams[0]) ui.assignTeamId = S.teams[0].id;
  if ((view === 'athlete' || view === 'team') && !ui.calMonth) ui.calMonth = L.today().slice(0, 7);
  render();
}
function openSession(templateId){
  ui.templateId = templateId;
  ui.lib = 'sessions';
  ui.exPicker = null;
  ui.view = 'session';
  render();
}
function openProgram(programId){
  ui.programId = programId;
  ui.lib = 'programs';
  ui.cellMenu = null;
  ui.cellPick = null;
  ui.view = 'program';
  render();
}
function signOut(){ L.logout(S); persist(); ui.view='home'; render(); }
function resetDemo(){
  S = L.resetState();
  Object.assign(ui, { view:'home', lib:'sessions', templateId:null, programId:null, cellMenu:null, cellPick:null, exPicker:null, err:'' });
  render();
}

function tryLogin(email, pass){
  const r = L.login(S, email, pass);
  if (!r.ok){ ui.err = r.error; render(); return; }
  if (r.account.role !== 'coach'){
    L.logout(S);
    ui.err = 'Coach workspace only. Athletes use the Hybrid athlete app.';
    persist(); render(); return;
  }
  ui.err = ''; persist(); render();
}

function navActive(key){
  if (key === 'home') return ui.view === 'home';
  if (key === 'athletes') return ui.view === 'athletes' || ui.view === 'athlete';
  if (key === 'teams') return ui.view === 'teams' || ui.view === 'team';
  if (key === 'library') return ['library','program','session'].includes(ui.view);
  if (key === 'nutrition') return ui.view === 'nutrition';
  return false;
}

function headerTitle(){
  const coachName = S.coach?.name || 'Dan';
  if (ui.view === 'home') return `Welcome back, Coach ${coachName}`;
  const titles = { athletes:'My Athletes', athlete:'My Athletes', teams:'My Teams', team:'My Teams', library:'Library', program:'Library', session:'Library', assign:'Assign', nutrition:'Nutrition' };
  return titles[ui.view] || 'Coach Home';
}

function sliceStub(label, slice){
  return `<div class="card slice-stub"><div><b>${esc(label)}</b><p class="muted">${esc(slice)} — layout stub for chrome review (R0)</p></div></div>`;
}

function ringSvg(done, total){
  const p = total ? done/total : 0;
  const c = 2*Math.PI*16;
  const dashn = `${p*c} ${c}`;
  return `<svg class="ring" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="16" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/><circle cx="21" cy="21" r="16" fill="none" stroke="#7dba9a" stroke-width="4" stroke-dasharray="${dashn}" stroke-linecap="round" transform="rotate(-90 21 21)"/></svg>`;
}

function metricRow(m){
  return `<div class="metrics">
    <div class="metric">${ringSvg(m.blocksDone,m.blocksTotal)}<b>${m.blocksDone}/${m.blocksTotal}</b><span>Blocks</span></div>
    <div class="metric"><b>${dash(m.readiness)}</b><span>Readiness</span></div>
    <div class="metric"><b>${dash(m.minutes)}</b><span>Minutes</span></div>
    <div class="metric"><b>${m.intensity==null?'–':m.intensity+'%'}</b><span>Intensity</span></div>
    <div class="metric"><b>${m.volumeKg?m.volumeKg+' kg':'–'}</b><span>Volume</span></div>
  </div>`;
}

function blockDetail(session){
  return (session.blocks||[]).map(b => {
    const letter = b.letter ? `<span class="pill">${esc(b.letter)}</span>` : '';
    const ex = (b.exercises||[]).map(e => {
      const actual = L.actualLine(e);
      const swap = e.swappedFrom ? `<div class="muted">Swapped from ${esc(e.swappedFrom.name)}</div>` : '';
      return `<div style="margin-top:10px"><div class="row"><b>${esc(e.name)}</b><span class="pill">${esc(e.metric||'Weight')}</span></div>
        <div class="presc">${esc(L.prescriptionLine(e))}</div>
        ${actual?`<div class="actual">${esc(actual)}</div>`:''}
        ${e.athleteNote?`<div class="muted">${esc(e.athleteNote)}</div>`:''}${swap}</div>`;
    }).join('');
    const notes = b.notes ? `<div class="muted" style="margin-top:8px">${esc(b.notes)}</div>` : '';
    return `<div class="card" style="margin-top:10px"><div class="row"><div><span class="eyebrow">${esc(b.category||b.type)}</span><div>${letter} ${esc(b.heading||'')}</div></div><span class="pill">${b.scoring==='weight'?'For Weight':'For Completion'}</span></div>${notes}${ex}</div>`;
  }).join('');
}

function saveComment(sessionId){
  const el = document.getElementById('note-'+sessionId);
  const s = ses(sessionId); if (!s || !el) return;
  L.setSessionComment(s, el.value, L.IDS.coach);
  persist(); render();
}

function toggleCard(id){ ui.expanded[id] = !ui.expanded[id]; render(); }

function feedHtml(){
  const athletes = S.athletes||[];
  const list = ui.filterAthlete && ui.filterAthlete!=='all'
    ? (S.sessions||[]).filter(s => s.athleteId===ui.filterAthlete)
    : S.sessions;
  const groups = L.groupFeed(list, athletes);
  const cards = groups.map(g => `<div class="dateh">${esc(g.label)}</div>` + g.cards.map(c => {
    const s = c.session;
    const open = ui.expandAll || ui.expanded[s.id];
    const title = s.sessionTitle || s.name;
    return `<div class="card">
      <div class="row"><div><div class="eyebrow">${esc(c.athlete?.name||'Athlete')}</div><h2 style="font-size:20px;margin-top:4px">${esc(s.name)}</h2><div class="muted">${esc(title)}</div></div><span class="pill">${esc(s.status)}</span></div>
      ${metricRow(c.metrics)}
      <div class="row" style="margin-top:12px"><button class="btn ghost small" onclick="toggleCard('${s.id}')">${open?'See less':'See more'}</button></div>
      ${open?blockDetail(s):''}
      <div class="field"><label>Session note</label><textarea id="note-${s.id}">${esc(s.comment?.text||'')}</textarea>
      <button class="btn primary block" style="margin-top:8px" onclick="saveComment('${s.id}')">Save session note</button></div>
    </div>`;
  }).join('')).join('') || `<div class="card muted">No logged sessions found — try a different filter.</div>`;
  const opts = athletes.map(a => `<option value="${a.id}" ${ui.filterAthlete===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
  return `<div class="topbar"><div><div class="eyebrow">Latest feed</div></div>
    <select onchange="ui.filterAthlete=this.value;render()" aria-label="Filter athletes"><option value="all">All Athletes</option>${opts}</select></div>
    <label class="row" style="justify-content:flex-start;gap:8px;margin-bottom:8px"><input type="checkbox" ${ui.expandAll?'checked':''} onchange="ui.expandAll=this.checked;render()" style="width:auto"> Expand all cards</label>
    <div class="stack">${cards}</div>`;
}

function needsHtml(){
  const n = L.needsProgramming(S);
  if (!n.athletes.length && !n.teams.length) {
    return `<div class="card"><div class="eyebrow">Needs programming</div><h2 style="font-size:20px;margin-top:6px">All clear</h2><p class="muted" style="margin-top:8px">There are currently no teams or athletes in need of programming.</p></div>`;
  }
  return `<div class="card"><div class="eyebrow">Needs programming</div><h2 style="font-size:20px;margin-top:6px">${n.athletes.length} athlete${n.athletes.length===1?'':'s'}</h2><p class="muted" style="margin-top:8px">${n.athletes.map(a=>esc(a.name)).join(', ')}</p></div>`;
}

function monthKey(){ return ui.calMonth || L.today().slice(0,7); }

function athleteListHtml(){ return CoachViews.athleteListHtml(); }
function athleteCalHtml(){ return CoachViews.athleteCalHtml(); }
function teamListHtml(){ return CoachViews.teamListHtml(); }
function teamCalHtml(){ return CoachViews.teamCalHtml(); }
function assignHtml(){ return CoachViews.assignHtml(); }
function nutritionHtml(){ return CoachViews.nutritionHtml(); }

function libraryTabs(){
  const tabs = [['programs','Programs'],['sessions','Sessions'],['exercises','Exercises']];
  return `<div class="lib-tabs">${tabs.map(([k,l]) => `<button type="button" class="${ui.lib===k?'on':''}" onclick="ui.lib='${k}';ui.cellMenu=null;render()">${l}</button>`).join('')}</div>`;
}

function programsListHtml(){
  const q = String(ui.progSearch||'').trim().toLowerCase();
  const list = (S.programs||[]).filter(p => !q || String(p.name).toLowerCase().includes(q));
  const rows = list.map(p => {
    const filled = Object.keys(p.cells||{}).length;
    const weeks = Number(p.weeks)||1;
    return `<div class="prog-row">
      <button type="button" class="prog-row-main" onclick="openProgram('${p.id}')">
        <div><b>${esc(p.name)}</b><div class="muted">${weeks} week${weeks===1?'':'s'} · ${filled} session${filled===1?'':'s'} placed</div></div>
        <span class="pill">Open grid</span>
      </button>
      <div class="prog-row-actions">
        <button type="button" class="btn small" onclick="go('assign',{programId:'${p.id}'})">Assign</button>
      </div>
    </div>`;
  }).join('');
  return `<div class="row" style="margin-bottom:16px;flex-wrap:wrap">
      <div class="field" style="margin:0;flex:1;min-width:180px"><label>Search programs</label>
        <input value="${esc(ui.progSearch)}" oninput="ui.progSearch=this.value;render()" placeholder="Hybrid Strength…"></div>
      <button type="button" class="btn primary small" onclick="newProgram()">Create program</button>
    </div>
    <div class="prog-list">${rows || '<div class="card muted">No programs yet.</div>'}</div>`;
}

function libraryHtml(){
  const tabs = libraryTabs();
  if (ui.lib === 'sessions') {
    const rows = (S.templates||[]).map(t => {
      const n = (t.blocks||[]).length;
      const kinds = (t.blocks||[]).map(b => b.category || b.type).filter(Boolean).slice(0,2).join(' · ');
      return `<button type="button" class="template-row" data-template-id="${esc(t.id)}" onclick="openSession('${t.id}')">
        <div><b>${esc(t.name)}</b><div class="muted">${n} block${n===1?'':'s'}${kinds?' · '+esc(kinds):''}</div></div>
        <span class="pill">Edit</span></button>`;
    }).join('');
    return `${tabs}
      <div class="row" style="margin-bottom:16px"><p class="muted">Session templates — same block shape the athlete app logs.</p>
      <button type="button" class="btn primary small" onclick="newTemplate()">New session</button></div>
      <div class="stack">${rows || '<div class="card muted">No session templates yet.</div>'}</div>`;
  }
  if (ui.lib === 'exercises') {
    return `${tabs}<div class="card slice-stub" style="min-height:200px"><b>Exercises catalog</b><p class="muted">Slice S8 — use exercise picker in session builder for now.</p></div>`;
  }
  ui.lib = 'programs';
  return `${tabs}${programsListHtml()}`;
}

function newTemplate(){
  const t = L.makeTemplate({
    name:'New session',
    coachInstructions:'',
    blocks:[L.makeBlock({ heading:'Strength', type:'strength', category:'Strength/Power', scoring:'weight', exercises:[L.makeExercise({ name:'Back Squat', exerciseId:'core-back-squat', sets:3, reps:'5', load:'', metric:'Weight' })] })],
  });
  S.templates.push(t);
  persist();
  openSession(t.id);
}

function newProgram(){
  const p = L.emptyProgram('New program', 1);
  S.programs = S.programs || [];
  S.programs.push(p);
  persist();
  openProgram(p.id);
}

function cellSummary(templateId){
  const t = tpl(templateId);
  if (!t) return null;
  const work = (t.blocks||[]).find(b => b.type === 'strength' || b.type === 'conditioning') || (t.blocks||[])[0];
  if (!work) return { title:t.name, letter:'A', line:'Empty session', sets:'' };
  if (work.type === 'conditioning') {
    return { title:t.name, letter:work.letter||'A', line:L.condPlanLineBlock(work)||work.heading||'Conditioning', sets:work.targetDurationMin?`${work.targetDurationMin} min`:'' };
  }
  if (work.type === 'text') {
    return { title:t.name, letter:work.letter||'A', line:work.heading||'Notes', sets:'' };
  }
  const e = (work.exercises||[])[0];
  return { title:t.name, letter:work.letter||'A', line:e?.name||work.heading||'Exercise', sets:e?.sets?`${e.sets} Sets`:'' };
}

function toggleCellMenu(week, day, ev){
  if (ev) ev.stopPropagation();
  const cur = ui.cellMenu;
  if (cur && cur.week === week && cur.day === day) ui.cellMenu = null;
  else ui.cellMenu = { week, day };
  ui.cellPick = null;
  render();
}

function openCellPick(week, day, mode){
  ui.cellPick = { week, day, mode: mode || 'set' };
  ui.cellMenu = null;
  render();
}

function closeCellPick(){ ui.cellPick = null; render(); }

function placeCellTemplate(templateId){
  const pick = ui.cellPick; if (!pick) return;
  const p = prog(ui.programId); if (!p) return;
  if (pick.mode === 'set' || pick.mode === 'copy' || pick.mode === 'move') {
    L.setProgramCell(p, pick.week, pick.day, templateId);
    if (pick.mode === 'move' && pick.fromWeek != null) {
      L.setProgramCell(p, pick.fromWeek, pick.fromDay, null);
    }
  }
  ui.cellPick = null;
  persist(); render();
}

function clearCell(week, day){
  const p = prog(ui.programId); if (!p) return;
  L.setProgramCell(p, week, day, null);
  ui.cellMenu = null;
  persist(); render();
}

function startCopyCell(week, day){
  const p = prog(ui.programId); if (!p) return;
  const tid = (p.cells||{})[L.cellKey(week, day)];
  if (!tid) return;
  ui.cellMenu = null;
  ui.cellPick = { week:null, day:null, mode:'copyTarget', templateId:tid };
  render();
}

function startMoveCell(week, day){
  const p = prog(ui.programId); if (!p) return;
  const tid = (p.cells||{})[L.cellKey(week, day)];
  if (!tid) return;
  ui.cellMenu = null;
  ui.cellPick = { week:null, day:null, mode:'moveTarget', templateId:tid, fromWeek:week, fromDay:day };
  render();
}

function onEmptyCell(week, day){
  const pick = ui.cellPick;
  if (pick && (pick.mode === 'copyTarget' || pick.mode === 'moveTarget')) {
    const p = prog(ui.programId); if (!p) return;
    L.setProgramCell(p, week, day, pick.templateId);
    if (pick.mode === 'moveTarget') L.setProgramCell(p, pick.fromWeek, pick.fromDay, null);
    ui.cellPick = null;
    persist(); render();
    return;
  }
  openCellPick(week, day, 'set');
}

function saveCellAsTemplate(week, day){
  const p = prog(ui.programId); if (!p) return;
  const tid = (p.cells||{})[L.cellKey(week, day)];
  const src = tpl(tid); if (!src) return;
  const fresh = L.makeTemplate({
    name: src.name + ' (copy)',
    coachInstructions: src.coachInstructions || '',
    blocks: (src.blocks||[]).map(b => {
      const { id, letter, ...rest } = b;
      const exercises = (b.exercises||[]).map(e => {
        const { id:eid, ...er } = e;
        return L.makeExercise(er);
      });
      return L.makeBlock({ ...rest, exercises });
    }),
  });
  S.templates.push(fresh);
  ui.cellMenu = null;
  persist();
  openSession(fresh.id);
}

function addWeek(){
  const p = prog(ui.programId); if (!p) return;
  L.addProgramWeek(p);
  persist(); render();
}

function progIcon(name){
  const paths = {
    eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
    folder:'<path d="M12 10v6"/><path d="M9 13h6"/><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  };
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||''}</svg>`;
}

function templatePickerHtml(){
  const pick = ui.cellPick;
  if (!pick || (pick.mode !== 'set' && pick.mode !== 'copy' && pick.mode !== 'move')) return '';
  const list = (S.templates||[]).map(t =>
    `<button type="button" class="picker-item" onclick="placeCellTemplate('${t.id}')"><span>${esc(t.name)}</span><span class="muted">${(t.blocks||[]).length} blocks</span></button>`
  ).join('');
  return `<div class="picker-overlay" onclick="if(event.target===this)closeCellPick()">
    <div class="picker-panel" role="dialog" aria-label="Choose session template">
      <div class="row"><b>Add from library</b><button type="button" class="btn ghost small" onclick="closeCellPick()">Close</button></div>
      <p class="muted" style="margin-top:8px">Week ${pick.week} · Day ${pick.day}</p>
      <div class="picker-list">${list || '<div class="muted">No session templates.</div>'}</div>
    </div></div>`;
}

function programCellHtml(p, week, day){
  const key = L.cellKey(week, day);
  const tid = (p.cells||{})[key];
  const menuOn = ui.cellMenu && ui.cellMenu.week === week && ui.cellMenu.day === day;
  if (!tid) {
    const hint = ui.cellPick && (ui.cellPick.mode === 'copyTarget' || ui.cellPick.mode === 'moveTarget')
      ? `<span class="muted" style="padding:12px;display:block;font-size:11px">${ui.cellPick.mode==='moveTarget'?'Drop here to move':'Drop here to copy'}</span>`
      : '';
    return `<button type="button" class="prog-cell empty" aria-label="Week ${week} Day ${day} empty" onclick="onEmptyCell(${week},${day})">${hint}</button>`;
  }
  const sum = cellSummary(tid) || { title:'Session', letter:'A', line:'—', sets:'' };
  const menu = menuOn ? `<div class="kebab-menu" role="menu">
      <button type="button" onclick="openSession('${tid}')">Edit session</button>
      <button type="button" onclick="startCopyCell(${week},${day})">Copy</button>
      <button type="button" onclick="startMoveCell(${week},${day})">Move</button>
      <button type="button" onclick="saveCellAsTemplate(${week},${day})">Save as template</button>
      <button type="button" class="danger" onclick="clearCell(${week},${day})">Delete</button>
    </div>` : '';
  return `<div class="prog-cell">
    <div class="prog-card">
      <div class="prog-card-top">
        <span class="prog-card-mark">TH</span>
        <button type="button" class="prog-card-title" style="background:transparent;border:0;padding:0;text-align:left;color:inherit;cursor:pointer" onclick="openSession('${tid}')">${esc(sum.title)}</button>
        <button type="button" class="kebab-btn" aria-label="Cell menu" onclick="toggleCellMenu(${week},${day},event)">⋯</button>
      </div>
      <div class="prog-card-body">
        <span class="letter-badge">${esc(sum.letter)}</span>
        <div class="prog-card-ex"><div>${esc(sum.line)}</div>${sum.sets?`<div class="muted">${esc(sum.sets)}</div>`:''}</div>
      </div>
    </div>${menu}</div>`;
}

function programHtml(){
  const p = prog(ui.programId);
  if (!p) return libraryHtml();
  ui.lib = 'programs';
  const weeks = Math.max(1, Number(p.weeks)||1);
  const dayHeads = [1,2,3,4,5,6,7].map(d => `<div class="prog-day-h">Day ${d}</div>`).join('');
  const weekBlocks = Array.from({ length: weeks }, (_, i) => {
    const w = i + 1;
    const cells = [1,2,3,4,5,6,7].map(d => programCellHtml(p, w, d)).join('');
    return `<div class="prog-week"><div class="prog-week-label">Week ${w}</div>
      <div class="prog-days">${dayHeads}${cells}</div></div>`;
  }).join('');
  const pasteHint = ui.cellPick && (ui.cellPick.mode === 'copyTarget' || ui.cellPick.mode === 'moveTarget')
    ? `<p class="muted" style="margin-top:8px">${ui.cellPick.mode==='moveTarget'?'Click an empty cell to move the session.':'Click an empty cell to paste the copy.'} <button type="button" class="btn ghost small" onclick="closeCellPick()">Cancel</button></p>`
    : '';
  return `<button type="button" class="btn ghost small" onclick="go('library',{lib:'programs'})">← Back to programs</button>
    <div class="prog-toolbar" style="margin-top:12px">
      <input class="prog-title" value="${esc(p.name)}" aria-label="Program title" oninput="prog(ui.programId).name=this.value;persist()">
      <div class="prog-icons">
        <button type="button" class="prog-icon" title="Preview (coming soon)" disabled>${progIcon('eye')}</button>
        <button type="button" class="prog-icon" title="Save to folder (coming soon)" disabled>${progIcon('folder')}</button>
        <button type="button" class="prog-icon" title="Program settings (coming soon)" disabled>${progIcon('gear')}</button>
        <button type="button" class="btn small" onclick="go('assign',{programId:ui.programId})">Assign</button>
      </div>
    </div>
    ${pasteHint}
    ${weekBlocks}
    <div class="prog-footer">
      <button type="button" class="btn" onclick="addWeek()">Add week</button>
      <span class="muted">Empty cells stay blank — click to place a session template.</span>
    </div>
    ${templatePickerHtml()}`;
}

function tplBlocks(){ return tpl(ui.templateId)?.blocks || []; }

function parseSets(tid, bi, ei, raw){
  const t = tpl(tid); const e = t.blocks[bi].exercises[ei];
  const m = String(raw).match(/(\d+)\s*[x×]\s*(.+)/i);
  if (m){ e.sets = Number(m[1]); e.reps = m[2].trim(); }
  persist();
}

function addEx(bi){
  const t = tpl(ui.templateId);
  t.blocks[bi].exercises = t.blocks[bi].exercises || [];
  t.blocks[bi].exercises.push(L.makeExercise({ name:'New lift', sets:3, reps:'8-10', load:'', metric:'Weight' }));
  persist(); render();
}

function removeEx(bi, ei){
  const t = tpl(ui.templateId);
  t.blocks[bi].exercises.splice(ei, 1);
  persist(); render();
}

function addBlk(type){
  const t = tpl(ui.templateId);
  const partial = type === 'conditioning'
    ? { type:'conditioning', heading:'Steady-state', category:'Conditioning', scoring:'completion', condFmt:'steady', effort:'easy', modality:'Bike', targetDurationMin:20 }
    : type === 'text'
      ? { type:'text', heading:'Prep', category:'Prep', scoring:'completion', notes:'' }
      : { type:'strength', heading:'Strength', category:'Strength/Power', scoring:'weight', exercises:[L.makeExercise({ name:'Back Squat', exerciseId:'core-back-squat', sets:3, reps:'8', load:'', metric:'Weight' })] };
  t.blocks.push(L.makeBlock(partial));
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function removeBlk(bi){
  const t = tpl(ui.templateId);
  t.blocks.splice(bi, 1);
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function toggleSuperset(bi, on){
  const t = tpl(ui.templateId);
  t.blocks[bi].superset = on;
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function openExPicker(bi, ei){
  ui.exPicker = { bi, ei };
  ui.exSearch = '';
  render();
}

function closeExPicker(){ ui.exPicker = null; ui.exSearch = ''; render(); }

function pickExercise(exId){
  if (!ui.exPicker) return;
  const cat = (S.exercises||[]).find(e => e.id === exId);
  if (!cat) return;
  const t = tpl(ui.templateId);
  const ex = t.blocks[ui.exPicker.bi].exercises[ui.exPicker.ei];
  ex.name = cat.name;
  ex.exerciseId = cat.id;
  ex.category = cat.category || ex.category;
  ui.exPicker = null;
  ui.exSearch = '';
  persist(); render();
}

function filteredExercises(){
  const q = String(ui.exSearch||'').trim().toLowerCase();
  return (S.exercises||[]).filter(e => !q || String(e.name).toLowerCase().includes(q) || String(e.category||'').toLowerCase().includes(q));
}

function exercisePickerHtml(){
  if (!ui.exPicker) return '';
  const list = filteredExercises().slice(0, 80).map(e =>
    `<button type="button" class="picker-item" onclick="pickExercise('${e.id}')"><span>${esc(e.name)}</span><span class="muted">${esc(e.category||'')}</span></button>`
  ).join('');
  return `<div class="picker-overlay" onclick="if(event.target===this)closeExPicker()">
    <div class="picker-panel" role="dialog" aria-label="Choose exercise">
      <div class="row"><b>Choose exercise</b><button type="button" class="btn ghost small" onclick="closeExPicker()">Close</button></div>
      <div class="field" style="margin-top:12px"><label>Search</label>
        <input value="${esc(ui.exSearch)}" oninput="ui.exSearch=this.value;render()" placeholder="Squat, row, bike…"></div>
      <div class="picker-list">${list || '<div class="muted">No matches.</div>'}</div>
    </div></div>`;
}

function setRowsTable(bi, ei){
  const e = tplBlocks()[bi].exercises[ei];
  const n = Math.max(1, Number(e.sets) || 1);
  const reps = L.targetList(e);
  const loads = L.loadList(e);
  let rows = '';
  for (let i = 0; i < n; i++) {
    rows += `<tr><td>${i+1}</td><td><input value="${esc(reps[i] ?? e.reps ?? '')}" oninput="setRowRep(${bi},${ei},${i},this.value)"></td>
      <td><input value="${esc(loads[i] ?? '')}" oninput="setRowLoad(${bi},${ei},${i},this.value)" placeholder="Load"></td></tr>`;
  }
  return `<table class="set-table"><thead><tr><th>Set</th><th>Reps</th><th>Load</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function setRowRep(bi, ei, ri, val){
  const e = tplBlocks()[bi].exercises[ei];
  const parts = L.targetList(e);
  while (parts.length < (e.sets || 1)) parts.push(String(e.reps || ''));
  parts[ri] = val;
  e.reps = parts.length === 1 ? parts[0] : parts.join(',');
  persist();
}

function setRowLoad(bi, ei, ri, val){
  const e = tplBlocks()[bi].exercises[ei];
  const parts = L.loadList(e);
  while (parts.length < (e.sets || 1)) parts.push('');
  parts[ri] = val;
  e.load = parts.length === 1 ? parts[0] : parts.join(',');
  persist();
}

function patchCond(bi, patch){
  const t = tpl(ui.templateId);
  L.applyCondBuilderToBlock(t.blocks[bi], patch);
  persist(); render();
}

function nudgeCondMin(bi, delta){
  const b = tplBlocks()[bi];
  const cur = Number(b.targetDurationMin) || 20;
  patchCond(bi, { targetDurationMin: Math.max(1, Math.min(180, cur + delta)) });
}

function setCondFmt(bi, key){
  const fmt = L.condFormatMeta(key);
  const patch = { condFmt:key, heading:fmt.name };
  if (L.fmtNeedsIntervalFields(fmt)) {
    patch.rounds = fmt.rounds || 4;
    patch.workSec = fmt.workSec || 240;
    patch.restSec = fmt.restSec || 180;
  }
  patchCond(bi, patch);
}

function modalityWantsWatts(mod){
  const m = String(mod||'').toLowerCase();
  return m.includes('bike') || m.includes('echo') || m.includes('air');
}

function condEngineHtml(b, bi){
  const fmt = L.condFormatMeta(b.condFmt || 'steady');
  const effort = L.condEffortMeta(b.effort || 'easy');
  const interval = L.fmtNeedsIntervalFields(fmt);
  const plan = L.condPlanLineBlock(b) || '—';
  const fmtOpts = L.COND_FORMATS.map(f => `<option value="${f.key}" ${fmt.key===f.key?'selected':''}>${esc(f.name)}</option>`).join('');
  const modOpts = L.COND_MODALITIES.map(m => `<option ${b.modality===m?'selected':''}>${esc(m)}</option>`).join('');
  const chips = L.COND_EFFORTS.map(e => {
    const on = effort.key === e.key;
    return `<button type="button" class="eff ${esc(e.key)}${on?' on':''}" aria-pressed="${on?'true':'false'}" onclick="patchCond(${bi},{effort:'${e.key}'})"><b>${esc(e.name)}</b><small>RPE ${esc(e.rpe)}</small></button>`;
  }).join('');
  const timing = interval
    ? `<div class="engine-fields" style="grid-template-columns:1fr 1fr 1fr;margin-top:10px">
        <div class="field"><label>Rounds</label><input type="number" min="1" step="1" value="${esc(b.rounds||fmt.rounds||1)}" onchange="patchCond(${bi},{rounds:Number(this.value)||1})"></div>
        <div class="field"><label>Work</label><input value="${esc(L.formatMmSs(b.workSec||fmt.workSec||30))}" onchange="patchCond(${bi},{workSec:L.parseMmSs(this.value)})"></div>
        <div class="field"><label>Rest</label><input value="${esc(L.formatMmSs(b.restSec!=null?b.restSec:(fmt.restSec||90)))}" onchange="patchCond(${bi},{restSec:L.parseMmSs(this.value)})"></div>
      </div><p class="engine-hint">Total ≈ ${L.condIntervalTotalMin(b)} min · stored as seconds.</p>`
    : `<div class="field" style="margin-top:10px"><label>Minutes</label>
        <div class="mins-row">
          <button type="button" class="btn small" onclick="nudgeCondMin(${bi},-5)">−</button>
          <input type="number" min="1" max="180" value="${esc(b.targetDurationMin||20)}" onchange="patchCond(${bi},{targetDurationMin:Number(this.value)||20})">
          <button type="button" class="btn small" onclick="nudgeCondMin(${bi},5)">+</button>
        </div></div>`;
  const watts = modalityWantsWatts(b.modality)
    ? `<div class="field" style="margin-top:10px"><label>Target watts <span class="muted">(optional)</span></label>
        <input type="number" min="0" step="5" placeholder="180" value="${esc(b.targetWatts||'')}" onchange="patchCond(${bi},{targetWatts:this.value})"></div>`
    : '';
  return `<div class="engine-box">
    <div class="engine-plan">${esc(plan)}</div>
    <div class="engine-fields">
      <div class="field"><label>Format</label><select onchange="setCondFmt(${bi},this.value)">${fmtOpts}</select></div>
      <div class="field"><label>Modality</label><select onchange="patchCond(${bi},{modality:this.value})">${modOpts}</select></div>
    </div>
    <div class="field" style="margin-top:10px"><label>Effort</label></div>
    <div class="efforts" role="group" aria-label="Effort">${chips}</div>
    ${timing}
    ${watts}
    <div class="field" style="margin-top:10px"><label>Coach notes</label>
      <textarea oninput="tpl(ui.templateId).blocks[${bi}].notes=this.value;persist()">${esc(b.notes||'')}</textarea></div>
  </div>`;
}

function blockExerciseHtml(b, bi){
  if (b.type === 'conditioning') return condEngineHtml(b, bi);
  if (b.type === 'text') {
    return `<div class="field"><label>Block notes</label>
      <textarea oninput="tpl(ui.templateId).blocks[${bi}].notes=this.value;persist()">${esc(b.notes||'')}</textarea></div>`;
  }
  const exHtml = (b.exercises||[]).map((e, ei) => `<div class="exercise-card">
    <div class="row" style="align-items:flex-start"><span class="letter-badge" style="width:26px;height:26px;font-size:11px">${esc(b.letter||'?')}</span>
      <button type="button" class="exercise-pick grow" onclick="openExPicker(${bi},${ei})">${esc(e.name||'Choose exercise')}</button>
      <button type="button" class="kebab-btn" title="Remove exercise" onclick="removeEx(${bi},${ei})">×</button></div>
    <div class="rx-grid">
      <div class="field"><label>Sets × reps</label><input value="${esc(e.sets+' × '+e.reps)}" onchange="parseSets(ui.templateId,${bi},${ei},this.value.replace('×','x'))"></div>
      <div class="field"><label>Load</label><input value="${esc(e.load)}" oninput="tpl(ui.templateId).blocks[${bi}].exercises[${ei}].load=this.value;persist()"></div>
      <div class="field"><label>Metric</label><select onchange="tpl(ui.templateId).blocks[${bi}].exercises[${ei}].metric=this.value;persist()">${L.METRICS.map(m=>`<option ${e.metric===m?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>
    ${setRowsTable(bi, ei)}
    <div class="field"><label>Exercise instructions</label><textarea oninput="tpl(ui.templateId).blocks[${bi}].exercises[${ei}].coachNote=this.value;persist()">${esc(e.coachNote||'')}</textarea></div>
  </div>`).join('');
  return `${exHtml}<button type="button" class="btn small" style="margin-top:10px" onclick="addEx(${bi})">Add exercise</button>`;
}

function sessionHtml(){
  const t = tpl(ui.templateId);
  if (!t) return libraryHtml();
  ui.lib = 'sessions';
  const blocks = tplBlocks().map((b, i) => {
    const catOpts = L.BLOCK_CATEGORIES.map(c => `<option ${b.category===c?'selected':''}>${c}</option>`).join('');
    const scoring = `<select onchange="tpl(ui.templateId).blocks[${i}].scoring=this.value;persist()"><option value="completion" ${b.scoring==='completion'?'selected':''}>For Completion</option><option value="weight" ${b.scoring==='weight'?'selected':''}>For Weight</option></select>`;
    return `<section class="block-card">
      <div class="block-head">
        <span class="letter-badge">${esc(b.letter||'?')}</span>
        <select class="grow" aria-label="Block category" onchange="tpl(ui.templateId).blocks[${i}].category=this.value;persist()">${catOpts}</select>
        ${scoring}
        <label class="row" style="gap:6px;margin:0;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500">
          <input type="checkbox" style="width:auto" ${b.superset?'checked':''} onchange="toggleSuperset(${i},this.checked)"> Superset</label>
        <button type="button" class="kebab-btn" title="Delete block" onclick="removeBlk(${i})">Del</button>
      </div>
      <div class="block-body">
        <div class="field"><label>Block title</label><input value="${esc(b.heading||'')}" oninput="tpl(ui.templateId).blocks[${i}].heading=this.value;persist()"></div>
        ${b.type!=='text' && b.type!=='conditioning'?`<div class="field"><label>Block notes</label><textarea oninput="tpl(ui.templateId).blocks[${i}].notes=this.value;persist()">${esc(b.notes||'')}</textarea></div>`:''}
        ${blockExerciseHtml(b, i)}
      </div>
    </section>`;
  }).join('');
  const instrLen = (t.coachInstructions||'').length;
  return `<button type="button" class="btn ghost small" onclick="go('library',{lib:'sessions'})">← Back to sessions</button>
    <div class="builder-top" style="margin-top:12px">
      <input class="builder-title" value="${esc(t.name)}" aria-label="Session title" oninput="tpl(ui.templateId).name=this.value;persist()">
      <div class="builder-actions"><span class="pill">Saved locally</span></div>
    </div>
    <div class="card instructions-box">
      <label>Coach instructions</label>
      <span class="char-count">${instrLen}/10000</span>
      <textarea maxlength="10000" placeholder="Use this area to help the athlete understand goals for today's session." oninput="tpl(ui.templateId).coachInstructions=this.value;persist();var c=this.closest('.instructions-box')&&this.closest('.instructions-box').querySelector('.char-count');if(c)c.textContent=this.value.length+'/10000'">${esc(t.coachInstructions||'')}</textarea>
    </div>
    ${blocks}
    <div class="add-block-bar stack">
      <button type="button" class="btn primary block" onclick="addBlk('strength')">Add Block</button>
      <div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn small" onclick="addBlk('strength')">+ Strength</button>
        <button type="button" class="btn small" onclick="addBlk('conditioning')">+ Conditioning</button>
        <button type="button" class="btn small" onclick="addBlk('text')">+ Prep / recovery</button>
      </div>
    </div>
    ${exercisePickerHtml()}`;
}

function coachChrome(body){
  const nav = [
    ['home','Coach Home','home',false],
    ['athletes','Athletes','users',false],
    ['teams','Teams','teams',false],
    ['library','Library','library',false],
    ['nutrition','Nutrition','nutrition',false],
    ['analytics','Analytics','chart',true],
    ['gym','Gym Tools','gym',true],
  ];
  const navHtml = nav.map(([k,l,ic,off]) => {
    if (off) return `<span class="nav-soon" title="Coming soon">${icon(ic)}${esc(l)}</span>`;
    return `<button type="button" class="${navActive(k)?'on':''}" onclick="go('${k}')">${icon(ic)}${esc(l)}</button>`;
  }).join('');
  const initials = String(S.coach?.name||'D').slice(0,1).toUpperCase();
  const hasRail = ui.view === 'home';
  return `<aside class="coach-side" aria-label="Coach navigation">
    <div class="coach-brand"><div class="mark">TH</div><div><b>THE Hybrid</b><div class="sub">hybrid S&C · coach workspace</div></div></div>
    <nav>${navHtml}</nav>
    <div class="coach-side-foot">
      <span class="nav-soon" title="Coming soon">${icon('support')}Support</span>
      <button type="button" onclick="resetDemo()">Reset demo data</button>
      <button type="button" onclick="signOut()">Sign out</button>
    </div>
  </aside>
  <div class="coach-workspace">
    <header class="coach-header">
      <div class="coach-header-title">${esc(headerTitle())}</div>
      <div class="coach-header-actions">
        <button type="button" class="btn-assist" disabled title="Coming soon">Manage Assistants</button>
        <span class="icon-btn" title="Coming soon">${icon('msg')}<span class="badge">·</span></span>
        <span class="icon-btn" title="Coming soon">${icon('bell')}</span>
        <div class="coach-avatar" title="Coach profile">${initials}</div>
      </div>
    </header>
    <div class="coach-body ${hasRail?'has-rail':''}">
      <main class="coach-main">${body}</main>
      ${hasRail?`<aside class="coach-rail" aria-label="Programming status">${needsHtml()}</aside>`:''}
    </div>
  </div>`;
}

function gateHtml(){
  return `<div class="row" style="justify-content:flex-start;gap:12px"><div class="mark">TH</div><div><b>THE Hybrid System</b><div class="muted">Coach workspace · local demo</div></div></div>
    <h1 style="margin-top:28px;font-family:var(--font-display);font-size:40px">Sign in</h1>
    <p class="muted" style="margin-top:8px">Coach demo. Password: <b>demo</b></p>
    ${ui.err?`<div class="card" style="margin-top:12px;border-color:#d0897d">${esc(ui.err)}</div>`:''}
    <div class="field"><label>Email</label><input id="em" value="dan@thehybrid.local"></div>
    <div class="field"><label>Password</label><input id="pw" type="password" value="demo"></div>
    <button class="btn primary block" style="margin-top:16px" onclick="tryLogin($('em').value,$('pw').value)">Sign in</button>
    <div class="acct">
      <button class="btn" onclick="tryLogin('dan@thehybrid.local','demo')">Coach · Dan</button>
    </div>
    <p class="muted" style="margin-top:24px">Athletes keep using the Hybrid athlete app. This page is coach-only.</p>`;
}

function render(){
  const acc = account();
  $('gate').classList.add('hidden');
  $('coachApp').classList.add('hidden');
  if (!acc || acc.role !== 'coach'){
    if (acc) { L.logout(S); persist(); }
    $('gate').classList.remove('hidden'); $('gate').innerHTML = gateHtml(); return;
  }
  $('coachApp').classList.remove('hidden');
  let body = '';
  if (ui.view==='athletes') body = athleteListHtml();
  else if (ui.view==='athlete') body = athleteCalHtml();
  else if (ui.view==='teams') body = teamListHtml();
  else if (ui.view==='team') body = teamCalHtml();
  else if (ui.view==='library') body = libraryHtml();
  else if (ui.view==='program') body = programHtml();
  else if (ui.view==='session') body = sessionHtml();
  else if (ui.view==='assign') body = assignHtml();
  else if (ui.view==='nutrition') body = nutritionHtml();
  else body = feedHtml();
  $('coachApp').innerHTML = coachChrome(body);
}

window.go=go; window.signOut=signOut; window.resetDemo=resetDemo; window.tryLogin=tryLogin;
window.saveComment=saveComment; window.toggleCard=toggleCard;
window.openSession=openSession; window.openProgram=openProgram;
window.newTemplate=newTemplate; window.newProgram=newProgram; window.parseSets=parseSets; window.addEx=addEx; window.addBlk=addBlk;
window.removeBlk=removeBlk; window.removeEx=removeEx; window.toggleSuperset=toggleSuperset;
window.openExPicker=openExPicker; window.closeExPicker=closeExPicker; window.pickExercise=pickExercise;
window.setRowRep=setRowRep; window.setRowLoad=setRowLoad;
window.patchCond=patchCond; window.setCondFmt=setCondFmt; window.nudgeCondMin=nudgeCondMin;
window.toggleCellMenu=toggleCellMenu; window.openCellPick=openCellPick; window.closeCellPick=closeCellPick;
window.placeCellTemplate=placeCellTemplate; window.clearCell=clearCell;
window.startCopyCell=startCopyCell; window.startMoveCell=startMoveCell; window.onEmptyCell=onEmptyCell;
window.saveCellAsTemplate=saveCellAsTemplate; window.addWeek=addWeek;
CoachViews.init({ L, S, ui, persist, esc, go, render, $, tpl, prog, ses, athleteBy, team });
render();
</script>
</body>
