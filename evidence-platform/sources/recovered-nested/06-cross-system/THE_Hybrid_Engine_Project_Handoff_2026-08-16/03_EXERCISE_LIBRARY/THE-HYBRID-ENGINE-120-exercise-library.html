function nav(){const tabs=[['home','⌂','Home'],['calendar','□','Log'],['library','▣','Library'],['checkin','◉','Check-In'],['settings','⚙','Settings']]; const isActive=v=>activeView===v || (v==='library'&&(activeView.startsWith('template:')||activeView.startsWith('editTemplate:'))) || (v==='home'&&(activeView.startsWith('workout:')||activeView.startsWith('editWorkout:'))); document.getElementById('nav').innerHTML=tabs.map(([v,i,l])=>`<button class="${isActive(v)?'active':''}" onclick="setView('${v}')"><span class="ico">${i}</span><span>${l}</span></button>`).join('')}
function header(title,sub=''){return `<div class="topbar"><div><div class="brand">THE HYBRID ENGINE</div><div class="h1">${esc(title)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div><span class="pill gold">hard</span></div>`}
function render(){
  try{
    nav(); closeModal(false); const app=document.getElementById('app');
    if(activeView==='home')app.innerHTML=renderHome();
    else if(activeView==='calendar')app.innerHTML=renderCalendar();
    else if(activeView==='library')app.innerHTML=renderLibrary();
    else if(activeView==='checkin')app.innerHTML=renderCheckin();
    else if(activeView==='settings')app.innerHTML=renderSettings();
    else if(String(activeView).startsWith('workout:'))app.innerHTML=renderWorkout(activeView.split(':')[1],false);
    else if(String(activeView).startsWith('editWorkout:'))app.innerHTML=renderWorkout(activeView.split(':')[1],true);
    else if(String(activeView).startsWith('template:'))app.innerHTML=renderTemplate(activeView.split(':')[1]);
    else if(String(activeView).startsWith('editTemplate:'))app.innerHTML=renderEditTemplate(activeView.split(':')[1]);
    else {activeView='home'; app.innerHTML=renderHome();}
    bindAfterRender();
  }catch(err){
    console.error('Render failed', err);
    const app=document.getElementById('app');
    if(app) app.innerHTML=`<main class="screen"><div class="topbar"><div><div class="brand">THE HYBRID ENGINE</div><div class="h1">Safe boot</div><div class="sub">Something in saved data broke the view. Reset the local app data and reopen clean.</div></div></div><section class="card"><b>Safe mode loaded.</b><p class="sub">No training data has been sent anywhere. This is local only.</p><button class="btn primary full" onclick="forceCleanBoot()">Reset local app data</button></section><section class="card"><div class="tiny">Error: ${esc(err?.message||err)}</div></section></main>`;
  }
}

function weekStart(d=new Date()){const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x}
function fmtDate(d){return d.toISOString().slice(0,10)}
function manualTemplateCards(){const p=currentProgram(); const templates=programTemplates(p.id); if(!templates.length)return `<div class="card"><b>No templates built yet.</b><p class="sub">Start in the Builder. You choose what to train and when — the app does not auto-place days across the week.</p><button class="btn primary full" onclick="newTemplate()">+ Build first template</button></div>`; return templates.map(t=>`<div class="listItem"><div class="row"><div><b>${esc(t.name||'Untitled session')}</b><div class="tiny">Manual start · ${esc((t.blocks||[]).length)} block${(t.blocks||[]).length===1?'':'s'}</div>${t.summary?`<p class="sub">${esc(t.summary)}</p>`:''}</div><div class="stack" style="align-items:flex-end"><button class="btn small primary" onclick="startTemplate('${t.id}',today(),'active')">Start</button><button class="btn small" onclick="setView('template:${t.id}')">Open</button></div></div></div>`).join('')}
function recommendedSlot(){const todayActive=S.workouts.find(w=>w.date===today()&&w.status==='active'); if(todayActive)return {existing:todayActive}; const first=programTemplates(currentProgram().id)[0]; return first?{templateId:first.id,template:first,label:first.name}:null}
function weeklySlots(){return []}
function weekSlotCard(){return ''}
function renderHome(){const c=currentCheckin(); const r=readiness(c); const [rt,rs]=laneText(r); const p=currentProgram(); const todays=S.workouts.filter(w=>w.date===today()); const active=todays.find(w=>w.status==='active'); return `<main class="screen">${header('What do I do today?','RE:BUILT Strength · You choose the session. The app guides the work.')}<section class="card command"><div class="row"><div><div class="kpi">Today’s call</div><div class="row" style="justify-content:flex-start;margin-top:7px"><span class="pill ${r?laneClass(r.lane):''}">${esc(rt)}</span><span class="pill">Manual log</span></div><p class="sub">${esc(rs)}</p></div>${r?`<div class="bigScore">${r.score}</div>`:''}</div><div class="notice">${esc(applyReadinessAdvice())}</div>${active?`<button class="btn primary full" onclick="setView('workout:${active.id}')">Resume active session</button>`:`<button class="btn primary full" onclick="setLibTab('templates');setView('library')">Choose a session</button>`}</section><section class="grid3"><div class="card"><b>Appearance</b><div class="tiny">Look trained</div></div><div class="card"><b>Readiness</b><div class="tiny">Perform today</div></div><div class="card"><b>Staying Power</b><div class="tiny">Repeat for years</div></div></section><section class="card"><div class="row"><div><div class="kpi">Active system</div><h2 style="margin:4px 0">${esc(p.name)}</h2><div class="sub">${esc(p.description)}</div></div><button class="btn small" onclick="setView('settings')">Settings</button></div></section><div class="sectionTitle">Start manually</div>${manualTemplateCards()}<div class="sectionTitle">Today’s logs</div>${todays.length?todays.map(workoutListItem).join(''):`<div class="card"><div class="sub">No session logged today yet.</div></div>`}</main>`}

function renderTemplatesTab(){

function templateItem(t,programName=''){
  if(!t) return '';
  const blocks = Array.isArray(t.blocks) ? t.blocks : [];
  const strengthCount = blocks.reduce((n,b)=>n + ((b && Array.isArray(b.exercises)) ? b.exercises.length : 0),0);
  const flowCount = blocks.reduce((n,b)=>n + ((b && Array.isArray(b.warmupItems)) ? b.warmupItems.length : 0),0);
  const kinds = blocks.map(b=>blockKind(b)).filter(Boolean);
  const blockLabel = `${blocks.length} block${blocks.length===1?'':'s'}`;
  return `<div class="listItem"><div class="row"><div><b>${esc(t.name||'Untitled template')}</b><div class="tiny">${esc(programName||'RE:BUILT Strength')} · ${esc(blockLabel)}${strengthCount?` · ${strengthCount} exercise${strengthCount===1?'':'s'}`:''}${flowCount?` · ${flowCount} flow item${flowCount===1?'':'s'}`:''}</div><div class="tiny">${kinds.map(k=>esc(labelKind(k))).join(' → ')}</div>${t.summary?`<p class="sub">${esc(t.summary)}</p>`:''}</div><div class="stack" style="align-items:flex-end"><button class="btn small primary" onclick="setView('template:${t.id}')">Open</button><button class="btn small" onclick="setView('editTemplate:${t.id}')">Edit</button></div></div></div>`;
}
function workoutListItem(w){
  if(!w) return '';
  const summary = w.session_data && w.session_data.summary ? w.session_data.summary : null;
  const statusClass = w.status==='completed' ? 'green' : w.status==='active' ? 'gold' : 'amber';
  const label = w.status==='completed' ? 'Done' : w.status==='active' ? 'Active' : 'Scheduled';
  const meta = summary ? `${summary.total_sets||0} strength · ${summary.flow_sets||0} flow${summary.avg_rpe?` · avg RPE ${summary.avg_rpe}`:''}` : `${esc(w.date||'')} · ${esc(w.status||'')}`;
  return `<div class="listItem"><div class="row"><div><span class="pill ${statusClass}">${label}</span><h3 style="margin:8px 0 2px">${esc(w.template_name||'Workout')}</h3><div class="tiny">${esc(meta)}</div>${w.applied_readiness?`<div class="tiny">Applied: ${esc(String(w.applied_readiness).toUpperCase())}</div>`:''}</div><button class="btn small primary" onclick="setView('workout:${w.id}')">Open</button></div></div>`;
}

function renderExercisesTab(){const cats=[...new Set(S.exercises.map(e=>e.category||'Other'))].sort(); const total=S.exercises.length; return `<div class="search"><input class="input" id="exerciseSearch" placeholder="Search name, alias, muscle, equipment..." oninput="filterList('exercise')"></div><p class="sub">${total} canonical exercises · aliases and programming metadata included</p><div id="exerciseList">${cats.map(cat=>`<div class="sectionTitle">${esc(cat)}</div>${S.exercises.filter(e=>(e.category||'Other')===cat).map(e=>{const search=[e.name,e.category,e.movement_pattern,e.role,e.difficulty,...(e.aliases||[]),...(e.source_aliases||[]),...(e.primary_muscles||[]),...(e.secondary_muscles||[]),...(e.equipment||[])].join(' '); return `<div class="listItem searchable exercise" data-search="${esc(search)}"><div class="row"><div><b>${esc(e.name)}</b><div class="tiny">${esc(e.category||'')} · ${esc(e.movement_pattern||'')} · ${esc(e.difficulty||'')}</div><div class="tiny">${esc((e.equipment||[]).join(' · '))}</div></div></div></div>`}).join('')}`).join('')}</div>`}
function renderMobilityTab(){return `<div class="search"><input class="input" id="mobilitySearch" placeholder="Search mobility..." oninput="filterList('mobility')"></div><div id="mobilityList">${S.mobilityCards.map((m,i)=>`<div class="listItem searchable mobility"><div class="row"><div><b>${esc(m.name)}</b><div class="tiny">${esc(m.duration)} · ${esc(m.area)}</div></div><button class="btn small" onclick="toggleMob(${i})">Details</button></div><div id="mob-${i}" class="hidden"><p class="sub">${esc(m.best_use||'')}</p><p><b>Flow:</b> ${esc(m.flow||'')}</p>${m.coach_note?`<p class="tiny">${esc(m.coach_note)}</p>`:''}${m.url?`<button class="btn small" onclick="window.open('${esc(m.url)}','_blank')">Follow along</button>`:''}</div></div>`).join('')}</div>`}
function renderBuilderTab(){
  return `<div class="card"><h3>RE:BUILT Builder</h3><p class="sub">Choose a session type. The builder creates logger-safe blocks: Prep → Power → Primary → Accessory → Conditioning → Recover.</p><div class="grid2"><button class="btn primary" onclick="newTemplate('fullbodyA')">Full Body A<br><span class="tiny">Squat + Pull</span></button><button class="btn primary" onclick="newTemplate('fullbodyB')">Full Body B<br><span class="tiny">Hinge + Push</span></button><button class="btn" onclick="newTemplate('easyConditioning')">Easy Conditioning<br><span class="tiny">Zone 2 / recovery</span></button><button class="btn" onclick="newTemplate('engineConditioning')">Engine Conditioning<br><span class="tiny">Intervals / carries</span></button><button class="btn" onclick="newTemplate('durability')">Durability<br><span class="tiny">Mobility + weak links</span></button><button class="btn" onclick="newTemplate('blank')">Blank Guided<br><span class="tiny">Start clean</span></button></div><div class="divider"></div><div class="builderNote"><b>Fool-proof rule</b><p class="tiny">The builder should never create a workout the guided logger cannot run. Warm-ups and primers are flow-only. Strength gets weight, reps and confirmed RPE.</p></div></div>`;
}
function toggleMob(i){document.getElementById('mob-'+i)?.classList.toggle('hidden')}
function filterList(type){const q=(document.getElementById(type+'Search')?.value||'').toLowerCase(); document.querySelectorAll('.searchable.'+type).forEach(el=>{const hay=(el.dataset.search||el.textContent).toLowerCase(); el.style.display=hay.includes(q)?'block':'none'})}

function renderTemplate(id){const t=byId(S.templates,id); if(!t)return `<main class="screen">${header('Missing template')}<button class="btn" onclick="setView('library')">Back</button></main>`; const lane=activeLane(); return `<main class="screen">${header(t.name,t.summary||'')}<button class="btn ghost" onclick="setView('library')">← Back</button><div class="notice">Start now will apply today’s readiness: ${esc(lane.toUpperCase())}</div>${t.blocks.map(renderPreviewBlock).join('')}<div class="grid2"><button class="btn" onclick="scheduleTemplate('${id}')">Schedule</button><button class="btn primary" onclick="startTemplate('${id}')">Start Recommended</button></div></main>`}


function renderPreviewBlock(b){
  const kind=blockKind(b);
  const flow=(b.warmupItems||[]).map((it,i)=>`<div class="previewFlowItem"><b>${i+1}. ${esc(it.name||'Movement')}</b><div class="tiny">${esc(it.prescription||'')} ${it.note?`· ${esc(it.note)}`:''}</div></div>`).join('');
  const exs=b.exercises?b.exercises.map((e,idx)=>{
    const flowOnly=isFlowPrimer(e,b);
    return `<div class="exCard"><div class="row"><div><b>${esc(e.name||'Choose exercise')}</b><div class="tiny">${flowOnly?'Flow only':`${esc(e.sets)} sets · ${esc(e.reps)} · rest ${esc(e.restSec||0)}s`}</div>${e.pattern?`<div class="tiny">Pattern: ${esc(e.pattern)}</div>`:''}${e.rirTarget&&!flowOnly?`<div class="tiny goldText">${esc(e.rirTarget)}</div>`:''}${e.coachNote?`<div class="tiny">${esc(e.coachNote)}</div>`:''}</div><span class="pill">${flowOnly?'flow':'log'}</span></div></div>`}).join(''):'';
  return `<div class="block"><div class="blockHead"><b>${esc(b.heading)}</b><span class="pill">${esc(labelKind(kind))}</span></div>${b.openText?`<p class="sub">${nl(b.openText)}</p>`:''}${b.coachNote?`<p class="tiny">${esc(b.coachNote)}</p>`:''}${b.warmupRounds?`<div class="tiny">Rounds: ${esc(b.warmupRounds)}</div>`:''}${flow}${exs}${b.metrics?`<div class="tiny">Metrics: ${b.metrics.map(m=>esc(m.name)).join(' · ')}</div>`:''}</div>`
}
function scheduleTemplate(id){const d=prompt('Schedule date (YYYY-MM-DD)',today()); if(!d)return; startTemplate(id,d,'scheduled',false)}
function startTemplate(id,date=today(),status='active',applyAdvice=true){const t=byId(S.templates,id); if(!t)return; const r=readiness(currentCheckin()); const lane=applyAdvice?(r?.lane||'build'):'build'; const blocks=applyAdvice?adaptBlocks(t.blocks,lane):deep(t.blocks); const w={id:uid('w'),template_id:t.id,template_name:t.name,date,status,blocks,started_at:status==='active'?new Date().toISOString():null,completed_at:null,duration_seconds:0,notes:'',applied_readiness:lane,applied_mode:'RE:BUILT Strength',session_feel:null,session_data:{lastSaved:new Date().toISOString(),summary:null}}; initWorkout(w); S.workouts.unshift(w); save(); setView('workout:'+w.id)}

function cloneExercise(e){return {...deep(e),loggedSets:[]}}
function adaptBlocks(blocks,lane){let bs=deep(blocks); const isMin=lane==='minimum'; if(isMin){let warm=bs.find(b=>b.type==='text'&&/warm|prep/i.test(b.heading))||bs.find(b=>b.type==='text'); const primaryStrength=bs.find(b=>b.type==='strength'&&/primary|main|strength/i.test(b.heading))||bs.find(b=>b.type==='strength'); const conditioning=bs.find(b=>b.type==='conditioning'); let main=primaryStrength||conditioning; let cool=bs.find(b=>b.type==='text'&&/cool|recover|downshift/i.test(b.heading)); const out=[]; if(warm)out.push({...deep(warm),openText:(warm.openText||'')+`\n\nMINIMUM: keep this short and easy.`}); if(main){let m=deep(main); if(m.exercises){m.exercises=m.exercises.slice(0,1).map(e=>({...e,sets:Math.min(num(e.sets)||1,2),rirTarget:'3–4 RIR',targetRpe:'6',coachNote:(e.coachNote||'')+' Minimum day: clean reps only.'}))} if(m.type==='conditioning'){m.openText=(m.openText||'')+`\n\nMINIMUM: 10–20 minutes easy. RPE 2–4.`} out.push(m)} if(cool)out.push(deep(cool)); return out}
 bs.unshift({type:'text',heading:'Today’s Prescription',order:0,openText:`Readiness: ${lane.toUpperCase()}\n${applyReadinessAdvice()}`});
 bs.forEach(b=>{if(b.exercises){b.exercises.forEach(e=>{if(lane==='control'){e.sets=Math.max(1,(num(e.sets)||1)-(/accessor|finisher/i.test(b.heading)?1:0)); e.rirTarget=e.rirTarget||'2–3 RIR'; e.coachNote=(e.coachNote||'')+' Control day: leave more in reserve.'}})} if(b.type==='conditioning'&&lane==='control'){b.openText=(b.openText||'')+`\n\nCONTROL: cap intensity at RPE 6–7.`}}); return bs}

function initWorkout(w){w.blocks.forEach(b=>{(b.exercises||[]).forEach(e=>{const parts=String(e.reps||'').split(',').map(x=>x.trim()).filter(Boolean); const count=Math.max(num(e.sets)||1,parts.length||1); const tr=targetRpe(e,b); e.loggedSets=Array.from({length:count},(_,i)=>({target:parts[i]||e.reps||'',targetRpe:String(tr),weight:'',reps:'',rpe:'',rir:''}))}); if(b.metrics&&!b.loggedMetrics)b.loggedMetrics=Array.from({length:b.metrics.length},()=> '')})}

function renderWorkout(id,editMode=false){
  const saved=byId(S.workouts,id);
  if(!saved)return `<main class="screen">${header('Missing workout')}<button class="btn" onclick="setView('home')">Home</button></main>`;
  if(editMode||saved.status!=='active')return renderWorkoutOverview(id,editMode);
  return renderGuidedWorkout(saved)
}
function ensureGuided(w){w.session_data=w.session_data||{}; if(!w.session_data.guided||typeof w.session_data.guided!=='object')w.session_data.guided={step:0,rest:null}; const steps=guidedSteps(w); if(!steps.length)w.session_data.guided.step=0; if(w.session_data.guided.step<0)w.session_data.guided.step=0; if(w.session_data.guided.step>=steps.length)w.session_data.guided.step=Math.max(0,steps.length-1); return w.session_data.guided}
function guidedSteps(w){const steps=[];(w.blocks||[]).forEach((b,bi)=>{if(b.type==='text'&&b.openText!==undefined){if(Array.isArray(b.warmupItems)&&b.warmupItems.length){const rounds=Math.max(1,num(b.warmupRounds)||1); for(let r=0;r<rounds;r++){b.warmupItems.forEach((_,ii)=>steps.push({kind:'warmupItem',bi,ii,round:r,rounds}))}}else if(!/today.?s prescription/i.test(b.heading||'')){steps.push({kind:'text',bi})}} if(b.exercises&&b.exercises.length){b.exercises.forEach((e,ei)=>{if(isFlowPrimer(e,b)){(e.loggedSets||[]).forEach((set,si)=>steps.push({kind:'powerSet',bi,ei,si})); return} steps.push({kind:'prep',bi,ei});(e.loggedSets||[]).forEach((set,si)=>steps.push({kind:'set',bi,ei,si}))})} if(b.type==='conditioning')steps.push({kind:'conditioning',bi})}); steps.push({kind:'finish'}); return steps}
function stepLabel(w,st){if(!st)return 'Step'; if(st.kind==='finish')return 'Finish'; const b=w.blocks[st.bi]; if(st.kind==='warmupItem'){const it=(b.warmupItems||[])[st.ii]||{}; return `${it.name||b.heading||'Warm-up'} · Round ${st.round+1}`} if(st.kind==='text')return b.heading||'Notes'; if(st.kind==='conditioning')return b.heading||'Conditioning'; const e=b.exercises[st.ei]; if(st.kind==='prep')return `${e.name||'Exercise'} prep`; if(st.kind==='powerSet')return `${e.name||'Power primer'} · Set ${st.si+1}`; return `${e.name||'Exercise'} · Set ${st.si+1}`}
function guidedProgress(w,steps,idx){const pct=steps.length?Math.round(((idx+1)/steps.length)*100):0; return `<div class="miniStepList">${steps.map((_,i)=>`<span class="miniStep ${i<idx?'done':i===idx?'now':''}"></span>`).join('')}</div><div class="guidedProgress"><span style="width:${pct}%"></span></div><div class="row"><span class="tiny">${idx+1} / ${steps.length}</span><span class="pill">${pct}%</span></div>`}

function renderSessionReadiness(w){return `<main class="screen guidedShell">${header(w.template_name,`${w.date} · session readiness`)}<button class="btn ghost small" onclick="setView('home')">← Home</button><section class="guidedCard"><div class="guidedKicker">Screen 1 · Session Readiness</div><div class="guidedTitle">How are you feeling today?</div><p class="sub">Choose the honest option. The workout will keep the same structure, but the demand changes.</p><div class="readinessGrid"><button class="readinessOption good" onclick="chooseSessionFeel('${w.id}','good')"><b>Good</b><span class="sub">Use planned loads. Allow small progression if sets are clean.</span></button><button class="readinessOption normal" onclick="chooseSessionFeel('${w.id}','normal')"><b>Normal</b><span class="sub">Run the plan as written. No hero work.</span></button><button class="readinessOption cooked" onclick="chooseSessionFeel('${w.id}','cooked')"><b>Cooked</b><span class="sub">Reduce demand. Main lift stays, accessories trim, finisher softens.</span></button></div></section></main>`}
function chooseSessionFeel(id,feel){const w=byId(S.workouts,id); if(!w)return; w.session_feel=feel; w.session_data=w.session_data||{}; w.session_data.guided={step:0,rest:null}; if(feel==='cooked')applyCookedDay(w); if(feel==='good')w.session_note='Good day: planned load and small progression allowed.'; if(feel==='normal')w.session_note='Normal day: planned load. Keep the work crisp.'; save(); render()}
function applyCookedDay(w){if(w.cooked_applied)return; w.cooked_applied=true; (w.blocks||[]).forEach(b=>{const h=(b.heading||'').toLowerCase(); if(b.exercises){b.exercises.forEach(e=>{const flow=isFlowPrimer(e,b)||/power|primer/.test(h); const primary=/primary|main/.test(h); const accessory=/accessory|secondary|carry|core/.test(h); if(flow){const target=Math.max(1,Math.floor((num(e.sets)||1)*0.67)); trimExerciseSets(e,target); e.coachNote=(e.coachNote||'')+' Cooked day: volume reduced. Move fast or skip.'} else if(primary){e.targetRpe='6'; e.rirTarget='3–4 RIR'; (e.loggedSets||[]).forEach(s=>s.targetRpe='6'); e.coachNote=(e.coachNote||'')+' Cooked day: keep movement, reduce intensity. Leave 3–4 reps in reserve.'} else if(accessory){const target=Math.max(1,(num(e.sets)||1)-1); trimExerciseSets(e,target); e.coachNote=(e.coachNote||'')+' Cooked day: final set removed.'}})} if(b.type==='conditioning'&&/finisher|engine|hard|zone 4|sprint/.test((b.heading+' '+(b.openText||'')).toLowerCase())){b.openText=(b.openText||'')+'\n\nCOOKED: skip hard work or replace with 5–10 minutes easy cooldown.'}})}
function trimExerciseSets(e,count){e.sets=count; e.loggedSets=e.loggedSets||[]; if(e.loggedSets.length>count)e.loggedSets=e.loggedSets.slice(0,count); while(e.loggedSets.length<count)e.loggedSets.push({target:e.reps||'',targetRpe:String(e.targetRpe||8),weight:'',reps:'',rpe:'',rir:''})}
function sessionFeelText(w){if(!w.session_feel)return ''; const map={good:'GOOD · planned loads and small progression allowed',normal:'NORMAL · run the plan as written',cooked:'COOKED · demand reduced, keep the habit'}; return map[w.session_feel]||''}
function patternSwapsFor(pattern){const swaps={squat:['Back Squat','Front Squat','Box Squat','Goblet Squat','Leg Press','Tempo Bodyweight Squat'],hinge:['Trap Bar Deadlift','Romanian Deadlift','DB RDL','Hip Thrust','Block Pull','Band Good Morning'],push:['Bench Press','Dumbbell Press','Incline DB Press','Push Up','Landmine Press','Machine Press'],pull:['Pull Up','Lat Pulldown','Dumbbell Row','Chest-Supported Row','Cable Row','Band Row'],lunge:['Reverse Lunge','Split Squat','Step Up','Walking Lunge','Lateral Lunge','Bulgarian Split Squat'],carry:['Farmer Walk','Suitcase Carry','Sled Push','Sandbag Carry','Bear Crawl','Backpack Carry'],power:['Medicine Ball Slam','Med-Ball Throw','Fast Sit-to-Stand','Box Jump','Seated Dynamic Jump','Kettlebell Swing']}; return swaps[pattern]||swaps.push||[]}
function painSwapFor(loc,e,b){const locKey=String(loc||'').toLowerCase(); const pat=patternOf(e.name,b.heading); if(/knee/.test(locKey))return ['Box Squat','Hip Thrust','Step Up','Sled Push'].find(x=>x!==e.name)||'Box Squat'; if(/back/.test(locKey))return ['Trap Bar Deadlift','Hip Thrust','Supported RDL','Leg Press'].find(x=>x!==e.name)||'Hip Thrust'; if(/shoulder/.test(locKey))return ['Landmine Press','Incline DB Press','Push Up','Neutral Grip DB Press'].find(x=>x!==e.name)||'Landmine Press'; if(/jump|power/.test(locKey)||pat==='power')return ['Med-Ball Throw','Medicine Ball Slam','Fast Sit-to-Stand','Low Step-Up Fast'].find(x=>x!==e.name)||'Fast Sit-to-Stand'; const list=patternSwapsFor(pat); return list.find(x=>x!==e.name)||e.name}

function renderGuidedPowerSet(w,st,steps,idx){const b=w.blocks[st.bi], e=b.exercises[st.ei], s=e.loggedSets[st.si]||{}; const target=String(s.target||e.reps||'3').split(',')[0].trim()||'3'; const done=flowSetDone(s); return `<section class="guidedCard"><div class="guidedKicker">${esc(b.heading)} · flow only</div><div class="guidedTitle">${esc(e.name||'Power primer')}</div><div class="guidedHero">Set ${st.si+1}</div><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><span class="pill gold">${esc(target)} reps</span><span class="pill">AFAP / explosive</span><span class="pill">Rest ${esc(e.restSec||45)}s</span>${done?`<span class="pill green">Logged</span>`:''}</div><div class="nextPreview repeat"><b>Primer rule</b><div style="font-size:22px;font-weight:950;margin-top:4px">Move fast. Stop if slow.</div><div class="tiny">No weight entry. No RPE. No load chasing. This is dynamic effort flow.</div></div>${e.coachNote?`<div class="card elev"><b>Coach cue</b><p class="sub">${esc(e.coachNote)}</p></div>`:''}<div class="grid2"><button class="btn small" onclick="powerTooHard('${w.id}',${st.bi},${st.ei},${st.si})">Too hard</button><button class="btn small" onclick="painPrompt('${w.id}',${st.bi},${st.ei})">Pain / Swap</button></div></section><div class="guidedActions three"><button class="btn" onclick="logGuidedPowerSet('${w.id}',${st.bi},${st.ei},${st.si},'skip')">Skip</button><button class="btn" onclick="logGuidedPowerSet('${w.id}',${st.bi},${st.ei},${st.si},'repeat')">Repeat</button><button class="btn primary" onclick="logGuidedPowerSet('${w.id}',${st.bi},${st.ei},${st.si},'done')">Done</button></div>`}

function renderGuidedSet(w,st,steps,idx){const b=w.blocks[st.bi], e=b.exercises[st.ei], s=e.loggedSets[st.si]; const rpe=num(s.rpe); const targetReps=parseTargetReps(s.target||e.reps)||''; const profile=exerciseProfile(e.name,w.id); const prior=st.si>0?e.loggedSets[st.si-1]:null; const priorSug=prior&&prior.logged===true&&setComplete(prior)?coachSuggestion(w,b,e,st.si-1):null; const sliderVal=rpe||num(s.targetRpe)||targetRpe(e,b)||8; const currentHint=s.weight?`${s.weight} × ${s.reps||targetReps}`:(priorSug?priorSug.display:(lastWorkingWeight(e.name,w.id)?`${lastWorkingWeight(e.name,w.id)} × ${targetReps||'target reps'}`:'Enter your starting load')); const weightHelp=/jump|slam|throw|push up|pull up|chin|dip/i.test(e.name||'')?'Use 0 if bodyweight/no external load.':'Enter the actual load used.'; const setCards=(e.loggedSets||[]).map((set,i)=>{const status=setCardStatus(set,i===st.si); if(i!==st.si)return renderSetCardCollapsed(w,b,e,st.bi,st.ei,i,set,status); return `<div class="setCard current"><div class="setCardHead"><div><strong>Set ${i+1}</strong><div class="meta">Log this set, then it collapses and the next set opens.</div></div><span class="setBadge current">Open</span></div><div class="setCardBody"><div class="nextPreview ${priorSug?esc(priorSug.action):'repeat'}"><b>Suggested now</b><div style="font-size:22px;font-weight:950;margin-top:4px">${esc(currentHint)}</div><div class="tiny">${priorSug?esc(priorSug.reason):'First working set. Warm up first, then choose a clean starting load.'}</div>${priorSug?`<button class="btn small primary" style="margin-top:8px" onclick="guidedUseSuggestion('${w.id}',${st.bi},${st.ei},${st.si-1},${st.si})">Use suggestion</button>`:''}</div><div class="guidedSetInputs"><div><div class="label">Weight</div><input id="guidedWeight" value="${esc(s.weight)}" inputmode="decimal" placeholder="kg or 0" onchange="updateSet('${w.id}',${st.bi},${st.ei},${st.si},'weight',this.value,false)"><div class="tiny">${esc(weightHelp)}</div></div><div><div class="label">Reps</div><input id="guidedReps" value="${esc(s.reps)}" inputmode="numeric" onchange="updateSet('${w.id}',${st.bi},${st.ei},${st.si},'reps',this.value,false)"></div></div><div class="rpeWrap"><div class="rpeTop"><span class="label">Set Effort</span><span class="rpeValue">${rpe?`RPE ${rpe}`:'Choose RPE'}</span></div><input id="guidedRpe" class="rpeScale" type="range" min="1" max="10" step="1" value="${sliderVal}" oninput="guidedRpeInput(this)" onchange="updateSet('${w.id}',${st.bi},${st.ei},${st.si},'rpe',this.value,false)"><div class="rpeHint">${esc(rpe?rpeText(rpe):'Confirm the effort before logging.')}</div>${!s.rpeConfirmed?`<button data-rpe-confirm="1" class="btn small" style="margin-top:8px" onclick="confirmGuidedRpeFromButton(this,'${w.id}',${st.bi},${st.ei},${st.si})">Confirm RPE ${sliderVal}</button>`:''}</div><div class="grid2" style="margin-top:10px"><button class="btn small" onclick="swapExercisePrompt('${w.id}',${st.bi},${st.ei})">Swap exercise</button><button class="btn small danger" onclick="painPrompt('${w.id}',${st.bi},${st.ei})">Pain</button></div></div></div>`}).join(''); return `<section class="guidedCard"><div class="guidedKicker">${esc(b.heading)} · set-by-set</div><div class="guidedTitle">${esc(e.name||'Exercise')}</div><div class="guidedHero">Set ${st.si+1} of ${(e.loggedSets||[]).length}</div><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><span class="pill gold">Target ${esc(s.target||e.reps||'')}</span><span class="pill">Target RPE ${esc(s.targetRpe||targetRpe(e,b))}</span><span class="pill">${esc(profile.count?profile.label:'No history')}</span></div><div class="setStack">${setCards}</div></section><div class="guidedActions three"><button class="btn" onclick="guidedPrev('${w.id}')">Back</button><button class="btn" onclick="addSet('${w.id}',${st.bi},${st.ei},false)">+ Extra set</button><button class="btn primary" onclick="logGuidedSet('${w.id}',${st.bi},${st.ei},${st.si})">Done / Log Set</button></div function logGuidedPowerSet(id,bi,ei,si,action){const w=byId(S.workouts,id); if(!w)return; const b=w.blocks[bi], e=b.exercises[ei], s=e.loggedSets[si]; const g=ensureGuided(w); const steps=guidedSteps(w); if(action==='repeat'){s.repeats=(num(s.repeats)||0)+1; save(); render(); return} if(action==='skip'){s.skipped=true; s.flowDone=false; save(); guidedNext(id); return} const target=String(s.target||e.reps||'3').split(',')[0].trim()||'3'; s.weight='0'; s.reps=target.replace(/[^0-9.]/g,'')||target; s.rpe=''; s.rir=''; s.flowDone=true; s.flowType='power-primer'; const current=g.step||0; const nextStep=Math.min(current+1,steps.length-1); const rest=num(e.restSec)||0; if(rest>0&&steps[nextStep]&&steps[nextStep].kind!=='finish'){g.rest={seconds:rest,startedAt:Date.now(),from:{bi,ei,si,flow:true},nextStep}; save(); render(); return} g.step=nextStep; save(); render()}
function logGuidedSet(id,bi,ei,si){const w=byId(S.workouts,id); if(!w)return; const b=w.blocks[bi], e=b.exercises[ei], s=e.loggedSets[si]; const weightEl=document.getElementById('guidedWeight'); const repsEl=document.getElementById('guidedReps'); if(weightEl)s.weight=String(weightEl.value).trim(); if(repsEl)s.reps=String(repsEl.value).trim(); if(!s.rpeConfirmed){save(); alert('Confirm the RPE before logging this set.'); return} if(!setComplete(s)){save(); alert('Log weight, reps and confirmed RPE before moving on. Use 0 for bodyweight/no external load.'); return} s.logged=true; save(); const g=ensureGuided(w); const steps=guidedSteps(w); const current=g.step||0; const nextStep=Math.min(current+1,steps.length-1); const rest=num(e.restSec)||0; if(rest>0&&steps[nextStep]&&steps[nextStep].kind!=='finish'){g.rest={seconds:rest,startedAt:Date.now(),from:{bi,ei,si},nextStep}; save(); render(); return} g.step=nextStep; save(); render()}
function renderGuidedRest(w,g,steps){const r=g.rest; const from=r.from; const b=w.blocks[from.bi], e=b.exercises[from.ei], s=e.loggedSets[from.si]; const isFlow=!!from.flow||isFlowPrimer(e,b); const sug=isFlow?null:coachSuggestion(w,b,e,from.si); const next=steps[r.nextStep]; const canUse=!isFlow&&sug&&next&&next.kind==='set'&&next.bi===from.bi&&next.ei===from.ei; const remaining=Math.max(0,Math.ceil((r.seconds-((Date.now()-r.startedAt)/1000)))); const nextTitle=canUse?esc(sug.display):esc(stepLabel(w,next)); const nextReason=isFlow?'Power primer flow: rest, then repeat the next explosive set. No RPE, no load suggestion.':(canUse?esc(sug.reason):'Next screen is a different block/exercise. Move on when ready.'); const logged=isFlow?`${esc(s.reps||s.target||'Done')} reps fast`:`${esc(s.weight)} × ${esc(s.reps)} @ RPE ${esc(s.rpe)}`; return `<main class="screen guidedShell">${header('Rest',`${e.name||'Exercise'} · after set ${from.si+1}`)}${guidedProgress(w,steps,r.nextStep-1)}<section class="guidedCard"><div class="guidedKicker">Logged</div><div class="guidedHero">${logged}</div><div class="restRing"><div class="restTime" id="restCountdown" data-seconds="${r.seconds}" data-started="${r.startedAt}">${formatTime(remaining)}</div></div><div class="nextPreview ${canUse?esc(sug.action):'repeat'}"><b>Next up</b><div style="font-size:24px;font-weight:950;margin-top:4px">${nextTitle}</div><div class="tiny">${nextReason}</div>${canUse?`<div class="coachTrend">${esc(sug.trendNote)}</div>`:''}</div></section><div class="guidedActions"><button class="btn" onclick="restNext('${w.id}',false)">Manual / Skip</button><button class="btn primary" onclick="restNext('${w.id}',${canUse?'true':'false'})">${canUse?'Use suggestion & continue':'Continue'}</button></div></main>`}
function restNext(id,use){const w=byId(S.workouts,id); if(!w)return; const g=ensureGuided(w); const r=g.rest; if(!r)return guidedNext(id); const steps=guidedSteps(w); const next=steps[r.nextStep]; if(use&&next&&next.kind==='set'&&next.bi===r.from.bi&&next.ei===r.from.ei){const b=w.blocks[r.from.bi], e=b.exercises[r.from.ei]; const sug=coachSuggestion(w,b,e,r.from.si); if(sug){const ns=e.loggedSets[next.si]; ns.weight=sug.weight; ns.reps=sug.reps; ns.rpe=''; ns.rir=''; ns.rpeConfirmed=false; ns.logged=false}} g.step=r.nextStep; g.rest=null; save(); render()}
function guidedUseSuggestion(id,bi,ei,fromSi,toSi){const w=byId(S.workouts,id); if(!w)return; const b=w.blocks[bi], e=b.exercises[ei]; const sug=coachSuggestion(w,b,e,fromSi); if(!sug)return; const s=e.loggedSets[toSi]; if(!s)return; s.weight=sug.weight; s.reps=sug.reps; s.rpe=''; s.rir=''; s.rpeConfirmed=false; s.logged=false; save(); render()}
function lastWorkingWeight(name,excludeWorkoutId=''){const p=exerciseProfile(name,excludeWorkoutId); const last=p.recent&&p.recent[p.recent.length-1]; return last?last.weight:0}
function warmupAdvice(w,b,e){const pattern=patternOf(e.name,b.heading); const last=lastWorkingWeight(e.name,w.id); if(pattern==='power')return 'Keep it snappy. Do 2–3 easy practice reps, then perform the work sets fast. Stop if speed drops. Target RPE 5–6.'; if(isAccessory(e,b))return 'Do one light feeler set if needed, then start. Add reps before load. Keep the movement clean.'; if(last){const inc=jumpSize(pattern,last)||2.5; const a=roundTo(last*.4,inc), c=roundTo(last*.6,inc), d=roundTo(last*.75,inc); return `Ramp suggestion from your recent working load (${last}):\n${a} × 5\n${c} × 3\n${d} × 2\nThen start Set 1. Keep warm-ups easy.`} return 'No history yet. Do 2–4 ramp sets. Start lighter than ego wants, then let the first logged set tell the engine what to do next.'}
function formatTime(sec){sec=Math.max(0,Math.floor(sec||0)); return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function bindGuidedRestTimer(){if(guidedRestTicker){clearInterval(guidedRestTicker); guidedRestTicker=null} const el=document.getElementById('restCountdown'); if(!el)return; const total=num(el.dataset.seconds), started=num(el.dataset.started); guidedRestTicker=setInterval(()=>{const rem=Math.max(0,Math.ceil(total-((Date.now()-started)/1000))); el.textContent=formatTime(rem); if(rem<=0){clearInterval(guidedRestTicker); guidedRestTicker=null}},250)}
function renderWorkoutOverview(id,editMode=false){const saved=byId(S.workouts,id); if(!saved)return `<main class="screen">${header('Missing workout')}<button class="btn" onclick="setView('home')">Home</button></main>`; let w=saved; if(editMode){if(!editDraft || editDraft.id!==id)editDraft={id,draft:deep(saved)}; w=editDraft.draft} const isActive=w.status==='active'; const isDone=w.status==='completed'; const editable=isActive||editMode; return `<main class="screen">${header(w.template_name,`${w.date} · ${editMode?'editing completed':w.status}`)}<button class="btn ghost" onclick="${editMode?`cancelCompletedEdit('${id}')`:`setView('home')`}">← ${editMode?'Cancel':'Home'}</button>${isDone&&!editMode&&w.session_data?.summary?summaryCard(w.session_data.summary):''}${w.applied_readiness?`<div class="notice">Applied readiness: ${esc(w.applied_readiness.toUpperCase())}</div>`:''}${w.status==='scheduled'?`<div class="card"><p>This workout is scheduled.</p><button class="btn primary full" onclick="beginWorkout('${w.id}')">Start Workout</button></div>`:''}<div class="${editable?'':'readonly'}">${w.blocks.map((b,bi)=>renderWorkoutBlock(w,b,bi,editable,editMode)).join('')}<div class="card"><div class="label">Session notes</div><textarea ${editable?'':'disabled'} onchange="updateWorkoutNotes('${w.id}',this.value,${editMode})">${esc(w.notes||'')}</textarea></div></div><div class="grid2">${editMode?`<button class="btn danger" onclick="cancelCompletedEdit('${id}')">Cancel</button><button class="btn primary" onclick="saveCompletedEdit('${id}')">Save Edit</button>`:isActive?`<button class="btn danger" onclick="deleteWorkout('${w.id}')">Delete</button><button class="btn primary" onclick="completeWorkout('${w.id}')">Finish</button>`:isDone?`<button class="btn danger" onclick="deleteWorkout('${w.id}')">Delete</button><button class="btn" onclick="startCompletedEdit('${w.id}')">Edit completed</button>`:`<button class="btn danger" onclick="deleteWorkout('${w.id}')">Delete</button><button class="btn primary" onclick="beginWorkout('${w.id}')">Start</button>`}</div></main>`}

function summaryCard(s){const strength=s.total_sets||0; const flow=s.flow_sets||0; const effort=s.avg_rpe?`RPE ${s.avg_rpe}`:'—'; const top=s.top_set?`${esc(s.top_set.exercise)} — ${esc(s.top_set.weight)} × ${esc(s.top_set.reps)} @ RPE ${esc(s.top_set.rpe)}`:'No top set logged'; return `<div class="card simpleSummary"><div class="guidedKicker">Workout summary</div><div class="bigDone">Done.</div><div class="simpleSummaryLine">${strength} strength set${strength===1?'':'s'} logged${flow?` · ${flow} flow set${flow===1?'':'s'}`:''}</div><div class="summaryMini"><div class="card"><b>${strength}</b><div class="tiny">Strength sets</div></div><div class="card"><b>${effort}</b><div class="tiny">Average effort</div></div></div><div class="summaryTopSet"><div class="tiny">Top set</div><b>${top}</b></div><div class="summaryActionsHint">Keep this simple: check the top set, add notes if needed, then finish.</div></div>`}
function renderWorkoutBlock(w,b,bi,editable,editMode){return `<div class="block"><div class="blockHead"><b>${esc(b.heading)}</b><span class="pill">${esc(b.type)}</span></div>${b.openText!==undefined?`<textarea ${editable?'':'disabled'} onchange="updateBlockText('${w.id}',${bi},this.value,${editMode})">${esc(b.openText||'')}</textarea>`:''}${b.exercises?b.exercises.map((e,ei)=>renderExercise(w,b,bi,ei,e,editable,editMode)).join(''):''}${b.metrics?renderMetrics(w.id,bi,b,editable,editMode):''}</div>`}
function renderExercise(w,b,bi,ei,e,editable,editMode){const profile=exerciseProfile(e.name,w.id); if(isFlowPrimer(e,b)){return `<div class="exCard flowOverview"><div class="row"><div><b>${esc(e.name||'Power primer')}</b><div class="tiny">${esc(e.sets)} sets · ${esc(e.reps)} · flow only · no RPE/load chasing</div>${e.coachNote?`<div class="tiny goldText">${esc(e.coachNote)}</div>`:''}</div></div>${(e.loggedSets||[]).map((s,si)=>`<div class="flowRow"><b>Set ${si+1}</b><span class="pill ${s.flowDone?'green':s.skipped?'danger':''}">${s.flowDone?'Done':s.skipped?'Skipped':'Pending'}</span><span class="tiny">${esc(s.target||e.reps||'')} fast</span></div>`).join('')}</div>`} return `<div class="exCard"><div class="row"><div><b>${esc(e.name||'Unnamed exercise')}</b><div class="tiny">${esc(e.sets)} sets · target ${esc(e.reps)} · target RPE ${targetRpe(e,b)} · rest ${esc(e.restSec||0)}s</div>${profile.count?`<div class="tiny goldText">${esc(profile.label)}</div>`:`<div class="tiny">No history yet — conservative first run.</div>`}${e.rirTarget?`<div class="tiny goldText">${esc(e.rirTarget)}</div>`:''}</div>${editable?`<button class="btn small" onclick="addSet('${w.id}',${bi},${ei},${editMode})">+ Set</button>`:''}</div>${(e.loggedSets||[]).map((s,si)=>renderSetRow(w,b,e,bi,ei,si,s,editable,editMode)).join('')}${e.coachNote?`<div class="tiny">${esc(e.coachNote)}</div>`:''}</div>`}
function renderSetRow(w,b,e,bi,ei,si,s,editable,editMode){const rpe=num(s.rpe); const label=rpe?rpeText(rpe):'Slide after set'; const sug=coachSuggestion(w,b,e,si); return `<div class="setRow"><div class="setInputs"><div class="tiny"><b>${si+1}</b><br><span class="muted">${esc(s.target||'')}</span></div><div><div class="label">Weight</div><input ${editable?'':'disabled'} value="${esc(s.weight)}" inputmode="decimal" onchange="updateSet('${w.id}',${bi},${ei},${si},'weight',this.value,${editMode})"></div><div><div class="label">Reps</div><input ${editable?'':'disabled'} value="${esc(s.reps)}" inputmode="numeric" onchange="updateSet('${w.id}',${bi},${ei},${si},'reps',this.value,${editMode})"></div></div><div class="rpeWrap"><div class="rpeTop"><span class="label">Set Effort</span><span class="rpeValue">${rpe?`RPE ${rpe}`:'RPE —'}</span></div><input class="rpeScale" type="range" min="1" max="10" step="1" ${editable?'':'disabled'} value="${rpe||6}" oninput="this.nextElementSibling.textContent=rpeText(this.value)" onchange="updateSet('${w.id}',${bi},${ei},${si},'rpe',this.value,${editMode})"><div class="rpeHint">${esc(label)}</div></div>${sug?renderSuggestion(w.id,bi,ei,si,sug,editMode):''}</div>`}
function renderSuggestion(wid,bi,ei,si,sug,editMode){return `<div class="coachBox ${esc(sug.action)}"><div class="row"><div><b>Next Set Coach</b><div class="coachReason">${esc(sug.reason)}</div></div><span class="pill ${sug.pill}">${esc(sug.confidence)}</span></div><div class="row" style="margin-top:8px"><div><b>${esc(sug.display)}</b><div class="coachTrend">${esc(sug.trendNote)}</div></div>${sug.weight?`<button class="btn small primary" onclick="useSuggestion('${wid}',${bi},${ei},${si},'${sug.weight}','${sug.reps}',${editMode})">Use</button>`:''}</div></div>`}
function renderMetrics(wid,bi,b,editable,editMode){return `<div class="grid2">${b.metrics.map((m,i)=>`<div><div class="label">${esc(m.name)}</div><input class="input" ${editable?'':'disabled'} type="${m.type==='number'?'number':'text'}" value="${esc((b.loggedMetrics||[])[i]||'')}" onchange="updateMetric('${wid}',${bi},${i},this.value,${editMode})"></div>`).join('')}</div>`}
function getTarget(id,editMode){return editMode?editDraft?.draft:byId(S.workouts,id)}
function beginWorkout(id){const w=byId(S.workouts,id); if(!w)return; const t=byId(S.templates,w.template_id); if(t&&w.status==='scheduled'&&confirm('Apply today’s readiness before starting?')){const r=readiness(currentCheckin()); const lane=r?.lane||'build'; w.blocks=adaptBlocks(t.blocks,lane); w.applied_readiness=lane; w.applied_mode='RE:BUILT Strength'} w.status='active'; w.started_at=new Date().toISOString(); w.session_feel=null; w.cooked_applied=false; w.session_data=w.session_data||{}; w.session_data.guided={step:0,rest:null}; initWorkout(w); save(); render()}

function completeWorkout(id){const w=byId(S.workouts,id); if(!w)return; w.status='completed'; w.completed_at=new Date().toISOString(); w.session_data=w.session_data||{}; w.session_data.summary=calcSummary(w); w.session_data.lastSaved=new Date().toISOString(); save(); render()}
function loggedSetCount(w){let c=0;(w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(e=>(e.loggedSets||[]).forEach(s=>{if(setComplete(s))c++})));return c}
function finishEarly(id){const w=byId(S.workouts,id); if(!w)return; const c=loggedSetCount(w); const msg=c?`Finish early and save ${c} logged set${c===1?'':'s'}? Incomplete future sets will stay blank.`:'Finish early with no logged sets?'; if(!confirm(msg))return; completeWorkout(id)}
function startCompletedEdit(id){editDraft={id,draft:deep(byId(S.workouts,id))}; setView('editWorkout:'+id)}
function cancelCompletedEdit(id){editDraft=null; setView('workout:'+id)}
function saveCompletedEdit(id){const i=S.workouts.findIndex(w=>w.id===id); if(i<0||!editDraft)return; const draft=editDraft.draft; draft.status='completed'; draft.session_data=draft.session_data||{}; draft.session_data.summary=calcSummary(draft); draft.session_data.lastEdited=new Date().toISOString(); S.workouts[i]=draft; editDraft=null; save(); setView('workout:'+id)}
function deleteWorkout(id){if(!confirm('Delete this workout?'))return; S.workouts=S.workouts.filter(w=>w.id!==id); save(); setView('home')}
function updateWorkoutNotes(id,v,editMode=false){const w=getTarget(id,editMode); if(w){w.notes=v; if(!editMode)save()}}
function updateBlockText(id,bi,v,editMode=false){const w=getTarget(id,editMode); if(w){w.blocks[bi].openText=v; if(!editMode)save()}}
function updateSet(id,bi,ei,si,k,v,editMode=false){const w=getTarget(id,editMode); if(w){const set=w.blocks[bi].exercises[ei].loggedSets[si]; set[k]=v; if(k==='rpe'){const r=num(v); set.rir=r?String(Math.max(0,10-r)):''} if(!editMode)save(); const suppress=!editMode&&activeView.startsWith('workout:')&&w.status==='active'; if(!suppress)render()}}
function addSet(id,bi,ei,editMode=false){const w=getTarget(id,editMode); if(w){const b=w.blocks[bi], e=b.exercises[ei]; e.loggedSets.push({target:'extra',targetRpe:String(targetRpe(e,b)),weight:'',reps:'',rpe:'',rir:''}); if(!editMode)save(); render()}}
function useSuggestion(id,bi,ei,si,weight,reps,editMode=false){const w=getTarget(id,editMode); if(!w)return; const e=w.blocks[bi].exercises[ei]; const next=si+1; if(!e.loggedSets[next])e.loggedSets.push({target:'extra',targetRpe:String(targetRpe(e,w.blocks[bi])),weight:'',reps:'',rpe:'',rir:''}); e.loggedSets[next].weight=weight; e.loggedSets[next].reps=reps; if(!editMode)save(); render()}
function updateMetric(id,bi,i,v,editMode=false){const w=getTarget(id,editMode); if(w){w.blocks[bi].loggedMetrics=w.blocks[bi].loggedMetrics||[]; w.blocks[bi].loggedMetrics[i]=v; if(!editMode)save()}}
function calcSummary(w){let total_sets=0,flow_sets=0,tonnage=0,conditioning_load=0,rpes=[],top=null; w.blocks.forEach(b=>{if(b.exercises){b.exercises.forEach(e=>(e.loggedSets||[]).forEach(s=>{if(s.flowDone||s.skipped){if(s.flowDone)flow_sets++; return} if(s.logged===true&&setComplete(s)){total_sets++; tonnage+=num(s.weight)*num(s.reps); if(num(s.rpe))rpes.push(num(s.rpe)); const score=e1rm(num(s.weight),num(s.reps),num(s.rpe)); if(score && (!top||score>top.e1rm))top={exercise:e.name,weight:num(s.weight),reps:num(s.reps),rpe:num(s.rpe),e1rm:Math.round(score)}}}))} if(b.loggedMetrics)conditioning_load+=b.loggedMetrics.filter(Boolean).length}); return {total_sets,flow_sets,tonnage:Math.round(tonnage),strength_load:total_sets,conditioning_load,total_load:total_sets+flow_sets+conditioning_load,avg_rpe:rpes.length?Math.round(avg(rpes)*10)/10:null,top_set:top}}


function rpeText(v){v=num(v); const map={1:'RPE 1 — Barely anything · 9+ reps left',2:'RPE 2 — Very easy · 8+ reps left',3:'RPE 3 — Easy · 7+ reps left',4:'RPE 4 — Comfortable · 6+ reps left',5:'RPE 5 — Moderate · about 5 reps left',6:'RPE 6 — Working · about 4 reps left',7:'RPE 7 — Challenging but clean · about 3 reps left',8:'RPE 8 — Hard but controlled · about 2 reps left',9:'RPE 9 — Very hard · about 1 rep left',10:'RPE 10 — Limit set · no reps left'}; return map[v]||'Slide after set'}
function targetRpe(e,b){if(e&&e.targetRpe)return num(e.targetRpe)||8; const h=((b&&b.heading)||'')+' '+((e&&e.name)||''); if(/power|primer|jump|slam|throw|plyo/i.test(h))return 6; if(/accessor|arm|curl|tricep|raise|fly|extension|calf|isolation/i.test(h))return 8; if(/conditioning/i.test(h))return 6; return 8}
function isFlowPrimer(e,b){const h=((b&&b.heading)||'')+' '+((e&&e.name)||''); return !!(e&&e.flowOnly)||/power|primer|jump|slam|throw|plyo|dynamic/i.test(h)}
function flowSetDone(s){return !!(s&&(s.flowDone||s.skipped||num(s.reps)>0))}
function parseTargetReps(v){const m=String(v||'').match(/\d+(?:\.\d+)?/); return m?Number(m[0]):0}
function patternOf(name,heading=''){const x=(name+' '+heading).toLowerCase(); if(/deadlift|rdl|hinge|hip thrust|good morning|nordic/.test(x))return 'hinge'; if(/squat|leg press|lunge|step up|split squat/.test(x))return 'squat'; if(/bench|dip|push up|press|fly|tricep/.test(x))return /overhead|shoulder|press/.test(x)&&!/bench/.test(x)?'vertical-push':'push'; if(/row|pull up|chin|pulldown|face pull/.test(x))return 'pull'; if(/curl|raise|extension|calf|leg curl|leg extension|pec deck/.test(x))return 'accessory'; if(/carry|farmer|suitcase|sled/.test(x))return 'carry'; if(/jump|slam|throw|plyo/.test(x))return 'power'; return 'strength'}
function isAccessory(e,b){return patternOf(e.name,b.heading)==='accessory'||/accessor|finisher/i.test(b.heading)}
function isHeavyRisk(e,b){return ['hinge','squat'].includes(patternOf(e.name,b.heading))}
function roundTo(x,inc){inc=inc||2.5; return Math.round(x/inc)*inc}
function jumpSize(pattern,weight){if(pattern==='hinge'||pattern==='squat')return weight>=80?5:2.5; if(pattern==='push'||pattern==='pull'||pattern==='vertical-push')return 2.5; if(pattern==='accessory')return weight>=20?2.5:1; if(pattern==='power')return 0; return 2.5}
function e1rm(weight,reps,rpe){weight=num(weight); reps=num(reps); rpe=num(rpe); if(!weight||!reps)return 0; const rir=rpe?Math.max(0,10-rpe):2; return weight*(1+(reps+rir)/30)}
function setComplete(s){const raw=String(s?.weight??'').trim(); const hasWeight=raw!=='' && Number.isFinite(Number(raw)) && Number(raw)>=0; return hasWeight && num(s.reps)>0 && num(s.rpe)>0}
function completedSetsForExercise(name,excludeWorkoutId=''){const key=String(name||'').trim().toLowerCase(); const rows=[]; if(!key)return rows; (S.workouts||[]).filter(w=>w.status==='completed'&&w.id!==excludeWorkoutId).forEach(w=>{(w.blocks||[]).forEach(b=>{(b.exercises||[]).forEach(e=>{if(String(e.name||'').trim().toLowerCase()===key){(e.loggedSets||[]).forEach(s=>{if(setComplete(s))rows.push({date:w.date,workoutId:w.id,weight:num(s.weight),reps:num(s.reps),rpe:num(s.rpe),e1rm:e1rm(s.weight,s.reps,s.rpe)})})}})})}); return rows.sort((a,b)=>a.date.localeCompare(b.date))}
function exerciseProfile(name,excludeWorkoutId=''){const rows=completedSetsForExercise(name,excludeWorkoutId); const byWorkout={}; rows.forEach(r=>{const k=r.date+'|'+r.workoutId; if(!byWorkout[k]||r.e1rm>byWorkout[k].e1rm)byWorkout[k]=r}); const exposures=Object.values(byWorkout).sort((a,b)=>a.date.localeCompare(b.date)); const recent=exposures.slice(-5); const count=exposures.length; if(!count)return {count:0,label:'No history yet',trend:'new',trendNote:'New lift. Conservative estimate.'}; const first=recent[0], last=recent[recent.length-1]; const pct=first&&first.e1rm?((last.e1rm-first.e1rm)/first.e1rm)*100:0; const avgRpe=avg(recent.map(x=>x.rpe)); let trend='steady', note='Trend steady.'; if(recent.length>=3&&pct>2&&avgRpe<=8.5){trend='adapting'; note='Trend: adapting well.'} else if(recent.length>=3&&pct<-2){trend='down'; note='Trend: performance dipping.'} else if(recent.length>=3&&avgRpe>=8.8){trend='effort-high'; note='Trend: effort is running high.'} else if(recent.length<3){trend='low-data'; note='Trend: still learning this lift.'} return {count,rows,recent,trend,trendNote:note,label:`${count} exposure${count===1?'':'s'} · ${note}`}}
function confidenceFor(profile,s,targetReps){let score=0; if(profile.count>=5)score+=2; else if(profile.count>=3)score+=1; const reps=num(s.reps), rpe=num(s.rpe); if(reps>=3&&reps<=12)score++; if(rpe>=7&&rpe<=9)score++; if(targetReps&&Math.abs(reps-targetReps)<=2)score++; if(score>=4)return ['high','green']; if(score>=2)return ['medium','amber']; return ['low','red']}
function coachSuggestion(w,b,e,si){const sets=e.loggedSets||[]; const s=sets[si]; if(!s||!setComplete(s))return null; const weight=num(s.weight), reps=num(s.reps), actualRpe=num(s.rpe); const targetReps=parseTargetReps(s.target||e.reps)||reps; const tr=num(s.targetRpe)||targetRpe(e,b); const rpeGap=tr-actualRpe; const repGap=reps-targetReps; const lane=w.applied_readiness||activeLane(); const feel=w.session_feel||''; const cooked=feel==='cooked'; const pattern=patternOf(e.name,b.heading); const profile=exerciseProfile(e.name,w.id); const [conf,pill]=confidenceFor(profile,s,targetReps); const baseJump=jumpSize(pattern,weight); if(pattern==='power'){let action='repeat'; let suggestedWeight=weight; let suggestedReps=targetReps||reps; let reason='Power work: repeat fast. Do not chase load.'; if(actualRpe>=8||repGap<0){reason='Power slowed or became too hard. Keep the load, reduce effort, or stop power work.'} const display=weight>0?`${suggestedWeight} × ${suggestedReps}`:`${suggestedReps} reps fast`; return {action,weight:String(suggestedWeight),reps:String(suggestedReps),reason,confidence:conf,pill,display,trendNote:profile.trendNote||'Power is judged by speed, not grinding.'}} const prior=sets.slice(0,si).filter(setComplete); const priorLast=prior[prior.length-1]; let action='repeat', suggestedWeight=weight, suggestedReps=targetReps||reps, reason='Repeat. That set landed close to target.'; let trendNote=profile.trendNote||'Trend: new lift.'; const accessory=isAccessory(e,b); const risky=isHeavyRisk(e,b); const minimum=lane==='minimum'; const control=lane==='control'; const effortClimb=priorLast && actualRpe-priorLast.rpe>=2; const missed=repGap<0; if(minimum){action='repeat'; reason='Minimum day: no load chasing. Keep clean work and finish fresh.'; suggestedWeight=weight; suggestedReps=reps} else if(actualRpe>=10){action='reduce'; suggestedWeight=roundTo(weight*.9,baseJump||2.5); reason='RPE 10 means limit set. Drop 10% or stop loading.'} else if(missed && actualRpe>=9){action='reduce'; suggestedWeight=roundTo(weight*.925,baseJump||2.5); reason='Missed reps and effort was high. Reduce the load.'} else if(missed){action='reduce'; suggestedWeight=roundTo(weight*.95,baseJump||2.5); reason='Reps missed. Take a small reduction and own the target.'} else if(actualRpe>tr){action='repeat'; suggestedWeight=actualRpe>=9?roundTo(weight*.975,baseJump||2.5):weight; reason='You hit reps but effort was above target. Hold or reduce slightly.'} else if(accessory && rpeGap>=1){action='reps'; suggestedWeight=weight; suggestedReps=reps+1; reason='Accessory lift: add reps before load.'} else if(rpeGap>=2){action='increase'; suggestedWeight=roundTo(weight+(risky?Math.min(baseJump,5):baseJump),baseJump||2.5); reason='You hit target reps well below target effort. Add weight.'} else if(rpeGap>=1){action=control||profile.trend==='effort-high'||effortClimb?'repeat':'increase'; suggestedWeight=action==='increase'?roundTo(weight+(risky?Math.min(baseJump,2.5):baseJump),baseJump||2.5):weight; reason=action==='increase'?'You were a little under target effort. Add a small jump.':'Good set. Because readiness/trend is cautious, repeat the load.'}
 if(cooked&&action==='increase'){action='repeat'; suggestedWeight=weight; reason='Cooked day: good set, but no load chasing. Keep it crisp.'}
 if(control&&action==='increase'){action='repeat'; suggestedWeight=weight; reason='Control day: good set, but repeat instead of chasing load.'}
 if(profile.trend==='down'&&action==='increase'){action='repeat'; suggestedWeight=weight; reason='Recent trend is dipping. Repeat before adding.'}
 if(profile.trend==='effort-high'&&action==='increase'){action='repeat'; suggestedWeight=weight; reason='Recent efforts are high. Repeat and stabilise.'}
 if(effortClimb&&action==='increase'){action='repeat'; suggestedWeight=weight; reason='RPE jumped quickly this exercise. Repeat before adding.'}
 suggestedWeight=Math.max(0,Math.round(suggestedWeight*10)/10); const display=action==='reps'?`${suggestedWeight} × ${suggestedReps} reps`:`${suggestedWeight} × ${suggestedReps}`; return {action,weight:String(suggestedWeight),reps:String(suggestedReps),reason,confidence:conf,pill,display,trendNote}}

function renderCalendar(){const grouped={}; S.workouts.forEach(w=>{(grouped[w.date] ||= []).push(w)}); const dates=[...new Set([...Object.keys(grouped),...S.checkins.map(c=>c.date)])].sort(); const history=dates.length?dates.reverse().map(d=>`<div class="sectionTitle">${esc(d)} ${d===today()?'· Today':''}</div>${(grouped[d]||[]).map(workoutListItem).join('')}${S.checkins.find(c=>c.date===d)?`<div class="listItem"><span class="pill amber">Check-in</span><div class="tiny">${esc(laneText(readiness(S.checkins.find(c=>c.date===d)))[0])}</div></div>`:''}`).join(''):`<div class="card"><b>No logged sessions yet.</b><p class="sub">Start a template when you train. This page will show what you actually did — not auto-planned days.</p></div>`; return `<main class="screen">${header('Manual Log','No auto week. You choose what to train and when.')}<div class="card"><div class="row"><div><b>Start from a template</b><p class="sub">Pick the session yourself. Nothing is auto-scheduled across the week.</p></div><button class="btn small primary" onclick="setLibTab('templates');setView('library')">Templates</button></div></div><div class="sectionTitle">History</div>${history}</main>`}

function renderCheckin(){const c=currentCheckin()||{date:today(),notes:''}; const r=readiness(c); const [rt,rs]=laneText(r); const ratings=[['sleep_quality','Sleep Quality'],['energy','Energy'],['soreness','Soreness'],['joint_stress','Joint Stress'],['mental_stress','Mental Stress'],['work_stress','Work Stress']]; const nums=[['sleep_hours','Sleep hours'],['steps','Steps'],['hrv','HRV'],['resting_hr','Resting HR'],['whoop_recovery','WHOOP Recovery %'],['bodyweight','Bodyweight']]; return `<main class="screen">${header('Check-In','No fake defaults. Leave unknowns blank.')}<div class="card elev"><span class="pill ${r?laneClass(r.lane):''}">${esc(rt)}</span><p class="sub">${esc(rs)}</p>${r?`<div class="bigScore">${r.score}</div>`:''}</div><form onsubmit="saveCheckin(event)"><div class="grid2">${ratings.map(([k,l])=>`<div><div class="label">${l} 1–10</div><input class="input" type="number" min="1" max="10" step="1" name="${k}" placeholder="blank" value="${esc(c[k]||'')}"></div>`).join('')}</div><div class="divider"></div><div class="grid2">${nums.map(([k,l])=>`<div><div class="label">${l}</div><input class="input" type="number" step="any" name="${k}" value="${esc(c[k]||'')}"></div>`).join('')}</div><div class="label">Notes</div><textarea name="notes">${esc(c.notes||'')}</textarea><button class="btn primary full" style="margin-top:12px">Save Check-In</button></form></main>`}
function saveCheckin(ev){ev.preventDefault(); const fd=new FormData(ev.target); const obj={date:today()}; fd.forEach((v,k)=>{if(String(v).trim()!=='')obj[k]=v}); const r=readiness(obj); obj.readiness=r?.lane||null; const i=S.checkins.findIndex(c=>c.date===obj.date); if(i>=0)S.checkins[i]={...S.checkins[i],...obj}; else S.checkins.unshift(obj); save(); render()}

function renderSettings(){const p=currentProgram(); return `<main class="screen">${header('Settings','Program and data controls.')}<div class="card"><div class="label">Active Program</div><h3 style="margin:4px 0">${esc(p.name)}</h3><p class="sub">${esc(p.description)}</p><div class="grid2"><span class="pill">${(p.templateIds||[]).length} templates</span><span class="pill green">RE:BUILT only</span></div></div><div class="card coachEngineCard"><h3>Adaptive Coach Engine</h3><p class="sub">Phase 5 is on from the start: RPE slider, Next Set Coach, exercise history, per-lift jump learning, readiness adjustment, and 3–5 exposure trend checks.</p><div class="grid2"><span class="pill green">RPE 1–10</span><span class="pill amber">Trend aware</span></div></div><div class="card"><h3>Data Management</h3><div class="grid2"><button class="btn" onclick="exportData()">Export</button><label class="btn" style="text-align:center">Import<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"></label></div><button class="btn danger full" style="margin-top:10px" onclick="resetApp()">Reset clean app</button></div><div class="card"><h3>About</h3><p><b>THE HYBRID ENGINE</b></p><p class="sub">Open app → check readiness → choose the session yourself → log the essentials → recover → repeat.</p><p class="tiny">No medical-grade recovery claims. Readiness is a coaching guide based on your inputs.</p></div></main>`}

function exportData(){const payload={...S,appId:'THE-HYBRID-ENGINE',version:'2.3-rebuilt-manual-log',exportedAt:new Date().toISOString()}; const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='THE-HYBRID-ENGINE-backup-'+today()+'.json'; a.click(); URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return; const r=new FileReader(); r.onload=()=>{try{const data=JSON.parse(r.result); const ok=data&&typeof data==='object'&&Array.isArray(data.templates)&&Array.isArray(data.workouts||[])&&Array.isArray(data.checkins||[]); if(!ok){alert('Import blocked: this does not look like a THE HYBRID ENGINE backup.'); return} if(!confirm('Import after validation? This replaces current app data. Export first if unsure.'))return; S=migrate(data); save(); alert('Import complete.'); render()}catch(e){alert('Could not parse JSON. Import blocked.')}}; r.readAsText(file)}

function forceCleanBoot(){
  try{localStorage.removeItem(STORAGE_KEY); (LEGACY_STORAGE_KEYS||[]).forEach(k=>localStorage.removeItem(k));}catch(e){}
  S=freshState(); activeView='home'; activeTab='templates'; editDraft=null; save(); render();
}

function resetApp(){if(!confirm('Reset this clean app data?'))return; try{localStorage.removeItem(STORAGE_KEY); (LEGACY_STORAGE_KEYS||[]).forEach(k=>localStorage.removeItem(k));}catch(e){window.__THE_MEMORY_ONLY__=true} S=freshState(); activeView='home'; editDraft=null; save(); render()}

function text_block(heading,order,openText=''){return {type:'text',heading,order,openText}}

const BUILDER_KINDS=['prep','power','primary','secondary','accessory','finisher','conditioning','recover'];
function labelKind(k){return ({prep:'Prep',power:'Power / Primer',primary:'Primary Lift',secondary:'Secondary Strength',accessory:'Accessory',finisher:'Finisher',conditioning:'Conditioning',recover:'Recover',custom:'Custom'})[k]||k}
function blockKind(b){if(!b)return 'custom'; if(b.kind)return b.kind; const h=String(b.heading||'').toLowerCase(); if(Array.isArray(b.warmupItems)&&/recover|cool|down/.test(h))return 'recover'; if(Array.isArray(b.warmupItems))return 'prep'; if(b.type==='conditioning')return /finisher|engine/.test(h)?'conditioning':'conditioning'; if(/power|primer|jump|slam|throw/.test(h))return 'power'; if(/primary|main/.test(h))return 'primary'; if(/secondary/.test(h))return 'secondary'; if(/finisher/.test(h))return 'finisher'; if(/accessory|volume|weak/.test(h))return 'accessory'; return b.type==='strength'?'accessory':'custom'}
function defaultHeadingForKind(k){return ({prep:'Prep',power:'Power / Primer',primary:'Primary Lift Block',secondary:'Secondary Strength',accessory:'Accessory Block',finisher:'Optional Finisher',conditioning:'Conditioning',recover:'Recover'})[k]||'Block'}
function patternOptionsForKind(k){if(k==='power')return ['power']; if(k==='primary')return ['squat','hinge','push','pull']; if(k==='secondary')return ['push','pull','hinge','squat']; if(k==='accessory')return ['lunge','pull','push','hinge','squat','carry','accessory']; if(k==='finisher')return ['carry','power','conditioning']; return ['squat','hinge','push','pull','lunge','carry','accessory','power']}
function selectOptions(vals,current){return vals.map(v=>`<option value="${esc(v)}" ${String(current||'')===String(v)?'selected':''}>${esc(v)}</option>`).join('')}
function exerciseChoices(pattern){let list=patternSwapsFor(pattern)||[]; if(pattern==='accessory')list=['Lateral Raise','Hamstring Curl','Leg Extension','Cable Tricep Pushdown','Barbell Curl','Face Pull','Calf Raise','Pallof Press']; if(pattern==='conditioning')list=['Bike','Rower','Fan Bike','Sled Push','Carry Medley']; const map={squat:['squat'],hinge:['hinge'],lunge:['unilateral'],push:['horizontal_push','vertical_push'],pull:['horizontal_pull','vertical_pull'],'vertical-push':['vertical_push'],carry:['carry'],accessory:['arms','isolation','core'],power:['power'],conditioning:['conditioning']}; const wanted=map[pattern]||[]; const existing=S.exercises.filter(e=>wanted.includes(e.movement_pattern)||(!e.movement_pattern&&patternOf(e.name,'')===pattern)).map(e=>e.name); return [...new Set([...list,...existing])]}

function newTemplate(kind='fullbodyA'){
  const p=currentProgram(); p.templateIds=p.templateIds||[];
  const t=makeTemplate(kind);
  S.templates.push(t); if(!p.templateIds.includes(t.id))p.templateIds.push(t.id); save(); setView('editTemplate:'+t.id)
}
function deleteTemplate(id){const t=byId(S.templates,id); if(!t)return; if(!confirm(`Delete template: ${t.name}?`))return; S.templates=S.templates.filter(x=>x.id!==id); S.programs.forEach(p=>{const ix=(p.templateIds||[]).indexOf(id); if(ix>-1){p.templateIds.splice(ix,1)}}); save(); render()}
function builderWarnings(t){
  const out=[]; const blocks=t.blocks||[];
  if(!t.name||/^Session\s/.test(t.name))out.push('Name the session clearly.');
  if(!blocks.some(b=>blockKind(b)==='prep'))out.push('Add a Prep block.');
  if(blocks.some(b=>['primary','secondary','accessory','finisher'].includes(blockKind(b))) && !blocks.some(b=>blockKind(b)==='power'))out.push('Strength sessions should include a flow-only Power / Primer block.');
  if(blocks.some(b=>['primary','secondary','accessory'].includes(blockKind(b))) && !blocks.some(b=>blockKind(b)==='primary'))out.push('Add a Primary Lift Block.');
  if(!blocks.some(b=>blockKind(b)==='recover'))out.push('Add a Recover block.');
  blocks.forEach(b=>{
    const k=blockKind(b);
    if((k==='prep'||k==='recover') && (!Array.isArray(b.warmupItems)||!b.warmupItems.length))out.push(`${b.heading}: add at least one guided flow item.`);
    (b.exercises||[]).forEach(e=>{
      if(!String(e.name||'').trim())out.push(`${b.heading}: choose an exercise.`);
      if(k==='power'&&!isFlowPrimer(e,b))out.push(`${b.heading}: primer movements must be flow-only.`);
      if(['primary','secondary','accessory'].includes(k) && isFlowPrimer(e,b))out.push(`${b.heading}: strength/accessory movements should not be flow-only.`);
      if(['primary','secondary','accessory'].includes(k) && !e.targetRpe && !e.rirTarget)out.push(`${b.heading}: set a target RPE/RIR.`);
    })
  });
  return [...new Set(out)]
}
function renderEditTemplate(id){
  const t=byId(S.templates,id); if(!t)return `<main class="screen">${header('Missing template')}</main>`; normaliseTemplate(t);
  const warns=builderWarnings(t);

function letterForBuilderIndex(i){return 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[i%26]||String(i+1)}
function syncSetPlanToExercise(e){
  const plan=(e.setPlan&&e.setPlan.length?e.setPlan:parseSetPlan(e));
  e.setPlan=plan.map(x=>({reps:String(x.reps||''),weight:String(x.weight||'')}));
  e.sets=e.setPlan.length;
  e.reps=e.setPlan.map(x=>x.reps||'').join(', ');
}
function parseSetPlan(e){
  const reps=String(e.reps||'').split(',').map(x=>x.trim()).filter((x,i,a)=>x!==''||a.length===1);
  const n=Math.max(num(e.sets)||0,reps.length,1);
  const out=[];
  for(let i=0;i<n;i++)out.push({reps:reps[i]||reps[reps.length-1]||'',weight:(e.setPlan&&e.setPlan[i]&&e.setPlan[i].weight)||''});
  return out;
}
function builderPrescriptionText(e){

}

function editTpl(id,k,v){const t=byId(S.templates,id); if(t){t[k]=v; save(); render()}}

function addBlock(id,type){const t=byId(S.templates,id); if(!t)return; const order=t.blocks.length+1; if(type==='prep')t.blocks.push(guided_warmup_block('Prep',order,null,1,'prep')); if(type==='recover')t.blocks.push(guided_warmup_block('Recover',order,null,1,'recover')); if(type==='power')t.blocks.push(strength_block('Power / Primer',order,[flowPrimer()],'power')); if(type==='primary')t.blocks.push(strength_block('Primary Lift Block',order,[defaultExerciseForKind('primary')],'primary')); if(type==='secondary')t.blocks.push(strength_block('Secondary Strength',order,[defaultExerciseForKind('secondary')],'secondary')); if(type==='accessory')t.blocks.push(strength_block('Accessory Block',order,[defaultExerciseForKind('accessory')],'accessory')); if(type==='finisher')t.blocks.push(strength_block('Optional Finisher',order,[defaultExerciseForKind('finisher')],'finisher')); if(type==='conditioning')t.blocks.push(conditioning_block('Conditioning',order,'','conditioning')); save(); render()}
function removeBlock(id,bi){const t=byId(S.templates,id); if(t&&confirm('Remove block?')){t.blocks.splice(bi,1); save(); render()}}
function moveBlock(id,bi,dir){const t=byId(S.templates,id); if(!t)return; const ni=bi+dir; if(ni<0||ni>=t.blocks.length)return; const x=t.blocks.splice(bi,1)[0]; t.blocks.splice(ni,0,x); normaliseTemplate(t); save(); render()}
function bindAfterRender(){bindGuidedRestTimer(); let dl=document.getElementById('exerciseNames'); if(!dl){dl=document.createElement('datalist'); dl.id='exerciseNames'; document.body.appendChild(dl)} dl.innerHTML=S.exercises.map(e=>`<option value="${esc(e.name)}"></option>`).join('')}
function closeModal(clear=true){const root=document.getElementById('modalRoot'); if(root&&clear)root.innerHTML=''}

render();

</script>
</body>
