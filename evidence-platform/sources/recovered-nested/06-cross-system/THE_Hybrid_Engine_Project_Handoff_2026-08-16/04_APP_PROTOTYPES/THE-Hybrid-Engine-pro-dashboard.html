function today(){return localISO(new Date())}
function localISO(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}

function render(){ensureSession();renderNav();const routes={home,plan,train,analyze,library,readiness,'session-builder':train,saved,manual,standards,exercises,conditioning,mobility,prep,nutrition,mental,daily,settings};const fn=routes[S.route]||home;main.innerHTML=`<div class="page">${fn()}</div>`;}
function heroButtons(){return `<button class="btn primary" data-route="readiness">Run readiness → start</button><button class="btn dark" data-route="plan">Open calendar</button>`}
function home(){const d=currentDay(),tmpl=currentTemplate(),r=S.lastReadiness||readinessScore(),st=loadStats(),done=Object.keys(S.completedDays||{}).length;return `${pageTop('Dashboard',formatShort(new Date()),'<button class="btn dark" data-route="manual">+ Log</button>')}
<div class="grid heroGrid"><section class="panel hero"><div class="heroContent"><div class="heroLabel"><span class="pill ${d.type==='strength'?'blue':d.type==='conditioning'?'green':'amber'}">${esc(d.id)} · ${esc(d.type)}</span><span class="pill ${r.lane}">${esc(r.label)} lane</span></div><h2>${esc(d.label)}</h2><p>${esc(tmpl.intent)} This is now dashboard-first: plan, train, log, then review the load.</p><div class="heroMeta"><div class="miniMetric"><span>Duration</span><b>${tmpl.duration}m</b><p>estimated</p></div><div class="miniMetric"><span>Load</span><b>${tmpl.load}</b><p>planned units</p></div><div class="miniMetric"><span>Week</span><b>${done}/7</b><p>D-days complete</p></div></div><div class="heroActions">${heroButtons()}</div></div></section>${todayCard()}</div>
${metricGrid(st,r)}
<div class="sectionTitle"><div><h3>Training load</h3><p>Recent logged work and planned microcycle load.</p></div><button class="btn dark small" data-route="analyze">Analyze</button></div>
<div class="grid two"><section class="chartBox">${loadChart(st.logs,false)}</section><section class="panel pad flat">${dayStrip()}</section></div>`}
function todayCard(){const d=currentDay(),tmpl=currentTemplate();return `<section class="panel white pad todayCard"><div class="sessionHead"><div class="dayBadge">${esc(d.id)}</div><div><h3>${esc(tmpl.name)}</h3><p>${esc(tmpl.intent)}</p></div><span class="pill dark">${tmpl.duration} min</span></div><div class="segments">${tmpl.sections.slice(0,5).map(s=>`<div class="seg"><div class="segId">${s.id}</div><div><strong>${esc(s.name)}</strong><span>${esc(s.exercise)}</span></div><div class="loadPill">${esc(s.type)}</div></div>`).join('')}</div><button class="btn primary" data-route="train">Open guided workout</button></section>`}
function metricGrid(st,r){const acwrText=st.gate?st.acwr.toFixed(2):`${st.strength}/${st.conditioning}`;const acwrDesc=st.gate?'7-day vs 28-day average':'strength / conditioning logs';return `<div class="sectionTitle"><div><h3>Command metrics</h3><p>Simple, visible, no buried numbers.</p></div></div><div class="grid metrics"><section class="metric ${r.lane}"><div class="k">Readiness</div><div class="v">${r.sum||'—'}</div><div class="d">${esc(r.label)} · ${esc(r.desc)}</div><div class="spark">◒</div></section><section class="metric green"><div class="k">Acute Load</div><div class="v">${Math.round(st.acute)}</div><div class="d">Last 7 days logged load.</div><div class="spark">↗</div></section><section class="metric blue"><div class="k">ACWR Gate</div><div class="v">${esc(acwrText)}</div><div class="d">${esc(acwrDesc)}</div><div class="spark">⌁</div></section><section class="metric amber"><div class="k">Data Quality</div><div class="v">${Math.min(16,st.logs.length)}/16</div><div class="d">Minimum 8 strength + 8 conditioning before ACWR goes live.</div><div class="spark">▦</div></section></div>`}
function dayStrip(){return `<div class="dayStrip">${dayPlan.map((d,i)=>{const curr=i===S.currentDayIndex, done=S.completedDays&&S.completedDays[d.id];return `<button class="dayCell ${d.type} ${curr?'current':''} ${done?'done':''}" data-action="set-day" data-index="${i}"><div class="dnum">${d.id}</div><div class="dtype">${esc(d.type)}</div><div class="dlabel">${esc(d.label)}</div>${done?'<div class="doneMark">✓</div>':''}</button>`}).join('')}</div>`}
function loadChart(logs,dark){const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const iso=localISO(d);const val=logs.filter(l=>localISO(l.date)===iso).reduce((a,l)=>a+l._load,0);days.push({iso,val,label:DOW[d.getDay()]})}const max=Math.max(100,...days.map(d=>d.val));const w=620,h=150,p=10;const x=i=>p+i*(w-2*p)/(days.length-1);const y=v=>h-p-(v/max)*(h-2*p);const pts=days.map((d,i)=>`${x(i)},${y(d.val)}`).join(' ');const area=`${p},${h-p} ${pts} ${w-p},${h-p}`;return `<div class="chartLegend"><strong>${dark?'Load trend':'14-day load trend'}</strong><div class="legendItems"><span><i></i>Logged load</span><span><i></i>Target lane</span></div></div><svg class="chartSvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Training load chart"><line class="axis" x1="${p}" y1="${y(50)}" x2="${w-p}" y2="${y(50)}"></line><line class="axis" x1="${p}" y1="${y(100)}" x2="${w-p}" y2="${y(100)}"></line><polygon class="area" points="${area}"></polygon><polyline class="lineBlue" points="${pts}"></polyline>${days.map((d,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(d.val)}" r="4"></circle>`).join('')}</svg><div class="barLabel"><span>${days[0].label}</span><span>${days[days.length-1].label}</span></div>`}
function plan(){const actions='<button class="btn dark" data-action="mark-complete">Mark today done</button><button class="btn primary" data-route="train">Train today</button>';return `${pageTop('Plan', 'D1–D7 microcycle with strength, conditioning and flex days.',actions)}<section class="calendarBoard">${dayPlan.map((d,i)=>{const date=dayDate(i),tmpl=sessionTemplates[d.id];return `<button class="calendarCard ${d.type} ${i===S.currentDayIndex?'current':''}" data-action="set-day" data-index="${i}"><div class="topLine"><div><div class="dow">${DOW[date.getDay()]}</div><div class="bigDay">${date.getDate()}</div></div><span class="pill dark">${d.id}</span></div><h4>${esc(d.label)}</h4><p>${esc(tmpl.intent)}</p><div class="divider"></div><div class="row between"><span class="tiny">${tmpl.duration} min</span><span class="tiny">Load ${tmpl.load}</span></div><div class="bar"></div></button>`}).join('')}</section><div class="sectionTitle"><div><h3>Selected day</h3><p>Edit the day by opening the guided session.</p></div></div><div class="grid two"><section class="panel white pad">${todayCardInner()}</section><section class="panel pad">${dayStrip()}</section></div>`}
function todayCardInner(){const d=currentDay(),tmpl=currentTemplate();return `<div class="sessionHead"><div class="dayBadge">${d.id}</div><div><h3>${esc(tmpl.name)}</h3><p>${esc(tmpl.intent)}</p></div><span class="pill dark">${tmpl.load} load</span></div><div class="divider"></div><div class="segments">${tmpl.sections.map(s=>`<div class="seg"><div class="segId">${s.id}</div><div><strong>${esc(s.name)}</strong><span>${esc(s.exercise)}</span></div><div class="loadPill">${esc(s.type)}</div></div>`).join('')}</div>`}
function train(){ensureSession();const d=currentDay(),tmpl=currentTemplate(),idx=Math.min(S.trainIndex||0,tmpl.sections.length-1),sec=tmpl.sections[idx],data=S.secData.sections[sec.id],done=completedCount(),total=tmpl.sections.length;return `${pageTop('Train', `${d.id} · ${d.label}`, '<button class="btn dark" data-route="readiness">Readiness</button><button class="btn primary" data-action="save-session">Save Session</button>')}<div class="trainLayout"><section class="panel white workoutCard"><div class="sessionHead"><div class="dayBadge">${sec.id}</div><div><h3>${esc(sec.name)}</h3><p>${esc(sec.type)} · ${esc(tmpl.intent)}</p></div><span class="pill dark">${done}/${total}</span></div><div class="divider"></div><div class="barLabel"><span>Workout progress</span><span>${percent(done,total)}%</span></div><div class="progress light"><b style="width:${percent(done,total)}%"></b></div><div class="divider"></div><div class="grid two"><div class="field"><label>Exercise</label><input data-field="exercise" data-section="${sec.id}" value="${attr(data.exercise)}"></div><div class="field"><label>Prescription</label><input data-field="reps" data-section="${sec.id}" value="${attr(data.reps)}"></div></div><div class="field" style="margin-top:12px"><label>Coach notes</label><textarea data-field="notes" data-section="${sec.id}">${esc(data.notes)}</textarea></div>${setsHtml(sec,data)}<div class="divider"></div><div class="row between" style="flex-wrap:wrap"><button class="btn dark" data-action="prev-section">← Previous</button><div class="row"><button class="btn dark" data-action="toggle-section" data-section="${sec.id}">${S.sectionDone[sec.id]?'Undo complete':'Complete block'}</button><button class="btn primary" data-action="next-section">Next →</button></div></div></section><aside class="panel pad"><div class="sectionTitle" style="margin-top:0"><div><h3>Session blocks</h3><p>Tap to jump.</p></div></div><div class="sectionNav">${tmpl.sections.map((s,i)=>`<button class="sectionTab ${i===idx?'active':''} ${S.sectionDone[s.id]?'done':''}" data-action="jump-section" data-index="${i}">${s.id}</button>`).join('')}</div><div class="divider"></div><div class="sideList">${tmpl.sections.map((s,i)=>`<button class="sideItem ${S.sectionDone[s.id]?'done':''}" data-action="jump-section" data-index="${i}" style="text-align:left"><strong>${s.id}. ${esc(s.name)}</strong><span>${esc(s.exercise)}</span></button>`).join('')}</div><div class="divider"></div><button class="btn red" data-action="reset-template" style="width:100%">Reset template</button></aside></div>`}
function setsHtml(sec,data){if(!data.sets||!data.sets.length)return `<div class="divider"></div><div class="empty" style="color:#68778e;border-color:rgba(13,23,40,.14);background:#f1f5fa">No fixed sets here. Run the block as prescribed, then mark it complete.</div>`;return `<div class="divider"></div><div class="setTable">${data.sets.map((set,i)=>`<div class="setRow"><div class="setNum">${i+1}</div><input data-set-field="w" data-section="${sec.id}" data-set="${i}" value="${attr(set.w??'')}" placeholder="kg"><input data-set-field="actual" data-section="${sec.id}" data-set="${i}" value="${attr(set.actual||set.r||'')}" placeholder="reps"><input class="rpeField" data-set-field="rpe" data-section="${sec.id}" data-set="${i}" value="${attr(set.rpe||'')}" placeholder="RPE"><button class="check ${set.done?'on':''}" data-action="toggle-set" data-section="${sec.id}" data-set="${i}">✓</button></div>`).join('')}</div>`}
function readiness(){const r=readinessScore();const row=(key,label,sub)=>`<section class="panel white pad"><div class="row between"><div><div class="h2">${label}</div><div class="muted smallText">${sub}</div></div><span class="pill dark">${S.readiness[key]||0}/5</span></div><input type="range" min="1" max="5" value="${S.readiness[key]||3}" data-readiness="${key}" style="width:100%;margin-top:18px;accent-color:#2f80ed"></section>`;return `${pageTop('Readiness', 'Throttle before ego. Quick check, then train.', '<button class="btn primary" data-action="save-readiness">Save & train</button>')}<div class="grid heroGrid"><section class="panel hero"><div class="heroContent"><span class="pill ${r.lane}">${r.label} lane</span><h2>${r.sum}/15</h2><p>${esc(r.desc)}</p><div class="heroActions"><button class="btn primary" data-action="save-readiness">Use this lane</button><button class="btn dark" data-route="train">Skip to workout</button></div></div></section><div class="stack">${row('sleep','Sleep','1 = wrecked, 5 = excellent')}${row('energy','Energy','1 = flat, 5 = switched on')}${row('soreness','Body','1 = sore or beat up, 5 = fresh')}</div></div>`}
function analyze(){const st=loadStats();const gateMsg=st.gate?'ACWR is live. Aim for roughly 0.80–1.30 while building.':'Learning mode. ACWR stays locked until you have at least 16 logs: 8 strength + 8 conditioning.';return `${pageTop('Analyze','Load, ACWR, standards and workout history.', '<button class="btn dark" data-route="manual">+ Manual log</button>')}<div class="grid metrics"><section class="metric ${st.lane}"><div class="k">ACWR</div><div class="v">${st.gate?st.acwr.toFixed(2):'LOCK'}</div><div class="d">${esc(gateMsg)}</div></section><section class="metric green"><div class="k">Acute</div><div class="v">${Math.round(st.acute)}</div><div class="d">7-day load.</div></section><section class="metric blue"><div class="k">Chronic</div><div class="v">${Math.round(st.chronic)}</div><div class="d">28-day average week.</div></section><section class="metric amber"><div class="k">Log mix</div><div class="v">${st.strength}/${st.conditioning}</div><div class="d">Strength / conditioning sessions.</div></section></div><div class="sectionTitle"><div><h3>Performance trend</h3><p>Built from your local logs.</p></div></div><div class="grid two"><section class="chartBox">${loadChart(st.logs,false)}</section><section class="panel white pad"><div class="h2">ACWR data gate</div><p class="muted">Need ${st.needTotal} total, ${st.needStrength} strength, ${st.needCond} conditioning logs before ACWR is trusted.</p><div class="divider"></div><div class="barLabel"><span>Total logs</span><span>${Math.min(16,st.logs.length)}/16</span></div><div class="progress light"><b style="width:${percent(Math.min(16,st.logs.length),16)}%"></b></div><div class="barLabel" style="margin-top:14px"><span>Strength</span><span>${Math.min(8,st.strength)}/8</span></div><div class="progress light"><b style="width:${percent(Math.min(8,st.strength),8)}%"></b></div><div class="barLabel" style="margin-top:14px"><span>Conditioning</span><span>${Math.min(8,st.conditioning)}/8</span></div><div class="progress light"><b style="width:${percent(Math.min(8,st.conditioning),8)}%"></b></div></section></div><div class="sectionTitle"><div><h3>Recent sessions</h3><p>Last sessions logged in this browser.</p></div><button class="btn dark small" data-route="saved">View all</button></div>${recentLogs(6)}`}
function recentLogs(limit=20){const logs=(S.workoutLogs||[]).slice(0,limit);if(!logs.length)return `<div class="empty">No logs yet. Save a guided workout or add a manual session.</div>`;return `<div class="logList">${logs.map(l=>{const d=new Date(l.date);return `<div class="logItem"><div class="logDate"><div>${d.getDate()}<span>${MONTHS[d.getMonth()]}</span></div></div><div><h4>${esc(l.name||l.day||'Session')}</h4><p>${esc(inferType(l))} · ${esc(l.duration||'—')} min · Load ${esc(l.load||logLoad(l))}${l.note?' · '+esc(l.note):''}</p></div><span class="pill dark">${esc(l.rating||'—')}</span></div>`}).join('')}</div>`}
function library(){const q=String(S.libraryQuery||'').toLowerCase();const items=libItems.filter(i=>(i[2]+' '+i[3]).toLowerCase().includes(q));return `${pageTop('Library','Everything clickable. No dead text.', '<button class="btn dark" data-route="settings">Backup</button>')}<div class="search"><input data-library-query value="${attr(S.libraryQuery)}" placeholder="Search tools, sessions, standards, mobility..."></div><div class="sectionTitle"><div><h3>Coach tools</h3><p>Builder, logs, standards, libraries and daily standards.</p></div></div><div class="libraryGrid">${items.map(i=>`<button class="cardButton" data-route="${i[0]}"><div class="arrow">→</div><div class="bigIco">${i[1]}</div><h3>${esc(i[2])}</h3><p>${esc(i[3])}</p></button>`).join('')}</div>`}
function saved(){return `${pageTop('Saved Sessions','Workout history stored locally in this HTML file.', '<button class="btn primary" data-route="manual">+ Manual log</button>')}<section class="panel white pad">${recentLogs(100)}</section>`}
function manual(){const d=S.manualDraft||{};return `${pageTop('Manual Log','Add a completed session so ACWR and history can learn.', '<button class="btn primary" data-action="save-manual">Save log</button>')}<section class="panel white pad stack"><div class="grid two"><div class="field"><label>Date</label><input type="date" data-manual="date" value="${attr(d.date||today())}"></div><div class="field"><label>Type</label><select data-manual="type"><option ${d.type==='Strength'?'selected':''}>Strength</option><option ${d.type==='Conditioning'?'selected':''}>Conditioning</option><option ${d.type==='Mixed'?'selected':''}>Mixed</option><option ${d.type==='Recovery'?'selected':''}>Recovery</option></select></div></div><div class="field"><label>Title</label><input data-manual="title" value="${attr(d.title||'')}" placeholder="e.g. Easy run, Full Body A, Bike intervals"></div><div class="grid two"><div class="field"><label>Duration min</label><input type="number" data-manual="duration" value="${attr(d.duration||'')}" placeholder="45"></div><div class="field"><label>Load units</label><input type="number" data-manual="load" value="${attr(d.load||'')}" placeholder="60"></div></div><div class="field"><label>Notes</label><textarea data-manual="notes" placeholder="How did it feel?">${esc(d.notes||'')}</textarea></div><button class="btn primary" data-action="save-manual">Save manual log</button></section>`}
function standards(){const bw=Number(S.bodyweightKg)||89;const target=s=>s.type==='relative'?Math.round(bw*s.multiplier)+(s.unit||' kg'):(s.target+' '+(s.unit||''));const status=(s,val)=>{const n=Number(val);if(!val)return '<span class="status">not logged</span>';const ok=s.type==='relative'?n>=bw*s.multiplier:n>=s.target;return `<span class="status ${ok?'at':'off'}">${ok?'at standard':'build'}</span>`};return `${pageTop('Uniform Strong','Relative strength and engine standards.', '')}<section class="panel white pad"><div class="field"><label>Bodyweight kg</label><input type="number" data-bodyweight value="${attr(S.bodyweightKg)}"></div><div class="divider"></div><div class="h2">Strength standards</div>${strengthStandards.map(s=>`<div class="standardRow"><div><strong>${esc(s.name)}</strong><div class="muted smallText">Target ${esc(target(s))}</div></div><input data-std="${s.key}" value="${attr(S.currentStandards[s.key]||'')}" placeholder="current"><div>${status(s,S.currentStandards[s.key])}</div></div>`).join('')}<div class="divider"></div><div class="h2">Conditioning standards</div>${condStandards.map(s=>`<div class="standardRow"><div><strong>${esc(s.name)}</strong><div class="muted smallText">${esc(s.target)}</div></div><input data-cond="${s.key}" value="${attr(S.condCurrents[s.key]||'')}" placeholder="result"><div><span class="status ${S.condCurrents[s.key]?'at':''}">${S.condCurrents[s.key]?'logged':'not logged'}</span></div></div>`).join('')}</section>`}
function exercises(){const filters=['All',...exerciseGroups.map(g=>g.cat)];const groups=exerciseGroups.filter(g=>S.exFilter==='All'||g.cat===S.exFilter);return `${pageTop('Exercise Library','Movement families and swaps.', '')}<div class="chips">${filters.map(f=>`<button class="chip ${S.exFilter===f?'active':''}" data-action="ex-filter" data-val="${f}">${f}</button>`).join('')}</div><div class="sectionTitle"><div><h3>Patterns</h3><p>Primary lifts and substitutions.</p></div></div><div class="libraryGrid">${groups.map(g=>`<section class="cardButton" style="cursor:default"><div class="bigIco">◫</div><h3>${esc(g.primary)}</h3><p><b>${esc(g.cat)}</b> — ${esc(g.why)}</p><div class="chips" style="margin-top:14px">${g.exercises.map(e=>`<span class="chip">${esc(e)}</span>`).join('')}</div></section>`).join('')}</div>`}
function conditioning(){return `${pageTop('Conditioning Library','Easy, pacing and hard protocols.', '')}<div class="grid three">${conditioningTypes.map(c=>`<section class="panel white pad"><span class="pill dark">${esc(c.feel)}</span><div class="h2" style="margin-top:12px">${esc(c.label)}</div><p class="muted smallText">${esc(c.purpose)}</p><div class="divider"></div><div class="stack">${c.protocols.map(p=>`<div class="seg"><div class="segId">≈</div><div><strong>${esc(p[0])}</strong><span>${esc(p[1])}</span></div><div></div></div>`).join('')}</div></section>`).join('')}</div>`}
function mobility(){const filters=['All','Hips','Shoulders','Spine','Full Body'];const flows=mobilityFlows.filter(m=>S.mobFilter==='All'||m.tags.includes(S.mobFilter));return `${pageTop('Mobility','Recovery flows and joint prep.', '')}<div class="chips">${filters.map(f=>`<button class="chip ${S.mobFilter===f?'active':''}" data-action="mob-filter" data-val="${f}">${f}</button>`).join('')}</div><div class="libraryGrid" style="margin-top:16px">${flows.map(m=>`<section class="cardButton" style="cursor:default"><div class="bigIco">◇</div><h3>${esc(m.name)}</h3><p>${esc(m.dur)} · ${esc(m.summary)}</p><div class="divider"></div><p>${esc(m.detail)}</p></section>`).join('')}</div>`}
function prep(){const prep=['KB RDL 3-5','Hamburger squat 3-5','Supported row 3-5 each','KB press 3 each','Turkish get-up 1 each','Pogo hops 2-3 x 10','Med ball throw 3 x 3'];const cooldown=['Dead hang 30-60 sec','Banded lat stretch 30 sec/side','Hip flexor + hamstring flow 60 sec','Slow nasal breathing 10-15 breaths','Easy walk 5-10 min'];return `${pageTop('Prep / Cooldown','Start clean. Finish calmer.', '')}<div class="grid two"><section class="panel white pad"><div class="h2">Prep menu</div><div class="divider"></div><div class="segments">${prep.map((x,i)=>`<div class="seg"><div class="segId">${i+1}</div><div><strong>${esc(x)}</strong><span>Quality reps only.</span></div><div></div></div>`).join('')}</div></section><section class="panel white pad"><div class="h2">Cooldown menu</div><div class="divider"></div><div class="segments">${cooldown.map((x,i)=>`<div class="seg"><div class="segId">${i+1}</div><div><strong>${esc(x)}</strong><span>Down-regulate.</span></div><div></div></div>`).join('')}</div></section></div>`}
function nutrition(){return `${pageTop('Nutrition Guide','Simple support rules.', '')}<section class="panel white pad"><div class="h2">Do the basics hard.</div><p class="muted">Support the work, recover, and stay consistent.</p><div class="divider"></div><div class="segments">${nutritionPriorities.map((p,i)=>`<div class="seg"><div class="segId">${i+1}</div><div><strong>${esc(p[0])}</strong><span>${esc(p[1])}</span></div><div></div></div>`).join('')}</div></section>`}
function mental(){return `${pageTop('Mental Performance','Rules for rough days.', '')}<div class="grid two">${mentalTools.map(t=>`<section class="panel white pad"><span class="pill dark">Tool</span><div class="h2" style="margin-top:12px">${esc(t[0])}</div><p class="muted">${esc(t[1])}</p></section>`).join('')}</div>`}
function daily(){const date=today();S.dailyToggles[date]=S.dailyToggles[date]||{};const score=dailyCheckItems.reduce((a,x)=>a+(S.dailyToggles[date][x[0]]?1:0),0);return `${pageTop('Daily Standards', 'Nine non-negotiables.', '')}<div class="grid heroGrid"><section class="panel hero"><div class="heroContent"><span class="pill green">Today</span><h2>${score}/9 kept</h2><p>Small promises kept daily. No drama, no perfection theatre.</p><div class="heroMeta"><div class="miniMetric"><span>Score</span><b>${percent(score,9)}%</b><p>daily</p></div></div></div></section><section class="panel white pad">${dailyCheckItems.map(item=>`<div class="toggleRow"><div><strong>${esc(item[1])}</strong><span>${esc(item[2])}</span></div><button class="toggle ${S.dailyToggles[date][item[0]]?'on':''}" data-action="toggle-daily" data-key="${item[0]}"></button></div>`).join('')}</section></div>`}
function settings(){return `${pageTop('Settings','Standalone HTML. Saves locally in this browser.', '')}<div class="grid two"><section class="panel white pad stack"><div><div class="h2">Backup</div><p class="muted">Export or import your local app data as JSON.</p></div><button class="btn primary" data-action="export-data">Export backup JSON</button><label class="btn dark" style="background:#0d1728;color:#fff"><input type="file" accept="application/json" data-import-file style="display:none">Import backup JSON</label></section><section class="panel white pad stack"><div><div class="h2">Danger zone</div><p class="muted">Clears saved data on this device only.</p></div><button class="btn red" data-action="clear-data">Clear local data</button></section></div>`}
function saveSession(){const d=currentDay(),tmpl=currentTemplate();const completed=completedCount();const rating=S.sessionRating||'';S.completedDays[d.id]=true;S.workoutLogs.unshift({date:new Date().toISOString(),day:d.id,name:tmpl.name,type:d.type==='conditioning'?'Conditioning':d.type==='flex'?'Recovery':'Strength',rating, note:S.sessionNote||'',duration:tmpl.duration,load:tmpl.load,completedSections:completed,totalSections:tmpl.sections.length});S.currentDayIndex=(S.currentDayIndex+1)%dayPlan.length;S.sessionNote='';S.sessionRating=0;S.secData=null;ensureSession();S.route='train';save();notify('Session saved');render()}
function saveManual(){const d=S.manualDraft||{};if(!String(d.title||'').trim()){notify('Add a title first');return}S.workoutLogs.unshift({date:new Date(d.date||today()).toISOString(),name:d.title,type:d.type||'Manual',rating:'',note:d.notes||'',duration:d.duration||'',load:d.load||''});S.manualDraft={date:today(),type:'Strength',title:'',duration:'',load:'',notes:''};S.route='analyze';save();notify('Manual log saved');render()}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`THE-Hybrid-Engine-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);notify('Backup exported')}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(String(reader.result||'{}'));S={...defaultState(),...obj};ensureSession();save();notify('Backup imported');render()}catch{notify('Import failed')}};reader.readAsText(file)}
function markComplete(){S.completedDays[currentDay().id]=true;save();notify(`${currentDay().id} marked done`);render()}
[sideNav,mobileNav].forEach(nav=>nav.addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(!b)return;S.route=b.dataset.route;save();render()}));
main.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){S.route=route.dataset.route;save();render();return}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;switch(a){case'set-day':S.currentDayIndex=+el.dataset.index;S.secData=null;ensureSession();save();notify(`${currentDay().id} selected`);render();break;case'mark-complete':markComplete();break;case'jump-section':S.trainIndex=+el.dataset.index;save();render();break;case'prev-section':S.trainIndex=Math.max(0,(S.trainIndex||0)-1);save();render();break;case'next-section':S.trainIndex=Math.min(currentTemplate().sections.length-1,(S.trainIndex||0)+1);save();render();break;case'toggle-section':S.sectionDone[el.dataset.section]=!S.sectionDone[el.dataset.section];save();render();break;case'toggle-set':{const sec=el.dataset.section,i=+el.dataset.set;S.secData.sections[sec].sets[i].done=!S.secData.sections[sec].sets[i].done;save();render();break}case'reset-template':if(confirm('Reset this day template edits?')){S.secData=null;ensureSession();save();notify('Template reset');render()}break;case'save-session':saveSession();break;case'save-readiness':S.lastReadiness=readinessScore();S.route='train';save();notify('Readiness saved');render();break;case'save-manual':saveManual();break;case'ex-filter':S.exFilter=el.dataset.val;save();render();break;case'mob-filter':S.mobFilter=el.dataset.val;save();render();break;case'toggle-daily':{const date=today();S.dailyToggles[date]=S.dailyToggles[date]||{};S.dailyToggles[date][el.dataset.key]=!S.dailyToggles[date][el.dataset.key];save();render();break}case'export-data':exportData();break;case'clear-data':if(confirm('Clear local app data on this device?')){localStorage.removeItem(STORE);S=defaultState();ensureSession();notify('Local data cleared');render()}break;}});
main.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-field]')){S.secData.sections[el.dataset.section][el.dataset.field]=el.value;save()}else if(el.matches('[data-set-field]')){const sec=el.dataset.section,i=+el.dataset.set;S.secData.sections[sec].sets[i][el.dataset.setField]=el.value;save()}else if(el.matches('[data-readiness]')){S.readiness[el.dataset.readiness]=+el.value;save();render()}else if(el.matches('[data-library-query]')){S.libraryQuery=el.value;save();render()}else if(el.matches('[data-bodyweight]')){S.bodyweightKg=el.value;save();render()}else if(el.matches('[data-std]')){S.currentStandards[el.dataset.std]=el.value;save()}else if(el.matches('[data-cond]')){S.condCurrents[el.dataset.cond]=el.value;save()}else if(el.matches('[data-manual]')){S.manualDraft=S.manualDraft||{};S.manualDraft[el.dataset.manual]=el.value;save()}});
main.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-import-file]')&&el.files&&el.files[0])importData(el.files[0]);});
ensureSession();render();
})();
</script>
</body>
</html>
